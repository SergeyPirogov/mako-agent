<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mako</title>
<link rel="stylesheet" href="/style.css">
<style>
body { display: block; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 760px); gap: 32px; max-width: 1040px; margin: 0 auto; padding: 24px 16px 120px; }
.page { min-width: 0; }
.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 74px; align-self: start; }
.side .group { padding: 14px 10px 4px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); }
.side .group:first-child { padding-top: 0; }
.side button { display: flex; flex-direction: column; align-items: flex-start; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; color: var(--fg); }
.side button:hover { background: var(--hover); }
.side button.on { background: var(--sel); font-weight: 600; }
.side button small { font-weight: 400; color: var(--mute); font-size: 12px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side button.add { color: var(--mute); }
.side .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--err); margin-left: 6px; vertical-align: middle; }
.pane { display: none; }
.pane.on { display: block; }
.pane > h2:first-child { margin-top: 0; }
.where { color: var(--faint); font-size: 12px; margin-top: 24px; overflow-wrap: anywhere; }
.step { font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--fg); margin: 0 0 10px; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
.mode { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.mode p { margin: 4px 0 10px; font-size: 13px; }
.notice-inline { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--err); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
.qr { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.qr img { width: 220px; height: 220px; image-rendering: pixelated; border-radius: 8px; background: #fff; padding: 8px; }
.qr ol { margin: 0; padding-left: 18px; max-width: 360px; }
.qr li { margin: 4px 0; }
.device { display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.device:last-of-type { border-bottom: 0; }
.add-big { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.add-big button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; text-align: left; border-radius: 12px; }
.add-big span { color: var(--mute); font-size: 12.5px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.lead { color: var(--mute); margin: 0 0 20px; }
h2 { font-size: 15px; margin: 32px 0 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head b { font-size: 15px; }
.field { display: grid; grid-template-columns: 220px 1fr; gap: 6px 16px; align-items: start; padding: 7px 0; }
.field > label { padding-top: 7px; color: var(--fg); }
.field .hint { grid-column: 2; font-size: 12.5px; color: var(--mute); margin-top: -2px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; }
.check input { margin-top: 3px; }
.check .hint { font-size: 12.5px; color: var(--mute); }
/* “Pause” of a tracker: a switch in its card head, on at once, no “Save” needed */
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); cursor: pointer; user-select: none; }
.switch input { appearance: none; -webkit-appearance: none; margin: 0; width: 32px; height: 18px; border-radius: 9px; background: var(--faint); position: relative; cursor: pointer; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked { background: var(--warn); }
.switch input:checked::after { left: 16px; }
.switch input:disabled { opacity: .6; }
.switch:has(input:checked) { color: var(--fg); }
input[type=text], input[type=number], input[type=password], select, textarea {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 0; border-color: var(--accent); }
input[type=number] { width: 120px; }
textarea { min-height: 120px; font: 12.5px/1.5 var(--mono); resize: vertical; }
.projects { width: 100%; border-collapse: collapse; margin-top: 4px; }
.projects th { text-align: left; font-weight: 500; font-size: 12px; color: var(--mute); padding: 4px 6px; }
.projects td { padding: 3px 6px 3px 0; vertical-align: top; }
.projects td:last-child { width: 1%; }
.projects .checks-row td { padding-bottom: 10px; }
.projects .checks-row textarea { width: 100%; min-height: 34px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--mute); padding: 6px 0; }
.ok { color: var(--ok); }
.bad { color: var(--err); }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }
.savebar .in { max-width: 1040px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.msg { color: var(--mute); font-size: 13px; overflow-wrap: anywhere; }
.msg.bad { color: var(--err); }
.msg.ok { color: var(--ok); }
.add { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px 12px calc(120px + env(safe-area-inset-bottom)); }
  .side { flex-direction: row; overflow-x: auto; position: static; gap: 4px; padding-bottom: 4px; }
  .side .group { display: none; }
  .side button { white-space: nowrap; flex: none; border: 1px solid var(--line); }
  .side button small { display: none; }
}
@media (max-width: 640px) {
  .field { grid-template-columns: 1fr; }
  .field .hint { grid-column: 1; }
  .projects th:nth-child(3), .projects td:nth-child(3) { display: none; }
  .projects { display: block; overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="/" style="color:inherit">🦈 Mako</a>
  <a class="ghost-link" href="/" data-t="s.toBoard">← Board</a>
  <b data-t="s.title">Settings</b>
  <span class="spacer"></span>
  <button class="ghost" id="theme"></button>
</header>
<div id="problems"></div>
<div class="layout">
  <nav class="side" id="side"></nav>
  <div class="page">
    <div class="pane" data-pane="tracker">
      <div id="trackers"></div>
    </div>
    <div class="pane" data-pane="add">
      <div class="card" id="first-language"></div>
      <h2 data-t="s.add.title">Add a tracker</h2>
      <p class="lead" data-t="s.add.lead"></p>
      <div class="add-big">
        <button data-add="gitlab"><b>GitLab</b><span data-t="s.add.gitlab"></span></button>
        <button data-add="github"><b>GitHub</b><span data-t="s.add.github"></span></button>
        <button data-add="jira"><b>Jira Cloud</b><span data-t="s.add.jira"></span></button>
      </div>
    </div>
    <div class="pane" data-pane="language">
      <h2 data-t="s.lang.title"></h2>
      <p class="lead" data-t="s.lang.lead"></p>
      <div class="card" id="language"></div>
    </div>
    <div class="pane" data-pane="orca">
      <h2 data-t="s.orca.title"></h2>
      <p class="lead" data-t="s.orca.lead"></p>
      <div class="card" id="orca"></div>
    </div>
    <div class="pane" data-pane="comments">
      <h2 data-t="s.comments.title"></h2>
      <p class="lead" data-t="s.comments.lead"></p>
      <div class="card" id="comments"></div>
    </div>
    <div class="pane" data-pane="limits">
      <h2 data-t="s.limits.title"></h2>
      <p class="lead" data-t="s.limits.lead"></p>
      <div class="card" id="limits"></div>
    </div>
    <div class="pane" data-pane="disk">
      <h2 data-t="s.disk.title"></h2>
      <p class="lead" data-t="s.disk.lead"></p>
      <div id="disk"></div>
    </div>
    <div class="pane" data-pane="phone">
      <h2 data-t="s.phone.title"></h2>
      <p class="lead" data-t="s.phone.lead"></p>
      <div id="phone"></div>
    </div>
    <div class="pane" data-pane="notifications">
      <h2 data-t="s.notif.title"></h2>
      <div class="card" id="notifications"></div>
    </div>
    <p class="where" id="where"></p>
  </div>
</div>
<div class="savebar"><div class="in">
  <button class="primary" id="save" data-t="s.save"></button>
  <button class="ghost" id="revert" data-t="s.revert"></button>
  <span class="msg" id="msg"></span>
</div></div>
<script src="/theme.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let navTimer;
const renderNavSoon = () => { clearTimeout(navTimer); navTimer = setTimeout(renderNav, 300); };
let cfg = {}, env = {}, envSet = {}, jiraBase = "", autoWip = 1, dirty = false;
const TOKENS = () => ({ gitlab: [["GITLAB_TOKEN", t("s.token"), t("s.token.gitlab")]],
  github: [["GITHUB_TOKEN", t("s.token"), t("s.token.github")]],
  jira: [["JIRA_EMAIL", t("s.token.jiraEmail"), ""], ["JIRA_API_TOKEN", t("s.token.jiraApi"), "id.atlassian.com → Security → API tokens"]] });
const NAMES = { gitlab: "GitLab", github: "GitHub", jira: "Jira Cloud" };

function changed() { if (pane) renderNavSoon(); dirty = true; $("msg").className = "msg"; $("msg").textContent = t("s.unsaved"); }

// Small form helpers bound to a path in an object: they write back on input.
function text(obj, key, label, { hint = "", placeholder = "", type = "text", parse } = {}) {
  const id = "f" + Math.random().toString(36).slice(2);
  const el = document.createElement("div");
  el.className = "field";
  const v = obj[key];
  el.innerHTML = `<label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(v ?? "")}">${hint ? `<div class="hint">${hint}</div>` : ""}`;
  el.querySelector("input").oninput = (e) => {
    const raw = e.target.value;
    if (raw.trim() === "") delete obj[key];
    else obj[key] = parse ? parse(raw) : raw;
    changed();
  };
  return el;
}
const num = (obj, key, label, opts = {}) => text(obj, key, label, { ...opts, type: "number", parse: (x) => Number(x) });
function check(obj, key, label, { hint = "", def = false } = {}) {
  const el = document.createElement("label");
  el.className = "check";
  el.innerHTML = `<input type="checkbox" ${(obj[key] ?? def) ? "checked" : ""}><span>${label}${hint ? `<div class="hint">${hint}</div>` : ""}</span>`;
  el.querySelector("input").onchange = (e) => {
    if (e.target.checked === def) delete obj[key];
    else obj[key] = e.target.checked;
    changed();
  };
  return el;
}
function select(obj, key, label, options, { hint = "", def = "" } = {}) {
  const el = document.createElement("div");
  el.className = "field";
  const cur = obj[key] ?? def;
  el.innerHTML = `<label>${label}</label><select>${options.map(([v, l]) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${l}</option>`).join("")}</select>${hint ? `<div class="hint">${hint}</div>` : ""}`;
  el.querySelector("select").onchange = (e) => {
    if (e.target.value === def) delete obj[key];
    else obj[key] = e.target.value;
    changed();
  };
  return el;
}
function secret(key, label, hint) {
  const el = document.createElement("div");
  el.className = "field";
  const plain = key === "JIRA_EMAIL";
  el.innerHTML = `<label>${label}</label><input type="${plain ? "text" : "password"}" autocomplete="off" placeholder="${envSet[key] ? t("s.secret.set") : t("s.secret.unset")}" value="${esc(env[key] ?? "")}">${hint ? `<div class="hint">${hint}</div>` : ""}`;
  el.querySelector("input").oninput = (e) => {
    if (e.target.value.trim()) env[key] = e.target.value.trim();
    else delete env[key];
    changed();
  };
  return el;
}
// A text the developer writes in both languages ({"en": …, "uk": …}): a field for each. An older config's plain
// string is both versions, as Mako reads it.
const LANGS = [["en", "English"], ["uk", "Українська"]];
function localized(obj, key, label, { hint = "", placeholders = {}, area = false } = {}) {
  if (typeof obj[key] === "string") obj[key] = { en: obj[key], uk: obj[key] };
  const el = document.createElement("div");
  el.className = "field";
  el.innerHTML = `<label>${label}</label><div>${LANGS.map(([l, name]) => `<div style="margin-bottom:6px"><div class="hint" style="margin:0 0 2px">${name}</div>${area
    ? `<textarea data-l="${l}" placeholder="${esc(placeholders[l] ?? "")}"></textarea>`
    : `<input type="text" data-l="${l}" placeholder="${esc(placeholders[l] ?? "")}">`}</div>`).join("")}</div>${hint ? `<div class="hint">${hint}</div>` : ""}`;
  for (const inp of el.querySelectorAll("[data-l]")) {
    inp.value = obj[key]?.[inp.dataset.l] ?? "";
    inp.oninput = () => {
      const v = { ...(obj[key] ?? {}) };
      if (inp.value.trim()) v[inp.dataset.l] = inp.value; else delete v[inp.dataset.l];
      if (Object.keys(v).length) obj[key] = v; else delete obj[key];
      changed();
    };
  }
  return el;
}

// transitions: absent → Mako guesses (or leaves it, where it cannot), "" in the form → absent, «-» → null: leave alone
function transition(tr0, key, label, auto) {
  tr0.transitions ??= {};
  const tr = tr0.transitions;
  const el = document.createElement("div");
  el.className = "field";
  const v = tr[key] === null ? "-" : tr[key] ?? "";
  el.innerHTML = `<label>${label}</label><input type="text" placeholder="${esc(auto)}" value="${esc(v)}">`;
  el.querySelector("input").oninput = (e) => {
    const raw = e.target.value.trim();
    if (!raw) delete tr[key];
    else tr[key] = raw === "-" ? null : raw;
    if (!Object.keys(tr).length) delete tr0.transitions;
    changed();
  };
  return el;
}

function renderTrackers() {
  const box = $("trackers");
  box.innerHTML = "";
  (cfg.trackers ?? []).forEach((tk, i) => {
    if (pane !== `tracker:${i}`) return;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="card-head"><b>${NAMES[tk.type] ?? esc(tk.type)}</b><span class="msg" data-me></span><span class="spacer"></span>
      <label class="switch" title="${esc(t("s.tr.pauseHint"))}"><input type="checkbox" data-pause ${tk.paused ? "checked" : ""}><span>${t("s.tr.pause")}</span></label>
      <button data-check>${t("s.tr.check")}</button><button class="ghost danger" data-del>${t("s.tr.delete")}</button></div>`;
    if (tk.type === "gitlab") card.append(text(tk, "baseUrl", t("s.tr.gitlabUrl"), { placeholder: "https://gitlab.com" }));
    if (tk.type === "jira") card.append(text(tk, "baseUrl", t("s.tr.jiraUrl"), { placeholder: jiraBase || "https://acme.atlassian.net" }));
    for (const [key, label, hint] of TOKENS()[tk.type] ?? []) card.append(secret(key, label, hint));

    if (tk.type === "jira") {
      card.append(text(tk, "jql", t("s.tr.jql"), { placeholder: "assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC" }));
    } else {
      card.append(check(tk, "allProjects", t("s.tr.allProjects"), { hint: t("s.tr.allProjectsHint") }));
      tk.labels ??= {};
      const noLabel = tk.labels.trigger === null;
      const label = document.createElement("div");
      label.append(check({ v: noLabel }, "v", t("s.tr.noLabel")));
      label.querySelector("input").onchange = (e) => {
        if (e.target.checked) tk.labels.trigger = null;
        else delete tk.labels.trigger;
        if (!Object.keys(tk.labels).length) delete tk.labels;
        changed();
        renderTrackers();
      };
      card.append(label);
      if (!noLabel) card.append(text(tk.labels, "trigger", t("s.tr.label"), { placeholder: "claude-agent", hint: t("s.tr.labelHint") }));
      card.append(text(tk, "assignee", t("s.tr.assignee"), { placeholder: noLabel || tk.allProjects ? t("s.tr.me") : t("s.tr.anyone"), hint: t("s.tr.assigneeHint") }));
    }
    card.append(check(tk, "assignOnTake", t("s.tr.assignOnTake"), { def: true }));
    card.append(check(tk, "skipOthersTasks", t("s.tr.skipOthers"), { def: true }));
    if (tk.type !== "jira") card.append(check(tk, "reviewRequests", t("s.tr.reviewRequests"), { def: true, hint: t("s.tr.reviewRequestsHint") }));

    const statuses = document.createElement("details");
    statuses.innerHTML = `<summary>${t("s.tr.statuses")}</summary><div class="hint" style="color:var(--mute);font-size:12.5px;margin:4px 0 6px">
      ${t(tk.type === "jira" ? "s.tr.statusesJira" : "s.tr.statusesHint")}${tk.type === "github" ? " " + t("s.tr.statusesGithub") : ""}</div>`;
    if (tk.type !== "github") {
      const auto = tk.type === "gitlab";
      statuses.append(transition(tk, "onStart", t("s.tr.onStart"), auto ? t("s.tr.autoInProgress") : t("s.tr.leave")));
      statuses.append(transition(tk, "onSuccess", t("s.tr.onSuccess"), t("s.tr.leave")));
      statuses.append(transition(tk, "onFailure", t("s.tr.onFailure"), t("s.tr.leave")));
      statuses.append(transition(tk, "onMerged", t("s.tr.onMerged"), t("s.tr.autoDone")));
      card.append(statuses);
    }

    card.append(projectsTable(tk));
    if (tk.type === "github") {
      const more = document.createElement("details");
      more.innerHTML = `<summary>${t("s.more")}</summary>`;
      more.append(text(tk, "apiUrl", t("s.tr.githubApi"), { placeholder: "https://api.github.com" }));
      card.append(more);
    }
    // A saved tracker goes on (or off) pause at once; one not saved yet keeps it till “Save”.
    card.querySelector("[data-pause]").onchange = async (e) => {
      const on = e.target.checked;
      if (on) tk.paused = true;
      else delete tk.paused;
      const out = card.querySelector("[data-me]");
      e.target.disabled = true;
      try {
        const r = await (await fetch(`/api/tracker-pause?id=${encodeURIComponent(trackerId(tk))}&on=${on ? 1 : 0}`, { method: "POST" })).json();
        if (r.ok) {
          out.className = "msg ok";
          out.textContent = on ? t("s.tr.paused") : t("s.tr.resumed");
          renderNav();
        } else changed();
      } catch (err) {
        out.className = "msg bad";
        out.textContent = t("s.noAnswer") + ": " + err.message;
        changed();
      } finally {
        e.target.disabled = false;
      }
    };
    card.querySelector("[data-del]").onclick = () => {
      if (!confirm(t("s.tr.deleteAsk", { name: NAMES[tk.type] }))) return;
      cfg.trackers.splice(i, 1);
      changed();
      show(cfg.trackers.length ? "tracker:0" : "add");
    };
    card.querySelector("[data-check]").onclick = async (e) => {
      const out = card.querySelector("[data-me]");
      out.className = "msg";
      out.textContent = t("s.checking");
      const r = await (await fetch("/api/settings/check", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tracker: tk, env }) })).json();
      out.className = "msg " + (r.ok ? "ok" : "bad");
      out.textContent = r.ok ? t("s.tr.connected", { me: r.me }) : r.error;
    };
    box.append(card);
  });
}

// The rules saved to the repos' CLAUDE.md from your corrections of the agents (newest first), by project.
let lessons = [];
function lessonsHTML(tk) {
  const mine = lessons.filter((l) => l.trackerId === (tk.id || tk.type));
  if (!mine.length) return "";
  const by = {};
  for (const l of mine) (by[l.project] ??= []).push(l);
  return `<h3 style="margin:16px 0 4px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--fg)">${t("s.lessons.title")}</h3>
    <div style="font-size:12.5px;color:var(--mute)">${t("s.lessons.hint")}</div>` +
    Object.entries(by).map(([p, ls]) => `<div style="margin-top:8px;font-size:12.5px"><b>${esc(p)}</b><ul style="margin:4px 0 0;padding-left:18px">${ls.map((l) =>
      `<li style="margin:2px 0">${esc(l.rule)} <span style="color:var(--mute)">· ${esc(l.task)} → <code>${esc(l.branch)}</code>${l.commit ? ` <code>${esc(l.commit)}</code>` : ""} · ${new Date(l.at).toLocaleDateString(LANG)}</span></li>`).join("")}</ul></div>`).join("");
}

function projectsTable(tk) {
  tk.projects ??= {};
  const wrap = document.createElement("div");
  const what = t(tk.type === "jira" ? "s.pr.jira" : tk.type === "github" ? "s.pr.github" : "s.pr.gitlab");
  const ph = tk.type === "jira" ? "PAY" : tk.type === "github" ? "acme/web" : "group/app";
  wrap.innerHTML = `<h3 style="margin:16px 0 4px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--fg)">${t("s.pr.title")}</h3>
    <div style="font-size:12.5px;color:var(--mute)">${t(tk.type === "jira" ? "s.pr.hintJira" : "s.pr.hint")}
      ${t("s.pr.checksHint")}</div>
    <table class="projects"><thead><tr><th>${what}</th><th>${t("s.pr.path")}</th><th>${t("s.pr.clone")}</th><th title="${esc(t("s.pr.baseHint"))}">${t("s.pr.base")}</th><th title="${esc(t("s.pr.setupHint"))}">${t("s.pr.setup")}</th><th></th></tr></thead><tbody></tbody></table>
    <button style="margin-top:6px" data-addp>${t("s.pr.add")}</button>`;
  const body = wrap.querySelector("tbody");
  const rows = Object.entries(tk.projects);
  for (const [key, p] of rows) {
    const tr = document.createElement("tr");
    const multi = p && p.repos && Object.keys(p.repos).length > 1;
    tr.innerHTML = `<td><input type="text" value="${esc(key)}" data-key></td>` +
      (multi ? `<td colspan="4" style="color:var(--mute);font-size:12.5px;padding-top:8px">${t("s.pr.multi", { repos: Object.keys(p.repos).map(esc).join(", ") })}</td>`
        : `<td><input type="text" placeholder="~/mako/projects/${esc(key.split("/").pop() || t("s.pr.name"))}" value="${esc(p?.repoPath ?? "")}" data-f="repoPath"></td>
           <td><input type="text" placeholder="${tk.type === "jira" ? "git@host:group/app.git" : t("s.auto")}" value="${esc(p?.cloneUrl ?? "")}" data-f="cloneUrl"></td>
           <td><input type="text" placeholder="${esc(t("s.pr.asOrigin"))}" value="${esc(p?.baseBranch ?? "")}" data-f="baseBranch"></td>
           <td><input type="text" placeholder="${esc(t("s.pr.common"))}" title="${esc(t("s.pr.dashNothing"))}" value="${esc(p?.setup ?? "")}" data-f="setup"></td>`) +
      `<td><button class="ghost danger" title="${esc(t("s.pr.remove"))}">✕</button></td>`;
    let current = key;
    tr.querySelector("[data-key]").onchange = (e) => {
      const nk = e.target.value.trim();
      if (!nk || nk === current || tk.projects[nk]) { e.target.value = current; return; }
      const entries = Object.entries(tk.projects).map(([k, v]) => (k === current ? [nk, v] : [k, v]));
      tk.projects = Object.fromEntries(entries);
      current = nk;
      changed();
    };
    for (const inp of tr.querySelectorAll("[data-f]")) {
      inp.oninput = () => {
        const pp = (tk.projects[current] ??= {});
        if (inp.value.trim()) pp[inp.dataset.f] = inp.value.trim();
        else delete pp[inp.dataset.f];
        changed();
      };
    }
    tr.querySelector("button").onclick = () => { delete tk.projects[current]; changed(); renderTrackers(); };
    body.append(tr);
    // The checks before the MR: a line of their own under the project, one command a line.
    if (!multi) {
      const cr = document.createElement("tr");
      cr.className = "checks-row";
      cr.innerHTML = `<td colspan="5"><textarea rows="1" placeholder="${esc(t("s.pr.checksPh"))}" title="${esc(t("s.pr.checksTitle"))}"></textarea></td><td></td>`;
      const ta = cr.querySelector("textarea");
      ta.value = (p?.checks ?? []).join("\n");
      const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
      ta.oninput = () => {
        const list = ta.value.split("\n").map((x) => x.trim()).filter(Boolean);
        const pp = (tk.projects[current] ??= {});
        if (list.length) pp.checks = list; else delete pp.checks;
        fit();
        changed();
      };
      requestAnimationFrame(fit);
      body.append(cr);
    }
  }
  wrap.insertAdjacentHTML("beforeend", lessonsHTML(tk));
  if (!rows.length) body.innerHTML = `<tr><td colspan="4" style="color:var(--mute);font-size:12.5px;padding:6px 0">${t(tk.allProjects ? "s.pr.optional" : "s.pr.none")}</td></tr>`;
  wrap.querySelector("[data-addp]").onclick = () => {
    const key = prompt(t("s.pr.addAsk", { what, example: ph }))?.trim();
    if (!key || tk.projects[key]) return;
    tk.projects[key] = {};
    changed();
    renderTrackers();
  };
  return wrap;
}

// The Orca executor: the default one, or the first; made when there is none.
function orcaExecutor() {
  cfg.executors ??= {};
  const names = Object.keys(cfg.executors).filter((n) => cfg.executors[n]?.type === "orca");
  const name = names.includes(cfg.defaultExecutor) ? cfg.defaultExecutor : names[0];
  if (name) return cfg.executors[name];
  const term = onTerminal();
  cfg.executors.orca = { type: "orca" };
  cfg.defaultExecutor = term ? terminalExecutor()[0] : "orca";
  cfg.mode = "dispatch";
  return cfg.executors.orca;
}

// Mako's own terminal: the agent runs in a terminal on the board. What it is told to finish with stays in the
// Orca executor, for both.
// As Mako reads it: its own agent unless Orca is the default executor, or the only one there is.
const onTerminal = () => {
  const ex = cfg.executors ?? {}, types = Object.values(ex).map((e) => e?.type);
  if (ex[cfg.defaultExecutor]) return ex[cfg.defaultExecutor].type !== "orca";
  return !(types.includes("orca") && !types.includes("terminal"));
};
function terminalExecutor() {
  cfg.executors ??= {};
  const name = Object.keys(cfg.executors).find((n) => cfg.executors[n]?.type === "terminal");
  if (name) return [name, cfg.executors[name]];
  cfg.executors.terminal = { type: "terminal" };
  return ["terminal", cfg.executors.terminal];
}

function plural(n, key) {

// The agents' worktrees: how much each project's take, and “Remove merged”.
let diskNote = "";
const size = (b) => b >= 1 << 30 ? `${(b / (1 << 30)).toFixed(1)} ${t("s.gb")}` : b >= 1 << 20 ? `${Math.round(b / (1 << 20))} ${t("s.mb")}` : `${Math.round(b / 1024)} ${t("s.kb")}`;
async function renderDisk(msg = "") {
  const box = $("disk");
  if (!box.innerHTML) box.innerHTML = `<div class="card muted">${t("s.d.counting")}</div>`;
  let list;
  try {
    list = await (await fetch("/api/settings/worktrees")).json();
  } catch {
    box.innerHTML = `<div class="card bad">${t("s.noAnswer")}</div>`;
    return;
  }
  const total = list.reduce((n, u) => n + u.bytes, 0), cleanable = list.reduce((n, u) => n + u.cleanable, 0);
  const freed = list.reduce((n, u) => n + u.cleanableBytes, 0);
  diskNote = total ? size(total) : "";
  const projects = list.length ? list.map((u) => `<div class="card"><div class="card-head"><b>${esc(u.repo)}</b><span class="muted">${u.worktrees.length} worktree · ${size(u.bytes)}</span></div>
      ${u.worktrees.map((w) => `<div class="device"><div><code>${esc(w.branch || w.path.split("/").pop())}</code>
        <div class="muted">${w.task ? esc(w.task) + (w.cleanable ? " · " + t("s.d.mergedOrArchived") : "") : t("s.d.notMako")}</div></div><span class="muted">${size(w.bytes)}</span></div>`).join("")}</div>`).join("")
    : `<div class="card muted">${t("s.d.none")}</div>`;
  box.innerHTML = `<div class="card"><div class="row" style="margin-top:0"><b>${t("s.d.total", { size: size(total) })}</b><span class="spacer"></span>
      <button class="primary" id="disk-clean" ${cleanable ? "" : "disabled"}>${t("s.d.clean")}${cleanable ? ` (${cleanable}, ${size(freed)})` : ""}</button></div>
      ${msg ? `<div class="msg">${esc(msg)}</div>` : ""}</div>${projects}`;
  $("disk-clean").onclick = async () => {
    $("disk-clean").disabled = true;
    $("disk-clean").textContent = t("s.d.cleaning");
    let r;
    try {
      r = await (await fetch("/api/settings/worktrees/clean", { method: "POST" })).json();
    } catch {
      r = { ok: false };
    }
    const c = r.cleanup;
    renderDisk(!r.ok ? t("s.noAnswer") : t("s.d.cleaned", { worktrees: c.worktrees, branches: c.branches }) +
      (c.keptTasks?.length ? t("s.d.kept", { tasks: c.keptTasks.join(", ") }) : ""));
  };
  renderNav();
}

      <div class="row">${ts.public
        ? `<button data-p="serve">${t("s.p.onlyTailnet")}</button>`
        : `<button data-p="serve" data-public="1">${t("s.p.openAny")}</button>`}
        <button class="ghost danger" data-p="unserve">${t("s.p.close")}</button></div>`;
  }
  if (phoneError) step1 += `<div class="notice-inline">${linkifyText(phoneError)}</div>`;
  const step2 = !st.url ? `<span class="muted">${t("s.p.step1First")}</span>`
    : qr ? `<div class="qr"><img src="${qr.qr}" alt="QR"><ol>
        <li>${t("s.p.qr1")}</li>
        <li>${t("s.p.qr2")}</li>
        <li>${t("s.p.qr3")}</li></ol></div>`
    : `<div class="row"><button class="primary" data-p="pairing">${t("s.p.showQr")}</button></div>`;
  const devices = st.devices.length
    ? st.devices.map((d) => `<div class="device"><div><b>${esc(d.name)}</b> <span class="muted">${t("s.p.device", { created: new Date(d.created).toLocaleDateString(LANG), seen: new Date(d.lastSeen).toLocaleString(LANG) })}</span>
        <div class="muted">${t(d.push ? "s.p.pushOn" : "s.p.pushOff")}</div></div>
        <button class="ghost danger" data-p="remove" data-id="${esc(d.id)}">${t("s.p.disconnect")}</button></div>`).join("") +
      `<div class="row"><button data-p="test">${t("s.p.test")}</button><span class="msg" id="phone-msg"></span></div>`
    : `<span class="muted">${t("s.p.noneYet")}</span>`;
  box.innerHTML = `<div class="card"><h3 class="step">${t("s.p.step1")}</h3>${step1}</div>
    <div class="card"><h3 class="step">${t("s.p.step2")}</h3>${step2}</div>
    <div class="card"><h3 class="step">${t("s.p.connected")}</h3>${devices}</div>`;
  phoneNote = st.devices.length ? t("s.p.note", { n: st.devices.length }) : ts.serving ? t("s.p.ready") : "";
  for (const b of box.querySelectorAll("[data-p]")) {
    b.onclick = async () => {
      const action = b.dataset.p;
      if (action === "refresh") return renderPhone();
      if (action === "remove" && !confirm(t("s.p.removeAsk"))) return;
      b.disabled = true;
      const query = b.dataset.id ? `?id=${encodeURIComponent(b.dataset.id)}` : b.dataset.public ? "?public=1" : "";
      if (action === "serve" || action === "unserve") b.textContent = t("s.p.wait");
      let r;
      try {
        r = await (await fetch(`/api/phone/${action}${query}`, { method: "POST" })).json();
      } catch {
        r = { ok: false, error: t("s.noAnswer") };
      }
      b.disabled = false;
      phoneError = r.ok ? "" : r.error;
      if (!r.ok && action !== "serve" && action !== "unserve") return alert(r.error);
      if (action === "test") return ($("phone-msg").textContent = t("s.p.sent"));
      renderPhone(action === "pairing" ? r : undefined);
    };
  }
  renderNav();
}

function render() {
  document.title = "Mako · " + t("s.title");
  show(pane || decodeURIComponent(location.hash.slice(1)));
  renderLanguage();
  renderOrca();
  renderComments();
  renderLimits();
  renderNotifications();
}

function showProblems(list) {
  problems = list ?? [];
  $("problems").innerHTML = list?.length ? `<div class="banner">${list.map((p) => `<div>${esc(p)}</div>`).join("")}</div>` : "";
}

async function load() {
  const [r, ls] = await Promise.all([fetch("/api/settings").then((x) => x.json()), fetch("/api/settings/lessons").then((x) => x.json()).catch(() => []), loadI18n()]);
  lessons = Array.isArray(ls) ? ls : [];
  cfg = r.config ?? {};
  envSet = r.env;
  jiraBase = r.jiraBaseUrl ?? "";
  autoWip = r.autoWip ?? 1;
  env = {};
  $("where").innerHTML = t("s.where", { file: `<code>${esc(r.home)}/mako.config.json</code>` });
  showProblems(r.problems);
  dirty = false;
  render();
}

for (const b of document.querySelectorAll("[data-add]")) {
  b.onclick = () => {
    cfg.trackers ??= [];
    const tk = { type: b.dataset.add, projects: {} };
    if (tk.type !== "jira") { tk.allProjects = true; tk.labels = { trigger: null }; }
    cfg.trackers.push(tk);
    changed();
    show(`tracker:${cfg.trackers.length - 1}`);
  };
}

$("revert").onclick = () => load();
$("save").onclick = async () => {
  $("save").disabled = true;
  $("msg").className = "msg";
  $("msg").textContent = t("s.saving");
  // Empty helper objects the form made stay out of the file.
  for (const tk of cfg.trackers ?? []) {
    if (tk.labels && !Object.keys(tk.labels).length) delete tk.labels;
    if (tk.transitions && !Object.keys(tk.transitions).length) delete tk.transitions;
  }
  if (cfg.notifications?.events && !Object.keys(cfg.notifications.events).length) delete cfg.notifications.events;
  if (cfg.notifications && !Object.keys(cfg.notifications).length) delete cfg.notifications;
  if (cfg.comments && !Object.keys(cfg.comments).length) delete cfg.comments;
  try {
    const r = await (await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ config: cfg, env }) })).json();
    if (!r.ok) {
      $("msg").className = "msg bad";
      $("msg").textContent = r.error;
      return;
    }
    dirty = false;
    for (const k of Object.keys(env)) envSet[k] = true;
    env = {};
    showProblems(r.problems);
    $("msg").className = "msg ok";
    $("msg").textContent = r.problems?.length ? t("s.savedProblems") : t("s.saved");
    render();
  } catch (e) {
    $("msg").className = "msg bad";
    $("msg").textContent = t("s.noAnswer") + ": " + e.message;
  } finally {
    $("save").disabled = false;
  }
};
window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });
load();
</script>
</body>
</html>
