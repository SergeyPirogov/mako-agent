    <div class="chat-resume" hidden><button type="button" class="resume-btn on-light" data-chat-resume title="The agent has stopped. The conversation is saved in Claude Code.">${ICON.play}Continue conversation</button></div>
    <div class="chat-foot">
      <div class="chat-quick">${["Continue", "Run the tests", "Open the MR"].map((q) => `<button type="button" class="chip" data-quick="${q}">${q}</button>`).join("")}</div>
      <div class="chat-box"><textarea rows="2" aria-label="Message to the agent"></textarea>
        <button type="button" class="icon chat-stop" title="Interrupt the current step" aria-label="Interrupt the current step" hidden>${ICON.stop}</button>
        <button type="button" class="chat-send" title="Send (Enter)" aria-label="Send">${ICON.push}</button></div>
      <div class="chat-hint">
        <label class="chat-mode" title="What Claude does without asking; takes effect immediately, like Shift+Tab in the terminal">
          <select aria-label="What Claude does without asking">
            <option value="auto">auto</option><option value="default">ask for everything</option><option value="acceptEdits">edits without asking</option>
            <option value="plan">plan</option><option value="bypassPermissions">no questions</option></select></label>
        <span class="chat-model"></span><span class="chat-ctx"></span>
        <span class="chat-keys">Enter — send · Shift+Enter — new line</span></div>
    </div>`;
  const v = (cv = { id, el, list: el.querySelector(".chat-list"), input: el.querySelector("textarea"), version: -1, flip: new Set(), snap: null, top: 0, atEnd: true, auto: -1 });
  // What grows after it is drawn (pictures, opened blocks) keeps the end in view.
  v.grow = new ResizeObserver(() => { if (v.atEnd && v.list.isConnected) restoreChatScroll(v); });
  // Where the reader is: the board re-attaches the chat when it redraws the page, and that drops the list's scroll.
  // Only the reader's own scrolling counts: the event from Mako setting the scroll itself comes a frame later, when
  // pictures may have loaded and pushed the end down, and would leave the chat in the middle from then on.
  v.list.onscroll = () => {
    if (!v.list.isConnected || Math.abs(v.list.scrollTop - v.auto) < 2) return;
    v.top = v.list.scrollTop;
    v.atEnd = v.list.scrollHeight - v.list.scrollTop - v.list.clientHeight < 60;
  };
  // To a closed agent too: the message resumes the conversation, in a new session the board reads from 0.
  const say = async (text) => {
    if (!text) return;
    const r = await (await fetch(`/api/say?id=${encodeURIComponent(id)}`, { method: "POST", body: text })).json().catch(() => ({}));
    const keys = el.querySelector(".chat-keys");
    keys.classList.toggle("err", r.ok === false);
    keys.textContent = r.ok === false ? `⚠ ${r.error}` : "Enter — send · Shift+Enter — new line";
    if (r.ok === false) v.input.value ||= text;
    if (!v.snap?.live) v.version = -1;
    pollChat();
  };
  const send = () => { const text = v.input.value.trim(); v.input.value = ""; say(text); };
  for (const q of el.querySelectorAll("[data-quick]")) q.onclick = () => say(q.dataset.quick);
  v.input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
  el.querySelector(".chat-send").onclick = send;
  el.querySelector(".chat-mode select").onchange = (e) =>
    fetch(`/api/mode?id=${encodeURIComponent(id)}&to=${e.target.value}`, { method: "POST" }).then(() => pollChat());
  el.querySelector(".chat-stop").onclick = () => fetch(`/api/interrupt?id=${encodeURIComponent(id)}`, { method: "POST" });
  el.querySelector("[data-chat-resume]").onclick = () => post("resume", id).then(() => { v.version = -1; pollChat(); });
  v.list.onclick = (e) => {
    const t = e.target.closest("[data-toggle]");
    if (t) { if (!v.flip.delete(t.dataset.toggle)) v.flip.add(t.dataset.toggle); renderChat(v); return; }
    // The agent's questions: an option, or your own words.
    if (answerClick(e, `/api/answer?id=${encodeURIComponent(id)}`, pollChat)) return;
    // The plan: approve it, or open the field for notes and send them.
    const pd = e.target.closest("[data-plan-do]");
    if (pd) {
      const card = pd.closest("[data-plan]"), fix = card.querySelector(".plan-fix"), notes = fix.querySelector("textarea");
      if (pd.dataset.planDo === "revise" && fix.hidden) {
        fix.hidden = false;
        pd.textContent = "Send edits";
        notes.focus();
        return;
      }
      if (pd.dataset.planDo === "revise" && !notes.value.trim()) return notes.focus();
      pd.disabled = true;
      fetch(`/api/plan?id=${encodeURIComponent(id)}&req=${encodeURIComponent(card.dataset.plan)}&do=${pd.dataset.planDo}`,
        { method: "POST", body: pd.dataset.planDo === "revise" ? notes.value.trim() : "" }).then(() => pollChat());
      return;
    }
    const p = e.target.closest("[data-permit]");
    if (p) {
      p.disabled = true;
      fetch(`/api/permit?id=${encodeURIComponent(id)}&req=${encodeURIComponent(p.dataset.permit)}&decision=${p.dataset.d}`, { method: "POST" }).then(() => pollChat());
    }
  };

  pollChat();
  return v;
}
function closeChat() {
  if (!cv) return;
  clearInterval(cv.timer);
  cv.grow.disconnect();
  cv = null;
}
async function pollChat() {
  // The first ask goes before the chat is on the page (chatFor runs ahead of the append): it waits for none.
  const v = cv;
  if (!v) return;
  const s = await getJSON(`/api/chat?id=${encodeURIComponent(v.id)}&v=${v.version}`);
  if (v !== cv || !v.el.isConnected || s.same || s.error) return;
  v.snap = s;
  v.version = s.version;

}
function restoreChatScroll(v) {
  v.list.scrollTop = v.atEnd ? v.list.scrollHeight : v.top;
  v.auto = v.list.scrollTop;
}
function renderChat(v) {

  list.innerHTML = `<div class="chat-col">${chatBlocks(s.items, v) || `<div class="files-empty">${s.live ? "The agent is waiting: tell it what to do." : "The conversation will appear here once the agent starts."}</div>`}
    ${s.state === "working" ? `<div class="chat-working"><span class="pulse"></span>${esc(running ? `${running.tool}${toolArg(running.input)}` : "Thinking…")}</div>` : ""}</div>`;
  // Stays at the end while the agent writes, unless the reader scrolled up: then right where they were.
  if (v.version <= 1) v.atEnd = true;

  v.grow.observe(list.firstElementChild);

  // A closed agent still takes a message: it resumes. The button is for one stopped some other way.
  v.el.querySelector(".chat-resume").hidden = s.live || s.asleep;
  v.el.querySelector(".chat-quick").hidden = s.state === "working" || s.state === "waiting";
  const mode = v.el.querySelector(".chat-mode select");
  if (document.activeElement !== mode) mode.value = s.mode || "default";
  mode.disabled = !s.live;
  v.el.querySelector(".chat-model").textContent = s.model ? s.model.replace(/^claude-/, "").replace(/-(\d+)-(\d+)$/, " $1.$2") : "";
  const k = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(n % 1e6 ? 1 : 0)}M` : `${Math.round(n / 1000)}k`;
  const ctx = v.el.querySelector(".chat-ctx");
  ctx.textContent = s.context ? `context ${s.window ? Math.round((100 * s.context) / s.window) + "% · " : ""}${k(s.context)}${s.window ? " of " + k(s.window) : ""}` : "";
  ctx.className = "chat-ctx" + (s.window && s.context / s.window > 0.8 ? " full" : "");

}
const toolArg = (input) => {
  for (const k of ["command", "file_path", "pattern", "url", "description", "prompt"]) {
    const x = input?.[k];

  }
  return "";
};
// What matters in a conversation is what the agent says, what it changed and what it asks: the commands and
// reads between are folded into one line, open on a click.
const EDITS = ["Edit", "MultiEdit", "Write", "NotebookEdit"];
const quiet = (it) => (it.kind === "tool" && !EDITS.includes(it.tool)) || (it.kind === "permission" && it.status !== "asked" && it.tool !== "ExitPlanMode");
const STEP = { Bash: "commands", Read: "reading", Grep: "search", Glob: "search", LS: "search", WebFetch: "web", WebSearch: "web",
  Task: "subagents", Agent: "subagents", TodoWrite: "plan" };
function chatBlocks(items, v) {

    let j = i; while (j < items.length && quiet(items[j])) j++;

    const failed = group.filter((it) => it.status === "error").length, running = group.some((it) => it.status === "running");
    out += `<div class="steps${open ? " open" : ""}"><button type="button" class="steps-h" data-toggle="${esc(key)}">${MR_ICON[running ? "run" : "ok"]}
        <span>${group.length} ${plural(group.length, "step", "steps")}</span>
        <span class="muted">${Object.entries(counts).map(([k, n]) => `${esc(k)} ${n}`).join(" · ")}</span>
        ${failed ? `<span class="steps-bad">${failed} failed</span>` : ""}<span class="muted tw">${open ? "▾" : "▸"}</span></button>
      ${open ? `<div class="steps-body">${items.slice(i, j).map((it, k) => chatItem(it, i + k, v)).join("")}</div>` : ""}</div>`;

function chatItem(it, i, v) {

          ${open("prompt", false) ? `<div class="prompt-body md">${md(it.text)}</div>` : ""}</div>`;
      }
      return `<div class="msg me"><div class="who">You</div><div class="bubble">${linkify(it.text)}</div></div>`;
    case "text": {
      if (!v.drafts) return `<div class="msg"><div class="who">Claude</div><div class="md">${md(it.text)}</div></div>`;
      const t = ticketOf(it.text);

      return `<div class="msg"><div class="who">Claude</div>${t.text.trim() ? `<div class="md">${md(t.text)}</div>` : ""}${t.draft ? ticketCard(t.draft, i) : ""}</div>`;
    }

      const arg = toolArg(it.input).slice(2);
      // An edit says which file and how much: «Changed checkout.ts +3 −1», the diff on a click.
      const head = edit ? `<b>${{ Write: "Created" }[it.tool] ?? "Changed"}</b><code title="${esc(arg)}">${esc(relPath(arg, v))}</code>${editCount(it)}`
        : `<b>${esc(it.tool)}</b><code>${esc(arg)}</code>`;
      return `<div class="tool-card ${it.status}${edit ? " edit" : ""}"><button type="button" class="tool-h" ${detail ? `data-toggle="${esc(it.id)}"` : "disabled"}>${MR_ICON[icon]}${head}
          ${detail ? `<span class="muted">${shown ? "▾" : "▸"}</span>` : ""}</button>${shown ? detail : ""}</div>`;
    }
    case "permission": {
      if (it.tool === "AskUserQuestion") return askCard(it);
      if (it.tool === "ExitPlanMode") return planCard(it, v);
      const arg = toolArg(it.input).slice(2) || JSON.stringify(it.input ?? {}).slice(0, 200);
      if (it.status !== "asked") {
        return `<div class="perm-done ${it.status}">${{ allowed: "✓ Allowed", always: "✓ Always allowed", denied: "✗ Denied" }[it.status] ?? it.status}: ${esc(it.tool)} ${esc(arg)}</div>`;
      }
      const sug = Array.isArray(it.suggestions) ? it.suggestions[0] : null;
      const always = !sug ? "" : sug.type === "addRules" ? `Allow ${(sug.rules ?? []).map((r) => r.ruleContent || r.toolName).join(", ")}`
        : sug.type === "setMode" && sug.mode === "acceptEdits" ? "Allow file edits" : "Always allow";
      return `<div class="perm"><div class="perm-h"><b>The agent asks for permission</b><span class="muted">· ${esc(it.tool)}</span></div>
        <code class="perm-cmd">${esc(arg)}</code>
        <div class="perm-btns"><button type="button" class="primary" data-permit="${esc(it.id)}" data-d="allow">Allow</button>
          ${always ? `<button type="button" data-permit="${esc(it.id)}" data-d="always" title="${esc(always)}">${esc(always.length > 48 ? always.slice(0, 47) + "…" : always)}</button>` : ""}
          <button type="button" class="danger" data-permit="${esc(it.id)}" data-d="deny">No</button></div></div>`;
    }
    case "result": {
      const sec = Math.round(it.seconds || 0), dur = sec >= 60 ? `${Math.floor(sec / 60)} min ${sec % 60} s` : `${sec} s`;
      return `<div class="turn-end">${MR_ICON.ok}Turn finished · ${dur}${it.cost ? ` · $${it.cost.toFixed(2)}` : ""}</div>`;
    }
    case "error":
      return `<div class="notice">${esc(it.text)}</div>`;
    case "image":
      return `<figure class="shot">${pic(it.text, it.output)}<figcaption>Screenshot · ${esc(it.output)}</figcaption></figure>`;
  }
  return "";
}
// The agent's plan (plan mode): to approve, after which it works in the usual mode, or to send back with notes.
function planCard(it, v) {
  const plan = it.input?.plan ?? "";
  if (it.status !== "asked") {
    const key = `plan:${it.id}`, shown = v.flip.has(key);
    const what = { approved: "✓ Plan approved", allowed: "✓ Plan approved", revised: "↺ Plan sent back for changes", denied: "✗ Plan rejected" }[it.status] ?? it.status;
    return `<div class="plan-card done ${esc(it.status)}"><button type="button" class="plan-h" data-toggle="${esc(key)}"><b>${what}</b>
        ${it.text ? `<span class="muted">${esc(it.text.split("\n")[0].slice(0, 120))}</span>` : ""}<span class="muted tw">${shown ? "▾" : "▸"}</span></button>
      ${shown ? `<div class="md plan-body">${md(plan)}</div>` : ""}</div>`;
  }
  return `<div class="plan-card" data-plan="${esc(it.id)}"><div class="plan-h"><b>Agent plan</b><span class="muted">· nothing changed yet, waiting for you</span></div>
    <div class="md plan-body">${md(plan)}</div>
    <div class="plan-fix" hidden><textarea rows="3" placeholder="What to change in the plan…" aria-label="Plan changes"></textarea></div>
    <div class="perm-btns"><button type="button" class="primary" data-plan-do="approve">Approve and proceed</button>
      <button type="button" data-plan-do="revise">Request changes</button></div></div>`;
}
// The agent asks: its questions with their options as buttons, and a line for your own answer.
// A click in the agent's question (askCard): an option picked, or the answers sent to url&req=<its request>, then
// after(). True when the click was the question's.
function answerClick(e, url, after) {
  const ans = e.target.closest("[data-ans]");
  if (ans) {
    const box = ans.closest("[data-question]"), answers = {};
    for (const q of box.querySelectorAll("[data-q]")) {
      const own = q.querySelector("input")?.value.trim();
      const picked = [...q.querySelectorAll(".opt.on")].map((b) => b.dataset.label);
      const a = own || picked.join(", ");
      if (a) answers[q.dataset.q] = a;
    }
    if (ans.dataset.ans === "send" && !Object.keys(answers).length) return true;
    ans.disabled = true;
    fetch(`${url}&req=${encodeURIComponent(box.dataset.question)}`, { method: "POST", body: JSON.stringify(answers) }).then(() => after());
    return true;
  }
  const opt = e.target.closest(".opt");
  if (!opt) return false;
  const q = opt.closest("[data-q]");
  if (q.dataset.multi !== "1") for (const b of q.querySelectorAll(".opt")) if (b !== opt) b.classList.remove("on");
  opt.classList.toggle("on");
  // One question, one choice: that is the answer.
  if (q.dataset.multi !== "1" && opt.closest("[data-question]").querySelectorAll("[data-q]").length === 1) opt.closest("[data-question]").querySelector("[data-ans]").click();
  return true;
}
function askCard(it) {
  const qs = it.input?.questions ?? [];
  if (it.status !== "asked") {
    const a = it.answers ?? {};
    return `<div class="perm-done ${it.status}">${it.status === "answered" ? `✓ ${Object.entries(a).map(([q, x]) => `${esc(q)} → <b>${esc(x)}</b>`).join(" · ")}` : `✗ No answer`}</div>`;
  }
  return `<div class="perm ask-card" data-question="${esc(it.id)}"><div class="perm-h"><b>The agent asks</b></div>
    ${qs.map((q) => `<div class="ask-item" data-q="${esc(q.question)}" data-multi="${q.multiSelect ? 1 : 0}"><div class="ask-text">${q.header ? `<span class="muted">${esc(q.header)} · </span>` : ""}${esc(q.question)}</div>
      <div class="ask-opts">${(q.options ?? []).map((o) => `<button type="button" class="opt" data-label="${esc(o.label)}" title="${esc(o.description ?? "")}">${esc(o.label)}</button>`).join("")}</div>
      <input type="text" placeholder="Or your own answer…" aria-label="Your own answer"></div>`).join("")}
    <div class="perm-btns"><button type="button" class="primary" data-ans="send">Answer</button></div></div>`;
}
const relPath = (p, v) => {
  const wt = data?.records.find((x) => x.id === v.id)?.worktree;
  return wt && p.startsWith(wt + "/") ? p.slice(wt.length + 1) : p;
};
function editCount(it) {
  const inp = it.input ?? {}, n = (t) => (t ? String(t).split("\n").length : 0);
  const pairs = it.tool === "MultiEdit" ? inp.edits ?? [] : it.tool === "Edit" ? [inp] : [];
  const add = it.tool === "Write" ? n(inp.content) : pairs.reduce((a, e) => a + n(e.new_string), 0);
  const del = pairs.reduce((a, e) => a + n(e.old_string), 0);
  return `<span class="num">${add ? `<span class="add">+${add}</span>` : ""}${del ? ` <span class="del">−${del}</span>` : ""}</span>`;
}
// What a tool card shows when opened: an edit's diff, a command's output.
function toolDetail(it) {
  const inp = it.input ?? {};
  const lines = (txt, sign) => String(txt ?? "").split("\n").map((l) => sign + l).join("\n");
  if (it.tool === "Edit") return diffHTML(`${lines(inp.old_string, "-")}\n${lines(inp.new_string, "+")}`);
  if (it.tool === "MultiEdit") return diffHTML((inp.edits ?? []).map((e) => `${lines(e.old_string, "-")}\n${lines(e.new_string, "+")}`).join("\n@@\n"));
  if (it.tool === "Write") return diffHTML(lines(String(inp.content ?? "").split("\n").slice(0, 60).join("\n"), "+"));
  if (it.tool === "Read" || it.tool === "Glob" || it.tool === "Grep") return "";
  return it.output ? `<pre class="tool-out">${esc(it.output)}</pre>` : "";
}

// Mako's own terminal: one xterm for the open task, kept while the board re-renders around it.
let tv = null;
function terminalFor(id) {
  if (tv?.id === id) return tv;
  closeTerminal();
  // The terminal, and over its bottom the agent's question with its answers as buttons.
  const wrap = document.createElement("div");
  wrap.className = "term-wrap";
  const el = document.createElement("div");
  el.className = "term";
  const ask = document.createElement("div");
  ask.className = "ask";
  ask.hidden = true;
  wrap.append(el, ask);
  const open = (e, uri) => { e?.preventDefault?.(); if (/^https?:\/\//i.test(uri)) window.open(uri, "_blank", "noopener"); };
  const term = new Terminal({
    cursorBlink: true, scrollback: 20000, allowProposedApi: true, fontSize: 12.5,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
    linkHandler: { activate: open, allowNonHttpProtocols: false },
    theme: { background: "#14161b", foreground: "#e6e6e6", cursor: "#4c8dff", selectionBackground: "#3a4d7a" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon.WebLinksAddon(open));
  term.open(el);
  const v = (tv = { id, el: wrap, term, ws: null, gone: false, closed: false, asked: "", answered: { key: "", at: 0 } });
  v.send = (m) => v.ws?.readyState === WebSocket.OPEN && v.ws.send(JSON.stringify(m));
  v.resize = () => {
    if (!el.isConnected || !el.offsetWidth) return;
    fit.fit();
    v.send({ t: "r", cols: term.cols, rows: term.rows });
  };
  term.onData((d) => v.send({ t: "i", d }));
  new ResizeObserver(() => v.resize()).observe(el);
  ask.onclick = (e) => {
    const b = e.target.closest("button[data-key]");
    if (!b) return;
    v.send({ t: "i", d: b.dataset.key });
    v.answered = { key: v.asked, at: Date.now() };
    ask.hidden = true;
    term.focus();
  };
  v.timer = setInterval(() => showChoice(v, ask), 1000);
  connect(v);
  return v;
}

// The agent's question: a numbered menu near the bottom of the screen («❯ 1. Yes / 2. … / 3. No») and the line
// above it that ends with «?».
function screenLines(term) {
  const b = term.buffer.active, lines = [];
  for (let y = b.baseY; y < b.baseY + term.rows; y++) {
    const line = b.getLine(y);
    const text = line?.translateToString(true) ?? "";
    if (line?.isWrapped && lines.length) lines[lines.length - 1] += text;
    else lines.push(text);
  }
  while (lines.length && !lines.at(-1).trim()) lines.pop();
  return lines;
}
function parseChoice(lines) {
  const opt = /^[\s│|]*(❯|>)?\s*(\d{1,2})[.)]\s+(.+?)\s*[│|]?\s*$/;
  let end = -1;
  for (let i = lines.length - 1; i >= Math.max(0, lines.length - 14); i--) if (opt.test(lines[i])) { end = i; break; }
  if (end < 0) return null;
  let start = end;
  for (let i = end - 1; i >= Math.max(0, end - 12); i--) {
    if (opt.test(lines[i])) start = i;
    else if (!/^\s{4,}\S/.test(lines[i])) break;
  }
  const options = lines.slice(start, end + 1).map((l) => l.match(opt)).filter(Boolean).map((m) => ({ key: m[2], label: m[3].trim() }));
  if (options.length < 2 || options[0].key !== "1") return null;
  for (let i = start - 1; i >= Math.max(0, start - 6); i--) {
    const q = lines[i].replace(/^[\s│|]+|[\s│|]+$/g, "");
    if (/\?\s*$/.test(q)) return { question: q, options };
  }
  return null;
}
function showChoice(v, ask) {
  if (v.closed || !v.el.isConnected) return;
  const c = v.gone ? null : parseChoice(screenLines(v.term));
  const key = c ? c.question + c.options.map((o) => o.label).join("|") : "";
  // Just answered: the menu stays on the screen a moment longer than the answer takes.
  if (key && key === v.answered.key && Date.now() - v.answered.at < 10000) return;
  if (key === v.asked && ask.hidden === !key) return;
  v.asked = key;
  ask.hidden = !key;
  if (!c) return;
  ask.innerHTML = `<span class="ask-q"><b>The agent asks:</b> ${esc(c.question)}</span>` + c.options.map((o, i) =>
    `<button type="button" class="${i === 0 ? "primary" : ""}" data-key="${esc(o.key)}" title="Same as pressing ${esc(o.key)} in the terminal">${esc(o.key)}. ${esc(o.label)}</button>`).join("");
}
function connect(v) {
  v.gone = false;
  v.ws?.close();
  const ws = (v.ws = new WebSocket(`ws://${location.host}/ws/term?id=${encodeURIComponent(v.id)}`));
  ws.onopen = () => v.resize();
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "init") { v.term.reset(); v.term.write(m.d); v.gone = m.gone; }
    else if (m.t === "o") v.term.write(m.d);
    else if (m.t === "x") { v.gone = true; load(); }
  };
  ws.onclose = () => { if (ws === v.ws && !v.closed && !v.gone) setTimeout(() => ws === v.ws && !v.closed && connect(v), 2000); };
}
function closeTerminal() {
  if (!tv) return;
  tv.closed = true;
  clearInterval(tv.timer);
  tv.ws?.close();
  tv.term.dispose();
  tv = null;
}

// #digest:<ms>: the morning push's link, the digest from that time.
const digestHash = () => { const h = decodeURIComponent(location.hash.slice(1)); return h.startsWith("digest:") ? h.slice(7) : null; };
const startDigest = digestHash();
// #new: straight to the new-task form.
if (location.hash === "#new") newOpen = "task";
else if (location.hash === "#code") newOpen = "code";
// #stats: straight to "Stats".
else if (location.hash === "#stats") statsOpen = true;
// On a phone the board opens on the list: only a link to a task (#id) opens the task itself.
else selected = startDigest ? null : decodeURIComponent(location.hash.slice(1)) || (narrow.matches ? null : (() => { try { return localStorage.getItem("mako-selected"); } catch { return null; } })());
// A link to a task (from a notification or the menu) opens it even when the board is already open.
// An open menu closes on a click anywhere else.
document.addEventListener("click", (e) => {
  for (const m of document.querySelectorAll("details.menu[open]")) if (!m.contains(e.target)) m.open = false;
});
window.addEventListener("hashchange", () => {
  const since = digestHash();
  if (since) return loadDigest(since);
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === "new") return openNewTask();
  if (id && id !== selected) select(id);
});
// Back at the board: look at once, so what happened meanwhile shows without waiting for the next poll.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
// On a phone: the app on the home screen, its service worker, and pushes once the user allows them.
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
// iPadOS calls itself a Mac; its touch screen tells it apart.
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
// Each iOS browser hides "Share" in its own place; Safari is the one without a name of its own in the UA.
function iosAddHome() {
  const ua = navigator.userAgent;
  const home = '"Add to Home Screen" → "Add"';
  const fallback = "If there is no such item, update the browser and iOS (16.4+ required) or open a new QR code from the settings in Safari.";
  if (/CriOS/.test(ua)) return `"Share" <b>⎙</b> on the right of the address bar (or <b>⋯</b> → "Share") → ${home}. ${fallback}`;
  if (/FxiOS/.test(ua)) return `menu <b>☰</b> → "Share" → ${home}. ${fallback}`;
  if (/EdgiOS/.test(ua)) return `<b>⋯</b> → "Share" → ${home}. ${fallback}`;
  return `"Share" <b>⎙</b> → ${home}.`;
}
// Android's Chrome offers to install the app itself; the event comes once the page qualifies.
let installPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installPrompt = e;
  const b = $("install-app");
  if (b) b.hidden = false;
});
let phoneReady = false;
function setupPhone() {
  if (phoneReady || !data?.remote) return;
  phoneReady = true;
  document.body.classList.add("phone");
  $("settings-link").hidden = true;
  $("awake").hidden = true; // the Mac's own sleep: its settings, not the phone's
  // The hint to install the app: once closed with «×», not shown again on this phone.
  const hintHidden = (() => { try { return localStorage.getItem("mako-hint-hidden") === "1"; } catch { return false; } })();
  const hint = (body) => {
    $("phone-hint").innerHTML = `<div class="banner hint"><div class="hint-row"><div>${body}</div>
      <button class="icon-btn" id="hint-close" title="Hide" aria-label="Hide">×</button></div></div>`;
    $("hint-close").onclick = () => { $("phone-hint").innerHTML = ""; try { localStorage.setItem("mako-hint-hidden", "1"); } catch {} };
  };
  if (!standalone && ios) {
    // iOS gives pushes only to an app added to the home screen.
    if (!hintHidden) hint(`Add Mako to your Home Screen: ${iosAddHome()}
      <div class="muted">Then open Mako from its icon: that is the only way notifications arrive.</div>`);
    return;
  }
  if (!standalone && !hintHidden) {
    // Android: pushes work in the browser too, the app on the home screen is for convenience.
    hint(`Install Mako as an app: browser menu <b>⋮</b> → "Add to Home Screen".
      <button class="primary" id="install-app"${installPrompt ? "" : " hidden"}>Install</button>`);
    $("install-app").onclick = async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      if ((await installPrompt.userChoice).outcome === "accepted") $("phone-hint").innerHTML = "";
      installPrompt = null;
    };
  }
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  navigator.serviceWorker.register("/sw.js").then(async (reg) => {
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === "granted") return subscribe(sub);
    $("bell").hidden = false;
  });
  $("bell").onclick = async () => {
    try {
      if ((await Notification.requestPermission()) !== "granted") return alert(ios
        ? "Notifications are not allowed. Turn them on: Settings → Notifications → Mako."
        : "Notifications are not allowed. Turn them on: 🔒 next to the address → Permissions → Notifications (or Settings → Apps → Mako → Notifications).");
      const reg = await navigator.serviceWorker.ready;
      const { key } = await (await fetch("/api/push/key")).json();
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlKey(key) });
      await subscribe(sub);
      $("bell").hidden = true;
    } catch (e) {
      alert("Could not enable notifications: " + e.message);
    }
  };
}
const subscribe = (sub) => fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
function urlKey(b64) {
  const raw = atob((b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

// The keyboard on iOS covers the page instead of shrinking it: the body takes the visible part, so the
// chat's input stays above the keyboard.
narrow.addEventListener("change", () => { if (data) renderDetail(); });
if (window.visualViewport) {
  const fit = () => document.documentElement.style.setProperty("--vvh", `${Math.round(visualViewport.height)}px`);
  visualViewport.addEventListener("resize", fit);
  fit();
}

load().then(() => { setupPhone(); if (startDigest) loadDigest(startDigest); });
setInterval(load, 5000);
// A task being started counts its steps' time by the second.
setInterval(() => { if (data?.records?.some((r) => r.id === selected && r.starting)) renderDetail(); }, 1000);
</script>
</body>
</html>
