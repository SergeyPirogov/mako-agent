<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mako</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mako">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/vendor/xterm.css">
</head>
<body>
<header>
  <span class="logo">🦈<span class="logo-t"> Mako</span> <span class="ver" id="ver"></span></span>
  <span class="wip" id="wip"></span>
  <span id="waiting"></span>
  <span id="restart-note"></span>
  <span class="spacer"></span>
  <span class="limits" id="limits"></span>
  <button class="icon-btn" id="awake"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/><path class="slash" d="M3 3l18 18"/></svg></button>
  <button class="icon-btn" id="restart" data-t-title="b.restart"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v7"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg></button>
  <button class="icon-btn" id="code-btn" data-t-title="b.code"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
  <button class="icon-btn" id="stats-btn" data-t-title="b.stats"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
  <button class="ghost" id="bell" hidden data-t-title="b.bell">🔔</button>
  <a class="icon-btn" id="settings-link" href="/settings" data-t-title="s.title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  <button class="ghost" id="theme"></button>
</header>
<div id="phone-hint"></div>
<div id="problems"></div>
<div id="trackers-down"></div>
<div id="update"></div>
<div id="release"></div>
<div id="limit-hold"></div>
<div class="work" id="work">
  <div class="side">
    <!-- One row on top: the filter, how the list is grouped, "+" (a new task or chat) -->
    <div class="side-top">
      <label class="find"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" data-t-ph="b.filterPh" autocomplete="off" spellcheck="false"></label>
      <button class="icon-btn" id="group-by" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 6H8"/><path d="M21 12h-8"/><path d="M21 18h-8"/><path d="M3 6v4a2 2 0 0 0 2 2h3"/><path d="M3 10v6a2 2 0 0 0 2 2h3"/></svg></button>
      <button class="icon-btn" id="new-menu" type="button" aria-haspopup="menu" aria-expanded="false" data-t-title="b.new">+</button>
      <div class="new-pop" id="new-pop" role="menu" hidden>
        <button id="new-task" role="menuitem" data-t="b.menuTask" hidden>Task</button>
        <button id="new-chat" role="menuitem" data-t="b.menuChat" data-t-title="b.newChatHint" hidden>Chat</button>
      </div>
    </div>
    <div class="filter" id="filter"><span id="need-chip" hidden></span><span class="scope" id="scope-box"><span class="scope-l" id="scope-l"></span><select id="scope" aria-label="Show"></select></span></div>
    <nav id="list" aria-label="Tasks"></nav>
    <!-- The search for tasks: when it last looked, look now, pause, why a task is missing -->
    <div class="side-bar">
      <span class="search" id="search"></span>
      <button class="icon-btn" id="poll" data-t-title="b.poll"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="icon-btn" id="pause"></button>
      <button class="icon-btn why" id="why-btn" data-t-title="b.whyHint">?</button>
    </div>
  </div>
  <section id="detail"><div class="empty" data-t="b.pick">Pick a task on the left</div></section>
</div>
<!-- "Redo differently": the agent went the wrong way; Mako drops the attempt and starts the task over. -->
<dialog id="redo" aria-labelledby="redo-h">
  <form method="dialog" id="redo-form">
    <h2 id="redo-h">Redo differently</h2>
    <p class="muted">Mako will stop the agent, close its MR, remove the worktree and start the task over on a new branch: with the same description, your instruction and a short summary of the previous attempt.</p>
    <label for="redo-note">What to do differently</label>
    <textarea id="redo-note" rows="5" placeholder="E.g.: don't touch the API, fix it on the frontend; first write a test that reproduces the bug"></textarea>
    <label for="redo-model">Model</label>
    <input id="redo-model" list="redo-models" placeholder="as in settings" autocomplete="off" spellcheck="false">
    <datalist id="redo-models"></datalist>
    <div class="redo-a">
      <button type="submit" class="primary" value="go">Redo</button>
      <button type="submit" value="cancel" formnovalidate>Cancel</button>
      <span class="muted">⌘/Ctrl+Enter — redo</span>
    </div>
  </form>
</dialog>
<!-- "Create ticket" / "Make a task" in a chat about code: the new-task form over the chat, which stays open. -->
<dialog id="ca-ticket-dlg" aria-label="New task"><div id="ca-ticket-form"></div></dialog>
<!-- "Send plan to…" on an agent's plan: a new chat, a new task or a chat that exists. -->
<dialog id="plan-xfer-dlg" aria-label="Send plan to"><div id="plan-xfer-box"></div></dialog>
<script src="/theme.js"></script>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script>
// The columns, the tasks' states and the agent's notes, in Mako's language: made again when it changes.
let COLUMNS = [], LABEL = {}, AGENT_NOTE = {};
function boardWords() {
  COLUMNS = ["doing", "blocked", "review", "merge", "forme", "new", "failed", "later", "done"].map((c) => [c, t("b.col." + c)]);
  // the agent's own state, for tasks in Orca (ag- keeps them apart from the columns)
  LABEL = Object.fromEntries(["new", "later", "queued", "starting", "doing", "review", "done", "failed",
    "ag-working", "ag-waiting", "ag-done", "ag-stopped", "ci", "ag-idle", "ag-missing"].map((k) => [k, t("b.label." + k)]));
  AGENT_NOTE = Object.fromEntries(["waiting", "done", "idle", "unknown"].map((k) => [k, t("b.agent." + k)]));
}
boardWords();
// The list's groups folded by a click on their heading (column → folded); "Snoozed", "Done" and "Not done" start folded.
const FOLDED_BY_DEFAULT = { later: true, done: true, failed: true };
let folded = (() => { try { return { ...FOLDED_BY_DEFAULT, ...JSON.parse(localStorage.getItem("mako-folded") || "{}") }; } catch { return { ...FOLDED_BY_DEFAULT }; } })();
// The list's filter.
let query = "";
// How the list is grouped, "project" (the default) or "status" (the user's choice is remembered in mako-group), and the projects folded in the first (a click on the heading).
let groupBy = (() => { try { return localStorage.getItem("mako-group") === "status" ? "status" : "project"; } catch { return "project"; } })();
let foldedProjects = new Set((() => { try { return JSON.parse(localStorage.getItem("mako-folded-projects") || "[]"); } catch { return []; } })());
// "Postponed" and "Done" of a project, opened on their own ("project|column").
const openQuiet = new Set();
// Where the list was scrolled to: it is drawn again on every refresh, click and fold.
let listTop = 0;
// The projects of the board (sorted): each has its colour in the list.
let liveProjects = [];
let statsDays = localStorage.getItem("mako-stats-days") || "";
// "Stats": the tab open and the project counted (none: all), remembered; the cut of "Breakdown" and "Heaviest",
// and the days shown as a table.
let statsTab = localStorage.getItem("mako-stats-tab") || "overview", statsProject = localStorage.getItem("mako-stats-project") || "";
let breakdownBy = "project", heavyBy = "files", trendTable = false;
// The list narrowed from "Needs attention" ({kind, reason}), until its chip is closed.
let attention = null;
// A phone's width: the list and the task are screens of their own, the right panel a tab.
const narrow = matchMedia("(max-width: 760px)");
// skew: how far this clock is from Mako's (a phone's may differ), for the times counted here.
let skew = 0;
let data = null, shown = "", selected = null, statsOpen = false, newOpen = false, project = localStorage.getItem("mako-project") || "", showArchive = false, logs = [], tab = "task";
// The last changes seen per task: a task opened again shows them at once, while the fresh ones load.
const changesOf = new Map();
// The task's work: its changed files, the files open in tabs over the terminal and their diffs.
let workOf = null, workStarted = false, changes = null, openFiles = [], fileTab = "", diffs = {}, collapsed = new Set();
// The task's MR as the code host has it ({review} or {error}), and what the last MR action said.
let review = null, mrNote = "", journalOpen = false;
// The branch's history for the commits' graph, and the commits opened in it (hash → their message and files).
let commitLog = null, commitOpen = {};
// Comments on the diff's lines, per task: a draft review until it goes to the agent, then shown on the lines
// until the agent changes them. The lines being commented ({path, rows, line, edit}) and what is written so far.
let notes = (() => { try { return JSON.parse(localStorage.getItem("mako-notes")) || {}; } catch { return {}; } })();
let pick = null, pickText = "", reviewNote = "";
// What happened while you were away ({since, until, waiting, review, failed, merged}): shown where a card goes.
let digest = null;
// The lesson Mako offers for CLAUDE.md, as you edit it before saving: { id, rule (as offered), text }.
let lessonEdit = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<>"')]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
// A task's text from the tracker: links, and its images, HTML (<img src="…">) or Markdown (![alt](url)), shown as images.
const IMG = /<img\b[^>]*?\bsrc\s*=\s*["']?(https?:\/\/[^"'\s>]+)[^>]*>|!\[([^\]]*)\]\((https?:\/\/[^\s)]+)(?:\s+"[^"]*")?\)/gi;
const richText = (s) => {
  let out = "", at = 0;
  for (const m of s.matchAll(IMG)) {
    const src = m[1] ?? m[3], alt = m[2] ?? m[0].match(/\balt\s*=\s*["']([^"']*)/i)?.[1] ?? "";
    out += linkify(s.slice(at, m.index)) + `<a href="${esc(src)}" target="_blank" rel="noopener"><img class="pic" src="${esc(src)}" alt="${esc(alt)}" loading="lazy"></a>`;
    at = m.index + m[0].length;
  }
  return out + linkify(s.slice(at));
};
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  if (m < 1440) return `${Math.round(m / 60)} h ago`;
  return `${Math.round(m / 1440)} d ago`;
};
// The list's narrow row: "4 min" for "4 min ago", the whole of it in the tooltip.
const agoShort = (iso) => ago(iso).replace(/ ago$/, "");
const ICON = {
  chevron: `<svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`,
  check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>`,
  doc: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>`,
  push: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`,
  external: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>`,
  merge: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>`,
  closeMR: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><path d="M6 9v12"/><circle cx="18" cy="18" r="3"/><path d="M18 11.5V15M21 3l-6 6M15 3l6 6"/></svg>`,
  pr: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4M13 3l-3 3 3 3"/></svg>`,
  archive: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg>`,
  unarchive: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M12 18v-6M9 15l3-3 3 3"/></svg>`,
  copy: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>`,
  folder: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
  code: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>`,
  pause: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>`,
  clock: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  play: `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>`,
  fix: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/><path d="M20 3v4M22 5h-4"/></svg>`,
  redo: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>`,
  find: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>`,
  swap: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>`,
  stop: `<svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>`,
  clip: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>`,
  up: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`,
  shield: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>`,
  warn: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/></svg>`,
  unwatch: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"/><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13 13 0 0 1-1.7 2.7"/><path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M2 2l20 20"/></svg>`,
};
const kind = (r) => `<span class="kind ${r.type}">${r.type === "fix" ? "bug" : "task"}</span>`;
// The list group a task sits in: a held-up task under "Blocked", a postponed one under "Snoozed".
// An MR that can be merged gets a group of its own under "In review".
const groupOf = (r) => (r.blocked ? "blocked" : state(r) === "later" ? "later" : !r.error && r.status !== "cancelled" && readyToMerge(r) ? "merge" : r.column);
const agentOf = (r) => (r.column === "doing" ? data.agents?.[r.id] : undefined);
// In Orca, the agent's own state says more than "in Orca".
const state = (r) => {
  if (r.column === "new" && r.postponed) return "later";
  // Taken: Mako prepares its start ("starting"), or the WIP limit or Claude's limit holds it ("queued").
  if (r.status === "queued") return r.starting ? "starting" : "queued";
  // The MR is open, its CI still runs: the task stays in work, but it waits for CI and not for the agent.
  const a = agentOf(r);
  if (r.column === "doing" && r.prUrl && r.status === "handed-off" && (!a || a.state === "done" || a.state === "idle")) return "ci";
  return a && LABEL["ag-" + a.state] ? "ag-" + a.state : r.column;
};
// The MR was checked and can be merged now: CI green, no conflicts or threads, the reviewer idle and its advice (if any) followed.
const readyToMerge = (r) => state(r) === "review" && !!r.mergeReady && !["running", "notes", "fixing"].includes(r.reviewStep) && !assessing(r) && !!(r.agentReviews?.length || !adviseReview(r));
// What the card says under its title: where the task is, in words ([text, class: "warn" or "err" or "", tooltip]).
const cardStatus = (r) => {
  if (r.status === "cancelled") return ["cancelled", ""];
  if (r.error) return ["failed", "err"];
  // "agent is waiting for you: agent asks": the head in the narrow row, the whole of it in the tooltip.
  // A stopped agent fixes nothing in its MR: red, so it does not pass for just a conflict.
  if (r.blocked) return [r.blocked.split(": ")[0], r.blocked.startsWith("agent stopped") ? "err" : "warn", r.blocked];
  if (r.checks?.attention && r.status === "handed-off") return ["needs attention", "warn", `Pre-MR check failed:  ${checksLine(r.checks)}`];
  if (r.reviewState === "closed") return ["MR closed", "err"];
  if (r.reviewState === "merged") return ["merged", ""];
  const st = state(r);
  if (st === "later") return ["snoozed", "", `Snoozed ${untilText(r.snoozedUntil)}`];
  // Left in "New" by auto-take: why, in the row ("large", "description has questions").
  if (r.column === "new" && r.autoSkip) return [r.autoSkip, "", `Not taken automatically:  ${r.autoSkip}`];
  if (st === "review" && r.ciWait) return ["MR · CI running", "warn", "MR is open, CI is still running: it goes to review when CI passes"];
  if (readyToMerge(r))
    return ["ready to merge", "ok", "CI passed, no conflicts or open threads: the MR can be merged"];
  if (st === "review") return !r.agentReviews?.length && adviseReview(r) ? ["MR in review · AI review advised", "warn", ADVISE + (r.assessment.review?.why ? `: ${r.assessment.review.why}` : "")] : ["MR in review", ""];
  if (st === "starting") return [LABEL[st], "", `Starting: ${startStep(r)?.label ?? "preparing the start"}`];
  if (st === "queued") return [LABEL[st], "", r.queueWhy ? `Queued:  ${r.queueWhy}` : ""];
  return [LABEL[st] ?? st, st === "ag-waiting" ? "warn" : st === "ag-stopped" ? "err" : ""];
};
const ATTENTION = { waiting: 0, done: 1, stopped: 1 };
// The start of a task taken: the steps done (with their time), the one going on, and those still to come.
const START_STEPS = { tracker: "updating the task in the tracker", main: "updating the base branch", worktree: "creating the worktree", setup: "setup",
  agent: "agent is starting", orca: "Orca creates the worktree and starts the agent" };
const startStep = (r) => r.starting?.steps?.at(-1);
const secs = (ms) => {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60} s`;
};
function startingHTML(r) {
  const p = r.starting, now = Date.now() - skew;
  const plan = p.executor === "orca" ? ["tracker", "orca"] : p.executor ? ["tracker", "main", "worktree", ...(p.setup ? ["setup"] : []), "agent"] : [];
  const seen = new Set(p.steps.map((s) => s.key));
  const rows = [...p.steps.map((s) => [s.label, s.done ? "done" : "now", (s.done || now) - s.at]), ...plan.filter((k) => !seen.has(k)).map((k) => [k === "main" && p.base ? `updating ${p.base}` : START_STEPS[k], "next", 0])];
  return `<div class="notice starting"><div><b>Starting the agent</b> · ${secs(now - p.since)}</div>
    <ol class="start-steps">${rows.map(([label, cls, ms]) => `<li class="${cls}">${esc(label)}${cls === "next" ? "" : `<span class="t">${secs(ms)}</span>`}</li>`).join("")}</ol></div>`;
}
// A small Markdown for what agents write and for tasks' text from the tracker: headings, lists, tables, code blocks,
// inline code, bold, italic and links.
// Images in it (screenshots for the MR, Mako's own ones, the tracker's), Markdown (![alt](url)) or HTML (<img src="…">), shown as images.
const MD_IMG = /<img\b[^>]*?\bsrc\s*=\s*["']?(https?:\/\/[^"'\s>]+)[^>]*>|!\[([^\]]*)\]\((https?:\/\/[^\s)]+|\/api\/screenshots\/[^\s)]+)(?:\s+"[^"]*")?\)/gi;
// Links: Markdown ([text](url)) and bare URLs.
const MD_LINK = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|https?:\/\/[^\s<>"'`)]+/g;
const pic = (src, alt) => `<a href="${esc(src)}" target="_blank" rel="noopener"><img class="pic" src="${esc(src)}" alt="${esc(alt)}" loading="lazy"></a>`;
function md(text) {
  const links = (x) => esc(x).replace(MD_LINK, (u, label, href) => `<a href="${href ?? u}" target="_blank" rel="noopener">${label ?? u}</a>`);
  // Inline code first: what is in backticks is never searched for links, so a URL there cannot swallow the closing </code>.
  // Bold and italic only outside the <a> that links() made, so a URL with _a_ in its path stays intact. Italic comes after bold;
  // _x_ and *x* need non-word characters around them, so snake_case and my_file.go stay as they are.
  const emph = (s) => s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^\w])_([^_\n]+?)_(?=[^\w]|$)/g, "$1<i>$2</i>")
    .replace(/(^|[^*\w])\*([^*\n]+?)\*(?![*\w])/g, "$1<i>$2</i>");
  const plain = (x) => x.split(/`([^`]+)`/).map((s, i) => i % 2 ? `<code>${esc(s)}</code>` : links(s).split(/(<a [^>]*>.*?<\/a>)/).map((t, j) => j % 2 ? t : emph(t)).join("")).join("");
  const inline = (x) => {
    let out = "", at = 0;
    for (const m of x.matchAll(MD_IMG)) {
      const src = m[1] ?? m[3], alt = m[2] ?? m[0].match(/\balt\s*=\s*["']([^"']*)/i)?.[1] ?? "";
      out += plain(x.slice(at, m.index)) + pic(src, alt);
      at = m.index + m[0].length;
    }
    return out + plain(x.slice(at));
  };
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const lines = text.trim().split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre class="code">${esc(code.join("\n"))}</pre>`);
      continue;
    }
    if (/^\s*\|/.test(l)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(lines[i]);
      i--;
      const body = rows.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r)).map(cells);
      const sep = rows.length > 1 && /^\s*\|?[\s:|-]+\|?\s*$/.test(rows[1]);
      const head = sep ? body.shift() : null;
      out.push(`<div class="table"><table>${head ? `<thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>` : ""}<tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const h = l.match(/^#{1,4}\s+(.*)/);
    const li = l.match(/^\s*[-*]\s+(.*)/);
    const num = l.match(/^\s*(\d+)[.)]\s+(.*)/);
    if (h) out.push(`<h4>${inline(h[1])}</h4>`);
    else if (li) out.push(`<li>${inline(li[1])}</li>`);
    else if (num) out.push(`<p class="num"><span>${num[1]}.</span> ${inline(num[2])}</p>`);
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  return out.join("").replace(/(<li>.*?<\/li>)+/g, (m) => `<ul>${m}</ul>`);
}

async function post(action, id, extra = "") {
  await fetch(`/api/${action}?id=${encodeURIComponent(id ?? "")}${extra}`, { method: "POST" });
  await load();
}
$("pause").onclick = () => fetch(`/api/pause?on=${data?.paused ? 0 : 1}`, { method: "POST" }).then(load);
$("awake").onclick = () => fetch(`/api/awake?on=${data?.awake?.on ? 0 : 1}`, { method: "POST" }).then(load);
$("restart").onclick = () => fetch(`/api/restart?on=${data?.restart?.pending ? 0 : 1}`, { method: "POST" }).then(load);
$("stats-btn").onclick = () => {
  selected = null; statsOpen = true; newOpen = false; digest = null;
  history.replaceState(null, "", location.pathname);
  try { localStorage.removeItem("mako-selected"); } catch {}
  render();
};
$("poll").onclick = async () => { $("poll").classList.add("busy"); await post("poll"); setTimeout(() => $("poll").classList.remove("busy"), 1500); };

async function load() {
  try {
    // seen=1: the board is on screen, so Mako knows you are back (and how long you were away).
    // days: the period "Stats" counts over.
    const q = new URLSearchParams();
    if (document.visibilityState === "visible") q.set("seen", "1");
    if (statsDays) q.set("days", statsDays);
    if (statsProject) q.set("project", statsProject);
    data = await (await fetch(`/api/state${q.toString() ? `?${q}` : ""}`)).json();
    if (data.now) skew = Date.now() - data.now;
    // The words of the page, the first time.
    if (!Object.keys(I18N).length) {
      await loadI18n();
      boardWords();
    }
  } catch {
    $("search").textContent = t("s.noAnswer");
    $("search").className = "search err";
    return;
  }
  // The running version, so it is clear which Mako is on screen.
  if (data.version) $("ver").textContent = data.version;
  if (data.digest) return openDigest(data.digest);
  await Promise.all([loadCard(), loadWork()]);
  render();
  if (cv) drawChatResume(cv);
}

// The digest takes the place of the open card; its links open the tasks.
function openDigest(d) {
  digest = d; selected = null; statsOpen = false; newOpen = false;
  history.replaceState(null, "", location.pathname);
  try { localStorage.removeItem("mako-selected"); } catch {}
  render();
}
async function loadDigest(since) {
  const d = await getJSON(`/api/digest?since=${encodeURIComponent(since)}`);
  if (!d.error) openDigest(d);
}

// The open card's journal and conversation, fetched side by side; a reply for a card no longer open is dropped.
async function loadCard() {
  const id = selected;
  if (!id) return;
  const [l] = await Promise.all([getJSON(`/api/log?id=${encodeURIComponent(id)}`), loadConvo()]);
  if (id === selected && Array.isArray(l)) logs = l;
}

// Claude's usage limits, the account's: how much of each window is used, when it resets in the tooltip (the 5h one also beside the meter).
// Bare=true is the compact form beside the meter: "12:20" today, "Fri, 12:20" later; otherwise "at 12:20" for prose.
const resetTime = (sec, bare) => {
  const d = new Date(sec * 1000), today = new Date().toDateString() === d.toDateString();
  const hm = d.toLocaleTimeString(LANG, { hour: "2-digit", minute: "2-digit" });
  return today ? (bare ? hm : `at ${hm}`) : d.toLocaleString(LANG, { weekday: "short", hour: "2-digit", minute: "2-digit" });
};
function limitsHTML(l) {
  const bad = data.limitPausePct || 85;
  const meter = (label, short, w, what, showReset) => {
    if (!w) return "";
    const pct = Math.round(w.used * 100), cls = pct >= bad ? "bad" : pct >= 60 ? "warn" : "";
    // A reset time in the past: the window is fresh again, though no agent has reported it yet.
    const live = w.resetsAt * 1000 > Date.now(), at = live ? resetTime(w.resetsAt) : "";
    return `<span class="limit ${cls}" title="${what}: ${pct}% used${live ? `, resets ${at}` : ""}"><span class="lk">${label}</span><span class="ls">${short}</span><span class="lbar"><span style="width:${Math.min(pct, 100)}%"></span></span><b>${pct}%</b>${showReset && live ? `<span class="lr">↻ ${resetTime(w.resetsAt, true)}</span>` : ""}</span>`;
  };
  return meter("5 h", "5h", l?.fiveHour, "Claude limit for 5 hours", true) + meter("Week", "wk", l?.week, "Claude limit for the week");
}

// Past the threshold the queue waits for the limit to reset; agents already working go on.
// Trackers Mako cannot search now (no internet, the VPN dropped, the service is down): which one, why in
// words, since when; the raw error under "Details".
// "Hide" snoozes a tracker's alert for an hour; it comes back only if the tracker is still down then.
const SNOOZE_MS = 60 * 60 * 1000;
let downSnoozed = (() => { try { return JSON.parse(localStorage.getItem("mako-down-snoozed")) || {}; } catch { return {}; } })();
const snoozed = (id) => Date.now() - (downSnoozed[id] || 0) < SNOOZE_MS;
function snoozeDown(ids) {
  const now = Date.now();
  for (const id of Object.keys(downSnoozed)) if (now - downSnoozed[id] >= SNOOZE_MS) delete downSnoozed[id];
  for (const id of ids) downSnoozed[id] = now;
  try { localStorage.setItem("mako-down-snoozed", JSON.stringify(downSnoozed)); } catch {}
}
function downHTML(failed) {
  failed = failed.filter(([id]) => !snoozed(id));
  if (!failed.length) return "";
  const since = (iso) => iso ? ` since ${new Date(iso).toLocaleTimeString(LANG, { hour: "2-digit", minute: "2-digit" })}` : "";
  return `<div class="banner down" role="alert">${failed.map(([id, s]) =>
    `<div><b>⚠ ${esc(s.down || id)}</b><span class="muted">${since(s.since)}</span>
      <button data-pause-tracker="${esc(id)}" title="Do not look for new tasks in this tracker until you resume; other trackers are still searched">Pause</button>
      <details><summary>Details</summary><code>${esc(s.error)}</code></details></div>`).join("")}
    <div class="muted">New tasks from ${failed.length > 1 ? "these trackers" : "this tracker"} will not appear while it is unavailable; Mako checks again on its own.
      <button class="ghost" id="poll-again">Check now</button>
      <button class="ghost" id="down-hide" data-ids="${esc(failed.map(([id]) => id).join("\n"))}" title="Do not show for an hour; if the tracker is still unavailable, the alert will come back">Hide for an hour</button></div></div>`;
}

// The trackers put on pause one by one: not searched until "Resume"; the others are.
function pausedHTML(ts) {
  if (!ts.length) return "";
  return `<div class="banner paused">${ts.map((t) =>
    `<div class="paused-row"><span class="pt"><b>⏸ ${esc(t.name)}${t.host ? ` · ${esc(t.host)}` : ""}</b>: search for new tasks is paused</span>
      <button data-resume-tracker="${esc(t.id)}">Resume</button></div>`).join("")}</div>`;
}

function limitHoldHTML(h) {
  if (!h) return "";
  const queued = data.records.filter((r) => !r.archivedAt && r.status === "queued").length;
  const working = data.records.filter((r) => !r.archivedAt && r.status === "handed-off").length;
  return `<div class="banner"><div><b>Claude limit (${esc(h.window)}) is ${h.used}% used</b> (threshold ${h.pct}%): new tasks will not start${queued ? ` (${queued} queued)` : ""}. The limit resets ${resetTime(h.resetsAt)}, and the queue will continue on its own.</div>`
    + (working ? `<div>Agents at work (${working}) keep going, but may stop when the limit runs out.</div>` : "") + `</div>`;
}

function visible() {
  return data.records.filter((r) => (showArchive ? r.archivedAt : !r.archivedAt) && (!project || r.task.project === project));
}

// A commit subject for the "What's new" list: the "owner/repo#N: " prefix becomes a "#N ↗" link to the issue.
function changeHTML(title, onGithub) {
  const m = onGithub && /^([\w.-]+\/[\w.-]+)#(\d+):\s+(.*)$/.exec(title);
  if (!m) return esc(title);
  return `<a href="https://github.com/${esc(m[1])}/issues/${m[2]}" target="_blank" rel="noopener">#${m[2]} ↗</a> ${esc(m[3])}`;
}

// "Update Mako": a button when Mako's own main branch has new commits, "Updating…" while they install.
function updateHTML(u) {
  if (!u || (!u.count && !u.state)) return "";
  const busy = ["building", "restarting", "waiting"].includes(u.state);
  // The failure in a line; what went wrong in full is in the issue filed about it.
  const failed = u.state === "failed" ? `<div class="update-error"><b>Update failed, nothing was changed.</b> <span class="muted">${esc(u.error || "")}</span>${u.issue ? ` <a href="${esc(u.issue)}" target="_blank" rel="noopener">Task ↗</a>` : ""}</div>` : "";
  const waiting = u.state === "waiting" && u.busy > 0;
  const button = waiting ? `<span class="muted">Waiting for ${u.busy} ${u.busy === 1 ? "agent" : "agents"} to finish the turn; new tasks will start after the update</span>`
      + `<button id="update-now" class="danger" title="Agents will be interrupted">Restart now</button><button id="update-cancel">Cancel</button>`
    : busy ? `<span class="muted">Updating…</span>` : u.count ? `<button class="primary" id="update-btn">${u.state === "failed" ? "Try again" : "Update"}</button>` : "";
  if (!button && !failed) return "";
  const shown = (u.titles || []).slice(0, 5);
  const more = u.count - shown.length;
  const compare = u.compare ? `<a href="${esc(u.compare)}" target="_blank" rel="noopener">Compare ↗</a>` : "";
  const news = u.count && shown.length ? `<details class="update-news"><summary>What's new</summary><ul>`
    + shown.map((t) => `<li>${changeHTML(t, !!u.compare)}</li>`).join("")
    + (more > 0 ? `<li class="muted">and ${more} more… ${compare}</li>` : compare ? `<li>${compare}</li>` : "")
    + `</ul></details>` : "";
  const n = u.count ? ` <span class="muted">· ${u.count} new ${u.count === 1 ? "change" : "changes"}</span>` : "";
  return `<div class="banner update"><div class="update-head"><b>Mako update</b>${n}<span class="spacer"></span>${button}</div>${news}${failed}</div>`;
}

// A newer release of Mako, for one installed from a release: a link to download it, hidden until the next one.
function releaseHTML(r) {
  if (!r) return "";
  return `<div class="banner update"><div class="update-head"><b>Mako ${esc(r.version)} is available</b>`
    + `<a class="button primary" href="${esc(r.url)}" target="_blank" rel="noopener">Download</a>`
    + `<span class="spacer"></span><button type="button" class="icon" id="release-hide" title="Hide until the next version" aria-label="Hide until the next version">×</button></div>`
    + (r.notes ? `<div class="muted">${esc(r.notes)}</div>` : "") + `</div>`;
}

function render() {
  $("update").innerHTML = updateHTML(data.update);
  $("release").innerHTML = releaseHTML(data.release);
  const rh = $("release-hide");
  if (rh) rh.onclick = async () => { rh.disabled = true; await fetch("/api/release/dismiss?version=" + encodeURIComponent(data.release.version), { method: "POST" }); await load(); };
  $("limit-hold").innerHTML = limitHoldHTML(data.limitHold);
  const ub = $("update-btn");
  if (ub) ub.onclick = async () => { ub.disabled = true; await fetch("/api/update", { method: "POST" }); await load(); };
  const un = $("update-now");
  if (un) un.onclick = async () => {
    if (!(await askConfirm("Restart Mako now? Running agents will be interrupted.", { ok: "Restart" }))) return;
    un.disabled = true; await fetch("/api/update/now", { method: "POST" }); await load();
  };
  const uc = $("update-cancel");
  if (uc) uc.onclick = async () => { uc.disabled = true; await fetch("/api/update/cancel", { method: "POST" }); await load(); };
  $("problems").innerHTML = data.problems?.length
    ? `<div class="banner">${data.problems.map((p) => `<div>${esc(p)}</div>`).join("")}${data.remote ? "" : `<a href="/settings">${t("b.openSettings")}</a>`}</div>` : "";
  $("pause").innerHTML = data.paused ? ICON.play : ICON.pause;
  $("pause").title = $("pause").ariaLabel = data.paused ? t("b.resume") : t("b.pause");
  $("pause").classList.toggle("on", !!data.paused);
  // "Restart when agents finish their turn": Mako waits for the agents that work now, then restarts.
  const rs = data.restart || {};
  $("restart").classList.toggle("on", !!rs.pending);
  // ☕: on — the Mac does not fall asleep while agents work (lit while it is being kept awake); off — crossed out.
  const aw = data.awake ?? {};
  $("awake").classList.toggle("off", !aw.on);
  $("awake").classList.toggle("awake", !!aw.on && !!aw.active);
  $("awake").title = $("awake").ariaLabel = !aw.on ? "Mac sleeps as usual. Click to keep it awake while agents work"
    : aw.active ? "Mac will stay awake: agents are working. Click to allow sleep"
    : "Mac will stay awake while agents work. Click to allow sleep";
  // Mako's own errors not sent for analysis yet: a dot on "Stats", where they are listed.
  const faults = (data.faults || []).filter((f) => !f.reported).length;
  $("stats-btn").classList.toggle("fault", faults > 0);
  $("stats-btn").title = $("stats-btn").ariaLabel = faults ? `Stats · Mako errors: ${faults}` : "Stats";
  $("restart").title = $("restart").ariaLabel = rs.pending ? "Cancel restart" : "Restart Mako when agents finish their turn";
  $("restart-note").innerHTML = rs.pending
    ? `<span class="waiting-chip" title="${esc((rs.busy || []).join(", "))}">${rs.busy?.length ? `Restart when agents finish their turn: ${rs.busy.length}` : "Restarting…"}</span>` : "";
  const live = data.records.filter((r) => !r.archivedAt);
  const doing = live.filter((r) => r.column === "doing").length;
  $("wip").className = "wip" + (data.wipLimit && doing >= data.wipLimit ? " full" : "");
  const waiting = live.filter((r) => agentOf(r)?.state === "waiting").length;
  // New tasks go to Orca or to Mako's own terminal.
  const where = data.executor === "terminal" ? t("b.col.doing") : t("b.inOrca");
  COLUMNS.find(([c]) => c === "doing")[1] = where;
  LABEL.doing = where.toLowerCase();
  // On a phone the full words go and a short one stays («Orca 2/5»): a bare «2» says nothing.
  const short = data.executor === "terminal" ? t("b.wipShortWork") : t("b.wipShortOrca");
  $("wip").innerHTML = `<span class="w">${where} </span><span class="ws">${short} </span><b>${doing}</b>` + (data.wipLimit ? `<span class="w"> ${t("b.of")} </span><span class="sl">/</span>${data.wipLimit}` : "");
  $("wip").title = data.wipLimit ? `${where}: ${doing} of ${data.wipLimit}` : `${where}: ${doing}`;
  $("waiting").innerHTML = waiting ? `<span class="waiting-chip" title="Waiting for you: ${waiting}"><span class="dot"></span><span class="wt">waiting for you: </span>${waiting}</span>` : "";
  document.title = waiting ? `(${waiting}) Mako` : "Mako";
  $("limits").innerHTML = limitsHTML(data.limits);
  const searches = Object.entries(data.searches);
  const failed = searches.filter(([, s]) => s.error);
  // Replaced only when it changes, so an open "Details" stays open between refreshes.
  const pausedTrackers = (data.trackers || []).filter((t) => t.paused);
  const down = (data.paused ? "" : downHTML(failed)) + pausedHTML(pausedTrackers);
  if ($("trackers-down").dataset.html !== down) {
    $("trackers-down").innerHTML = $("trackers-down").dataset.html = down;
    const pt = $("poll-again");
    if (pt) pt.onclick = () => $("poll").click();
    const dh = $("down-hide");
    if (dh) dh.onclick = () => { snoozeDown(dh.dataset.ids.split("\n")); render(); };
    for (const b of $("trackers-down").querySelectorAll("[data-pause-tracker], [data-resume-tracker]")) b.onclick = async () => {
      b.disabled = true;
      const pause = b.dataset.pauseTracker !== undefined;
      await fetch(`/api/tracker-pause?id=${encodeURIComponent(pause ? b.dataset.pauseTracker : b.dataset.resumeTracker)}&on=${pause ? 1 : 0}`, { method: "POST" });
      await load();
    };
  }
  const allPaused = data.paused || (pausedTrackers.length && pausedTrackers.length === (data.trackers || []).length);
  $("search").className = "search" + (failed.length ? " err" : "");
  $("search").textContent = failed.length
    ? `Unavailable:  ${failed.map(([id]) => id).join(", ")}`
    : allPaused ? "Task search is paused"
    : searches.length ? `Checked ${ago(searches.map(([, s]) => s.at).sort().pop())}` : "First tracker check…";
  $("search").title = $("search").textContent;

  // the projects, with how many tasks are on the board
  const counts = {};
  for (const r of live) counts[r.task.project] = (counts[r.task.project] || 0) + 1;
  const projects = Object.keys(counts).sort();
  if (project && (!counts[project] || projects.length < 2)) project = "";
  const archived = data.records.filter((r) => r.archivedAt).length;
  // One line for what the list shows: all tasks, a project's, or the archive.
  // Projects are prefixed so none can pass for the archive. (No NUL here: HTML turns it into U+FFFD.)
  const scope = showArchive ? "archive" : project ? "p:" + project : "";
  // A single project would only repeat "All tasks".
  const options = `<option value="">All tasks ${live.length}</option>` +
    (projects.length > 1 ? projects.map((p) => `<option value="p:${esc(p)}" title="${esc(p)}">${esc(shortProject(p))} ${counts[p]}</option>`).join("") : "") +
    (archived ? `<option value="archive">Archive ${archived}</option>` : "");
  liveProjects = projects;
  if ($("scope").dataset.options !== options) { $("scope").innerHTML = options; $("scope").dataset.options = options; }
  $("scope").value = scope;
  $("scope-l").textContent = $("scope").selectedOptions[0]?.textContent || "";
  // The menu only when there is something to choose from: several projects or an archive.
  $("scope-box").hidden = projects.length < 2 && !archived;
  // Narrowed from "Stats" → "Needs attention": a chip says to what, its × shows all the tasks again.
  const need = attention && NEEDS[attention.kind];
  if (!need) attention = null;
  const chip = need ? `<span class="chip need-chip" title="${esc(attention.reason || "")}">Needs attention: ${esc(attention.reason ? `failed · ${attention.reason}` : need.label)}`
    + `<button type="button" class="icon" id="need-clear" aria-label="Show all tasks" title="Show all tasks">×</button></span>` : "";
  if ($("need-chip").dataset.html !== chip) $("need-chip").innerHTML = $("need-chip").dataset.html = chip;
  $("need-chip").hidden = !need;
  if ($("need-clear")) $("need-clear").onclick = () => { attention = null; render(); };
  $("filter").hidden = !need && $("scope-box").hidden;
  $("q").oninput = () => { query = $("q").value; render(); };
  $("scope").onchange = () => {
    const v = $("scope").value;
    showArchive = v === "archive"; attention = null;
    if (!showArchive) { project = v.replace(/^p:/, ""); try { localStorage.setItem("mako-project", project); } catch {} }
    render();
  };

  // The filter matches the title, the number ("#12", "PROJ-12") and the project.
  const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows = (attention ? attentionTasks(attention) : visible()).filter((r) => {
    const hay = `${r.task.title} ${r.id} ${r.task.project}`.toLowerCase();
    return words.every((w) => hay.includes(w));
  });
  // Others' MRs where I am a reviewer: open ones in "Reviews for me", finished ones in "Done".
  const entries = rows.map((r) => ({ p: r.task.project, g: groupOf(r), r, html: taskRow(r) }));
  if (!attention) for (const q of reviewAsks(words)) entries.push({ p: q.project, g: q.state === "open" ? "forme" : "done", ask: true, html: reviewAskRow(q) });
  // While filtering, every match shows: a folded group would hide what was asked for.
  const showAll = !!words.length || !!attention;
  const html = groupBy === "project" ? listByProject(entries, showAll) : listByStatus(entries, showAll);
  $("new-task").hidden = !newTaskTargets().length;
  $("new-chat").hidden = !(data?.trackers || []).length;
  $("new-menu").hidden = $("new-task").hidden && $("new-chat").hidden;
  $("new-menu").ariaLabel = $("new-menu").title = t("b.new");
  $("why-btn").ariaLabel = t("b.why");
  $("q").title = t("b.filterHint");
  const byProject = groupBy === "project";
  $("group-by").classList.toggle("on", byProject);
  $("group-by").setAttribute("aria-pressed", byProject);
  $("group-by").ariaLabel = $("group-by").title = t(byProject ? "b.groupProject" : "b.groupStatus");
  // The list is drawn again on every refresh, click and fold: it keeps its place (a list hidden by the open task on a phone keeps the last one it had).
  if ($("list").clientHeight) listTop = $("list").scrollTop;
  $("list").innerHTML = html || `<div class="empty">${words.length || attention ? "Nothing found" : showArchive ? "The archive is empty" : "No tasks. Mako checks the trackers and will show new tasks assigned to you here."}</div>`;
  $("list").scrollTop = listTop;
  for (const b of $("list").querySelectorAll(".item")) b.onclick = () => select(b.dataset.id);
  for (const b of $("list").querySelectorAll(".group")) b.onclick = () => {
    if (showAll) return;
    folded[b.dataset.col] = !folded[b.dataset.col];
    try { localStorage.setItem("mako-folded", JSON.stringify(folded)); } catch {}
    render();
  };
  for (const b of $("list").querySelectorAll(".proj-head")) b.onclick = (e) => {
    // The 💡 of a lesson from the reviewer's remarks: to the project's lessons in the settings.
    const lesson = e.target.closest("[data-lessons-of]");
    if (lesson) return (location.href = "/settings#lessons:" + encodeURIComponent(lesson.dataset.lessonsOf));
    if (showAll) return;
    foldedProjects.has(b.dataset.proj) ? foldedProjects.delete(b.dataset.proj) : foldedProjects.add(b.dataset.proj);
    try { localStorage.setItem("mako-folded-projects", JSON.stringify([...foldedProjects])); } catch {}
    render();
  };
  for (const b of $("list").querySelectorAll(".quiet")) b.onclick = () => {
    openQuiet.has(b.dataset.key) ? openQuiet.delete(b.dataset.key) : openQuiet.add(b.dataset.key);
    render();
  };
  renderDetail();
}

// ---- The list on the left ----
const shortProject = (p) => p.split("/").pop();
const PROJECT_HUES = ["#2f6fde", "#2f9e5b", "#c27c0e", "#7b61d9", "#d14343", "#0f8b8d"];
const projectDot = (p, cls = "p-dot") => `<i class="${cls}" style="background:${PROJECT_HUES[Math.max(0, liveProjects.indexOf(p)) % PROJECT_HUES.length]}"></i>`;
const showTrackerMark = () => (data?.trackers || []).length > 1;
// A task's row: its title (two lines at most); a meta line with the dot, the number, the badges and the time; a line of
// chips (priority, kind, estimate) when there are any; and, when it needs room, the status on a line of its own.
// The number is the short one (#333, PROJ-12), the full id is in the tooltip.
const shortId = (id) => id.replace(/^.*(?=#\d+$)/, "");
// The row shows a status with a capital first letter (cap); the strings stay as they are: "agent stopped" is checked on them.
function taskRow(r) {
  const st = state(r);
  const [say0, tone, more] = cardStatus(r), say = cap(say0), why = cap(r.error && r.status !== "cancelled" ? r.error : more ?? say0);
  const badges = `${reviewBadge(r)}${checksBadge(r)}`;
  // A calm short status ("the agent works") stays in the meta line, so such a card is compact. A warn/err one, a long
  // one, or one next to the review/checks badges has no room there: it gets a line of its own, up to two lines long.
  const merge = groupOf(r) === "merge"; // the group heading already says "Ready to merge"
  // A plain status that only repeats the column's name, which already is the group heading, says nothing: leave it out.
  const redundant = groupBy !== "project" && !tone && say0 === LABEL[r.column];
  const own = !merge && !redundant && (!!tone || say.length > 14 || !!badges);
  const tags = `${prioBadge(r.task)}${r.type === "fix" ? kind(r) : ""}${r.column === "new" && estimated(r) ? `<span class="size ${esc(r.estimate.size)}" title="Estimate in advance:  ${esc(SIZE_NAMES[r.estimate.size] ?? "")}, description ${r.estimate.clarity?.value || 0}/5">${SIZE_NAMES[r.estimate.size] ?? ""}</span>` : ""}`;
  return `<button class="item ${r.id === selected ? "sel" : ""} ${st === "later" ? "later" : ""} ${merge ? "merge" : ""}" data-id="${esc(r.id)}" title="${esc(r.id)} · ${esc(r.task.title)}">
    <span class="t">${esc(r.task.title)}</span>
    <span class="m"><span class="s ${r.error && r.status !== "cancelled" ? "failed" : st}"></span>${showTrackerMark() ? trackerMark(r.task) : ""}<span class="num" title="${esc(r.id)}">${esc(shortId(r.id))}</span>${own || merge || redundant ? "" : `<span class="say ${tone}" title="${esc(why)}">${esc(say)}</span>`}${badges}<span class="ago" title="${esc(ago(r.updatedAt))}">${agoShort(r.updatedAt)}</span></span>${tags ? `<span class="tags">${tags}</span>` : ""}${own ? `<span class="st2 ${tone}" title="${esc(why)}">${esc(say)}</span>` : ""}</button>`;
}
// The order inside a group: MRs to review first; the tasks of an agent that waits for you first; "New": the clear and small ones first, the not estimated last.
const attnRank = (r) => ATTENTION[agentOf(r)?.state] ?? 9;
const newRank = (r) => { const e = estimated(r); return e ? SIZE_RANK[e.size] * 5 + (5 - (e.clarity?.value || 0)) : 99; };
const entryRank = (e) => e.ask ? -1 : e.g === "new" || e.g === "later" ? newRank(e.r) : e.g === "doing" ? attnRank(e.r) : 0;
const byProjectOrder = (a, b) => liveProjects.indexOf(a) - liveProjects.indexOf(b);

// By status: a group per state in the order of the work; with several projects in a group, a thin label per project.
function listByStatus(entries, showAll) {
  let html = "";
  for (const [col, title] of COLUMNS) {
    const items = entries.filter((e) => e.g === col).sort((a, b) => entryRank(a) - entryRank(b));
    if (!items.length) continue;
    const fold = !showAll && !!folded[col];
    html += `<div class="group-box"><button class="group${fold ? " folded" : ""}${col === "merge" ? " merge" : ""}" data-col="${col}" aria-expanded="${!fold}">${ICON.chevron}${title}<span class="n">${items.length}</span></button>`;
    if (!fold) {
      const ps = [...new Set(items.map((e) => e.p))].sort(byProjectOrder);
      if (ps.length < 2) html += items.map((e) => e.html).join("");
      else for (const p of ps) html += `<div class="sub" title="${esc(p)}">${projectDot(p, "p-dot sm")}${esc(shortProject(p))}</div>` + items.filter((e) => e.p === p).map((e) => e.html).join("");
    }
    html += `</div>`;
  }
  return html;
}

// 💡 on a project's line: a lesson from the reviewer's remarks waits in the settings (keyed by "tracker|project").
function lessonBadge(p, entries) {
  const tid = [...new Set(entries.map((e) => e.r?.task?.trackerId).filter(Boolean))].find((x) => data?.lessonOffers?.[`${x}|${p}`]);
  return tid ? `<span class="lesson-badge" data-lessons-of="${esc(`${tid}|${p}`)}" title="${esc(t("b.lessonOffer"))}">💡</span>` : "";
}

// By project: a group per project, its tasks in the order of the work; "Postponed" and "Done" each a folded line of its own.
const QUIET = ["later", "done"], SUMMARY = { doing: "at work", blocked: "blocked", review: "in review", merge: "ready to merge", forme: "to review", new: "new", failed: "not done" };
function listByProject(entries, showAll) {
  const by = new Map();
  for (const e of entries) by.set(e.p, [...(by.get(e.p) || []), e]);
  const order = COLUMNS.map(([c]) => c);
  const live = (p) => by.get(p).filter((e) => !QUIET.includes(e.g)).length > 0;
  // The projects with something in work first.
  const projects = [...by.keys()].sort((a, b) => live(b) - live(a) || shortProject(a).localeCompare(shortProject(b)));
  let html = "";
  for (const p of projects) {
    const all = by.get(p).sort((a, b) => order.indexOf(a.g) - order.indexOf(b.g) || entryRank(a) - entryRank(b));
    const active = all.filter((e) => !QUIET.includes(e.g)), isFolded = foldedProjects.has(p) && !showAll;
    const count = (g) => all.filter((e) => e.g === g).length;
    const summary = order.filter((g) => SUMMARY[g] && count(g)).map((g) => g === "merge" ? `<span class="ok">${count(g)} ${SUMMARY[g]}</span>` : esc(`${count(g)} ${SUMMARY[g]}`)).join(" · ") || "nothing in work";
    html += `<div class="group-box proj${isFolded ? " folded" : ""}"><button class="proj-head" data-proj="${esc(p)}" aria-expanded="${!isFolded}" title="${esc(p)}">${ICON.chevron}${projectDot(p)}<b>${esc(shortProject(p))}</b>`
      + lessonBadge(p, all)
      + (isFolded ? `<span class="p-sum">${summary}</span>` : "") + `<span class="n">${all.length}</span></button>`;
    if (!isFolded) {
      // Ready to merge first, under a small green heading: the next action for a person.
      const ready = active.filter((e) => e.g === "merge"), doing = active.filter((e) => e.g !== "merge" && e.g !== "new"), fresh = active.filter((e) => e.g === "new");
      if (ready.length) html += `<div class="sub merge" title="CI passed, no conflicts or open threads: the MR can be merged">${COLUMNS.find(([c]) => c === "merge")[1]}</div>` + ready.map((e) => e.html).join("");
      // The rest in two small groups: what is in progress, then the new ones.
      for (const [title, rs] of [[t("b.inProgress"), doing], [COLUMNS.find(([c]) => c === "new")[1], fresh]]) {
        if (rs.length) html += `<div class="sub">${title}<span class="n">${rs.length}</span></div>` + rs.map((e) => e.html).join("");
      }
      if (!active.length) html += `<div class="p-none">${t("b.nothingInWork")}</div>`;
      for (const g of QUIET) {
        const rs = all.filter((e) => e.g === g);
        if (!rs.length) continue;
        const key = `${p}|${g}`, isOpen = showAll || openQuiet.has(key);
        html += `<button class="quiet${isOpen ? " open" : ""}" data-key="${esc(key)}" aria-expanded="${isOpen}">${ICON.chevron}${COLUMNS.find(([c]) => c === g)[1]}<span class="n">${rs.length}</span></button>`;
        if (isOpen) html += rs.map((e) => e.html).join("");
      }
    }
    html += `</div>`;
  }
  return html;
}

// "Reviews for me": the MRs to review the list shows now (not in the archive; by the project and the filter).
function reviewAsks(words) {
  if (showArchive) return [];
  return (data.reviewRequests || []).filter((q) => (!project || q.project === project)
    && words.every((w) => `${q.title} ${q.ref} ${q.project} ${q.author}`.toLowerCase().includes(w)));
}
const DONE_WHY = { merged: "merged", closed: "MR closed", approved: "you approved" };
const sizeHTML = (q) => `<span class="mr-size" title="Lines added / removed"><span class="add">+${q.additions}</span> <span class="del">−${q.deletions}</span></span>`;
const ciDot = (ci) => { const [icon, text] = CI[ci] ?? []; return icon ? `<span class="ci-dot ${icon}" title="${esc(text)}"></span>` : ""; };
function reviewAskRow(q) {
  const say = q.state === "open" ? `${q.ref} · ${q.author}` : DONE_WHY[q.done] ?? "done";
  const since = q.state === "open" ? q.since : q.doneAt;
  return `<button class="item rq ${q.id === selected ? "sel" : ""}" data-id="${esc(q.id)}" title="${esc(q.project)}${esc(q.ref)} · ${esc(q.title)}">
    <span class="t">${esc(q.title)}</span>
    <span class="m"><span class="s ${q.state === "open" ? "review" : "done"}"></span>${showTrackerMark() ? trackerMark(q) : ""}<span class="say">${esc(say)}</span>${q.updated ? `<span class="updated" title="New commits since you last looked">updated</span>` : ""}${q.state === "open" ? sizeHTML(q) + ciDot(q.ci) : ""}<span class="ago" title="${q.state === "open" ? "Waiting " : ""}${esc(ago(since))}">${agoShort(since)}</span></span></button>`;
}

// The open MR to review as its code host has it now ({check, files, item} or {error}), and the files unfolded.
let askView = null, askOpen = new Set();
async function loadAsk(q) {
  const id = q.id, v = await getJSON(`/api/review-request?id=${encodeURIComponent(id)}`);
  if (selected !== id) return;
  askView = { id, sha: q.headSha, v };
  // "updated" is off once seen: the list shows it at once.
  if (q.updated && v.item) q.updated = false;
  render();
}
function renderAsk(q) {
  closeTerminal(); closeChat(); $("detail").classList.remove("ws");
  if (askView?.id !== q.id || askView.sha !== q.headSha) {
    if (askView?.id !== q.id) askOpen = new Set();
    askView = { id: q.id, sha: q.headSha, v: null };
    loadAsk(q);
  }
  const v = askView.v, c = v?.check, host = trackerName(q);
  const chip = (body, cls = "", title = "") => `<span class="tchip ${cls}"${title ? ` title="${esc(title)}"` : ""}>${body}</span>`;
  const card = (title, body, note = "") => `<div class="tcard"><div class="tcard-h">${title}${note ? `<span class="r">${note}</span>` : ""}</div>${body}</div>`;
  const chips = [chip(`<span class="k">Author</span>${esc(q.author)}`), chip(sizeHTML(q))];
  if (q.state === "open") chips.push(chip(`<span class="k">Waiting</span>${esc(ago(q.since).replace(/ ago$/, ""))}`, "", `Since ${new Date(q.since).toLocaleString(LANG)}`));
  else chips.push(chip(`<span class="dot"></span><span class="v">${esc(DONE_WHY[q.done] ?? "done")}</span>`, "st"));
  if (q.updated) chips.push(chip("updated: new commits", "upd"));
  let ci = "";
  if (!v) ci = `<div class="muted mr-none">Reading MR…</div>`;
  else if (c?.ci) {
    const [icon, text] = CI[c.ci] ?? ["run", `CI: ${c.ci}`];
    ci = row(icon, c.ci === "failed" && c.failed.length ? `${text}: ${c.failed.map((j) => j.name).join(", ")}` : text, c.ciUrl) + jobsHTML(c.jobs);
  } else if (c) ci = `<div class="muted mr-none">No CI</div>`;
  const threads = c?.threads?.length ? c.threads.map((th) => `<div class="cmt"><span class="av">${esc(initials(th.author))}</span><div><b>${esc(th.author)}</b>${th.path ? ` <a href="${esc(th.url)}" target="_blank" rel="noopener"><code>${esc(th.path)}${th.line ? `:${th.line}` : ""}</code></a>` : ` <a href="${esc(th.url)}" target="_blank" rel="noopener">↗</a>`}<div class="md">${md(th.body)}</div></div></div>`).join("")
    : `<div class="tcard-b muted">${v ? "No unresolved discussions" : "…"}</div>`;
  const files = v?.files ?? [];
  const filesHTML = !v ? `<div class="tcard-b muted">…</div>` : !files.length ? `<div class="tcard-b muted">No changes</div>`
    : files.map((f) => `<details class="rq-file" data-path="${esc(f.path)}" ${askOpen.has(f.path) ? "open" : ""}><summary><span class="fst ${esc(f.status)}">${esc(f.status)}</span><code>${f.oldPath ? `${esc(f.oldPath)} → ` : ""}${esc(f.path)}</code><span class="spacer"></span>${sizeHTML(f)}</summary>
      ${askOpen.has(f.path) ? (f.diff ? diffHTML(f.diff) : `<div class="diff"><div class="diff-note">Diff not shown: the file is too large or binary</div></div>`) : ""}</details>`).join("");
  const html = `
    <button class="ghost back" id="back">← Tasks</button>
    <div class="d-head">
      <div class="d-main">
        <div class="d-id">${trackerIcon(q)}<span class="kind rq">Review</span><span class="s ${q.state === "open" ? "review" : "done"}">${q.state === "open" ? "waiting for your review" : "done"}</span><a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.ref)}</a><span>${esc(q.project)}</span></div>
        <h1>${esc(q.title)}</h1>
      </div>
      <div class="actions"><button class="primary" id="ask-open">Open in ${esc(host)} ↗</button></div>
    </div>
    ${v?.error ? `<div class="notice">${linkify(v.error)}</div>` : ""}
    <div class="tchips">${chips.join("")}</div>
    ${card("Description",  `<div class="tcard-b md">${q.description?.trim() ? md(q.description) : `<span style="color:var(--mute)">No description</span>`}</div>`, `from ${esc(host)}`)}
    ${card("CI", `<div class="tcard-b">${ci}</div>`)}
    ${card(`Discussions${c?.threads?.length ? ` · ${c.threads.length}` : ""}`, threads)}
    ${card(`Changes${files.length ? ` · ${files.length} ${plural(files.length, "file", "files")}` : ""}`, filesHTML)}
    ${logs.length ? `<details class="journal"><summary>Journal ·  ${logs.length}</summary><div class="log">${logs.map((l) => `${new Date(l.at).toLocaleTimeString(LANG)}  ${linkify(l.text)}`).join("\n")}</div></details>` : ""}`;
  if (html === shown) return;
  $("detail").innerHTML = shown = html;
  $("back").onclick = () => { selected = null; history.replaceState(null, "", location.pathname); try { localStorage.removeItem("mako-selected"); } catch {} render(); };
  $("ask-open").onclick = () => window.open(q.url, "_blank", "noopener");
  for (const d of $("detail").querySelectorAll(".rq-file")) d.ontoggle = () => {
    if (d.open === askOpen.has(d.dataset.path)) return;
    if (d.open) askOpen.add(d.dataset.path); else askOpen.delete(d.dataset.path);
    renderAsk(q);
  };
}

async function select(id) {
  selected = id; statsOpen = false; newOpen = false; digest = null;
  history.replaceState(null, "", "#" + encodeURIComponent(id));
  try { localStorage.setItem("mako-selected", id); } catch {}
  // The card opens at once from what the board already has; its journal and conversation follow.
  logs = [];
  render();
  await loadCard();
  if (id === selected) render();
}

const getJSON = (url) => fetch(url).then((r) => r.json()).catch((e) => ({ error: e.message }));

// The changed files (and the open file's diff) of the selected task, while its work tab is open.
// As many commits as the panel shows without scrolling: a row is 28px, the panel and the graph pad 16px.
function commitsFit() {
  const h = document.querySelector("#detail .insp-panel")?.clientHeight ?? 0;
  return h ? Math.max(1, Math.floor((h - 16) / 28)) : 10;
}

async function loadWork() {
  const r = data?.records.find((x) => x.id === selected);
  if (!r?.worktree || workOf !== r.id || (tab !== "orca" && r.executor !== "terminal")) return;
  const q = `id=${encodeURIComponent(r.id)}`, path = fileTab;
  // Each part is drawn as it comes: the changes need not wait for the code host's MR.
  const part = (url, set, empty) => url && getJSON(url).then((v) => {
    if (workOf !== r.id) return;
    set(v);
    if (empty) renderDetail();
  });
  await Promise.all([
    part(`/api/changes?${q}`, (v) => {
      changes = v;
      if (!v.error) changesOf.set(r.id, v);
      // The chat's next actions follow the branch.
      if (cv?.id === r.id && cv.snap) drawNextActions(cv);
    }, !changes),
    part(path && `/api/diff?${q}&path=${encodeURIComponent(path)}${diffWhole ? "&whole=1" : ""}`, (v) => {
      diffs[path] = v.error ? `⚠ ${v.error}` : v.diff || "";
