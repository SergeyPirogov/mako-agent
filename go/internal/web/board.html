  $("ca-model").innerHTML = (models.models ?? [models.current || "haiku"]).map((m) => `<option value="${esc(m)}" ${m === models.current ? "selected" : ""}>${esc(names[m] ?? m)}</option>`).join("");
  $("ca-model").onchange = async (e) => {
    const r = await fetch("/api/code/model", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: e.target.value }) })
      .then((x) => x.json()).catch((err) => ({ ok: false, error: err.message }));
    const keys = document.querySelector("#code-ask .chat-keys");
    keys.classList.toggle("err", !r.ok);
    keys.textContent = r.ok ? `Model: ${names[e.target.value] ?? e.target.value} — from the next message` : `⚠ ${r.error}`;
  };
  let saved = ""; try { saved = localStorage.getItem("mako-code-project") || ""; } catch {}
  const start = projects.find((p) => p.key === saved) ?? projects.find((p) => p.project === project) ?? projects[0];
  code = { project: start?.key ?? "", projects, thread: "", version: -1, snap: null, flip: new Set(), code: true, list: document.querySelector("#code-ask .chat-list"), input: document.querySelector("#code-ask textarea") };
  $("ca-project").innerHTML = projects.map((p) => `<option value="${esc(p.key)}" ${p.key === code.project ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  $("back").onclick = () => { newOpen = false; code = null; render(); };
  if (!projects.length) {
    $("ca-project").disabled = $("ca-new").disabled = true; code.input.disabled = true;
    code.list.innerHTML = `<div class="files-empty">There are no project clones on this Mac. A clone appears when Mako takes a task of the project, or set a path to it in the settings.</div>`;
    return;
  }
  $("ca-project").onchange = (e) => {
    code.project = e.target.value;
    try { localStorage.setItem("mako-code-project", code.project); } catch {}
    openLatest(); loadWorkspace();
  };
  $("ca-ws").onclick = async (e) => {
    const b = e.target.closest("[data-ws]");
    if (!b) return;
    const what = b.dataset.ws, ws = code.ws;
    // Both stop the agents of this project's questions first: the code is not changed under their feet.
    const stops = "An agent currently answering a question of this project will stop and its answer will be cut off; the next message continues the conversation.";
    if (what === "reset" && !confirm(`Discard ${ws?.dirty || ""} unsaved changes in the worktree and update it from ${ws?.base || "main"}? The changes will be lost.\n\n${stops}`)) return;
    if (what === "remove" && !confirm(`Delete the worktree for questions${ws?.dirty ? ` along with ${ws.dirty} unsaved changes` : ""}? It will reappear with the next question.\n\n${stops}`)) return;
    b.disabled = true;
    const r = await fetch(`/api/code/workspace/${what}?project=${encodeURIComponent(code.project)}`, { method: "POST" })
      .then((x) => x.json()).catch((err) => ({ ok: false, error: err.message }));
    if (!r.ok) alert(r.error || "Failed");
    loadWorkspace();
  };
  $("ca-new").onclick = () => { openThread(""); code.input.focus(); };
  const send = async () => {
    const text = code.input.value.trim();
    if (!text) return;
    code.input.value = "";
    const keys = document.querySelector("#code-ask .chat-keys");
    const r = await fetch("/api/code/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: code.project, thread: code.thread, text }) })
      .then((x) => x.json()).catch((err) => ({ ok: false, error: err.message }));
    keys.classList.toggle("err", !r.ok);
    keys.textContent = r.ok ? "Enter to send · Shift+Enter for a new line" : `⚠ ${r.error}`;
    if (!r.ok) { code.input.value ||= text; return; }
    if (r.id !== code.thread) { code.thread = r.id; code.version = -1; }
    else if (!code.snap?.live) code.version = -1; // resumed: a new session, read from the start
    loadThreads(); pollCode(); loadWorkspace();
  };
  code.input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
  document.querySelector("#code-ask .chat-send").onclick = send;
  document.querySelector("#code-ask .chat-stop").onclick = () => fetch(`/api/code/stop?id=${encodeURIComponent(code.thread)}`, { method: "POST" });
  $("ca-task").onclick = toTask;
  code.list.onclick = (e) => {
    const tk = e.target.closest("[data-ticket]");
    if (tk) { const d = code.drafts?.[tk.dataset.ticket]; if (d) toTicket(d); return; }
    // The agent's question: an option, or your own words.
    if (answerClick(e, `/api/code/answer?id=${encodeURIComponent(code.thread)}`, pollCode)) return;
    const src = e.target.closest("[data-src]");
    if (src) { e.preventDefault(); openSource(src.dataset.src, +src.dataset.line, +(src.dataset.end || src.dataset.line)); return; }
    const t = e.target.closest("[data-toggle]");
    if (t) { if (!code.flip.delete(t.dataset.toggle)) code.flip.add(t.dataset.toggle); renderCode(); }
  };
  $("ca-threads").onclick = (e) => { const b = e.target.closest("[data-thread]"); if (b) openThread(b.dataset.thread); };
  code.timer = setInterval(pollCode, 1000);
  openLatest(); loadWorkspace();
}

// The shared worktree, bottom right: its branch, and a warning when something changed it, with "Reset and update".
async function loadWorkspace() {
  const v = code;
  const ws = await getJSON(`/api/code/workspace?project=${encodeURIComponent(v.project)}`);
  if (v !== code || !$("ca-ws")) return;
  v.ws = ws.error ? null : ws;
  const remove = `<button type="button" class="ghost" data-ws="remove" title="${esc(ws.dir || "")}">Delete</button>`;
  $("ca-ws").innerHTML = ws.error ? "" : !ws.exists ? `<span class="muted" title="${esc(ws.dir)}">the worktree will appear with the first question</span>`
    : ws.dirty ? `<span class="ca-ws-warn" title="${esc((ws.files || []).join("\n"))}">⚠ The worktree has ${ws.dirty} ${plural(ws.dirty, "unsaved change", "unsaved changes")}: it was not updated from ${esc(ws.base)}</span>
        <button type="button" data-ws="reset">Reset and update</button>${remove}`
    : ws.behind ? `<span class="muted" title="${esc(ws.dir)}">the worktree is ${ws.behind} ${plural(ws.behind, "commit", "commits")} behind ${esc(ws.base)}: it will update with a new question, when no other is running</span>${remove}`
    : `<span class="muted" title="${esc(ws.dir)}">worktree · ${esc(ws.base)}</span>${remove}`;
}

// The ticket the agent proposes: a fenced mako-ticket block of JSON {title, description} in its answer. The answer
// shows without it; an unfinished one (still being written) is hidden.
const TICKET = /```mako-ticket[^\n]*\n([\s\S]*?)\n\s*```/;
function ticketOf(text) {
  const m = text.match(TICKET);
  if (!m) return { text: text.replace(/```mako-ticket[\s\S]*$/, ""), draft: null };
  let d = null;
  try { const j = JSON.parse(m[1]); if (j && typeof j.title === "string" && j.title.trim()) d = { title: j.title.trim(), description: String(j.description ?? "") }; } catch {}
  return d ? { text: text.replace(m[0], ""), draft: d } : { text, draft: null };
}
function ticketCard(d, i) {
  return `<div class="ca-ticket"><div class="ca-ticket-h">${ICON.doc}<span>Ticket draft</span></div>
    <b>${esc(d.title)}</b><div class="md ca-ticket-body">${md(d.description)}</div>
    <div class="ca-ticket-foot"><span class="muted">You can edit it and pick a tracker before creating</span><span class="spacer"></span>
      <button type="button" class="primary" data-ticket="${i}">Create ticket</button></div></div>`;
}

// "Create ticket": the agent's draft goes to the new task form, to be edited, given a tracker and created.
function toTicket(d) {
  const p = code.projects.find((x) => x.key === code.project);
  taskDraft = { title: d.title.slice(0, 250), desc: `${d.description.trim()}\n\n_From "Ask about code" on the Mako board._`, tracker: p?.tracker, project: p?.project };
  code = null;
  newOpen = "task";
  render();
}

// The project's latest question, to go on with; "New question" starts another.
async function openLatest() {
  const v = code;
  await loadThreads();
  if (v === code) openThread(v.threads?.[0]?.id ?? "");
}

function openThread(id) {
  code.thread = id; code.version = -1; code.snap = null; code.flip = new Set();
  $("ca-file").hidden = true;
  renderCode(); loadThreads(); pollCode();
}

async function loadThreads() {
  const v = code;
  const r = await getJSON(`/api/code/threads?project=${encodeURIComponent(v.project)}`);
  if (v !== code || !$("ca-threads")) return;
  v.threads = r.threads ?? [];
  $("ca-threads").innerHTML = v.threads.length ? v.threads.map((t) => `<button type="button" class="ca-thread ${t.id === v.thread ? "on" : ""}" data-thread="${esc(t.id)}" title="${esc(t.title)}">
      <span>${esc(t.title)}</span><span class="muted">${esc(ago(new Date(t.at).toISOString()))}</span></button>`).join("")
    : `<div class="muted ca-none">There have been no questions about this project yet.</div>`;
}

async function pollCode() {
  const v = code;
  if (!v) return;
  if (!$("code-ask")) { clearInterval(v.timer); if (code === v) code = null; return; }
  if (!v.thread) return;
  const s = await getJSON(`/api/chat?id=${encodeURIComponent(v.thread)}&v=${v.version}`);
  if (v !== code || s.same || s.error) return;
  const ended = v.snap?.state === "working" && s.state !== "working";
  v.snap = s; v.version = s.version;
  renderCode();
  if (ended) loadThreads();
}

function renderCode() {
  const v = code, s = v.snap;
  if (!v.list.isConnected) return;
  const atEnd = v.list.scrollHeight - v.list.scrollTop - v.list.clientHeight < 60;
  const items = s?.items ?? [];
  v.drafts = {};
  v.list.innerHTML = `<div class="chat-col">${chatBlocks(items, { id: v.thread, flip: v.flip, code: true, drafts: v.drafts }) ||
      `<div class="files-empty">${v.thread ? "Loading the conversation…" : "Ask a question about the project's code: the agent will find the answer and show the places in the code."}</div>`}
    ${s?.state === "working" ? `<div class="chat-working"><span class="pulse"></span>Searching the code…</div>` : ""}</div>`;
  linkSources(v.list);
  if (atEnd || v.version <= 1) v.list.scrollTop = v.list.scrollHeight;
  document.querySelector("#code-ask .chat-stop").hidden = s?.state !== "working";
  $("ca-task").hidden = !items.some((it) => it.kind === "text");
  for (const b of document.querySelectorAll("#ca-threads .ca-thread")) b.classList.toggle("on", b.dataset.thread === v.thread);
}

// file:line in the agent's answers (path:12 or path:12-20): links that open the file beside the chat.
const SRC = /((?:[\w@.-]+\/)*[\w@-][\w@.-]*\.[A-Za-z0-9]+):(\d+)(?:[-–](\d+))?/g;
function linkSources(root) {
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement.closest("a, .msg.me, .tool-card, .steps") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = [];
  for (let n; (n = walk.nextNode());) if (n.data.search(SRC) >= 0) nodes.push(n);
  for (const n of nodes) {
    const frag = document.createDocumentFragment();
    let at = 0;
    for (const m of n.data.matchAll(SRC)) {
      frag.append(n.data.slice(at, m.index));
      const a = document.createElement("a");
      a.href = "#"; a.className = "src-link"; a.textContent = m[0];
      a.dataset.src = m[1]; a.dataset.line = m[2]; if (m[3]) a.dataset.end = m[3];
      a.title = "Open file";
      frag.append(a);
      at = m.index + m[0].length;
    }
    frag.append(n.data.slice(at));
    n.replaceWith(frag);
  }
}

async function openSource(path, line, end) {
  const box = $("ca-file");
  box.hidden = false;
  box.innerHTML = `<div class="ca-file-h"><code title="${esc(path)}">${esc(path)}:${line}${end > line ? "-" + end : ""}</code><span class="spacer"></span>
    <button type="button" class="icon" id="ca-file-close" title="Close" aria-label="Close">×</button></div><div class="ca-file-body"><div class="muted">Opening…</div></div>`;
  $("ca-file-close").onclick = () => { box.hidden = true; };
  const r = await getJSON(`/api/code/file?project=${encodeURIComponent(code.project)}&path=${encodeURIComponent(path)}`);
  const body = box.querySelector(".ca-file-body");
  if (!body) return;
  if (r.error || typeof r.text !== "string") { body.innerHTML = `<div class="notice">${esc(r.error || "Could not open the file")}</div>`; return; }
  if (r.path) { const h = box.querySelector(".ca-file-h code"); h.textContent = `${r.path}:${line}${end > line ? "-" + end : ""}`; h.title = r.path; }
  body.innerHTML = `<pre class="ca-src">${r.text.split("\n").map((l, i) => `<span class="ln${i + 1 >= line && i + 1 <= end ? " hit" : ""}"><i>${i + 1}</i>${esc(l)}</span>`).join("")}</pre>`;
  body.querySelector(".hit")?.scrollIntoView({ block: "center" });
}

// "Make a task": the question and the answers become the description of a new task in this project.
function toTask() {
  const items = code.snap?.items ?? [], p = code.projects.find((x) => x.key === code.project);
  const questions = items.filter((it) => it.kind === "user");
  const title = (code.threads?.find((t) => t.id === code.thread)?.title || questions[0]?.text || "").split("\n")[0].slice(0, 250);
  // The agent's ticket draft is not part of the answer: "Create ticket" is its way to a task.
  const desc = items.filter((it) => it.kind === "user" || it.kind === "text")
    .map((it) => it.kind === "user" ? `**Question:** ${it.text}` : ticketOf(it.text).text.trim()).filter(Boolean).join("\n\n");
  taskDraft = { title, desc: `${desc}\n\n_From "Ask about code" on the Mako board._`, tracker: p?.tracker, project: p?.project };
  code = null;
  newOpen = "task";
  render();
}

// A pasted screenshot goes to the tracker; a placeholder stands in the text until its link comes back.
async function uploadImage(area, t, file, busy, fail) {
  if (!t) return fail("Pick a project first");
  const name = file.name && file.name !== "image.png" ? file.name : `screenshot-${Date.now()}.${(file.type.split("/")[1] || "png").replace("jpeg", "jpg")}`;
  const mark = `![Uploading ${name}…]()`;
  area.setRangeText(mark, area.selectionStart, area.selectionEnd, "end");
  busy(1);
  const q = `tracker=${encodeURIComponent(t.tracker)}&project=${encodeURIComponent(t.project)}&name=${encodeURIComponent(name)}`;
  const res = await fetch(`/api/upload?${q}`, { method: "POST", headers: { "Content-Type": file.type }, body: file })
    .then((r) => r.json()).catch((err) => ({ error: err.message }));
  busy(-1);
  area.value = area.value.replace(mark, res.ok ? res.markdown : "");
  if (!res.ok) fail("The screenshot failed to upload: " + (res.error || "unknown error"));
}

// How the taken tasks went: shown where a task's card goes while none is open.
function statsHTML(s) {
  const period = `<select id="stats-days" aria-label="Statistics period">${[["", "All time"], ["7", "7 days"], ["30", "30 days"], ["90", "90 days"]]
    .map(([v, l]) => `<option value="${v}"${v === statsDays ? " selected" : ""}>${l}</option>`).join("")}</select>`;
  const head = `<div class="stats-head"><h1>Statistics</h1>${period}</div>`;
  if (!s?.taken && statsDays) return `<div class="stats">${head}<div class="text" style="color:var(--mute)">The agent took no tasks in this period</div></div>`;
  if (!s?.taken) return `<div class="empty">Pick a task on the left. Statistics will appear once the agent takes its first task.</div>`;
  const pct = (n) => s.taken ? Math.round((n / s.taken) * 100) : 0;
  const dur = durText;
  const tile = (label, value, note = "") => `<div class="stat"><span>${label}</span><b>${value}</b>${note ? `<small>${note}</small>` : ""}</div>`;
  const share = (n, of) => of ? `${Math.round((n / of) * 100)}%` : "—";
  const failedNote = s.cancelled ? `${pct(s.failed)}% · ${s.cancelled} of them cancelled` : `${pct(s.failed)}%`;
  return `<div class="stats">
    ${head}
    <div class="stat-row main">
      ${tile("Tasks taken", s.taken, s.running ? `${s.running} still in progress` : "")}
      ${tile("Merged", s.merged, `${pct(s.merged)}%${s.succeeded > s.merged ? ` · in review ${s.succeeded - s.merged}` : ""}`)}
      ${tile("No rework", share(s.clean, s.ended), s.ended ? `${s.clean} of ${s.ended} finished` : "none finished yet")}
      ${tile("Take to merge", s.leadSeconds ? dur(s.leadSeconds) : "—", "median")}
      ${tile("Unsuccessful", s.failed, failedNote)}
      ${tile("Spent by the agent", `$${(s.cost || 0).toFixed(2)}`, s.priced ? `≈ $${(s.cost / s.priced).toFixed(2)} per task${s.tokens ? ` · ${tok(s.tokens)} tokens in total` : ""}` : "Mako's agent only")}
    </div>
    ${trendHTML(s.days)}
    ${stagesHTML(s.stages, s.staged, dur)}
    <h3>Time and attempts</h3>
    <div class="stat-row small">
      ${tile("Agent to MR", s.medianSeconds ? dur(s.medianSeconds) : "—", s.avgSeconds ? `median · average ${dur(s.avgSeconds)}` : "")}
      ${tile("Review to merge", s.reviewSeconds ? dur(s.reviewSeconds) : "—", "average")}
      ${tile("Retries", s.retried || 0, `${pct(s.retried || 0)}% of tasks`)}
      ${s.merged ? tile("CI fixes", (s.ciFixes || 0).toFixed(1), "rounds per merged task") : ""}
      ${s.merged ? tile("Comment fixes", (s.reviewFixes || 0).toFixed(1), "rounds per merged task") : ""}
    </div>
    ${phasesHTML(s)}
    ${reviewStatsHTML(s.review)}
    ${contextHTML(s.context)}
    ${s.assessed ? `<h3>Agent assessment <span class="muted">· ${s.assessed} ${plural(s.assessed, "task", "tasks")}</span></h3>
    <div class="stat-row">
      ${tile("Task description", `${s.clarity.toFixed(1)}/5`, "how well described")}
      ${tile("Complexity", `${s.complexity.toFixed(1)}/5`, "average")}
      ${tile("Task completed", `${s.completeness.toFixed(1)}/5`, "how fully")}
      ${tile("Change risk", `${s.risk.toFixed(1)}/5`, "average")}
    </div>` : ""}
    ${forecastHTML(s.forecast)}
    ${bySizeHTML(s.bySize, dur)}
    ${clarityHTML(s)}
    ${groupsHTML("By project", s.projects, "Project")}
    ${groupsHTML("By agent", s.executors, "Agent", (n) => n === "terminal" ? "Mako agent" : n === "—" ? "—" : `Orca · ${n}`)}
    ${groupsHTML("By model", [...(s.models || []).filter((g) => g.name !== "—"), ...(s.models || []).filter((g) => g.name === "—")], "Model", (n) => n === "—" ? "Unknown" : n[0].toUpperCase() + n.slice(1), 1)}
    <h3>Failure reasons</h3>
    ${s.reasons.length ? `<dl class="facts">${s.reasons.map((x) => `<dt>${x.count}</dt><dd>${linkify(x.text)}</dd>`).join("")}</dl>` : `<div class="text" style="color:var(--mute)">No failures</div>`}
    <p class="stats-note">"No rework" means merged without "Retry differently", new attempts, or fixes after review, out of those merged or failed. "Take to merge" is from handing the task to the agent to the MR merge; "Agent to MR" is until the MR is opened, and review is from the MR to the merge. "Where the time goes" is the average per merged task: the agent works, waits for you (a question, a permission, a plan, its turn is over), the MR waits for CI, the MR waits for review and merge. "Spent by the agent", "≈ per task" and the costs in the tables cover only the work and plan of Mako's own agent: an agent in Orca does not report its costs. The assessment, the agent's review, the assessment and retro are separate, in "What was spent on", for all tasks. The time stages run from the hand-off to the agent; the time of the agent's review before the MR is the agent's time. Tokens are everything the model read and wrote, including cache. "Context" is from the usage of each model call: the start is the first call (system prompt, tools, MCP, CLAUDE.md, memory and the task prompt), the peak is the largest; "What fills the context" is the growth between calls, split among tool results by their size, so it is approximate. By model, a task is counted under the model of its last attempt, with its whole budget.</p>
  </div>`;
}

// The tasks taken each day: how many got merged, failed or are still going; the hover tells the numbers.
function trendHTML(days) {
  if (!days?.some((d) => d.taken)) return "";
  // The days before the first task tell nothing: from it on, though a week at least.
  days = days.slice(Math.max(0, Math.min(days.findIndex((d) => d.taken), days.length - 7)));
  const top = Math.max(...days.map((d) => d.taken));
  const date = (d) => new Date(d + "T12:00:00").toLocaleDateString(LANG, { day: "numeric", month: "short" });
  const seg = (cls, n) => n ? `<i class="${cls}" style="height:${(n / top) * 100}%"></i>` : "";
  const label = (i) => i === 0 || i === days.length - 1 || (days.length > 10 && i === Math.floor(days.length / 2));
  const col = (d, i) => {
    const other = d.taken - d.merged - d.failed;
    const tip = `${date(d.date)}: taken ${d.taken}${d.taken ? ` · merged ${d.merged} · failed ${d.failed} · still going ${other}${d.cost ? ` · $${d.cost.toFixed(2)}` : ""}` : ""}`;
    return `<div class="day" title="${esc(tip)}"><div class="bar">${seg("failed", d.failed)}${seg("other", other)}${seg("merged", d.merged)}</div>`
      + `<span>${label(i) ? date(d.date) : ""}</span></div>`;
  };
  return `<h3>By day <span class="muted">· most ${top} ${plural(top, "task", "tasks")} in a day</span></h3>
    <div class="trend">${days.map(col).join("")}</div>
    <div class="legend"><span><i class="merged"></i>merged</span><span><i class="other"></i>MR in review or still in progress</span><span><i class="failed"></i>failed</span></div>`;
}

// Mako's own errors, one row per kind: "Send for analysis" writes them into an issue in Mako's repository.
function faultsHTML(fs) {
  if (!fs?.length) return "";
  const fresh = fs.filter((f) => !f.reported).length;
  const at = (t) => new Date(t).toLocaleString(LANG, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const row = (f) => `<li class="${f.reported ? "reported" : ""}"><div><b>${esc(f.what)}</b> <span class="muted">${f.count}× · ${at(f.last)}${f.task ? ` · ${esc(f.task)}` : ""}</span></div>`
    + `<div class="fault-text">${esc(f.error)}</div>`
    + (f.reported ? `<div class="muted">under analysis: ${/^https?:/.test(f.reported) ? `<a href="${esc(f.reported)}" target="_blank" rel="noopener">${esc(f.reported)}</a>` : esc(f.reported)}</div>` : "") + `</li>`;
  return `<div class="stats faults">
    <div class="digest-head"><h3>Mako errors <span class="muted">${fs.length}</span></h3>
      <span class="actions">${fresh && !data.remote ? `<button id="faults-report"${faultsBusy ? " disabled" : ""} title="Create a task with these errors in the Mako repository, so the agent can sort them out">${faultsBusy ? "Creating the task…" : `Send for analysis: ${fresh}`}</button>` : ""}
      ${data.remote ? "" : `<button class="ghost" id="faults-clear">Clear</button>`}</span></div>
    <ul class="digest-list">${fs.map(row).join("")}</ul>
    <p class="stats-note">What failed on the Mako side: search, comments, statuses, MR checks, worktree. Identical errors are merged into one.</p>
  </div>`;
}
// The board re-renders every few seconds: the report under way is remembered here, not in the button.
let faultsBusy = false;
function bindFaults() {
  const rep = $("faults-report"), clr = $("faults-clear");
  if (rep) rep.onclick = async () => {
    if (faultsBusy) return;
    faultsBusy = true; render();
    const res = await fetch("/api/faults/report", { method: "POST" }).then((r) => r.json()).catch((err) => ({ error: err.message }));
    faultsBusy = false;
    if (!res.ok) { toast(res.error || "Could not create the task", true); await load(); return; }
    toast("The task with Mako errors was created");
    await load();
    select(res.id);
  };
  if (clr) clr.onclick = async () => {
    if (!confirm("Forget all Mako errors?")) return;
    await fetch("/api/faults/clear", { method: "POST" });
    await load();
  };
}

// One row per project or agent: how its tasks went. Hidden while there is only one.
// min: the fewest groups worth a table; a known model is worth one even alone.
function groupsHTML(title, groups, col, name = (n) => n, min = 2) {
  if (!groups || groups.length < min || groups.every((g) => g.name === "—")) return "";
  const rated = groups.some((g) => g.assessed), tokened = groups.some((g) => g.tokens);
  const row = (g) => `<tr><td>${esc(name(g.name))}</td><td>${g.taken}</td><td>${g.succeeded}</td><td>${g.failed}</td><td>${g.taken ? Math.round((g.succeeded / g.taken) * 100) : 0}%</td><td>${g.cost ? `$${g.cost.toFixed(2)}` : "—"}</td>${tokened ? `<td>${g.tokens ? tok(g.tokens) : "—"}</td>` : ""}${rated ? `<td>${g.assessed ? `${g.clarity.toFixed(1)}/5` : "—"}</td>` : ""}</tr>`;
  return `<h3>${title}</h3><div class="table"><table><thead><tr><th>${col}</th><th>Taken</th><th>Succeeded</th><th>Unsuccessful</th><th>Success</th><th>Spent</th>${tokened ? "<th>Tokens</th>" : ""}${rated ? `<th title="How well the tasks are described, by the agent's assessment">Description</th>` : ""}</tr></thead><tbody>${groups.map(row).join("")}</tbody></table></div>`;
}

const SIZE_NAMES = { small: "small", medium: "medium", big: "big" };
const STAGE_NAMES = { agent: "agent working", you: "waiting for you", ci: "waiting for CI", review: "waiting for review" };
const PHASE_NAMES = { estimate: "estimate", plan: "plan", work: "work", review: "agent review", assess: "assessment and retro" };

// A time in seconds, short: 42 min, 3 h 5 min, 2 d 4 h.
function durText(sec) {
  const m = Math.round(sec / 60);
  return m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${Math.floor(m / 1440)} d ${Math.floor((m % 1440) / 60)} h`;
}

// The task's own cycle: where its time went by stage (the current one up to now) and what each phase cost.
function cycleHTML(r, card) {
  const m = r.metrics;
  if (!m) return "";
  const seconds = { ...(m.seconds || {}) };
  if (m.stage && m.stageSince) seconds[m.stage] = (seconds[m.stage] || 0) + Math.max(0, (Date.now() - Date.parse(m.stageSince)) / 1000);
  const bar = stageBar(seconds, durText);
  const phases = Object.keys(PHASE_NAMES).filter((k) => m.cost?.[k] || m.tokens?.[k]);
  const tokens = Object.values(m.tokens || {}).reduce((a, b) => a + b, 0);
  const spend = phases.length ? `<div class="legend stage-legend">${phases.map((k) => `<span>${PHASE_NAMES[k]} <b>${m.cost?.[k] ? `$${m.cost[k].toFixed(2)}` : "—"}</b>${m.tokens?.[k] ? ` <span class="muted">· ${tok(m.tokens[k])}</span>` : ""}</span>`).join("")}</div>` : "";
  if (!bar && !spend) return "";
  const spent = (r.cost || 0) + Object.entries(m.cost || {}).filter(([k]) => k !== "plan" && k !== "work").reduce((a, [, v]) => a + v, 0);
  const note = [spent ? `$${spent.toFixed(2)}` : "", tokens ? `${tok(tokens)} tokens` : "",
    r.ciFixes ? `CI fixes ${r.ciFixes}` : "", r.reviewFixes ? `comment fixes ${r.reviewFixes}` : ""].filter(Boolean).join(" · ");
  return card("Time and cost", `<div class="tcard-b">${bar}${spend}</div>`, "cycle", note);
}

// Tokens, short: 950, 12k, 1.4M.
function tok(n) {
  return n < 1000 ? `${n}` : n < 1e6 ? `${Math.round(n / 1000)}k` : `${(n / 1e6).toFixed(1)}M`;
}

// Where the time of a task goes, by stage: one bar of their shares and the times under it. seconds: stage → s.
function stageBar(seconds, dur) {
  const stages = Object.keys(STAGE_NAMES).filter((k) => seconds?.[k] >= 1);
  const total = stages.reduce((n, k) => n + seconds[k], 0);
  if (!total) return "";
  return `<div class="stage-bar">${stages.map((k) => `<i class="s-${k}" style="width:${(seconds[k] / total) * 100}%" title="${esc(`${STAGE_NAMES[k]}: ${dur(seconds[k])}`)}"></i>`).join("")}</div>
    <div class="legend stage-legend">${stages.map((k) => `<span><i class="s-${k}"></i>${STAGE_NAMES[k]} <b>${dur(seconds[k])}</b> <span class="muted">· ${Math.round((seconds[k] / total) * 100)}%</span></span>`).join("")}</div>`;
}

function stagesHTML(stages, staged, dur) {
  const bar = staged ? stageBar(stages, dur) : "";
  return bar ? `<h3>Where the time goes <span class="muted">· average per merged task, ${staged} ${plural(staged, "task", "tasks")}</span></h3>${bar}` : "";
}

// What each phase of the work cost over the period: $ and tokens.
function phasesHTML(s) {
  const phases = Object.keys(PHASE_NAMES).filter((k) => s.phases?.[k] || s.phaseTokens?.[k]);
  if (!phases.length) return "";
  const tile = (k) => `<div class="stat"><span>${PHASE_NAMES[k]}</span><b>${s.phases[k] ? `$${s.phases[k].toFixed(2)}` : "—"}</b>`
    + `<small>${s.phaseTokens?.[k] ? `${tok(s.phaseTokens[k])} tokens` : ""}${s.cost && s.phases[k] ? ` · ${Math.round((s.phases[k] / s.cost) * 100)}%` : ""}</small></div>`;
  return `<h3>What was spent on</h3><div class="stat-row small">${phases.map(tile).join("")}</div>`;
}

// The phases of the context, in the order the board shows them: the ones that have runs.
const ctxPhases = (phases) => Object.keys(PHASE_NAMES).filter((k) => phases?.[k]?.runs);
// The cache's share of all the input: what was read from it, of everything the model read.
const cacheShare = (p) => { const all = (p.input || 0) + (p.cacheRead || 0) + (p.cacheCreate || 0); return all ? p.cacheRead / all : 0; };
const pctText = (x) => `${Math.round(x * 100)}%`;

// How the agents' context filled over the period: the start, the peak, the compactions and the cache, by phase;
// what filled it, by tool; the heaviest files and commands.
// How the reviewer agent's rounds went: remarks per round, the agent's answers, the next rounds' verdicts.
function reviewStatsHTML(v) {
  if (!v?.rounds) return "";
  const tile = (label, value, note = "") => `<div class="stat"><span>${label}</span><b>${value}</b>${note ? `<small>${note}</small>` : ""}</div>`;
  const answered = v.fixed + v.notFixed + v.partly, checked = v.closed + v.open + v.accepted;
  const share = (x, of) => of ? pctText(x / of) : "—";
  return `<h3>Agent review</h3><div class="stat-row small">
      ${tile("Rounds", v.rounds, `${v.tasks} ${plural(v.tasks, "task", "tasks")} · clean ${v.clean}`)}
      ${tile("Remarks per round", v.remarks ? v.perRound.toFixed(1) : "—", v.remarks ? `${v.remarks} in total · "must" ${v.must}` : "no numbered ones yet")}
      ${tile("Agent fixed", share(v.fixed, answered), `partly ${v.partly} · declined ${v.notFixed}${v.noReply ? ` · no reply ${v.noReply}` : ""}`)}
      ${tile("Next round", share(v.closed, checked), `closed ${v.closed} · explanations accepted ${v.accepted} · not closed ${v.open}`)}
      ${tile("Rounds to clean", v.converged ? v.toClean.toFixed(1) : "—", `converged ${v.converged} of ${v.tasks}${v.escalated ? ` · to a human ${v.escalated}` : ""}`)}
      ${tile("Waiting for \"Fix\"", v.waiting, v.unverified ? `"fixed" without commits: ${v.unverified}` : "")}
    </div>`;
}
function contextHTML(c) {
  const phases = ctxPhases(c?.phases);
  if (!phases.length) return "";
  const main = c.phases.work ? "work" : phases[0], p = c.phases[main];
  const tile = (label, value, note = "") => `<div class="stat"><span>${label}</span><b>${value}</b>${note ? `<small>${note}</small>` : ""}</div>`;
  const tiles = `<div class="stat-row small">
      ${tile("Starting context", tok(Math.round(p.start)), `median${p.prompt ? ` · task prompt ≈ ${tok(Math.round(p.prompt))}` : ""}`)}
      ${tile("Context peak", tok(Math.round(p.peak)), `median${p.peakShare ? ` · ${pctText(p.peakShare)} of the window` : ""} · largest ${tok(p.maxPeak)}`)}
      ${tile("Compactions", p.compactions, `${p.compacted} of ${p.runs} ${plural(p.runs, "session", "sessions")}`)}
      ${tile("Cache", pctText(cacheShare(p)), "read from the cache, of all the input")}
    </div>`;
  const row = (k) => { const x = c.phases[k]; return `<tr><td>${PHASE_NAMES[k]}</td><td>${x.runs}</td><td>${tok(Math.round(x.start))}</td>`
    + `<td>${tok(Math.round(x.peak))}${x.peakShare ? ` <span class="muted">· ${pctText(x.peakShare)}</span>` : ""}</td><td>${x.compactions || "—"}</td><td>${pctText(cacheShare(x))}</td></tr>`; };
  const byPhase = phases.length > 1 ? `<div class="table"><table><thead><tr><th>Phase</th><th>Sessions</th><th title="Median: system prompt, tools, MCP, CLAUDE.md, memory and prompt">Start</th><th title="Median, share of the model window">Peak</th><th>Compactions</th><th>Cache</th></tr></thead><tbody>${phases.map(row).join("")}</tbody></table></div>` : "";
  return `<h3>Context <span class="muted">· ${PHASE_NAMES[main]}</span></h3>${tiles}${byPhase}${toolsTable(phases, (k) => c.phases[k].tools)}${heavyHTML(c.files, c.commands)}`;
}

// What filled the context, by tool, in each phase: the growth between the model's calls split by the size of
// what came in.
function toolsTable(phases, toolsOf) {
  const total = {};
  for (const k of phases) for (const [t, n] of Object.entries(toolsOf(k) || {})) total[t] = (total[t] || 0) + n;
  const tools = Object.keys(total).filter((t) => total[t] > 0).sort((a, b) => total[b] - total[a]);
  if (!tools.length) return "";
  const sum = tools.reduce((n, t) => n + total[t], 0);
  const multi = phases.length > 1;
  const row = (t) => `<tr><td>${esc(t)}</td>${multi ? phases.map((k) => `<td>${toolsOf(k)?.[t] ? tok(toolsOf(k)[t]) : "—"}</td>`).join("") : ""}<td>${tok(total[t])} <span class="muted">· ${pctText(total[t] / sum)}</span></td></tr>`;
  return `<h4 class="sub">What fills the context</h4><div class="table"><table><thead><tr><th>What</th>${multi ? phases.map((k) => `<th>${PHASE_NAMES[k]}</th>`).join("") : ""}<th>Total</th></tr></thead><tbody>${tools.map(row).join("")}</tbody></table></div>`;
}

// The heaviest files read and the commands with the largest output.
function heavyHTML(files, commands) {
  const list = (title, hs, what) => hs?.length ? `<div><h4 class="sub">${title}</h4><dl class="facts heavy">${hs.map((h) => `<dt>${tok(h.tokens)}</dt><dd><code title="${esc(h.name)}">${esc(h.name.length > 90 ? "…" + h.name.slice(-89) : h.name)}</code> <span class="muted">· ${h.count} ${what(h.count)}</span></dd>`).join("")}</dl></div>` : "";
  const body = list("Heaviest files", files, (n) => plural(n, "read", "reads")) + list("Heaviest commands", commands, (n) => plural(n, "run", "runs"));
  return body ? `<div class="heavy-lists">${body}</div>` : "";
}

// The size the estimate expected before the start against the one the finished task came to.
function forecastHTML(f) {
  if (!f?.compared) return "";
  const sizes = Object.keys(SIZE_NAMES);
  const row = (cells, i) => `<tr><td>${SIZE_NAMES[sizes[i]]}</td>${cells.map((n, j) => `<td class="${i === j ? "hit" : ""}">${n || "—"}</td>`).join("")}</tr>`;
  return `<h3>Forecast vs actual size <span class="muted">· ${f.compared} ${plural(f.compared, "task", "tasks")} · hits ${Math.round((f.hits / f.compared) * 100)}%</span></h3>
    <div class="table"><table class="forecast"><thead><tr><th>Expected ↓ · came out →</th>${sizes.map((x) => `<th>${SIZE_NAMES[x]}</th>`).join("")}</tr></thead>
    <tbody>${f.matrix.map(row).join("")}</tbody></table></div>`;
}

// How the tasks of each expected size went: merged with no rework, and what the agent spent on them.
function bySizeHTML(groups, dur) {
  if (!groups?.some((g) => g.taken)) return "";
  const tokened = groups.some((g) => g.tokened);
  const row = (g) => `<tr><td>${SIZE_NAMES[g.size] || esc(g.size)}</td><td>${g.taken}</td>`
    + `<td>${g.ended ? `${Math.round((g.clean / g.ended) * 100)}% <span class="muted">· ${g.clean} of ${g.ended}</span>` : "—"}</td>`
    + `<td>${g.timed ? dur(g.seconds) : "—"}</td><td>${g.priced ? `$${g.cost.toFixed(2)}` : "—"}</td>${tokened ? `<td>${g.tokened ? tok(g.tokens) : "—"}</td>` : ""}</tr>`;
  return `<h3>By expected size</h3><div class="table"><table><thead><tr><th>Size</th><th>Taken</th>`
    + `<th title="Merged without 'Retry differently', new attempts, or fixes after review, out of those merged or failed">No rework</th>`
    + `<th title="From hand-off to the agent until the MR">Agent time</th><th title="Work and plan of Mako's agent, average per task; without the agent's assessment and review">Cost</th>${tokened ? `<th title="Average per task">Tokens</th>` : ""}</tr></thead><tbody>${groups.filter((g) => g.taken).map(row).join("")}</tbody></table></div>`;
}

// Where the agents most often did not understand the task: clarity 1–2 in the final assessment.
function clarityHTML(s) {
  const table = (groups, col) => {
    const rated = (groups || []).filter((g) => g.assessed)
      .sort((a, b) => b.unclear / b.assessed - a.unclear / a.assessed || b.assessed - a.assessed);
    if (!rated.length) return "";
    const row = (g) => `<tr><td>${esc(g.name)}</td><td>${g.assessed}</td><td>${g.clarity.toFixed(1)}/5</td>`
      + `<td>${g.unclear ? `${g.unclear} <span class="muted">· ${Math.round((g.unclear / g.assessed) * 100)}%</span>` : "—"}</td></tr>`;
    return `<div class="table"><table><thead><tr><th>${col}</th><th>Assessed</th><th>Description</th><th title="Description clarity 1–2 out of 5">Did not understand</th></tr></thead><tbody>${rated.map(row).join("")}</tbody></table></div>`;
  };
  const body = table(s.projects, "Project") + table(s.authors, "Author");
  return body ? `<h3>Description quality</h3>${body}` : "";
}

// "While you were away": what waits for you, the MRs to merge, what failed and got merged, with links to the tasks.
function digestHTML(d) {
  const at = (ms) => new Date(ms).toLocaleString(LANG, { weekday: "short", hour: "2-digit", minute: "2-digit" });
  const item = (x) => `<li><a href="#${encodeURIComponent(x.id)}"><b>${esc(x.id)}</b> ${esc(x.title)}</a>`
    + (x.new ? ` <span class="digest-new">new</span>` : "")
    + (x.note ? `<div class="muted">${esc(x.note)}</div>` : "")
    + (x.mr ? ` <a class="mr" href="${esc(x.mr)}" target="_blank" rel="noopener">MR ↗</a>` : "") + `</li>`;
  const part = (title, xs) => xs?.length ? `<h3>${title} <span class="muted">${xs.length}</span></h3><ul class="digest-list">${xs.map(item).join("")}</ul>` : "";
  const body = part("Waiting for you", d.waiting) + part("MRs ready to merge", d.review) + part("Failed", d.failed) + part("Merged", d.merged);
  return `<div class="stats digest">
    <div class="digest-head"><h1>While you were away</h1><button class="ghost" id="digest-close">Close</button></div>
    <p class="stats-note">${at(d.since)} — ${at(d.until)}</p>
    ${body || `<div class="text" style="color:var(--mute)">Nothing happened</div>`}
  </div>`;
}

// The card's head: tracker · number · status, the title and one muted line of facts; on the right the main action
// for the task's state (Mako picks it: r.card.primary) and the rest in "⋯".
function headHTML(r, title = true) {
  const t = r.task, st = state(r), [text, cls, tip] = cardStatus(r);
  return `<div class="d-head">
      <div class="d-main">
        <div class="d-id">${trackerIcon(t)}${r.type === "fix" ? kind(r) : ""}<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(r.id)}</a><span class="s ${st} ${cls}"${tip ? ` title="${esc(tip)}"` : ""}>${esc(text)}</span></div>
        ${title ? `<h1>${esc(t.title)}</h1>${metaLine(r)}` : ""}
      </div>
      <div class="actions">${primaryHTML(r)}${moreMenu(r)}</div>
    </div>`;
}

// The task's facts in one muted line: repo · branch (copy) · model · assignees · priority · labels. The project is in
// the number already, the worktree's path is in "⋯".
function metaLine(r) {
  const t = r.task, parts = [];
  const branch = r.branch || r.branchName;
  if (r.repo) parts.push(`<span title="Repository">${esc(r.repo)}</span>`);
  if (branch && r.column !== "done") parts.push(`<span title="Branch"><code>${esc(branch)}</code><button type="button" class="icon" data-copy="${esc(branch)}" title="Copy branch name" aria-label="Copy branch name">${ICON.copy}</button></span>`);
  if (r.agentModel && r.column !== "new") parts.push(`<span title="The model the agent worked with"><code>${esc(r.agentModel)}</code></span>`);
  if (t.assignees?.length) parts.push(`<span title="Assignees">${esc(t.assignees.join(", "))}</span>`);
  if (t.priority) parts.push(`<span title="Priority in the tracker" class="prio ${prioTone(t.priority)}">${esc(t.priority)}</span>`);
  // Jira's meta carries the priority too, GitHub's and GitLab's the labels: both are shown on their own.
  const meta = t.meta?.split(" | ").filter((p) => !(t.priority && p.startsWith("Priority:")) && !(t.labels?.length && p.startsWith("Labels:"))).join(" | ");
  if (meta) parts.push(`<span title="Tracker">${esc(meta)}</span>`);
  if (r.trackerStatus) parts.push(`<span class="${r.trackerStatus.ok ? "" : "bad"}" title="Tracker status">${esc(r.trackerStatus.text)}</span>`);
  if (t.labels?.length) parts.push(`<span title="Labels">${t.labels.map(esc).join(", ")}</span>`);
  return parts.length ? `<div class="d-meta">${parts.join(`<i>·</i>`)}</div>` : "";
}

const openMR = (r, cls = "") => r.prUrl ? `<a class="btn ${cls}" href="${esc(r.prUrl)}" target="_blank" rel="noopener">Open ${esc(mrName(r.prUrl))} ↗</a>` : "";
// The main action, as a button the card's handlers already know (data-a, data-ask, data-merge), and the one next
// to it when the state has a pair (Start + Snooze, Merge + Open MR).
function primaryHTML(r) {
  const b = (a, label, cls = "", x = "", title = "") => `<button class="${cls}" data-a="${a}" data-x="${x}"${title ? ` title="${esc(title)}"` : ""}>${label}</button>`;
  switch (r.card?.primary) {
    case "take": return takeButton(r) + laterMenu();
    case "restore": return takeButton(r) + b("later", "Restore", "", "&min=-1", "Bring it back from snoozed");
    case "push": return `<button class="primary" data-a="push" title="Skip the queue: hand it to the agent now, past the WIP limit and Claude limits">Run now</button>`;
    case "cancel": return b("cancel", "Cancel", "danger");
    case "stop": return b("stop", `${ICON.stop}Stop`, "", "", "Stop the agent");
    case "resume": return b("resume", `${ICON.play}Resume`, "primary", "", "Continue the conversation");
    case "focus": return b("focus", "Show in Orca", agentOf(r)?.state === "waiting" ? "primary" : "");
    case "fix-conflicts": return `<button class="primary" data-ask="conflicts" title="The agent will rebase on the main branch, resolve the conflicts and push">Resolve conflicts</button>` + openMR(r);
    case "fix-ci": return `<button class="primary" data-ask="ci" title="The agent will look at the failed jobs, fix them and push">Fix CI</button>` + openMR(r);
    case "merge": return `<button class="primary" data-merge>${ICON.merge}Merge</button>` + openMR(r);
    // CI still running, or the agent is in Orca: the MR is where to look.
    case "open-mr": return openMR(r, "primary");
    case "retry": return b("retry", "Retry", "primary");
    case "unarchive": return b("unarchive", `${ICON.unarchive}Restore from archive`);
    case "archive": return b("archive", `${ICON.archive}Archive`);
    default: return "";
  }
}

// "⋯": what is not the main action for this state.
function moreMenu(r) {
  const p = r.card?.primary, term = r.executor === "terminal" && r.worktree, items = [];
  const it = (attrs, label, cls = "") => items.push(`<button type="button" class="${cls}" ${attrs}>${label}</button>`);
  if (r.column === "doing" && p !== "stop" && term && r.live) it(`data-a="stop"`, "Stop the agent");
  if (r.column === "review" && term && p !== "resume") it(`data-a="${r.live ? "stop" : "resume"}"`, r.live ? "Stop the agent" : "Continue the conversation");
  if (r.reviewStep === "ready") it(`data-a="agentreview"`, "Run agent review");
  if (["doing", "review", "failed"].includes(r.column) && r.status !== "queued") it("data-redo", "Retry differently");
  if (r.column === "doing" && !term && r.worktree && p !== "focus") it(`data-a="focus"`, "Show in Orca");
  if (r.prUrl && !["merge", "fix-conflicts", "fix-ci", "open-mr"].includes(p)) items.push(`<a href="${esc(r.prUrl)}" target="_blank" rel="noopener">Open ${esc(mrName(r.prUrl))} ↗</a>`);
  if (r.worktree && r.column !== "done") {
    if (data.editor) it(`data-open="editor"`, `Open in ${esc(data.editor)}`);
    it(`data-open="finder"`, "Show in Finder");
    it(`data-copy="${esc(r.worktree)}" title="${esc(r.worktree)}"`, "Copy worktree path");
  }
  if (r.task.url) it(`data-copy="${esc(r.task.url)}"`, "Copy task link");
  if (r.status === "queued" && p !== "cancel") it(`data-a="cancel"`, "Cancel", "danger");
  if (r.column === "doing" && r.status !== "queued") it(`data-a="cancel"`, term ? "Stop watching" : "Stop watching the agent", "danger");
  if (!r.archivedAt && p !== "archive" && r.column !== "new" && r.column !== "doing") it(`data-a="archive"`, "Archive");
  if (!items.length) return "";
  return `<details class="menu more"><summary class="btn icon" title="More actions" aria-label="More actions">⋯</summary><div class="menu-pop">${items.join("")}</div></details>`;
}

// The stage strip: Estimate → Plan → Work → Review → CI → Merge, each with its time and cost (r.card.stages, from
// the record's metrics). A click on a stage opens what it holds under the strip.
const STAGE_LABEL = { estimate: "Estimate", plan: "Plan", work: "Work", review: "Review", ci: "CI", merge: "Merge" };
const STAGE_MARK = {
  done: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>`,
  fail: `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  now: `<i></i>`,
};
const STAGE_WORD = { done: "done", now: "current", fail: "failed", skip: "skipped", todo: "not yet" };
const stageOpen = {};
function stripHTML(r, card) {
  const ss = r.card?.stages;
  if (!ss?.length) return "";
  const open = stageOpen[r.id];
  const cells = ss.map((s) => {
    const sub = [s.note, s.seconds >= 60 ? durText(s.seconds) : "", s.cost >= 0.005 ? `$${s.cost.toFixed(2)}` : ""].filter(Boolean).join(" · ") || "—";
    return `<button type="button" class="st ${s.state}${open === s.key ? " open" : ""}" data-stage="${s.key}" aria-expanded="${open === s.key}" title="${STAGE_LABEL[s.key]}: ${STAGE_WORD[s.state]}">
      <span class="row"><span class="c">${STAGE_MARK[s.state] ?? ""}</span><b>${STAGE_LABEL[s.key]}</b></span><small>${esc(sub)}</small></button>`;
  }).join(`<span class="sep"></span>`);
  return `<div class="stage-strip" role="group" aria-label="Stages">${cells}</div>${open ? `<div class="stage-more">${stageMore(r, open, card) || `<div class="muted">Nothing here yet.</div>`}</div>` : ""}`;
}
// What a stage holds: the estimate, the reviewer's rounds, the checks and the MR's CI, the time and the cost.
function stageMore(r, key, card) {
  const term = r.executor === "terminal" && r.worktree;
  if (key === "estimate") return estimateHTML(r, card);
  if (key === "review") return `<div class="mr-card">${reviewSection(r) || `<div class="muted">The reviewer has not run.</div>`}</div>${reviewerHTML(r)}`;
  if (key === "ci") return checksHTML(r, card) + (r.prUrl ? mrCard(r, term) : "") || `<div class="muted">No checks yet.</div>`;
  return cycleHTML(r, card);
}

// The description: the task's own text. Folded to its first line once the task is taken; opened, it stays open
// over the board's reloads.
const descOpen = {};
function descHTML(r, folded) {
  const t = r.task, has = !!t.description?.trim();
  const body = `<div class="tcard-b md">${has ? md(t.description) : `<span style="color:var(--mute)">No description</span>`}</div>`;
  if (!folded || !has) return `<div class="tcard"><div class="tcard-h">Description<span class="r">from ${esc(trackerName(t))}</span></div>${body}</div>`;
  const peek = t.description.replace(/[#*_`>\[\]()!-]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 160);
  return `<details class="tcard desc" data-desc ${descOpen[r.id] ? "open" : ""}><summary class="tcard-h">Description<span class="peek">${esc(peek)}</span><span class="r">Expand ▾</span></summary>${body}</details>`;
}

// In work: what the agent is doing now, and the way to its tab.
function nowHTML(r, card, bar) {
  const a = agentOf(r), term = r.executor === "terminal";
  const lines = [];
  if (r.status === "queued") return "";
  if (r.planning) lines.push(["now", "The agent is writing a plan: it changes nothing until you approve it"]);
  if (a?.state === "waiting") lines.push(["wait", `Waiting for you${a.reason ? `: ${a.reason}` : ""}`]);
  else if (a?.state === "working") lines.push(["now", a.tool ? `Working: ${a.tool}` : "The agent is working"]);
  else if (term && r.live) lines.push(["now", "The agent is working"]);
  else if (term || a?.state === "stopped") lines.push(["bad", `The agent is stopped${a?.reason ? `: ${a.reason}` : ""}`]);
  else if (a?.state === "done") lines.push(["ok", "The agent has finished its turn"]);
  if (r.checks?.state === "running") lines.push(["now", "Mako runs the checks before the MR"]);
  if (!lines.length) return "";
  const link = bar ? `<button type="button" class="link" data-tab="orca">${term ? "Agent" : "Orca"} tab →</button>` : "";
  const msg = a?.message ? `<div class="now-msg md">${md(a.message)}</div>` : "";
  return card("Now", `<div class="tcard-b now">${lines.map(([cls, text]) => `<div class="now-l ${cls}"><span class="dot"></span><span>${esc(text)}</span></div>`).join("")}${msg}</div>`, "", link);
}

// An MR waiting for the merge: what holds it up, on top.
function blockersHTML(r) {
  const c = review?.review, lines = [];
  if (r.blocked) lines.push(`<div><b>${esc(r.blocked.charAt(0).toUpperCase() + r.blocked.slice(1))}</b></div>`);
  if (c?.conflicts || r.baseConflict?.files?.length) {
    const files = r.baseConflict?.files ?? [];
    lines.push(`<div>${esc(mrName(r.prUrl))} conflicts with ${r.baseConflict?.base ? `<code>${esc(r.baseConflict.base.slice(0, 8))}</code> of ` : ""}the main branch${files.length ? ` in ${files.length} ${plural(files.length, "file", "files")}:` : ""}</div>`
      + (files.length ? `<div class="mono-list">${files.map(esc).join("<br>")}</div>` : ""));
  }
  if (c?.ci === "failed" && c.failed?.length) lines.push(`<div>CI failed: ${c.failed.map((j) => j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.name)}</a>` : esc(j.name)).join(", ")}</div>`);
  if (c?.threads?.length) lines.push(`<div>${c.threads.length} review ${plural(c.threads.length, "comment", "comments")} in the MR</div>`);
  if (!lines.length) return r.ciWait ? `<div class="tcard blocker wait"><div class="tcard-b"><b>Waiting for CI</b><div class="muted">The MR goes to review when CI passes.</div></div></div>` : "";
  return `<div class="tcard blocker"><div class="tcard-h">What blocks the merge</div><div class="tcard-b">${lines.join("")}</div></div>`;
}

// A finished task: how long it took, what it cost, how much rework, and where its time went.
function doneHTML(r, card) {
  const m = r.metrics, kv = [];
  const start = Date.parse(r.startedAt), end = Date.parse(r.mergedAt || r.finishedAt);
  if (start && end > start) kv.push([r.mergedAt ? "Taken to merge" : "Taken", durText((end - start) / 1000)]);
  const spent = (r.cost || 0) + Object.entries(m?.cost || {}).filter(([k]) => k !== "plan" && k !== "work").reduce((a, [, v]) => a + v, 0);
  if (spent) kv.push(["Spent", `$${spent.toFixed(2)}`]);
  const tokens = Object.values(m?.tokens || {}).reduce((a, b) => a + b, 0);
  if (tokens) kv.push(["Tokens", tok(tokens)]);
  // What the branch changed: kept in the record when its worktree was cleaned up, else read from the worktree.
  const fs = changes?.files;
  const ch = r.changed ?? (fs?.length ? { files: fs.length, added: fs.reduce((n, f) => n + f.additions, 0), removed: fs.reduce((n, f) => n + f.deletions, 0), commits: changes.commits?.length || 0 } : null);
  if (ch) kv.push(["Changed", `${ch.files} ${plural(ch.files, "file", "files")}`, `+${ch.added} −${ch.removed}${ch.commits ? ` · ${ch.commits} ${plural(ch.commits, "commit", "commits")}` : ""}`]);
  const rework = (r.ciFixes || 0) + (r.reviewFixes || 0);
  kv.push(["Rework", rework ? `${rework}` : "none", [r.ciFixes ? `CI ${r.ciFixes}` : "", r.reviewFixes ? `comments ${r.reviewFixes}` : ""].filter(Boolean).join(" · ")]);
  if (r.agentReviews?.length) kv.push(["Agent review", `${r.agentReviews.length} ${plural(r.agentReviews.length, "round", "rounds")}`]);
  const seconds = { ...(m?.seconds || {}) };
  const bar = stageBar(seconds, durText);
  const grid = `<div class="sum-grid">${kv.map(([k, v, s]) => `<div class="kv"><span>${k}</span><b>${esc(v)}</b>${s ? `<span>${esc(s)}</span>` : ""}</div>`).join("")}</div>`;
  const link = r.prUrl ? `<a href="${esc(r.prUrl)}" target="_blank" rel="noopener">${esc(mrName(r.prUrl))} ↗</a>` : "";
  return card("Summary", `<div class="tcard-b">${grid}${bar}</div>`, "sum-card", link);
}

function renderDetail() {
  const r = data.records.find((x) => x.id === selected);
  const ask = !r && !statsOpen && !newOpen && !digest && (data.reviewRequests || []).find((x) => x.id === selected);
  $("work").classList.toggle("detail", !!r || !!ask || statsOpen || newOpen || !!digest);
  if (ask) return renderAsk(ask);
  if (!r && digest) {
    closeTerminal(); shown = ""; $("detail").classList.remove("ws");
    $("detail").innerHTML = `<button class="ghost back" id="back">← Tasks</button>` + digestHTML(digest);
    $("back").onclick = $("digest-close").onclick = () => { digest = null; render(); };
    return;
  }
  if (!r && newOpen) {
    closeTerminal(); shown = ""; $("detail").classList.remove("ws");
    // The form keeps what is typed: the board re-renders every few seconds.
    if (newOpen === "code") { $("detail").classList.add("ws"); if (!$("code-ask")) showCode(); }
    else if (newOpen === "why") { if (!$("why-form")) showWhy(); } else if (!$("new-form")) showNewTask();
    return;
  }
  if (!r) {
    closeTerminal(); shown = ""; $("detail").classList.remove("ws");
    // The period's list is open: the next refresh would close it.
    if (document.activeElement?.id === "stats-days") return;
    $("detail").innerHTML = (statsOpen ? `<button class="ghost back" id="back">← Tasks</button>` : "") + statsHTML(data.stats) + faultsHTML(data.faults);
    if ($("back")) $("back").onclick = () => { statsOpen = false; render(); };
    if ($("stats-days")) $("stats-days").onchange = (e) => {
      statsDays = e.target.value;
      try { localStorage.setItem("mako-stats-days", statsDays); } catch {}
      load();
    };
    bindFaults();
    return;
  }
  const t = r.task;
  const term = r.executor === "terminal" && r.worktree;
  // Mako's own agent goes on after its MR too (CI, review comments), until the merge.
  const agentOn = term && !r.archivedAt && r.reviewState !== "merged" && (r.column === "doing" || r.column === "review");
  // The buttons are the same everywhere: the main action for the state (r.card.primary) and "⋯".
  const actions = primaryHTML(r) + moreMenu(r);

  const card = (title, body, cls = "", note = "") => `<div class="tcard ${cls}"><div class="tcard-h">${title}${note ? `<span class="r">${note}</span>` : ""}</div>${body}</div>`;

  // The content follows the task's state: what matters now on top, the description folded once the task is taken.
  const col = r.column;
  const agentSummary = r.summary && col !== "doing" ? card("Agent summary", summaryHTML(r.summary), "sum") : "";
  const byState = col === "new" ? descHTML(r, false) + estimateHTML(r, card)
    : col === "doing" ? nowHTML(r, card, !!(term || r.worktree || agentOf(r))) + checksHTML(r, card) + descHTML(r, true)
    : col === "review" ? blockersHTML(r) + reviewerHTML(r) + agentSummary + descHTML(r, true)
    : (col === "done" ? doneHTML(r, card) : "") + agentSummary + assessmentHTML(r, card) + retroHTML(r, card) + descHTML(r, col !== "failed");
  const stages = stripHTML(r, card);
  const task = `
    ${byState}
    ${r.retryNote ? card(`Attempt ${r.attempt || 2}: what to do differently`, `<div class="tcard-b text">${richText(r.retryNote)}</div>`, "", r.model ? `<code>${esc(r.model)}</code>` : "") : ""}
    ${t.comments?.length ? card(`Comments · ${t.comments.length}`, t.comments.map((c) => `<div class="cmt"><span class="av">${esc(initials(c.author))}</span><div><b>${esc(c.author)}</b><div class="md">${md(c.body)}</div></div></div>`).join("")) : ""}
    ${logs.length ? `<details class="journal" ${journalOpen ? "open" : ""}><summary>Journal · ${logs.length} ${plural(logs.length, "entry", "entries")}</summary>
      <div class="log">${logs.map((l) => `${new Date(l.at).toLocaleTimeString(LANG)}  ${linkify(l.text)}`).join("\n")}</div></details>` : ""}`;
  const started = r.column === "doing" && !!r.worktree;
  // A new task opened: a terminal task in progress opens on its terminal, the side card on its changes.
  if (workOf !== r.id) {
    workOf = r.id;
    itab = "changes"; itabPicked = false; tabPicked = false;
    changes = changesOf.get(r.id) ?? null; openFiles = []; fileTab = ""; diffs = {}; review = null; mrNote = ""; commitLog = null; commitOpen = {};
    pick = null; pickText = ""; reviewNote = "";
    tab = term && r.column === "doing" ? "orca" : "task";
    if (r.worktree) loadWork().then(renderDetail);
  } else if (started && !workStarted && !tabPicked) {
    // Taken while open: once the agent has started, show its work instead of the task (unless you picked a tab).
    tab = "orca"; fileTab = "";
    loadWork().then(renderDetail);
  }
  workStarted = started;
  const notices = `
    ${r.status === "queued" && r.starting ? `<!--st--><div id="starting-slot">${startingHTML(r)}</div><!--/st-->` : ""}
    ${r.status === "queued" && !r.starting ? `<div class="notice later-note">${ICON.clock}Queued${r.queueWhy ? `: ${esc(r.queueWhy)}` : ""}. Mako will start it on its own</div>` : ""}
    ${r.column === "new" && r.postponed ? `<div class="notice later-note">${ICON.clock}Postponed ${untilText(r.snoozedUntil)}: Mako will remind you about the task then</div>` : ""}
    ${r.column === "new" && r.autoSkip ? `<div class="notice auto-skip">Not taken automatically: ${esc(r.autoSkip)}. Take it with the button, or Mako will take it on its own once the estimate fits the settings</div>` : ""}
    ${r.error ? `<div class="notice ${r.status === "cancelled" ? "warn" : ""}">${linkify(r.error)}</div>` : ""}
    ${r.secrets?.length && !r.archivedAt ? secretsHTML(r) : ""}
    ${r.checks?.attention && r.status === "handed-off" ? `<div class="notice warn">The pre-MR check failed ${r.checks.fails} ${plural(r.checks.fails, "time", "times")} in a row (${esc(checksLine(r.checks))}): the MR is not opened and the agent is no longer asked to fix it. See what broke and continue with the agent; after a new commit Mako will check again.</div>` : ""}
    ${r.checks?.error && !r.prUrl && r.status === "handed-off" ? `<div class="notice">The check passed, but the MR was not opened: ${linkify(r.checks.error)}. Mako will try again.</div>` : ""}
    ${r.lesson && !r.archivedAt ? lessonHTML(r) : ""}
    ${r.worktreeKept ? `<div class="notice warn kept">The task is finished, but its worktree was not removed: ${r.worktreeKept} ${plural(r.worktreeKept, "uncommitted change or unpushed commit", "uncommitted changes or unpushed commits")}.
      <span class="kept-a"><button type="button" class="danger" data-kept="clean">Remove anyway</button><button type="button" class="ghost" data-kept="keepworktree">Keep</button></span></div>` : ""}
    ${r.gone && r.status !== "cancelled" ? `<div class="notice warn">The task was ${r.gone === "deleted" ? "deleted" : "closed"} in the tracker, but the agent is still working on it ${term ? "in the terminal" : "in Orca"}.</div>` : ""}`;
  // A task of Mako's own agent is one workspace: the tabs only change the centre, the right panel stays. Its
  // "Task" tab has the card's own head, stages and notices; the bar's buttons are the "Agent" tab's.
  const taskPane = term ? `<div class="task-pane">${headHTML(r)}${stages}${notices}${task}</div>` : "";
  const orca = (r.worktree && (term || showSide(r)) ? workArea(r, term, taskPane) : "") + (term ? "" : agentBlock(r));
  if (!orca.trim()) tab = "task";
  // "Changes" is a tab of its own only on a phone; a window grown wide shows the panel next to the agent again.
  if (tab === "side" && !(term && narrow.matches)) tab = "orca";
  const waiting = agentOf(r)?.state === "waiting";
  // One bar: the task, the agent's terminal (or Orca), and the files opened from the changes.
  const bar = orca.trim() ? `<div class="tabs">
      <button class="tab ${tab === "task" ? "on" : ""}" data-tab="task">Task</button>
      <button class="tab ${tab === "orca" && !fileTab ? "on" : ""}" data-tab="orca">${term ? "Agent" : "Orca"}${waiting ? ` <span class="wait">· waiting for you</span>` : ""}</button>
      ${term && showSide(r) ? `<button class="tab tab-phone ${tab === "side" ? "on" : ""}" data-tab="side">Changes${changes?.files?.length ? ` <span class="ibadge">${changes.files.length}</span>` : ""}</button>` : ""}
      ${openFiles.map((p) => `<button class="tab ${tab === "orca" && p === fileTab ? "on" : ""}" data-ftab="${esc(p)}" title="${esc(p)}"><span class="tn">${esc(p.split("/").pop())}</span><span class="x" data-close="${esc(p)}" title="Close">×</span></button>`).join("")}
    </div>` : "";
  const ws = !!term;
  const body = ws ? orca : bar && tab === "orca" ? orca : task;
  // How the agent is shown: its chat or its terminal; the same conversation either way.
  const view = r.view === "chat" ? "chat" : "terminal";
  const views = agentOn ? `<span class="seg" role="group" aria-label="Agent view">
      <button type="button" class="${view === "chat" ? "on" : ""}" data-view="chat">Chat</button><button type="button" class="${view === "terminal" ? "on" : ""}" data-view="terminal">Terminal</button></span>` : "";
  $("detail").classList.toggle("ws", ws);
  $("detail").dataset.tab = ws ? (fileTab && tab === "orca" ? "file" : tab) : "";
  if (ws) $("detail").scrollTop = 0; // it does not scroll, but keeps where the task page was scrolled to

  // In the workspace the tabs, the task's id and the buttons share one thin bar: the rest is the terminal's.
  const html = ws ? `
    <button class="ghost back" id="back">← Tasks</button>
    <div class="ws-bar">${bar}${views}
      <div class="actions">${tab === "task" ? "" : actions}</div>
    </div>${tab === "task" ? "" : notices}${body}` : `
    <button class="ghost back" id="back">← Tasks</button>
    ${headHTML(r, tab === "task")}
    ${tab === "task" ? stages : ""}
    ${notices}
    ${bar}${body}`;
  if (!term) { closeTerminal(); closeChat(); }
  // The board reloads every 5 s: the same page is left as it is, so the terminal keeps its focus and selection.
  if (html === shown) return;
  // Only the start's timers moved: patch that notice, so the task's text and pictures below it do not reload and jump.
  const strip = (x) => x.replace(/<!--st-->[\s\S]*<!--\/st-->/, "");
  const inner = (x) => x.slice(x.indexOf("<!--st-->") + 9, x.indexOf("<!--/st-->"));
  if ($("starting-slot") && shown.includes("<!--st-->") && html.includes("<!--st-->") && strip(shown) === strip(html)) {
    $("starting-slot").outerHTML = inner(html);
    shown = html;
    return;
  }
  const typing = tv?.el.contains(document.activeElement) || cv?.el.contains(document.activeElement);
  // The diff stays where it was scrolled to, and a comment being written keeps its cursor.
  const tp = $("detail").querySelector(".task-pane");
  if (tp) taskScroll[r.id] = tp.scrollTop;
  const box = $("detail").querySelector(".diff-view > .diff"), scrolled = box && { path: box.dataset.path, top: box.scrollTop, left: box.scrollLeft };
  const writing = document.activeElement?.id === "note-input" && [document.activeElement.selectionStart, document.activeElement.selectionEnd];
  if (lessonEdit) lessonEdit.at = document.activeElement?.id === "lesson-input" && [document.activeElement.selectionStart, document.activeElement.selectionEnd];
  const answering = document.activeElement?.dataset?.qa != null && { qa: document.activeElement.dataset.qa, at: [document.activeElement.selectionStart, document.activeElement.selectionEnd] };
  $("detail").innerHTML = shown = html;
  bindAnswers(r, answering);
  const tp2 = $("detail").querySelector(".task-pane");
  if (tp2) {
    tp2.scrollTop = taskScroll[r.id] ?? 0;
    tp2.onscroll = () => (taskScroll[r.id] = tp2.scrollTop);
  }
  const box2 = $("detail").querySelector(".diff-view > .diff");
  if (box2) box2.dataset.path = fileTab;
  if (box2 && scrolled?.path === fileTab) { box2.scrollTop = scrolled.top; box2.scrollLeft = scrolled.left; }
  const li = $("lesson-input");
  if (li && lessonEdit?.id === r.id && lessonEdit.rule === r.lesson.rule) {
    li.value = lessonEdit.text;
    if (lessonEdit.at) { li.focus(); li.setSelectionRange(...lessonEdit.at); }
  }
  if (li) li.oninput = () => (lessonEdit = { id: r.id, rule: r.lesson.rule, text: li.value });
  for (const btn of $("detail").querySelectorAll("[data-lesson]")) btn.onclick = async () => {
    for (const x of $("detail").querySelectorAll("[data-lesson]")) x.disabled = true;
    const to = btn.dataset.lesson;
    const res = await fetch(`/api/lesson?id=${encodeURIComponent(r.id)}&to=${to}`, { method: "POST", body: li?.value ?? "" })
      .then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) toast(res.error, true);
    else { lessonEdit = null; if (to !== "no") toast(`Lesson saved to CLAUDE.md (${to === "base" ? "base branch" : "task branch"})`); }
    await load();
  };
  for (const btn of $("detail").querySelectorAll("[data-kept]")) btn.onclick = async () => {
    if (btn.dataset.kept === "clean" && !confirm("Delete the worktree along with uncommitted changes? This cannot be undone.")) return;
    for (const x of $("detail").querySelectorAll("[data-kept]")) x.disabled = true;
    const res = await fetch(`/api/${btn.dataset.kept}?id=${encodeURIComponent(r.id)}`, { method: "POST" }).then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) toast(res.error, true);
    await load();
  };
  for (const btn of $("detail").querySelectorAll("[data-notsecret]")) btn.onclick = async () => {
    btn.disabled = true;
    const res = await fetch(`/api/notsecret?id=${encodeURIComponent(r.id)}&key=${encodeURIComponent(btn.dataset.notsecret)}`, { method: "POST" })
      .then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) toast(res.error, true);
    else toast("Line allowed: the next push will skip it");
    await load();
  };
  const input = $("note-input");
  if (input) {
    input.value = pickText;
    if (writing) { input.focus(); input.setSelectionRange(...writing); }
  }
  if (term && $("term-slot") && view === "chat") {
    closeTerminal();
    const c = chatFor(r.id);
    $("term-slot").append(c.el);
    restoreChatScroll(c);
    if (typing) c.input.focus();
  } else if (term && $("term-slot")) {
    closeChat();
    const v = terminalFor(r.id);
    $("term-slot").append(v.el);
    if (r.live && v.gone) connect(v);
    requestAnimationFrame(() => { v.resize(); if (typing) v.term.focus(); });
  }
  for (const j of $("detail").querySelectorAll("details.journal")) j.ontoggle = () => { journalOpen = j.open; };
  // The folded description and questions stay as you left them over the reloads.
  for (const d of $("detail").querySelectorAll("details[data-desc]")) d.ontoggle = () => { descOpen[r.id] = d.open; };
  for (const d of $("detail").querySelectorAll("details[data-qs]")) d.ontoggle = () => { qOpen[r.id] = d.open; };
  for (const btn of $("detail").querySelectorAll("[data-stage]")) btn.onclick = () => {
    const shownBelow = r.column === "new" && btn.dataset.stage === "estimate" && $("detail").querySelector(".tcard.assess");
    if (shownBelow) return shownBelow.scrollIntoView({ behavior: "smooth", block: "start" });
    stageOpen[r.id] = stageOpen[r.id] === btn.dataset.stage ? "" : btn.dataset.stage;
    renderDetail();
  };
  // A pick in "⋯" closes it.
  for (const m of $("detail").querySelectorAll("details.more")) m.querySelector(".menu-pop").addEventListener("click", (e) => { if (e.target.closest("button, a")) m.open = false; });
  for (const c of $("detail").querySelectorAll("details.convo")) {
    // Stays at the end while the agent writes, unless the reader scrolled up.
    const body = c.querySelector(".convo-body");
    body.scrollTop = convoScroll?.id === r.id && !convoScroll.atEnd ? convoScroll.top : body.scrollHeight;
    body.onscroll = () => (convoScroll = { id: r.id, top: body.scrollTop, atEnd: body.scrollTop + body.clientHeight >= body.scrollHeight - 30 });
    c.ontoggle = async () => {
      if (convoOpen === c.open) return;
      convoOpen = c.open;
      try { localStorage.setItem("mako-chat", convoOpen ? "1" : "0"); } catch {}
      if (convoOpen) { await loadConvo(); renderDetail(); }
    };
  }
  for (const btn of $("detail").querySelectorAll("[data-itab]")) btn.onclick = () => {
    itab = btn.dataset.itab; itabPicked = true;
    renderDetail();
    loadWork().then(renderDetail);
  };
  for (const btn of $("detail").querySelectorAll("[data-commit]")) btn.onclick = async () => {
    const h = btn.dataset.commit;
    if (commitOpen[h]) { delete commitOpen[h]; renderDetail(); return; }
    commitOpen[h] = "loading";
    renderDetail();
    commitOpen[h] = await getJSON(`/api/commit?id=${encodeURIComponent(r.id)}&hash=${h}`);
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-view]")) btn.onclick = async () => {
    if (btn.classList.contains("on")) return;
    btn.disabled = true;
    await fetch(`/api/view?id=${encodeURIComponent(r.id)}&to=${btn.dataset.view}`, { method: "POST" });
    await load();
  };
  for (const btn of $("detail").querySelectorAll("[data-tab]")) btn.onclick = () => {
    tab = btn.dataset.tab; tabPicked = true;
    if (tab === "orca" || tab === "side") fileTab = "";
    renderDetail();
    if (tab === "orca") { tv?.term.focus(); cv?.input.focus(); }
    loadWork().then(renderDetail);
  };
  for (const btn of $("detail").querySelectorAll("[data-file]")) btn.onclick = () => openFile(btn.dataset.file);
  for (const btn of $("detail").querySelectorAll("[data-copy]")) btn.onclick = () => navigator.clipboard?.writeText(btn.dataset.copy);
  for (const btn of $("detail").querySelectorAll("[data-open]")) btn.onclick = () => fetch(`/api/open?id=${encodeURIComponent(r.id)}&in=${btn.dataset.open}`, { method: "POST" });
  for (const btn of $("detail").querySelectorAll("[data-open-file]")) btn.onclick = () =>
    fetch(`/api/open?id=${encodeURIComponent(r.id)}&in=editor&file=${encodeURIComponent(btn.dataset.openFile)}`, { method: "POST" });
  bindNotes(r);
  for (const btn of $("detail").querySelectorAll("[data-dwhole]")) btn.onclick = () => {
    diffWhole = btn.dataset.dwhole === "1";
    try { localStorage.setItem("mako-diff-whole", diffWhole ? "1" : "0"); } catch {}
    for (const k in diffs) delete diffs[k];

    loadWork().then(renderDetail);

  for (const btn of $("detail").querySelectorAll("[data-dnav]")) btn.onclick = () => {
    const box = $("detail").querySelector(".diff-view > .diff");
    if (!box) return;
    const top = box.scrollTop, starts = [...box.querySelectorAll(".dstart")].map((e) => e.offsetTop - 40);

  for (const btn of $("detail").querySelectorAll("[data-dmode]")) btn.onclick = () => {
    diffMode = btn.dataset.dmode;
    try { localStorage.setItem("mako-diff", diffMode); } catch {}

  };
  for (const btn of $("detail").querySelectorAll("[data-ask]")) btn.onclick = () => { btn.disabled = true; btn.classList.add("busy"); mrAction(r.id, "ask", btn.dataset.ask); };
  for (const btn of $("detail").querySelectorAll("[data-merge]")) btn.onclick = () => {
    if (confirm("Merge the MR? The task branch will be deleted and the task will get its final status.")) { btn.disabled = true; mrAction(r.id, "merge"); }
  };
  for (const btn of $("detail").querySelectorAll("[data-close-mr]")) btn.onclick = () => {
    if (confirm("Close the MR without merging? The changes stay on the branch and the task gets the status “Not done”.")) { btn.disabled = true; mrAction(r.id, "close"); }
  };
  for (const btn of $("detail").querySelectorAll("[data-dir]")) btn.onclick = () => {

  };

    if (e.target.dataset.close) return closeFile(e.target.dataset.close);

    fileTab = btn.dataset.ftab;

    if (!(fileTab in diffs)) loadWork().then(renderDetail);

  for (const btn of $("detail").querySelectorAll("[data-a]")) btn.onclick = () => {
    if (btn.dataset.a === "cancel" && r.starting && !confirm("Cancel the launch? Preparation will be stopped and the created worktree removed.")) return;
    post(btn.dataset.a, r.id, btn.dataset.x);
  };
  for (const btn of $("detail").querySelectorAll("[data-redo]")) btn.onclick = () => openRedo(r);
  $("back").onclick = () => { selected = null; statsOpen = false; history.replaceState(null, "", location.pathname); try { localStorage.removeItem("mako-selected"); } catch {} render(); };
}

// Comments on the open file's lines: a click on a line number (Shift+click or a drag for several) opens the box
// to write in; the comments gather in the draft review, which goes to the agent as one message.
function bindNotes(r) {
  const box = $("detail").querySelector(".diff-view > .diff[data-notes]");
  if (box) {
    const rows = () => parseDiff(diffs[fileTab]).rows;
    const show = (a, b) => {
      for (const el of box.querySelectorAll("[data-row]")) {
        const on = +el.dataset.row >= Math.min(a, b) && +el.dataset.row <= Math.max(a, b);
        if (el.parentElement.classList.contains("dl")) el.parentElement.classList.toggle("picked", on);
        else { el.classList.toggle("picked", on); el.nextElementSibling?.classList.toggle("picked", on); }
      }
    };
    box.onmousedown = (e) => {
      const ln = e.target.closest("[data-row]");
      if (!ln || e.button !== 0) return;
      e.preventDefault();
      const all = rows(), at = +ln.dataset.row;
      // Shift+click goes on from the lines already picked in this file.
      const from = e.shiftKey && pick?.path === fileTab && !pick.edit ? linesAt(all, pick.rows, pick.line) : -1;
      const drag = { a: from >= 0 ? from : at, b: at };
      show(drag.a, drag.b);
      box.onmouseover = (ev) => {
        const over = ev.target.closest("[data-row]");
        if (over) { drag.b = +over.dataset.row; show(drag.a, drag.b); }
      };
      document.addEventListener("mouseup", () => {
        box.onmouseover = null;
        const lo = Math.min(drag.a, drag.b), hi = Math.max(drag.a, drag.b), picked = all.slice(lo, hi + 1).map(({ t, o, n, s }) => ({ t, o, n, s }));
        if (!pick || pick.edit) pickText = "";
        pick = { path: fileTab, rows: picked, line: lineOf(picked[0]) };
        renderDetail();
        $("note-input")?.focus();
      }, { once: true });
    };
  }
  const input = $("note-input");
  const cancel = () => { pick = null; pickText = ""; renderDetail(); };
  const save = () => {
    const text = pickText.trim(), list = notesOf(r.id);
    if (pick.edit) {
      const n = list.find((x) => x.id === pick.edit);
      if (n && text) n.text = text;
      else if (n) list.splice(list.indexOf(n), 1);
    } else if (text) list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), path: pick.path, rows: pick.rows, line: pick.line, text });
    saveNotes();
    reviewNote = "";
    cancel();
  };
  if (input) {
    input.oninput = () => (pickText = input.value);
    input.onkeydown = (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
      else if (e.key === "Escape") { e.preventDefault(); cancel(); }
    };
  }
  for (const btn of $("detail").querySelectorAll("[data-note-save]")) btn.onclick = save;
  for (const btn of $("detail").querySelectorAll("[data-note-cancel]")) btn.onclick = cancel;
  for (const btn of $("detail").querySelectorAll("[data-note-edit]")) btn.onclick = () => {
    const n = notesOf(r.id).find((x) => x.id === btn.dataset.noteEdit);
    if (!n) return;
    pick = { path: n.path, rows: n.rows, line: n.line, edit: n.id };
    pickText = n.text;
    renderDetail();
    $("note-input")?.focus();
  };
  for (const btn of $("detail").querySelectorAll("[data-note-del]")) btn.onclick = () => {
    notes[r.id] = notesOf(r.id).filter((x) => x.id !== btn.dataset.noteDel);
    saveNotes();
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-review-clear]")) btn.onclick = () => {
    if (!confirm("Delete all draft comments?")) return;
    notes[r.id] = notesOf(r.id).filter((x) => x.sent);
    saveNotes();
    reviewNote = "";
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-review-send]")) btn.onclick = async () => {
    const drafts = notesOf(r.id).filter((x) => !x.sent);
    if (!drafts.length) return;
    btn.disabled = true;
    const res = await fetch(`/api/say?id=${encodeURIComponent(r.id)}`, { method: "POST", body: reviewMessage(drafts) }).then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) reviewNote = `⚠ ${res.error}`;
    else {
      for (const n of drafts) n.sent = true;
      saveNotes();
      reviewNote = `Sent to the agent: ${drafts.length} ${plural(drafts.length, "comment", "comments")}`;
      if (cv?.id === r.id) { if (!cv.snap?.live) cv.version = -1; pollChat(); }
    }
    renderDetail();
  };
}

// The task from the link, else the one open last time.
// Mako's chat with the agent: one for the open task, kept while the board re-renders around it; the board asks

let cv = null;
function chatFor(id) {
