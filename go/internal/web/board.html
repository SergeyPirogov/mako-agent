<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mako</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mako">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
</head>
<body>
<header>
  <span class="logo">🦈 Mako</span>
  <span class="wip" id="wip"></span>
  <span class="search" id="search"></span>
  <span class="spacer"></span>
  <button class="ghost" id="poll" title="Перевірити трекери зараз">Оновити</button>
  <button class="ghost" id="pause" title="Пауза: не шукати нових задач"></button>
  <button class="ghost" id="bell" hidden title="Сповіщення на цей телефон">🔔</button>
  <a class="ghost-link" id="settings-link" href="/settings">Налаштування</a>
  <button class="ghost" id="theme" title="Тема"></button>
</header>
<div id="phone-hint"></div>
<div id="problems"></div>
<div class="chips" id="chips"></div>
<div class="work" id="work">
  <aside id="list"></aside>
  <section id="detail"><div class="empty">Виберіть задачу зліва</div></section>
</div>
<script src="/theme.js"></script>
<script>
const COLUMNS = [["new", "Нові"], ["doing", "В роботі"], ["review", "На рев'ю"], ["done", "Готово"], ["failed", "Не виконано"]];
const LABEL = { new: "нова", later: "відкладена", doing: "в роботі", review: "на рев'ю", done: "готово", failed: "не виконано",
  // the agent's own state, for tasks in Orca (ag- keeps them apart from the columns)
  "ag-working": "агент працює", "ag-waiting": "чекає на вас", "ag-done": "агент закінчив", "ag-stopped": "агент зупинився",
  "ag-idle": "агент не працює", "ag-missing": "немає в Orca" };
const AGENT_NOTE = { waiting: "Агент чекає на вас", done: "Агент закінчив хід: далі — ваше слово або MR", idle: "Зараз агент нічого не робить", unknown: "Orca не відповідає" };
let data = null, selected = null, project = localStorage.getItem("mako-project") || "", showArchive = false, logs = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<>"')]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return "щойно";
  if (m < 60) return `${m} хв тому`;
  if (m < 1440) return `${Math.round(m / 60)} год тому`;
  return `${Math.round(m / 1440)} дн тому`;
};
const agentOf = (r) => data.agents?.[r.id];
// In Orca, the agent's own state says more than «в Orca».
const state = (r) => {
  if (r.column === "new" && r.postponed) return "later";
  const a = r.column === "doing" ? agentOf(r) : undefined;
  return a && LABEL["ag-" + a.state] ? "ag-" + a.state : r.column;
};
const ATTENTION = { waiting: 0, done: 1, stopped: 1 };
// A small Markdown for what agents write: headings, lists, tables, code blocks, inline code, bold and links.
function md(text) {
  const inline = (x) => linkify(x).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const lines = text.trim().split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre class="code">${esc(code.join("\n"))}</pre>`);
      continue;
    }
    if (/^\s*\|/.test(l)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(lines[i]);
      i--;
      const body = rows.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r)).map(cells);
      const sep = rows.length > 1 && /^\s*\|?[\s:|-]+\|?\s*$/.test(rows[1]);
      const head = sep ? body.shift() : null;
      out.push(`<div class="table"><table>${head ? `<thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>` : ""}<tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const h = l.match(/^#{1,4}\s+(.*)/);
    const li = l.match(/^\s*[-*]\s+(.*)/);
    const num = l.match(/^\s*(\d+)[.)]\s+(.*)/);
    if (h) out.push(`<h4>${inline(h[1])}</h4>`);
    else if (li) out.push(`<li>${inline(li[1])}</li>`);
    else if (num) out.push(`<p class="num"><span>${num[1]}.</span> ${inline(num[2])}</p>`);
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  return out.join("").replace(/(<li>.*?<\/li>)+/g, (m) => `<ul>${m}</ul>`);
}

async function post(action, id, extra = "") {
  await fetch(`/api/${action}?id=${encodeURIComponent(id ?? "")}${extra}`, { method: "POST" });
  await load();
}
$("pause").onclick = () => fetch(`/api/pause?on=${data?.paused ? 0 : 1}`, { method: "POST" }).then(load);
$("poll").onclick = async () => { $("poll").textContent = "Перевіряю…"; await post("poll"); setTimeout(() => ($("poll").textContent = "Оновити"), 1500); };

async function load() {
  try {
    data = await (await fetch("/api/state")).json();
  } catch {
    $("search").textContent = "Mako не відповідає";
    $("search").className = "search err";
    return;
  }
  await loadCard();
  render();
}

// The open card's journal and conversation, fetched side by side; a reply for a card no longer open is dropped.
async function loadCard() {
  const id = selected;
  if (!id) return;
  const [l] = await Promise.all([
    fetch(`/api/log?id=${encodeURIComponent(id)}`).then((r) => r.json()).catch(() => null),
    chatOpen ? loadChat() : null,
  ]);
  if (id === selected && l) logs = l;
}

// The whole conversation with the agent, read from its Claude Code session; loaded while it is open.
let chatOpen = false, chat = { id: null, turns: [] };
try { chatOpen = localStorage.getItem("mako-chat") === "1"; } catch {}
async function loadChat() {
  const id = selected;
  try {
    const r = await (await fetch(`/api/chat?id=${encodeURIComponent(id)}`)).json();
    if (id === selected) chat = { id, turns: r.turns };
  } catch {}
}
function chatHTML(turns) {
  if (!turns.length) return `<div class="muted chat-empty">Розмови не знайдено: агент працює не в Claude Code або ще нічого не написав.</div>`;
  const out = [];
  for (let i = 0; i < turns.length; i++) {
    const t = turns[i];
    if (t.role === "tool") {
      const group = [];
      for (; i < turns.length && turns[i].role === "tool"; i++) group.push(turns[i].text);
      i--;
      const shown = group.slice(-4);
      out.push(`<div class="tools">${group.length > shown.length ? `<div>… ще ${group.length - shown.length}</div>` : ""}${shown.map((x) => `<div>${esc(x)}</div>`).join("")}</div>`);
    } else if (t.role === "user") {
      const long = t.text.length > 500;
      out.push(`<div class="msg-user">${long ? `<details><summary>${esc(t.text.slice(0, 300))}…</summary><div class="text">${linkify(t.text)}</div></details>` : `<div class="text">${linkify(t.text)}</div>`}</div>`);
    } else {
      out.push(`<div class="msg-agent">${md(t.text)}</div>`);
    }
  }
  return out.join("");
}

function visible() {
  return data.records.filter((r) => (showArchive ? r.archivedAt : !r.archivedAt) && (!project || r.task.project === project));
}

function render() {
  $("problems").innerHTML = data.problems?.length
    ? `<div class="banner">${data.problems.map((p) => `<div>${esc(p)}</div>`).join("")}${data.remote ? "" : `<a href="/settings">Відкрити налаштування →</a>`}</div>` : "";
  $("pause").textContent = data.paused ? "Продовжити" : "Пауза";
  $("pause").title = data.paused ? "Пошук нових задач на паузі" : "Пауза: не шукати нових задач";
  const live = data.records.filter((r) => !r.archivedAt);
  const doing = live.filter((r) => r.column === "doing").length;
  $("wip").className = "wip" + (data.wipLimit && doing >= data.wipLimit ? " full" : "");
  const waiting = live.filter((r) => agentOf(r)?.state === "waiting").length;
  $("wip").innerHTML = (data.wipLimit ? `В роботі <b>${doing}</b> з ${data.wipLimit}` : `В роботі <b>${doing}</b>`) +
    (waiting ? ` · <span class="wait">✋ чекає на вас: ${waiting}</span>` : "");
  document.title = waiting ? `(${waiting}) Mako` : "Mako";
  const searches = Object.entries(data.searches);
  const failed = searches.filter(([, s]) => s.error);
  $("search").className = "search" + (failed.length ? " err" : "");
  $("search").textContent = failed.length
    ? failed.map(([id, s]) => `${id}: ${s.error}`).join(" · ")
    : data.paused ? "Пошук задач на паузі"
    : searches.length ? `Перевірено ${ago(searches.map(([, s]) => s.at).sort().pop())}` : "Перша перевірка трекерів…";
  $("search").title = $("search").textContent;

  // projects as chips, with how many tasks are on the board
  const counts = {};
  for (const r of live) counts[r.task.project] = (counts[r.task.project] || 0) + 1;
  const projects = Object.keys(counts).sort();
  if (project && !counts[project]) project = "";
  const archived = data.records.filter((r) => r.archivedAt).length;
  $("chips").innerHTML =
    `<button class="chip ${!project && !showArchive ? "on" : ""}" data-p="">Усі<span class="n">${live.length}</span></button>` +
    projects.map((p) => `<button class="chip ${project === p && !showArchive ? "on" : ""}" data-p="${esc(p)}">${esc(p)}<span class="n">${counts[p]}</span></button>`).join("") +
    (archived ? `<span class="spacer"></span><button class="chip ${showArchive ? "on" : ""}" data-archive>Архів<span class="n">${archived}</span></button>` : "");
  $("chips").style.display = projects.length > 1 || archived ? "" : "none";
  for (const b of $("chips").querySelectorAll("button")) {
    b.onclick = () => {
      if (b.hasAttribute("data-archive")) showArchive = !showArchive;
      else { showArchive = false; project = b.dataset.p; try { localStorage.setItem("mako-project", project); } catch {} }
      render();
    };
  }

  const rows = visible();
  let html = "";
  for (const [col, title] of COLUMNS) {
    const rank = (r) => ATTENTION[agentOf(r)?.state] ?? 9;
    const items = rows.filter((r) => r.column === col).sort((a, b) => (col === "new" ? a.postponed - b.postponed : col === "doing" ? rank(a) - rank(b) : 0));
    if (!items.length) continue;
    html += `<div class="group">${title}<span class="n">${items.length}</span></div>`;
    for (const r of items) {
      const st = state(r);
      html += `<button class="item ${r.id === selected ? "sel" : ""} ${st === "later" ? "later" : ""}" data-id="${esc(r.id)}">
        <span class="t">${esc(r.task.title)}</span>
        <span class="m"><span class="s ${st}">${LABEL[st]}</span><code>${esc(r.id)}</code><span>${ago(r.updatedAt)}</span></span></button>`;
    }
  }
  $("list").innerHTML = html || `<div class="empty">${showArchive ? "Архів порожній" : "Задач немає. Mako перевіряє трекери і покаже тут нові задачі, призначені на вас."}</div>`;
  for (const b of $("list").querySelectorAll(".item")) b.onclick = () => select(b.dataset.id);
  renderDetail();
}

let chatScroll = null;
async function select(id) {
  chatScroll = null;
  selected = id;
  history.replaceState(null, "", "#" + encodeURIComponent(id));
  // The card opens at once from what the board already has; its journal and conversation follow.
  logs = [];
  render();
  await loadCard();
  if (id === selected) render();
}

function agentBlock(r) {
  const a = agentOf(r);
  if (!a) return "";
  const since = a.since ? ` · ${ago(new Date(a.since).toISOString()).replace(" тому", "")}` : "";
  const name = { claude: "Claude Code", codex: "Codex", cursor: "Cursor", opencode: "OpenCode", gemini: "Gemini" }[a.name] ?? a.name ?? "";
  const note = a.state === "waiting" ? `${AGENT_NOTE.waiting}${a.reason ? `: ${esc(a.reason)}` : ""}`
    : a.state === "stopped" ? `Агент зупинився${a.reason ? `: ${esc(a.reason)}` : ""}`
    : a.state === "working" && a.tool ? esc(a.tool) : AGENT_NOTE[a.state] ?? "";
  return `<div class="agent ${a.state}">
    <div class="agent-head"><span class="s ag-${a.state}">${LABEL["ag-" + a.state] ?? "агент"}${since}</span>${name ? `<span class="muted">${esc(name)}</span>` : ""}
      ${note ? `<span class="agent-note">${note}</span>` : ""}</div>
    ${a.screen?.length ? `<pre class="screen">${a.screen.map(esc).join("\n")}</pre>` : ""}
    ${a.message && !(chatOpen && chat.id === r.id && chat.turns.length) ? `<div class="agent-msg"><div class="agent-msg-h">Останнє повідомлення агента</div>${md(a.message)}</div>` : ""}
    ${a.error ? `<div class="agent-err">${esc(a.error)}</div>` : ""}
    ${a.own ? ownControls(r, a) : ""}
  </div>`;
}

// Mako's own agent: what it asks, answered here, and a line to write to it.
function ownControls(r, a) {
  const reqs = (a.requests ?? []).map((q) => q.questions?.length
    ? `<div class="req" data-req="${esc(q.id)}">${q.questions.map((qq, i) => `<div class="req-q"><b>${esc(qq.question)}</b>
        <div class="req-opts">${qq.options.map((o) => `<button data-answer="${i}" data-label="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("")}
        <div class="req-own"><input type="text" placeholder="Або своя відповідь…" data-own-answer><button data-answer-own>Відповісти</button></div></div>`
    : `<div class="req" data-req="${esc(q.id)}"><div><b>Агент просить дозволу</b>${q.description ? ` <span class="muted">— ${esc(q.description)}</span>` : ""}</div>
        <code class="req-what">${esc(q.what)}</code>
        <div class="req-opts"><button class="primary" data-allow>Дозволити</button><button data-allow-always title="Не питати про таке в цій задачі">Дозволяти завжди</button><button class="danger" data-deny>Відхилити</button></div></div>`).join("");
  const chips = ["Продовжуй", "Запусти тести", "Відкрий MR"].map((c) => `<button class="chip" data-chip="${esc(c)}">${c}</button>`).join("");
  return `${reqs}
    <div class="composer">
      <textarea id="composer" rows="2" placeholder="Написати агенту…">${esc(drafts[r.id] ?? "")}</textarea>
      <div class="composer-row">${chips}<span class="spacer"></span>
        ${a.state === "working" ? `<button class="ghost danger" data-interrupt>Зупинити</button>` : ""}
        <button class="primary" data-send>Надіслати</button></div>
    </div>`;
}

const drafts = {};
async function agentCall(action, id, query = "", body = {}) {
  const r = await (await fetch(`/api/${action}?id=${encodeURIComponent(id)}${query}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
  if (!r.ok) alert(r.error);
  await load();
  return r.ok;
}
function wireOwn(r) {
  const box = $("detail");
  for (const req of box.querySelectorAll("[data-req]")) {
    const id = req.dataset.req;
    req.querySelector("[data-allow]")?.addEventListener("click", () => agentCall("answer", r.id, `&req=${encodeURIComponent(id)}&allow=1`));
    req.querySelector("[data-allow-always]")?.addEventListener("click", () => agentCall("answer", r.id, `&req=${encodeURIComponent(id)}&allow=1&always=1`));
    req.querySelector("[data-deny]")?.addEventListener("click", () => agentCall("answer", r.id, `&req=${encodeURIComponent(id)}`));
    const a = agentOf(r)?.requests?.find((x) => x.id === id);
    for (const b of req.querySelectorAll("[data-answer]")) {
      b.addEventListener("click", () => agentCall("answer", r.id, `&req=${encodeURIComponent(id)}&allow=1`, { answers: { [a.questions[+b.dataset.answer].question]: b.dataset.label } }));
    }
    req.querySelector("[data-answer-own]")?.addEventListener("click", () => {
      const text = req.querySelector("[data-own-answer]").value.trim();
      if (text) agentCall("answer", r.id, `&req=${encodeURIComponent(id)}&allow=1`, { answers: { [a.questions[0].question]: text } });
    });
  }
  const ta = $("composer");
  if (!ta) return;
  const send = async (text) => {
    if (!text.trim()) return;
    if (await agentCall("send", r.id, "", { text })) { drafts[r.id] = ""; }
  };
  ta.oninput = () => (drafts[r.id] = ta.value);
  ta.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(ta.value); } };
  box.querySelector("[data-send]").onclick = () => send(ta.value);
  for (const c of box.querySelectorAll("[data-chip]")) c.onclick = () => send(c.dataset.chip);
  box.querySelector("[data-interrupt]")?.addEventListener("click", () => agentCall("interrupt", r.id));
}

function renderDetail() {
  // The board redraws every few seconds: what is being typed to the agent stays, with the cursor.
  const ta = $("composer"), typing = ta && document.activeElement === ta, sel = ta ? [ta.selectionStart, ta.selectionEnd] : null;
  const r = data.records.find((x) => x.id === selected);
  $("work").classList.toggle("detail", !!r);
  if (!r) { $("detail").innerHTML = `<div class="empty">Виберіть задачу зліва</div>`; return; }
  const t = r.task, st = state(r);
  const b = (action, label, cls = "", extra = "") => `<button class="${cls}" data-a="${action}" data-x="${extra}">${label}</button>`;
  let actions = "";
  if (r.column === "new") actions = b("take", data.runner === "orca" ? "Віддати в Orca" : "Взяти в роботу", "primary") + b("later", "Відкласти на годину", "", "&min=60") + b("later", "До завтра", "", "&min=1080");
  else if (r.status === "queued") actions = b("cancel", "Скасувати", "danger");
  else if (r.column === "doing") actions = (r.worktree && !agentOf(r)?.own ? b("focus", "Показати в Orca", agentOf(r)?.state === "waiting" ? "primary" : "") : "")
    + b("cancel", agentOf(r)?.own ? "Зупинити й скасувати" : "Більше не стежити", "danger");
  else if (r.column === "failed") actions = b("retry", "Повторити", "primary") + b("archive", "В архів");
  else actions = b("archive", "В архів");
  if (r.archivedAt) actions = b("unarchive", "Повернути з архіву");

  const facts = [];
  if (t.meta) facts.push(["Трекер", esc(t.meta)]);
  if (t.assignees?.length) facts.push(["Виконавці", esc(t.assignees.join(", "))]);
  if (r.trackerStatus) facts.push(["Статус у трекері", r.trackerStatus.ok ? esc(r.trackerStatus.text) : `<span style="color:var(--err)">${esc(r.trackerStatus.text)}</span>`]);
  if (r.repo) facts.push(["Репозиторій", esc(r.repo)]);
  if (r.branch || r.branchName) facts.push(["Гілка", `<code>${esc(r.branch || r.branchName)}</code>`]);
  if (r.worktree) facts.push(["Worktree", `<code>${esc(r.worktree)}</code>`]);
  if (r.prUrl) facts.push(["MR", `<a href="${esc(r.prUrl)}" target="_blank" rel="noopener">${esc(r.prUrl)}</a>${r.reviewState === "merged" ? " · змерджено" : r.reviewState === "closed" ? " · закрито" : ""}`]);
  if (r.postponed) facts.push(["Відкладено до", new Date(r.snoozedUntil).toLocaleString("uk")]);

  $("detail").innerHTML = `
    <button class="ghost back" id="back">← Задачі</button>
    <div class="d-id"><span class="s ${st}">${LABEL[st]}</span><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(r.id)}</a><span>${esc(t.project)}</span></div>
    <h1>${esc(t.title)}</h1>
    ${t.labels?.length ? `<div class="labels">${t.labels.map((l) => `<span class="label">${esc(l)}</span>`).join("")}</div>` : ""}
    <div class="actions">${actions}</div>
    ${r.error ? `<div class="notice ${r.status === "cancelled" ? "warn" : ""}">${linkify(r.error)}</div>` : ""}
    ${r.gone && r.status !== "cancelled" ? `<div class="notice warn">Задачу ${r.gone === "deleted" ? "видалено" : "закрито"} в трекері, а агент ще працює над нею.</div>` : ""}
    ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : ""}
    ${agentBlock(r)}
    ${r.worktree ? `<details class="chat" id="chat" ${chatOpen ? "open" : ""}><summary>Уся розмова з агентом${chat.id === r.id && chat.turns.length ? ` <span class="muted">· ${chat.turns.filter((t) => t.role !== "tool").length}</span>` : ""}</summary>
      <div class="chat-body" id="chat-body">${chat.id === r.id ? chatHTML(chat.turns) : `<div class="muted chat-empty">Завантажую…</div>`}</div></details>` : ""}
    ${r.summary && r.column !== "doing" ? `<h3>Підсумок</h3><div class="summary">${md(r.summary)}</div>` : ""}
    <h3>Опис</h3>
    <div class="text">${t.description?.trim() ? linkify(t.description.trim()) : `<span style="color:var(--mute)">Без опису</span>`}</div>
    ${t.comments?.length ? `<h3>Коментарі</h3>${t.comments.map((c) => `<div class="comment"><b>${esc(c.author)}</b><div class="text">${linkify(c.body)}</div></div>`).join("")}` : ""}
    ${logs.length ? `<h3>Журнал</h3><div class="log">${logs.map((l) => `${new Date(l.at).toLocaleTimeString("uk")}  ${linkify(l.text)}`).join("\n")}</div>` : ""}`;
  for (const btn of $("detail").querySelectorAll("[data-a]")) btn.onclick = () => post(btn.dataset.a, r.id, btn.dataset.x);
  wireOwn(r);
  if (typing && $("composer")) { $("composer").focus(); $("composer").setSelectionRange(...sel); }
  const box = $("chat");
  if (box) {
    const body = $("chat-body");
    // Stay at the end while the agent writes, unless the reader scrolled up.
    if (chatScroll === null || chatScroll.atEnd) body.scrollTop = body.scrollHeight;
    else body.scrollTop = chatScroll.top;
    body.onscroll = () => (chatScroll = { top: body.scrollTop, atEnd: body.scrollTop + body.clientHeight >= body.scrollHeight - 30 });
    box.ontoggle = async () => {
      chatOpen = box.open;
      try { localStorage.setItem("mako-chat", chatOpen ? "1" : "0"); } catch {}
      if (chatOpen) { chatScroll = null; await loadChat(); renderDetail(); }
    };
  }
  $("back").onclick = () => { selected = null; history.replaceState(null, "", location.pathname); render(); };
}

selected = decodeURIComponent(location.hash.slice(1)) || null;
// A link to a task (from a notification or the menu) opens it even when the board is already open.
window.addEventListener("hashchange", () => {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && id !== selected) select(id);
});
// On a phone: the app on the home screen, its service worker, and pushes once the user allows them.
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let phoneReady = false;
function setupPhone() {
  if (phoneReady || !data?.remote) return;
  phoneReady = true;
  document.body.classList.add("phone");
  $("settings-link").hidden = true;
  if (!standalone) {
    // iOS gives pushes only to an app added to the home screen.
    $("phone-hint").innerHTML = `<div class="banner"><div>Додайте Mako на екран «Додому»: «Поділитися» <b>⎙</b> → «На екран “Додому”». Потім відкривайте Mako зі значка: так приходять сповіщення.</div></div>`;
    return;
  }
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  navigator.serviceWorker.register("/sw.js").then(async (reg) => {
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === "granted") return send(sub);
    $("bell").hidden = false;
  });
  $("bell").onclick = async () => {
    try {
      if ((await Notification.requestPermission()) !== "granted") return alert("Сповіщення не дозволено. Увімкніть їх: Параметри → Сповіщення → Mako.");
      const reg = await navigator.serviceWorker.ready;
      const { key } = await (await fetch("/api/push/key")).json();
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlKey(key) });
      await send(sub);
      $("bell").hidden = true;
    } catch (e) {
      alert("Не вдалося увімкнути сповіщення: " + e.message);
    }
  };
}
const send = (sub) => fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
function urlKey(b64) {
  const raw = atob((b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

load().then(setupPhone);
setInterval(load, 5000);
</script>
