<script>
const COLUMNS = [["new", "Нові"], ["doing", "В роботі"], ["blocked", "Заблоковані"], ["review", "На рев'ю"], ["done", "Готово"], ["failed", "Не виконано"]];
const LABEL = { new: "нова", later: "відкладена", doing: "в роботі", review: "на рев'ю", done: "готово", failed: "не виконано",
  // the agent's own state, for tasks in Orca (ag- keeps them apart from the columns)
  "ag-working": "агент працює", "ag-waiting": "чекає на вас", "ag-done": "агент закінчив", "ag-stopped": "агент зупинився",
  "ag-idle": "агент не запущений", "ag-missing": "немає в Orca" };
const AGENT_NOTE = { waiting: "Агент чекає на вас", done: "Подивіться відповідь агента в Orca: далі — ваш хід або MR", idle: "У workspace зараз не працює жоден агент", unknown: "Orca не відповідає" };
// The list's groups folded by a click on their heading (column → folded); «Готово» and «Не виконано» start folded.
let folded = (() => { try { return { done: true, failed: true, ...JSON.parse(localStorage.getItem("mako-folded") || "{}") }; } catch { return { done: true, failed: true }; } })();
// The list's filter, shown once there are more tasks than fit at a glance.
let query = "";
const FILTER_FROM = 15;
let data = null, shown = "", selected = null, statsOpen = false, newOpen = false, project = localStorage.getItem("mako-project") || "", showArchive = false, logs = [], tab = "task";
// The last changes seen per task: a task opened again shows them at once, while the fresh ones load.
const changesOf = new Map();
// The task's work: its changed files, the files open in tabs over the terminal and their diffs.
let workOf = null, workStarted = false, changes = null, openFiles = [], fileTab = "", diffs = {}, collapsed = new Set();
// The task's MR as the code host has it ({review} or {error}), and what the last MR action said.
let review = null, mrNote = "", journalOpen = false;
// The branch's history for the commits' graph, and the commits opened in it (hash → their message and files).
let commitLog = null, commitOpen = {};
// Comments on the diff's lines, per task: a draft review until it goes to the agent, then shown on the lines
// until the agent changes them. The lines being commented ({path, rows, line, edit}) and what is written so far.
let notes = (() => { try { return JSON.parse(localStorage.getItem("mako-notes")) || {}; } catch { return {}; } })();
let pick = null, pickText = "", reviewNote = "";
// What happened while you were away ({since, until, waiting, review, failed, merged}): shown where a card goes.
let digest = null;
// The lesson Mako offers for CLAUDE.md, as you edit it before saving: { id, rule (as offered), text }.
let lessonEdit = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<>"')]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
// A task's text from the tracker: links, and its images, HTML (<img src="…">) or Markdown (![alt](url)), shown as images.
const IMG = /<img\b[^>]*?\bsrc\s*=\s*["']?(https?:\/\/[^"'\s>]+)[^>]*>|!\[([^\]]*)\]\((https?:\/\/[^\s)]+)(?:\s+"[^"]*")?\)/gi;
const richText = (s) => {
  let out = "", at = 0;
  for (const m of s.matchAll(IMG)) {
    const src = m[1] ?? m[3], alt = m[2] ?? m[0].match(/\balt\s*=\s*["']([^"']*)/i)?.[1] ?? "";
    out += linkify(s.slice(at, m.index)) + `<a href="${esc(src)}" target="_blank" rel="noopener"><img class="pic" src="${esc(src)}" alt="${esc(alt)}" loading="lazy"></a>`;
    at = m.index + m[0].length;
  }
  return out + linkify(s.slice(at));
};
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return "щойно";
  if (m < 60) return `${m} хв тому`;
  if (m < 1440) return `${Math.round(m / 60)} год тому`;
  return `${Math.round(m / 1440)} дн тому`;
};
const ICON = {
  chevron: `<svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`,
  doc: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>`,
  push: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`,
  merge: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>`,
  closeMR: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><path d="M6 9v12"/><circle cx="18" cy="18" r="3"/><path d="M18 11.5V15M21 3l-6 6M15 3l6 6"/></svg>`,
  pr: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4M13 3l-3 3 3 3"/></svg>`,
  archive: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg>`,
  unarchive: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M12 18v-6M9 15l3-3 3 3"/></svg>`,
  copy: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>`,
  folder: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
  code: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>`,
  pause: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>`,
  clock: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  play: `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>`,
  fix: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/><path d="M20 3v4M22 5h-4"/></svg>`,
  redo: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>`,
  stop: `<svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>`,
  unwatch: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"/><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13 13 0 0 1-1.7 2.7"/><path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M2 2l20 20"/></svg>`,
};
const kind = (r) => `<span class="kind ${r.type}">${r.type === "fix" ? "Баг" : "Задача"}</span>`;
const agentOf = (r) => (r.column === "doing" ? data.agents?.[r.id] : undefined);
// In Orca, the agent's own state says more than «в Orca».
const state = (r) => {
  if (r.column === "new" && r.postponed) return "later";
  const a = agentOf(r);
  return a && LABEL["ag-" + a.state] ? "ag-" + a.state : r.column;
};
const ATTENTION = { waiting: 0, done: 1, stopped: 1 };
// A small Markdown for what agents write: headings, lists, tables, code blocks, inline code, bold and links.
// Markdown images in what agents write (screenshots for the MR, Mako's own ones), shown as images.
const MD_IMG = /!\[([^\]]*)\]\((https?:\/\/[^\s)]+|\/api\/screenshots\/[^\s)]+)\)/g;
const pic = (src, alt) => `<a href="${esc(src)}" target="_blank" rel="noopener"><img class="pic" src="${esc(src)}" alt="${esc(alt)}" loading="lazy"></a>`;
function md(text) {
  const plain = (x) => linkify(x).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const inline = (x) => {
    let out = "", at = 0;
    for (const m of x.matchAll(MD_IMG)) {
      out += plain(x.slice(at, m.index)) + pic(m[2], m[1]);
      at = m.index + m[0].length;
    }
    return out + plain(x.slice(at));
  };
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const lines = text.trim().split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre class="code">${esc(code.join("\n"))}</pre>`);
      continue;
    }
    if (/^\s*\|/.test(l)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(lines[i]);
      i--;
      const body = rows.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r)).map(cells);
      const sep = rows.length > 1 && /^\s*\|?[\s:|-]+\|?\s*$/.test(rows[1]);
      const head = sep ? body.shift() : null;
      out.push(`<div class="table"><table>${head ? `<thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>` : ""}<tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const h = l.match(/^#{1,4}\s+(.*)/);
    const li = l.match(/^\s*[-*]\s+(.*)/);
    const num = l.match(/^\s*(\d+)[.)]\s+(.*)/);
    if (h) out.push(`<h4>${inline(h[1])}</h4>`);
    else if (li) out.push(`<li>${inline(li[1])}</li>`);
    else if (num) out.push(`<p class="num"><span>${num[1]}.</span> ${inline(num[2])}</p>`);
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  return out.join("").replace(/(<li>.*?<\/li>)+/g, (m) => `<ul>${m}</ul>`);
}

async function post(action, id, extra = "") {
  await fetch(`/api/${action}?id=${encodeURIComponent(id ?? "")}${extra}`, { method: "POST" });
  await load();
}
$("pause").onclick = () => fetch(`/api/pause?on=${data?.paused ? 0 : 1}`, { method: "POST" }).then(load);
$("restart").onclick = () => fetch(`/api/restart?on=${data?.restart?.pending ? 0 : 1}`, { method: "POST" }).then(load);
$("stats-btn").onclick = () => {
  selected = null; statsOpen = true; newOpen = false; digest = null;
  history.replaceState(null, "", location.pathname);
  try { localStorage.removeItem("mako-selected"); } catch {}
  render();
};
$("poll").onclick = async () => { $("poll").classList.add("busy"); await post("poll"); setTimeout(() => $("poll").classList.remove("busy"), 1500); };

async function load() {
  try {
    // seen=1: the board is on screen, so Mako knows you are back (and how long you were away).
    data = await (await fetch(`/api/state${document.visibilityState === "visible" ? "?seen=1" : ""}`)).json();
  } catch {
    $("search").textContent = "Mako не відповідає";
    $("search").className = "search err";
    return;
  }
  if (data.digest) return openDigest(data.digest);
  await Promise.all([loadCard(), loadWork()]);
  render();
}

// The digest takes the place of the open card; its links open the tasks.
function openDigest(d) {
  digest = d; selected = null; statsOpen = false; newOpen = false;
  history.replaceState(null, "", location.pathname);
  try { localStorage.removeItem("mako-selected"); } catch {}
  render();
}
async function loadDigest(since) {
  const d = await getJSON(`/api/digest?since=${encodeURIComponent(since)}`);
  if (!d.error) openDigest(d);
}

// The open card's journal and conversation, fetched side by side; a reply for a card no longer open is dropped.
async function loadCard() {
  const id = selected;
  if (!id) return;
  const [l] = await Promise.all([getJSON(`/api/log?id=${encodeURIComponent(id)}`), loadConvo()]);
  if (id === selected && Array.isArray(l)) logs = l;
}

// Claude's usage limits, the account's: how much of each window is used, when it resets in the tooltip.
const resetTime = (sec) => {
  const d = new Date(sec * 1000), today = new Date().toDateString() === d.toDateString();
  return today ? `о ${d.toLocaleTimeString("uk", { hour: "2-digit", minute: "2-digit" })}`
    : d.toLocaleString("uk", { weekday: "short", hour: "2-digit", minute: "2-digit" });
};
function limitsHTML(l) {
  const bad = data.limitPausePct || 85;
  const meter = (label, w, what) => {
    if (!w) return "";
    const pct = Math.round(w.used * 100), cls = pct >= bad ? "bad" : pct >= 60 ? "warn" : "";
    return `<span class="limit ${cls}" title="${what}: використано ${pct}%, оновиться ${resetTime(w.resetsAt)}">${label}<span class="lbar"><span style="width:${Math.min(pct, 100)}%"></span></span><b>${pct}%</b></span>`;
  };
  return meter("5 год", l?.fiveHour, "Ліміт Claude на 5 годин") + meter("Тиждень", l?.week, "Ліміт Claude на тиждень");
}

// Past the threshold the queue waits for the limit to reset; agents already working go on.
// Trackers Mako cannot search now (no internet, the VPN dropped, the service is down): which one, why in
// words, since when; the raw error under «Деталі».
// «Сховати» snoozes a tracker's alert for an hour; it comes back only if the tracker is still down then.
const SNOOZE_MS = 60 * 60 * 1000;
let downSnoozed = (() => { try { return JSON.parse(localStorage.getItem("mako-down-snoozed")) || {}; } catch { return {}; } })();
const snoozed = (id) => Date.now() - (downSnoozed[id] || 0) < SNOOZE_MS;
function snoozeDown(ids) {
  const now = Date.now();
  for (const id of Object.keys(downSnoozed)) if (now - downSnoozed[id] >= SNOOZE_MS) delete downSnoozed[id];
  for (const id of ids) downSnoozed[id] = now;
  try { localStorage.setItem("mako-down-snoozed", JSON.stringify(downSnoozed)); } catch {}
}
function downHTML(failed) {
  failed = failed.filter(([id]) => !snoozed(id));
  if (!failed.length) return "";
  const since = (iso) => iso ? ` з ${new Date(iso).toLocaleTimeString("uk", { hour: "2-digit", minute: "2-digit" })}` : "";
  return `<div class="banner down" role="alert">${failed.map(([id, s]) =>
    `<div><b>⚠ ${esc(s.down || id)}</b><span class="muted">${since(s.since)}</span>
      <button data-pause-tracker="${esc(id)}" title="Не шукати нових задач у цьому трекері, доки не продовжите; інші трекери шукаються">Пауза</button>
      <details><summary>Деталі</summary><code>${esc(s.error)}</code></details></div>`).join("")}
    <div class="muted">Нові задачі з ${failed.length > 1 ? "цих трекерів" : "цього трекера"} не з'являться, доки він недоступний; Mako перевіряє знову сам.
      <button class="ghost" id="poll-again">Перевірити зараз</button>
      <button class="ghost" id="down-hide" data-ids="${esc(failed.map(([id]) => id).join("\n"))}" title="Не показувати годину; якщо трекер і далі недоступний, сповіщення повернеться">Сховати на годину</button></div></div>`;
}

// The trackers put on pause one by one: not searched until «Продовжити»; the others are.
function pausedHTML(ts) {
  if (!ts.length) return "";
  return `<div class="banner paused">${ts.map((t) =>
    `<div><b>⏸ ${esc(t.name)}${t.host ? ` · ${esc(t.host)}` : ""}</b>: пошук нових задач на паузі
      <button data-resume-tracker="${esc(t.id)}">Продовжити</button></div>`).join("")}</div>`;
}

function limitHoldHTML(h) {
  if (!h) return "";
  const queued = data.records.filter((r) => !r.archivedAt && r.status === "queued").length;
  const working = data.records.filter((r) => !r.archivedAt && r.status === "handed-off").length;
  return `<div class="banner"><div><b>Ліміт Claude (${esc(h.window)}) використано на ${h.used}%</b> (поріг ${h.pct}%): нові задачі не стартують${queued ? ` (у черзі ${queued})` : ""}. Ліміт оновиться ${resetTime(h.resetsAt)}, і черга продовжиться сама.</div>`
    + (working ? `<div>Агенти в роботі (${working}) продовжують, але можуть зупинитися, коли ліміт закінчиться.</div>` : "") + `</div>`;
}

function visible() {
  return data.records.filter((r) => (showArchive ? r.archivedAt : !r.archivedAt) && (!project || r.task.project === project));
}

// «Оновити Mako»: a button when Mako's own main branch has new commits, «Оновлюю…» while they install.
function updateHTML(u) {
  if (!u || (!u.count && !u.state)) return "";
  const busy = ["building", "restarting", "waiting"].includes(u.state);
  // The failure in a line; what went wrong in full is in the issue filed about it.
  const failed = u.state === "failed" ? `<div class="update-error"><b>Не вдалося оновити, нічого не змінено.</b> <span class="muted">${esc(u.error || "")}</span>${u.issue ? ` <a href="${esc(u.issue)}" target="_blank" rel="noopener">Задача ↗</a>` : ""}</div>` : "";
  const button = busy ? `<span class="muted">Оновлюю…</span>` : u.count ? `<button class="primary" id="update-btn">${u.state === "failed" ? "Спробувати ще раз" : "Оновити"}</button>` : "";
  if (!button && !failed) return "";
  return `<div class="banner update"><div class="update-head"><b>Оновлення Mako</b>${button}</div>${failed}</div>`;
}

function render() {
  $("update").innerHTML = updateHTML(data.update);
  $("limit-hold").innerHTML = limitHoldHTML(data.limitHold);
  const ub = $("update-btn");
  if (ub) ub.onclick = async () => { ub.disabled = true; await fetch("/api/update", { method: "POST" }); await load(); };
  $("problems").innerHTML = data.problems?.length
    ? `<div class="banner">${data.problems.map((p) => `<div>${esc(p)}</div>`).join("")}${data.remote ? "" : `<a href="/settings">Відкрити налаштування →</a>`}</div>` : "";
  $("pause").innerHTML = data.paused ? ICON.play : ICON.pause;
  $("pause").title = $("pause").ariaLabel = data.paused ? "Пошук на паузі: продовжити" : "Пауза: не шукати нових задач";
  $("pause").classList.toggle("on", !!data.paused);
  // «Перезапустити, коли агенти закінчать хід»: Mako waits for the agents that work now, then restarts.
  const rs = data.restart || {};
  $("restart").classList.toggle("on", !!rs.pending);
  // Mako's own errors not sent for analysis yet: a dot on «Статистика», where they are listed.
  const faults = (data.faults || []).filter((f) => !f.reported).length;
  $("stats-btn").classList.toggle("fault", faults > 0);
  $("stats-btn").title = $("stats-btn").ariaLabel = faults ? `Статистика · помилки Mako: ${faults}` : "Статистика";
  $("restart").title = $("restart").ariaLabel = rs.pending ? "Скасувати перезапуск" : "Перезапустити Mako, коли агенти закінчать хід";
  $("restart-note").innerHTML = rs.pending
    ? `<span class="waiting-chip" title="${esc((rs.busy || []).join(", "))}">${rs.busy?.length ? `Перезапуск, коли агенти закінчать хід: ${rs.busy.length}` : "Перезапуск…"}</span>` : "";
  const live = data.records.filter((r) => !r.archivedAt);
  const doing = live.filter((r) => r.column === "doing").length;
  $("wip").className = "wip" + (data.wipLimit && doing >= data.wipLimit ? " full" : "");
  const waiting = live.filter((r) => agentOf(r)?.state === "waiting").length;
  // New tasks go to Orca or to Mako's own terminal.
  const where = data.executor === "terminal" ? "В роботі" : "В Orca";
  COLUMNS[1][1] = where;
  LABEL.doing = where.toLowerCase();
  $("wip").innerHTML = data.wipLimit ? `${where} <b>${doing}</b> з ${data.wipLimit}` : `${where} <b>${doing}</b>`;
  $("waiting").innerHTML = waiting ? `<span class="waiting-chip"><span class="dot"></span>чекає на вас: ${waiting}</span>` : "";
  document.title = waiting ? `(${waiting}) Mako` : "Mako";
  $("limits").innerHTML = limitsHTML(data.limits);
  const searches = Object.entries(data.searches);
  const failed = searches.filter(([, s]) => s.error);
  // Replaced only when it changes, so an open «Деталі» stays open between refreshes.
  const pausedTrackers = (data.trackers || []).filter((t) => t.paused);
  const down = (data.paused ? "" : downHTML(failed)) + pausedHTML(pausedTrackers);
  if ($("trackers-down").dataset.html !== down) {
    $("trackers-down").innerHTML = $("trackers-down").dataset.html = down;
    const pt = $("poll-again");
    if (pt) pt.onclick = () => $("poll").click();
    const dh = $("down-hide");
    if (dh) dh.onclick = () => { snoozeDown(dh.dataset.ids.split("\n")); render(); };
    for (const b of $("trackers-down").querySelectorAll("[data-pause-tracker], [data-resume-tracker]")) b.onclick = async () => {
      b.disabled = true;
      const pause = b.dataset.pauseTracker !== undefined;
      await fetch(`/api/tracker-pause?id=${encodeURIComponent(pause ? b.dataset.pauseTracker : b.dataset.resumeTracker)}&on=${pause ? 1 : 0}`, { method: "POST" });
      await load();
    };
  }
  const allPaused = data.paused || (pausedTrackers.length && pausedTrackers.length === (data.trackers || []).length);
  $("search").className = "search" + (failed.length ? " err" : "");
  $("search").textContent = failed.length
    ? `Недоступно: ${failed.map(([id]) => id).join(", ")}`
    : allPaused ? "Пошук задач на паузі"
    : searches.length ? `Перевірено ${ago(searches.map(([, s]) => s.at).sort().pop())}` : "Перша перевірка трекерів…";
  $("search").title = $("search").textContent;

  // the projects, with how many tasks are on the board
  const counts = {};
  for (const r of live) counts[r.task.project] = (counts[r.task.project] || 0) + 1;
  const projects = Object.keys(counts).sort();
  if (project && (!counts[project] || projects.length < 2)) project = "";
  const archived = data.records.filter((r) => r.archivedAt).length;
  // One line for what the list shows: all tasks, a project's, or the archive.
  // Projects are prefixed so none can pass for the archive. (No NUL here: HTML turns it into U+FFFD.)
  const scope = showArchive ? "archive" : project ? "p:" + project : "";
  // A single project would only repeat «Усі задачі».
  const options = `<option value="">Усі задачі · ${live.length}</option>` +
    (projects.length > 1 ? projects.map((p) => `<option value="p:${esc(p)}" title="${esc(p)}">${esc(p.split("/").pop())} · ${counts[p]}</option>`).join("") : "") +
    (archived ? `<option value="archive">Архів · ${archived}</option>` : "");
  if ($("scope").dataset.options !== options) { $("scope").innerHTML = options; $("scope").dataset.options = options; }
  $("scope").value = scope;
  const many = visible().length > FILTER_FROM;
  if (!many && !$("q").value) query = "";
  $("scope").hidden = projects.length < 2 && !archived;
  $("q").hidden = !many && !query;
  $("filter").hidden = $("scope").hidden && $("q").hidden;
  $("q").oninput = () => { query = $("q").value; render(); };
  $("scope").onchange = () => {
    const v = $("scope").value;
    showArchive = v === "archive";
    if (!showArchive) { project = v.replace(/^p:/, ""); try { localStorage.setItem("mako-project", project); } catch {} }
    render();
  };

  // The filter matches the title, the number ("#12", "PROJ-12") and the project.
  const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows = visible().filter((r) => {
    const hay = `${r.task.title} ${r.id} ${r.task.project}`.toLowerCase();
    return words.every((w) => hay.includes(w));
  });
  let html = "";
  for (const [col, title] of COLUMNS) {
    const rank = (r) => ATTENTION[agentOf(r)?.state] ?? 9;
    // A held-up task keeps its column for its actions, but is listed under «Заблоковані».
    const items = rows.filter((r) => (r.blocked ? "blocked" : r.column) === col).sort((a, b) => (col === "new" ? a.postponed - b.postponed : col === "doing" ? rank(a) - rank(b) : 0));
    if (!items.length) continue;
    // While filtering, every match shows: a folded group would hide what was asked for.
    const fold = !words.length && !!folded[col];
    html += `<div class="group-box"><button class="group${fold ? " folded" : ""}" data-col="${col}" aria-expanded="${!fold}">${ICON.chevron}${title}<span class="n">${items.length}</span></button>`;
    for (const r of fold ? [] : items) {
      const st = state(r);
      html += `<button class="item ${r.id === selected ? "sel" : ""} ${st === "later" ? "later" : ""}" data-id="${esc(r.id)}" title="${esc(r.task.title)}">
        <span class="t">${trackerMark(r.task)}${esc(r.task.title)}</span>
        <span class="m"><span class="s ${r.error && r.status !== "cancelled" ? "failed" : st}" title="${esc(r.error && r.status !== "cancelled" ? r.error : LABEL[st])}"></span>${kind(r)}<code>${esc(r.id)}</code>${r.blocked ? `<span class="blocked-why" title="${esc(r.blocked)}">${esc(r.blocked)}</span>` : ""}${r.agentReviews?.at(-1)?.state === "clean" ? `<span class="reviewed" title="Рев'ю агентом пройдено">✓ рев'ю</span>` : ""}<span class="ago">${ago(r.updatedAt)}</span></span></button>`;
    }
    html += `</div>`;
  }
  $("new-task").hidden = !newTaskTargets().length;
  $("list").innerHTML = html || `<div class="empty">${words.length ? "Нічого не знайдено" : showArchive ? "Архів порожній" : "Задач немає. Mako перевіряє трекери і покаже тут нові задачі, призначені на вас."}</div>`;
  for (const b of $("list").querySelectorAll(".item")) b.onclick = () => select(b.dataset.id);
  for (const b of $("list").querySelectorAll(".group")) b.onclick = () => {
    if (words.length) return;
    folded[b.dataset.col] = !folded[b.dataset.col];
    try { localStorage.setItem("mako-folded", JSON.stringify(folded)); } catch {}
    render();
  };
  renderDetail();
}

async function select(id) {
  selected = id; statsOpen = false; newOpen = false; digest = null;
  history.replaceState(null, "", "#" + encodeURIComponent(id));
  try { localStorage.setItem("mako-selected", id); } catch {}
  // The card opens at once from what the board already has; its journal and conversation follow.
  logs = [];
  render();
  await loadCard();
  if (id === selected) render();
}

const getJSON = (url) => fetch(url).then((r) => r.json()).catch((e) => ({ error: e.message }));

// The changed files (and the open file's diff) of the selected task, while its work tab is open.
// As many commits as the panel shows without scrolling: a row is 28px, the panel and the graph pad 16px.
function commitsFit() {
  const h = document.querySelector("#detail .insp-panel")?.clientHeight ?? 0;
  return h ? Math.max(1, Math.floor((h - 16) / 28)) : 10;
}

async function loadWork() {
  const r = data?.records.find((x) => x.id === selected);
  if (!r?.worktree || workOf !== r.id || (tab !== "orca" && r.executor !== "terminal")) return;
  const q = `id=${encodeURIComponent(r.id)}`, path = fileTab;
  // Each part is drawn as it comes: the changes need not wait for the code host's MR.
  const part = (url, set, empty) => url && getJSON(url).then((v) => {
    if (workOf !== r.id) return;
    set(v);
    if (empty) renderDetail();
  });
  await Promise.all([
    part(`/api/changes?${q}`, (v) => { changes = v; if (!v.error) changesOf.set(r.id, v); }, !changes),
    part(path && `/api/diff?${q}&path=${encodeURIComponent(path)}${diffWhole ? "&whole=1" : ""}`, (v) => {
      diffs[path] = v.error ? `⚠ ${v.error}` : v.diff || "";
      if (!v.error) dropChangedNotes(r.id, path, diffs[path]);
    }, !(path in diffs)),
    part(r.prUrl && `/api/review?${q}`, (v) => {
      review = v;
      // An MR ready to merge opens the side card on its tab, once per task and not over the user's own choice.
      if (!itabPicked && v.review?.state === "open" && v.review.mergeable) {
        itabPicked = true;
        if (itab !== "mr") { itab = "mr"; renderDetail(); }
      }
    }, !review),
    part(itab === "commits" && `/api/commits?${q}&n=${commitsFit()}`, (v) => { if (!v.error) commitLog = v; }, !commitLog),
  ]);
}

async function openFile(path) {
  if (!openFiles.includes(path)) openFiles.push(path);
  // A file opens as its own tab over the terminal, also when the task's tab was the one open.
  tab = "orca";
  fileTab = path;
  if (!(path in diffs)) await loadWork();
  renderDetail();
}

function closeFile(path) {
  const i = openFiles.indexOf(path);
  openFiles.splice(i, 1);
  delete diffs[path];
  if (fileTab === path) fileTab = openFiles[Math.max(0, i - 1)] ?? "";
  renderDetail();
  if (!fileTab) tv?.term.focus();
}

const DIFF_META = /^(diff --git|index |--- |\+\+\+ |new file|deleted file|similarity|rename |old mode|new mode)/;
let diffMode = (() => { try { return localStorage.getItem("mako-diff") || "unified"; } catch { return "unified"; } })();
// The whole file around its changes, or just them with 3 lines on each side.
let diffWhole = (() => { try { return localStorage.getItem("mako-diff-whole") === "1"; } catch { return false; } })();

// A unified diff as hunks of rows (context, removed, added) with their line numbers; what is not a row is a note.
function parseDiff(text) {
  const d = { notes: [], hunks: [], rows: [], numbered: false };
  let h = null, o = 1, n = 1;
  for (const l of String(text ?? "").split("\n")) {
    const m = l.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@ ?(.*)/);
    if (m) { o = +m[1]; n = +m[2]; h = { o, n, ctx: m[3], rows: [] }; d.hunks.push(h); d.numbered = true; continue; }
    if (l === "@@") { h = { rows: [] }; d.hunks.push(h); continue; } // one MultiEdit's edits apart
    if (!h && DIFF_META.test(l)) continue;
    if (l.startsWith("\\")) continue; // "\ No newline at end of file"
    const t = l[0];
    if (t !== "+" && t !== "-" && t !== " ") { if (l.trim()) d.notes.push(l); continue; }
    if (!h) { h = { rows: [] }; d.hunks.push(h); } // an edit without hunk headers: a tool card's
    const row = t === "+" ? { t, n: n++, s: l.slice(1) } : t === "-" ? { t, o: o++, s: l.slice(1) } : { t, o: o++, n: n++, s: l.slice(1) };
    row.i = d.rows.length;
    d.rows.push(row);
    h.rows.push(row);
    h.oEnd = o;
  }
  for (const hk of d.hunks) markWords(hk.rows);
  return d;
}

// A line changed in place: the words that differ stand out, the rest of it is plain.
const TOKENS = /[\p{L}\p{N}_]+|\s+|[^\p{L}\p{N}_\s]/gu;
function markWords(rows) {
  for (let i = 0; i < rows.length;) {
    if (rows[i].t !== "-") { i++; continue; }
    let j = i; while (j < rows.length && rows[j].t === "-") j++;
    let k = j; while (k < rows.length && rows[k].t === "+") k++;
    for (let p = 0; p < Math.min(j - i, k - j); p++) {
      const a = rows[i + p], b = rows[j + p], ta = a.s.match(TOKENS) ?? [], tb = b.s.match(TOKENS) ?? [];
      let pre = 0; while (pre < ta.length && pre < tb.length && ta[pre] === tb[pre]) pre++;
      let suf = 0; while (suf < ta.length - pre && suf < tb.length - pre && ta[ta.length - 1 - suf] === tb[tb.length - 1 - suf]) suf++;
      const pa = ta.slice(0, pre).join("").length, sa = ta.slice(ta.length - suf).join("").length, sb = tb.slice(tb.length - suf).join("").length;
      if (pa + sa < 0.3 * Math.max(a.s.length, b.s.length)) continue; // a different line, not an edited one
      a.mark = [pa, a.s.length - sa];
      b.mark = [pa, b.s.length - sb];
    }
    i = k;
  }
}
const codeHTML = (r) => !r ? "" : r.mark && r.mark[1] > r.mark[0]
  ? `${esc(r.s.slice(0, r.mark[0]))}<mark>${esc(r.s.slice(r.mark[0], r.mark[1]))}</mark>${esc(r.s.slice(r.mark[1]))}`
  : esc(r.s) || " ";

// The diff: line numbers, the changed words marked, unchanged lines between hunks folded; one column or side by side.
// annotate, when given, makes the line numbers pickable for comments: it says which rows are picked and what
// goes under a row ({picked: Set, after: {row: html}, end: html}).
function diffHTML(text, mode = "unified", annotate = null) {
  const d = parseDiff(text), CLS = { "+": "da", "-": "dd", " ": "" };
  const ann = d.hunks.length && d.numbered && annotate ? annotate(d) : null;
  const ln = (num, r) => `<span class="ln"${ann ? ` data-row="${r.i}"` : ""}>${num ?? ""}</span>`;
  const picked = (r) => (ann?.picked.has(r.i) ? " picked" : "");
  const after = (...rs) => (ann ? [...new Set(rs.filter(Boolean))].map((r) => ann.after[r.i] ?? "").join("") : "");
  const notes = d.notes.map((x) => `<div class="diff-note">${esc(x)}</div>`).join("");
  if (!d.hunks.length) return `<div class="diff">${notes || `<div class="diff-note">Змін немає</div>`}</div>`;
  const last = Math.max(...d.hunks.map((h) => h.oEnd ?? 0), ...d.hunks.flatMap((h) => h.rows.map((r) => r.n ?? 0)));
  const lw = d.numbered ? `${String(last).length + 1}ch` : "0px";
  let prevEnd = 1, out = "";
  for (const h of d.hunks) {
    if (d.numbered) {
      const skipped = h.o - prevEnd;
      if (skipped > 0) out += `<div class="dhunk"><span>⋯ ${skipped} ${plural(skipped, "рядок", "рядки", "рядків")} без змін</span>${h.ctx ? `<code>${esc(h.ctx)}</code>` : ""}</div>`;
      prevEnd = h.oEnd ?? h.o;
    } else if (out) out += `<div class="dhunk"><span>⋯</span></div>`;
    if (mode === "split") {
      for (let i = 0; i < h.rows.length;) {
        const r = h.rows[i];
        if (r.t === " ") { out += splitRow(r, r, false, ann) + after(r); i++; continue; }
        let j = i; while (j < h.rows.length && h.rows[j].t === "-") j++;
        let k = j; while (k < h.rows.length && h.rows[k].t === "+") k++;
        for (let p = 0; p < Math.max(j - i, k - j); p++) {
          const a = i + p < j ? h.rows[i + p] : null, b = j + p < k ? h.rows[j + p] : null;
          out += splitRow(a, b, p === 0, ann) + after(a, b);
        }
        i = k;
      }
    } else {
      h.rows.forEach((r, x) => out += `<div class="dl ${CLS[r.t]}${r.t !== " " && h.rows[x - 1]?.t !== r.t && h.rows[x - 1]?.t !== "-" ? " dstart" : ""}${picked(r)}">${ln(r.o, r)}${ln(r.n, r)}<span class="sg">${r.t.trim()}</span><span class="code">${codeHTML(r)}</span></div>` + after(r));
    }
  }
  if (ann?.end) out += ann.end;
  return `<div class="diff ${mode}${d.numbered ? "" : " bare"}"${ann ? " data-notes" : ""} style="--lw:${lw}">${notes}<div class="diff-rows">${out}</div></div>`;
}
const splitRow = (a, b, start, ann) => {
  const cell = (r, num) => {
    const cls = r ? CLS2(r) + (ann?.picked.has(r.i) ? " picked" : "") : "dx";
    return `<span class="ln ${cls}"${r && ann ? ` data-row="${r.i}"` : ""}>${r ? num(r) ?? "" : ""}</span><span class="code ${cls}">${codeHTML(r)}</span>`;
  };

const CLS2 = (r) => ({ "+": "da", "-": "dd", " ": "" })[r.t];

// Comments on lines. A comment keeps the lines it was written on ({t, o, n, s}): it is shown where the same lines

const saveNotes = () => { try { localStorage.setItem("mako-notes", JSON.stringify(notes)); } catch {} };

}

// «рядок 12», «рядки 12–15»; only removed lines are counted in the file as it was.

  const span = (a) => { const lo = Math.min(...a), hi = Math.max(...a); return lo === hi ? `${lo}` : `${lo}–${hi}`; };
  if (ns.length) return `${ns.length > 1 ? "рядки" : "рядок"} ${span(ns)}`;

}
// The draft review as one message to the agent: for each comment the file, the lines, their code and the comment.
function reviewMessage(list) {

    const fence = "`".repeat(Math.max(3, ...(code.match(/`+/g) ?? []).map((m) => m.length + 1)));

// A file's comments in its diff: the picked lines with the box to write in, the comments under their lines.

    const put = (at, html) => (at < 0 ? (ann.end += html) : (ann.after[at] = (ann.after[at] ?? "") + html));

      if (n.path !== path || n.id === pick?.edit) continue;
      const p = linesAt(d.rows, n.rows, n.line);
      if (p < 0) continue;
      put(p + n.rows.length - 1, `<div class="dnote${n.sent ? " sent" : ""}"><div class="dnote-h">
          <span class="dnote-k">${n.sent ? "Надіслано агенту" : "Чернетка"}</span><span>${linesLabel(n.rows)}</span><span class="spacer"></span>
          ${n.sent ? "" : `<button type="button" class="icon" data-note-edit="${esc(n.id)}" title="Змінити" aria-label="Змінити">✎</button>`}
          <button type="button" class="icon" data-note-del="${esc(n.id)}" title="${n.sent ? "Сховати" : "Видалити"}" aria-label="${n.sent ? "Сховати" : "Видалити"}">×</button>
        </div><div class="dnote-t">${esc(n.text)}</div></div>`);

      for (let i = 0; p >= 0 && i < pick.rows.length; i++) ann.picked.add(p + i);
      put(p < 0 ? -1 : p + pick.rows.length - 1, `<div class="dnote edit"><div class="dnote-h"><span class="dnote-k">Коментар агенту</span><span>${linesLabel(pick.rows)}</span></div>
        <textarea id="note-input" rows="3" aria-label="Коментар до рядків" placeholder="Що тут не так або що змінити"></textarea>

// The draft review under the diff: how many comments wait for the agent, and the way to send them.
function reviewBar(id) {
  const drafts = notesOf(id).filter((n) => !n.sent);

  const files = new Set(drafts.map((n) => n.path)).size;
  return `<div class="review-bar">${drafts.length ? `<span>Чернетка рев'ю: <b>${drafts.length}</b> ${plural(drafts.length, "коментар", "коментарі", "коментарів")}${files > 1 ? ` у ${files} файлах` : ""}</span>` : ""}

// An open file: its path, what it gained and lost, the view and the way to the editor, then its diff.
function diffView(r, path) {

  const cut = path.lastIndexOf("/") + 1;
  const status = f ? (f.status === "?" ? "N" : f.status) : "";
  const seg = ["unified", "split"].map((m) => `<button type="button" class="${diffMode === m ? "on" : ""}" data-dmode="${m}">${m === "unified" ? "Рядком" : "Поруч"}</button>`).join("");
  const scope = [[false, "Зміни"], [true, "Весь файл"]].map(([w, label]) => `<button type="button" class="${diffWhole === w ? "on" : ""}" data-dwhole="${w ? 1 : 0}">${label}</button>`).join("");
  return `<div class="diff-view"><div class="diff-head">
      ${status ? `<span class="st st-${esc(status)}">${status === "N" ? "+" : esc(status)}</span>` : ""}
      <span class="dpath" title="${esc(path)}"><span class="ddir">${esc(path.slice(0, cut))}</span><span class="dname">${esc(path.slice(cut))}</span></span>

      <span class="dnav"><button type="button" class="icon" data-dnav="-1" title="Попередня зміна" aria-label="Попередня зміна">↑</button><button type="button" class="icon" data-dnav="1" title="Наступна зміна" aria-label="Наступна зміна">↓</button></span>
      <span class="seg" role="group" aria-label="Скільки файла">${scope}</span>

// The changed files as a tree of folders; a folder with only one folder inside shares its row («src/app»).
function fileTree(files) {
  const root = { dirs: {}, files: [] };
  for (const f of files) {
    let n = root;
    for (const d of f.path.split("/").slice(0, -1)) n = n.dirs[d] ??= { dirs: {}, files: [] };

    let label = name, path = prefix + name, child = node.dirs[name];
    while (!child.files.length && Object.keys(child.dirs).length === 1) {
      const [only] = Object.keys(child.dirs);
      label += "/" + only; path += "/" + only; child = child.dirs[only];
    }
    const shut = collapsed.has(path);
    out += `<button class="dir" data-dir="${esc(path)}" style="--d:${depth}" title="${esc(path)}"><span class="tw">${shut ? "▸" : "▾"}</span><span class="fname">${esc(label)}</span></button>`;
    if (!shut) out += treeHTML(child, depth + 1, path + "/", ST);
  }
  for (const f of node.files.sort((a, b) => a.path.localeCompare(b.path))) {
    out += `<button class="file ${f.path === fileTab ? "on" : ""}" data-file="${esc(f.path)}" style="--d:${depth}" title="${esc(f.path)} · ${ST[f.status] ?? f.status}">
      <span class="st st-${f.status === "?" ? "N" : esc(f.status)}">${f.status === "?" ? "+" : esc(f.status)}</span>
      <span class="fname">${esc(f.path.split("/").pop())}</span>
      <span class="num">${f.additions ? `<span class="add">+${f.additions}</span>` : ""}${f.deletions ? ` <span class="del">−${f.deletions}</span>` : ""}</span></button>`;
  }

// Next to the agent: what its branch changed. A file opens as a tab over the terminal.
function workArea(r, term, taskPane = "") {
  const files = changes?.files ?? [];
  const ST = { A: "додано", M: "змінено", D: "видалено", R: "перейменовано", "?": "новий, не закомічено" };
  const list = changes?.error ? `<div class="files-empty">${esc(changes.error)}</div>`
    : !changes ? `<div class="files-empty">Читаю зміни…</div>`
    : files.length ? treeHTML(fileTree(files), 0, "", ST)
    : `<div class="files-empty">Агент ще нічого не змінив</div>`;
  const commits = changes?.commits?.length ? `<div class="files-h">Коміти<span class="n">${changes.commits.length}</span></div>` +
    changes.commits.map((c) => `<div class="commit" title="${esc(c.hash)} ${esc(c.subject)}">${esc(c.subject)}</div>`).join("") : "";

// The commits as Orca draws them: a lane per line of history, a dot per commit, merges curving into it.
const LANE_COLORS = ["#4c8dff", "#e5a23b", "#d6457a", "#c4906b", "#3fb39b", "#9b7be8", "#7aa83c"];
function graphRows(commits) {
  const lanes = [], rows = [];

    let col = lanes.indexOf(c.hash);

    const before = lanes.slice();
    const joins = before.map((h, i) => (h === c.hash && i !== col ? i : -1)).filter((i) => i >= 0);
    for (const i of joins) lanes[i] = null;
    lanes[col] = c.parents[0] ?? null;
    const forks = [];
    for (const p of c.parents.slice(1)) {
      let i = lanes.indexOf(p);
      if (i < 0) { i = lanes.indexOf(null); if (i < 0) i = lanes.length; lanes[i] = p; }
      forks.push(i);
    }

    rows.push({ col, fresh, before, after: lanes.slice(), joins, forks });
  }
  return rows;
}
function commitGraph(commits) {
  if (!commits.length) return `<div class="files-empty">Комітів ще немає</div>`;
  const rows = graphRows(commits), H = 28, W = 14, R = 6;
  const width = Math.max(...rows.map((r) => Math.max(r.before.length, r.after.length, r.col + 1))) * W + 6;
  const x = (i) => R + i * W, color = (i) => LANE_COLORS[i % LANE_COLORS.length];
  const line = (x1, y1, x2, y2, c) => x1 === x2 ? `<path d="M${x1} ${y1}V${y2}" stroke="${c}"/>`
    : `<path d="M${x1} ${y1}C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2}" stroke="${c}"/>`;
  return `<div class="cg">${commits.map((c, n) => {
    const r = rows[n];
    let svg = "";
    r.before.forEach((h, i) => {
      if (h === null || i === r.col || r.joins.includes(i)) return;
      svg += line(x(i), 0, x(i), H, color(i));
    });
    if (!r.fresh) svg += line(x(r.col), 0, x(r.col), H / 2, color(r.col));
    for (const i of r.joins) svg += line(x(i), 0, x(r.col), H / 2, color(i));
    if (r.after[r.col] != null) svg += line(x(r.col), H / 2, x(r.col), H, color(r.col));
    for (const i of r.forks) svg += line(x(r.col), H / 2, x(i), H, color(i));
    svg += c.parents.length > 1
      ? `<circle cx="${x(r.col)}" cy="${H / 2}" r="4.5" fill="var(--card)" stroke="${color(r.col)}" stroke-width="2.2"/>`
      : `<circle cx="${x(r.col)}" cy="${H / 2}" r="3.5" fill="${color(r.col)}"/>`;
    const refs = (c.refs ?? []).map((ref) => {
      const head = ref.startsWith("HEAD -> "), name = ref.replace(/^HEAD -> /, "").replace(/^tag: /, "");
      return `<span class="cg-ref ${head ? "head" : ref.startsWith("origin/") ? "remote" : ref.startsWith("tag: ") ? "tag" : ""}" title="${esc(ref)}">${esc(name)}</span>`;
    });
    const open = commitOpen[c.hash];
    const when = new Date(c.at * 1000).toLocaleString("uk", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<div class="cg-row ${c.mine ? "mine" : ""}" title="${esc(c.hash.slice(0, 8))} · ${esc(c.author)} · ${esc(when)}">
        <svg class="cg-lanes" width="${width}" height="${H}" fill="none" stroke-width="1.6" aria-hidden="true">${svg}</svg>
        <button type="button" class="cg-toggle" data-commit="${esc(c.hash)}" aria-label="${open ? "Згорнути" : "Розгорнути"} коміт">${open ? "▾" : "›"}</button>
        <span class="cg-subj">${esc(c.subject)}</span>${refs.slice(0, 2).join("")}${refs.length > 2 ? `<span class="cg-ref more">+${refs.length - 2}</span>` : ""}</div>
      ${open ? `<div class="cg-detail" style="margin-left:${width + 18}px">${open === "loading" ? "Читаю…" : open.error ? esc(open.error)
        : `<div class="cg-msg">${esc(open.message.trim())}</div>${open.files.map((f) => `<div class="cg-file"><b class="st-${f.status === "?" ? "N" : esc(f.status)}">${esc(f.status)}</b><span>${esc(f.path)}</span>${f.additions ? `<span class="add">+${f.additions}</span>` : ""}${f.deletions ? `<span class="del">−${f.deletions}</span>` : ""}</div>`).join("")}`}</div>` : ""}`;
  }).join("")}</div>`;
}

// CI running: a spinning arc, not the «⟳» glyph, which fonts draw small and off-centre in the badge.
const IBADGE_SPIN = `<svg class="spin" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" role="img" aria-label="CI виконується"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>`;

// The right panel's tabs: the changes, the commits, the MR with its CI; the card keeps its size, the tab scrolls.
let itab = "changes", itabPicked = false;
function inspectorTabs(r, term, nFiles, list) {
  const c = review?.review, cs = changes?.commits ?? [];
  const mrBadge = !r.prUrl ? ["—", ""] : r.reviewState === "merged" || c?.state === "merged" ? ["✓", "merged"]
    : !c ? ["", ""] : c.ci === "failed" || c.conflicts ? ["!", "bad"] : c.threads.length ? [String(c.threads.length), "warn"]
    : ["running", "pending", "created"].includes(c.ci) ? ["⟳", "run"] : c.mergeable ? ["✓", "ok"] : ["", ""];
  const nCommits = commitLog ? `${commitLog.commits.length}${commitLog.more ? "+" : ""}` : String(cs.length);
  const tabs = [["changes", "Зміни", [String(nFiles), ""]], ["commits", "Коміти", [nCommits, ""]], ["mr", "MR", mrBadge]];
  const panel = itab === "commits" ? (commitLog ? commitGraph(commitLog.commits) : `<div class="files-empty">Читаю історію…</div>`)
    : itab === "mr" ? mrCard(r, term)
    : `${changes?.base ? `<div class="files-sub">від ${esc(changes.base)}</div>` : ""}${list}`;
  return `<div class="insp-card"><div class="itabs" role="tablist">${tabs.map(([k, label, [badge, cls]]) =>
      `<button type="button" role="tab" class="itab ${itab === k ? "on" : ""}" data-itab="${k}">${label}${badge ? `<span class="ibadge ${cls}">${cls === "run" ? IBADGE_SPIN : esc(badge)}</span>` : ""}</button>`).join("")}</div>
    <div class="insp-panel">${panel}</div></div>`;
}

// The MR: its CI, review threads and conflicts, each with what fixes it; then «Оновити MR» and «Змерджити».
const MR_ICON = {
  bad: `<svg class="mi bad" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>`,
  ok: `<svg class="mi ok" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>`,
  run: `<svg class="mi run" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  idle: `<svg class="mi idle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>`,
  talk: `<svg class="mi talk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>`,
};
const CI = { failed: ["bad", "CI впав"], running: ["run", "CI іде"], pending: ["run", "CI чекає"], created: ["run", "CI чекає"],
  preparing: ["run", "CI чекає"], waiting_for_resource: ["run", "CI чекає"], scheduled: ["run", "CI заплановано"], success: ["ok", "CI пройшов"],
  canceled: ["idle", "CI скасовано"], skipped: ["idle", "CI пропущено"], manual: ["idle", "CI чекає ручного запуску"] };
const plural = (n, one, few, many) => (n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
// One line of a card: a status icon, what it is (a link when it has one), and the button that fixes it.
const row = (icon, text, href, btn = "") => `<div class="mr-row">${MR_ICON[icon]}${href
  ? `<a href="${esc(href)}" target="_blank" rel="noopener" title="${esc(text)}">${esc(text)}</a>` : `<span title="${esc(text)}">${esc(text)}</span>`}${btn}</div>`;
// ✨: the agent in the terminal does it; only while it runs.
const fixBtn = (live, kind, label) => live ? `<button type="button" class="fix-btn" data-ask="${kind}" title="${label}" aria-label="${label}">${ICON.fix}</button>` : "";
const commits = (n) => `${n} ${plural(n, "коміт", "коміти", "комітів")}`;

// The branch: against its base and its remote, uncommitted work; copy its name, open it in Finder or the editor.
// Until git answers it holds its place, the name from the task, so the panel does not jump when the state comes.
function branchCard(r, term) {
  const b = changes ? changes.branch : { name: r.branch || r.branchName || "", loading: true };
  if (!b) return "";
  const live = term && r.live;
  let rows = "";
  if (b.loading) rows = `<div class="mr-row"><span style="color:var(--mute)">Перевіряю гілку…</span></div><div class="mr-row"></div>`;
  else {
    rows = b.behind ? row("idle", `Позаду ${b.base} на ${commits(b.behind)}`, "", fixBtn(live, "rebase", `Агент оновить гілку з ${b.base}`))
      : row("ok", `Актуальна з ${b.base}`);
    if (b.unpushed) rows += row("run", `${commits(b.unpushed)} не запушено`, "", fixBtn(live, "push", "Агент запушить гілку"));
    else if (b.pushed) rows += row("ok", "Усе запушено");
    if (b.dirty) rows += row("idle", `${b.dirty} ${plural(b.dirty, "файл", "файли", "файлів")} не закомічено`);
  }
  return `<div class="mr-card"><div class="mr-h"><span class="files-h-t">Гілка</span>
      <code class="branch-name" title="${esc(b.name)}">${esc(b.name)}</code>
      ${b.name ? `<button type="button" class="icon" data-copy="${esc(b.name)}" title="Скопіювати назву гілки" aria-label="Скопіювати назву гілки">${ICON.copy}</button>` : ""}
      <button type="button" class="icon" data-open="finder" title="Показати у Finder" aria-label="Показати у Finder">${ICON.folder}</button>
      ${data.editor ? `<button type="button" class="icon" data-open="editor" title="Відкрити в ${esc(data.editor)}" aria-label="Відкрити в ${esc(data.editor)}">${ICON.code}</button>` : ""}
    </div>${rows}</div>`;
}

// The pipeline as GitLab draws it: a line per stage, its jobs with their state.
const JOB = { success: ["ok", "✓"], failed: ["bad", "✗"], running: ["run", "⟳"], pending: ["wait", "◷"], created: ["wait", "◷"],
  preparing: ["wait", "◷"], waiting_for_resource: ["wait", "◷"], scheduled: ["wait", "◷"], manual: ["idle", "▶"], canceled: ["idle", "⊘"], skipped: ["idle", "⊘"] };
function stagesHTML(jobs) {
  if (!jobs?.length) return "";
  const stages = [];
  for (const j of jobs) {
    let st = stages.find((x) => x.name === (j.stage || ""));
    if (!st) stages.push((st = { name: j.stage || "", jobs: [] }));
    st.jobs.push(j);
  }
  return `<div class="stages">${stages.map((st) => `<div class="stage">${st.name ? `<span class="stage-name">${esc(st.name)}</span>` : ""}${st.jobs.map((j) => {
    const allowed = j.status === "failed" && j.allowFailure;
    const [cls, mark] = allowed ? ["warn", "!"] : JOB[j.status] ?? ["idle", "•"];
    return `<a class="job ${cls}" href="${esc(j.url)}" target="_blank" rel="noopener" title="${esc(j.name)}: ${esc(j.status)}${allowed ? " (дозволено падати)" : ""}"><span class="jm">${mark}</span>${esc(j.name)}</a>`;
  }).join("")}</div>`).join("")}</div>`;
}

function mrCard(r, term) {
  const live = term && r.live, c = review?.review;
  const num = r.prUrl?.match(/\/(?:merge_requests|pull)\/(\d+)/)?.[1];
  const state = c?.state ?? (r.reviewState || (r.prUrl ? "open" : ""));
  const fix = (kind, label) => fixBtn(live, kind, label);
  let rows = "";
  if (!r.prUrl) rows = `<div class="muted mr-none">Ще немає: агент відкриє MR, коли закінчить</div>`;
  else if (review?.error) rows = `<div class="mr-none mr-err">${esc(review.error)}</div>`;
  else if (!c) rows = `<div class="muted mr-none">Перевіряю MR…</div>`;
  else if (c.state === "open") {
    if (c.ci) {
      const [icon, text] = CI[c.ci] ?? ["run", `CI: ${c.ci}`];
      rows += row(icon, c.ci === "failed" && c.failed.length ? `${text}: ${c.failed.map((j) => j.name).join(", ")}` : text, c.ciUrl,
        c.ci === "failed" && c.failed.length ? fix("ci", "Агент полагодить CI у терміналі") : "") + stagesHTML(c.jobs);
    }
    if (c.threads.length) {
      const n = c.threads.length;
      rows += row("talk", `${n} ${plural(n, "коментар", "коментарі", "коментарів")} рев'ю`, c.threads[0].url, fix("comments", "Агент виправить коментарі у терміналі"));
    }
    rows += c.conflicts ? row("bad", "Конфлікти з основною гілкою", "", fix("conflicts", "Агент розвʼяже конфлікти у терміналі")) : row("ok", "Без конфліктів");
  }
  rows += reviewerRow(r);
  // The MR's own actions sit in its header, as icons: open it, update it, merge it.
  const icon = (attr, label, name, cls = "", disabled = false) =>
    `<button type="button" class="icon ${cls}" ${attr} title="${esc(label)}" aria-label="${esc(label)}" ${disabled ? "disabled" : ""}>${ICON[name]}</button>`;
  const open = live && !r.prUrl ? icon(`data-ask="open"`, "Відкрити MR: агент закомітить, запушить і відкриє його", "pr") : "";
  const update = live && r.prUrl && state === "open" ? icon(`data-ask="push"`, "Оновити MR: агент закомітить і запушить зроблене", "push") : "";
  const merge = c?.state === "open" ? icon("data-merge", c.mergeable ? "Змерджити MR в основну гілку" : `Змерджити ще не можна: ${c.blocked || "GitLab не дозволяє"}`,
    "merge", c.mergeable ? "ready" : "", !c.mergeable) : "";
  const close = c?.state === "open" ? icon("data-close-mr", "Закрити MR без злиття", "closeMR", "danger") : "";
  return `<div class="mr-card"><div class="mr-h"><span class="files-h-t">MR</span>
      ${r.prUrl ? `<a href="${esc(r.prUrl)}" target="_blank" rel="noopener">${num ? (r.prUrl.includes("/pull/") ? "#" : "!") + num : "відкрити"}</a>` : ""}
      <span class="muted">${{ open: "відкритий", merged: "змерджено", closed: "закрито" }[state] ?? ""}</span>
      <span class="spacer"></span>${open}${update}${close}${merge}</div>
    ${rows}${mrNote ? `<div class="mr-note">${esc(mrNote)}</div>` : ""}</div>`;
}

// The reviewer agent's rounds over the branch: the last one as a line of the MR card, all of them in the task.
const REVIEW_STATE = { running: ["run", "Рецензент-агент переглядає гілку…"], notes: ["talk", "Зауваження рецензента-агента передано агенту"],
  clean: ["ok", "Рев'ю агентом пройдено"], failed: ["bad", "Рев'ю агентом не вдалось"] };
function reviewerRow(r) {
  const last = r.agentReviews?.at(-1);
  if (!last) return "";
  const [icon, text] = REVIEW_STATE[last.state] ?? ["idle", last.state];
  const n = r.agentReviews.filter((a) => a.state === "notes" || a.state === "clean").length;
  return row(icon, n > 1 ? `${text} · раунд ${n}` : text, "");
}
// The agent's summary, a section per heading: what was done, how it was checked (green), what to look at (amber).
function summaryHTML(text) {
  const parts = md(text).split(/(?=<h4>)/).filter((p) => p.trim());
  return parts.map((p) => {
    const h = p.match(/^<h4>(.*?)<\/h4>/)?.[1] || "";
    const plain = h.replace(/<[^>]+>/g, "").toLowerCase();
    const [cls, ic] = /уваг|ризик|risk|worth|attention|відкрит/.test(plain) ? ["warn", "!"] : /перевір|check|test|тест/.test(plain) ? ["check", "✓"] : ["done", "✎"];
    return `<div class="sec ${h ? cls : ""}">${h ? `<h4><span class="ic">${ic}</span>${h}</h4>` : ""}${p.replace(/^<h4>.*?<\/h4>/, "")}</div>`;
  }).join("");
}
// «PR #80», «MR !12»: what a link to a merge request is called on the card.
const mrName = (url) => { const m = url.match(/\/pull\/(\d+)/) || url.match(/merge_requests\/(\d+)/); return m ? (url.includes("/pull/") ? `PR #${m[1]}` : `MR !${m[1]}`) : "MR"; };
// The last folders of a long path: the whole one is in the tooltip and is what gets copied.
const shortPath = (p) => { const s = p.split("/").filter(Boolean); return s.length > 3 ? "…/" + s.slice(-3).join("/") : p; };
const initials = (name) => name.split(/[\s._-]+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("") || "?";
function reviewerHTML(r) {
  if (!r.agentReviews?.length) return "";
  return `<h3>Рев'ю агентом</h3>` + r.agentReviews.map((a, i) => {
    const [, text] = REVIEW_STATE[a.state] ?? ["", a.state];
    return `<div class="agent-review ${esc(a.state)}"><div class="muted">Раунд ${i + 1} · ${new Date(a.at).toLocaleString("uk")} · <code>${esc(a.commit.slice(0, 8))}</code> · ${esc(text)}</div>
      ${a.notes ? `<div class="summary">${md(a.notes)}</div>` : ""}${a.error ? `<div class="mr-err">${esc(a.error)}</div>` : ""}</div>`;
  }).join("");
}

// The agent's rating of a finished task: four scores from 1 to 5 with why, and what the description lacked.
const ASSESS = [["clarity", "Опис задачі", "up"], ["complexity", "Складність", ""], ["completeness", "Виконано задачі", "up"], ["risk", "Ризик змін", "down"]];
function assessmentHTML(r, card) {
  if (r.status !== "done") return "";
  const a = r.assessment;
  const btn = (label) => `<button class="ghost" data-a="assess" title="Агент оцінить опис задачі, складність, повноту й ризик змін">${label}</button>`;
  if (!a) return card("Оцінка агента", `<div class="tcard-b muted">Ще не оцінено.</div>`, "", btn("Оцінити"));
  if (a.state === "running") return card("Оцінка агента", `<div class="tcard-b muted">Агент оцінює задачу…</div>`);
  if (a.state === "failed") return card("Оцінка агента", `<div class="tcard-b mr-err">${esc(a.error || "Не вдалось оцінити")}</div>`, "", btn("Спробувати ще"));
  const rows = ASSESS.map(([k, label, way]) => {
    const s = a[k] || {}, v = s.value || 0;
    const tone = !way ? "" : (way === "up" ? v : 6 - v) >= 4 ? "good" : (way === "up" ? v : 6 - v) <= 2 ? "bad" : "mid";
    const pips = [1, 2, 3, 4, 5].map((i) => `<i class="${i <= v ? "on" : ""}"></i>`).join("");
    return `<div class="score ${tone}"><span class="k">${label}</span><span class="pips" title="${v} з 5">${pips}</span><b>${v}/5</b>${s.why ? `<span class="score-why">${esc(s.why)}</span>` : ""}</div>`;
  }).join("");
  const missing = a.missing?.trim() ? `<div class="sec warn"><h4><span class="ic">!</span>Чого бракувало в описі</h4>${md(a.missing)}</div>` : "";
  return card("Оцінка агента", `<div class="tcard-b scores">${rows}</div>${missing}`, "assess", btn("Оцінити ще раз"));
}

// The rule Mako drew from your correction of the agent: saved, it goes into the repo's CLAUDE.md for the next agents.
function lessonHTML(r) {
  const base = changes?.branch?.base;
  return `<div class="notice lesson"><div class="lesson-h">💡 Урок для CLAUDE.md, щоб наступні агенти цього не повторювали</div>
    <input type="text" id="lesson-input" value="${esc(r.lesson.rule)}" aria-label="Правило для CLAUDE.md" title="З вашого повідомлення: ${esc(r.lesson.from)}">
    <div class="lesson-a"><button type="button" class="primary" data-lesson="branch" title="Окремий коміт у гілці задачі: піде в MR">Зберегти в гілку задачі</button>
      <button type="button" data-lesson="base" title="Окремий коміт, одразу запушений в ${esc(base || "основну гілку")}">Зберегти в ${base ? `<code>${esc(base)}</code>` : "основну гілку"}</button>
      <button type="button" class="ghost" data-lesson="no">Ні</button></div></div>`;
}

// A short note at the bottom of the window that a click did something; it outlives the re-render of the card.
let toastTimer = 0;
function toast(text, bad = false) {
  let el = $("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.setAttribute("role", "status");
    el.setAttribute("aria-live", "polite");
    document.body.append(el);
  }
  el.textContent = text;
  el.classList.toggle("bad", bad);
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// The card's buttons: a request to the agent, or the merge.
async function mrAction(id, action, kind = "") {
  const res = await fetch(`/api/${action}?id=${encodeURIComponent(id)}${kind ? `&kind=${kind}` : ""}`, { method: "POST" }).then((r) => r.json()).catch((e) => ({ error: e.message }));
  mrNote = res.ok === false || res.error ? `⚠ ${res.error}` : { merge: "MR змерджено", close: "MR закрито без злиття" }[action] ?? "Передано агенту";
  if (action === "ask") toast(res.ok === false || res.error ? mrNote : "✨ Передано агенту", res.ok === false || !!res.error);
  await loadWork();
  renderDetail();
  if (action === "ask" && !res.error) tv?.term.focus();
}

// «Повторити інакше»: the note and the model go to Mako, which drops the attempt and starts the task over.
function openRedo(r) {
  const dlg = $("redo"), note = $("redo-note"), model = $("redo-model");
  dlg.dataset.id = r.id;
  note.value = "";
  model.value = r.model || "";
  dlg.showModal();
  note.focus();
}
$("redo-note").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("redo-form").requestSubmit($("redo-form").querySelector('[value="go"]')); }
});
$("redo").addEventListener("close", async () => {
  const dlg = $("redo");
  if (dlg.returnValue !== "go") return;
  dlg.returnValue = "";
  const id = dlg.dataset.id, body = JSON.stringify({ note: $("redo-note").value, model: $("redo-model").value });
  const res = await fetch(`/api/redo?id=${encodeURIComponent(id)}`, { method: "POST", body }).then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
  toast(res.ok === false ? `⚠ ${res.error}` : "Mako прибирає минулу спробу і почне задачу знову", res.ok === false);
  await load();
});

// «Відкласти»: one button, the times in its menu; the task shows how long it is put off and comes back with a
// notification.
function laterAt(kind) {
  const d = new Date();
  if (kind === "hour") return new Date(d.getTime() + 3600e3);
  d.setHours(9, 0, 0, 0);
  if (kind === "monday") d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));
  else d.setDate(d.getDate() + 1);
  return d;
}
function laterMenu() {
  const item = (kind, label) => {
    const min = Math.max(1, Math.round((laterAt(kind) - Date.now()) / 60000));
    return `<button type="button" data-a="later" data-x="&min=${min}">${label}</button>`;
  };
  const monday = new Date().getDay() === 1 ? "До наступного понеділка, 9:00" : "До понеділка, 9:00";
  return `<details class="menu"><summary class="btn">${ICON.clock}Відкласти</summary>
    <div class="menu-pop">${item("hour", "На годину")}${item("tomorrow", "До завтра, 9:00")}${item("monday", monday)}</div></details>`;
}
const untilText = (ms) => {
  const d = new Date(ms), t = d.toLocaleTimeString("uk", { hour: "2-digit", minute: "2-digit" });
  const days = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 864e5);
  return days === 0 ? `до ${t}` : days === 1 ? `до завтра, ${t}` : `до ${d.toLocaleDateString("uk", { weekday: "long" })}, ${t}`;
};

function agentBlock(r) {
  const a = agentOf(r);
  if (!a) return "";
  const since = a.since ? ` · ${ago(new Date(a.since).toISOString()).replace(" тому", "")}` : "";
  const name = { claude: "Claude Code", codex: "Codex", cursor: "Cursor", opencode: "OpenCode", gemini: "Gemini" }[a.name] ?? a.name ?? "";
  const note = a.state === "waiting" ? `${AGENT_NOTE.waiting}${a.reason ? `: ${esc(a.reason)}` : ""}`
    : a.state === "stopped" ? `Агент зупинився${a.reason ? `: ${esc(a.reason)}` : ""}`
    : a.state === "working" && a.tool ? esc(a.tool) : AGENT_NOTE[a.state] ?? "";
  return `<div class="agent ${a.state}">
    <div class="agent-head"><span class="s ag-${a.state}">${LABEL["ag-" + a.state] ?? "агент"}${since}</span>${name ? `<span class="muted">${esc(name)}</span>` : ""}
      ${note ? `<span class="agent-note">${note}</span>` : ""}</div>
    ${a.screen?.length ? `<pre class="screen">${a.screen.map(esc).join("\n")}</pre>` : ""}
    ${a.message ? `<div class="agent-msg"><div class="agent-msg-h">Останнє повідомлення агента</div>${md(a.message)}</div>` : ""}
    ${a.error ? `<div class="agent-err">${esc(a.error)}</div>` : ""}
  </div>${r.worktree ? `<details class="convo" ${convoOpen ? "open" : ""}><summary>Уся розмова з агентом${convo.id === r.id && convo.turns.length ? ` · ${convo.turns.filter((x) => x.role !== "tool").length}` : ""}</summary>
    <div class="convo-body">${convo.id === r.id ? convoHTML(convo.turns) : `<div class="muted">Читаю…</div>`}</div></details>` : ""}`;
}

// A task in Orca: its agent's whole Claude Code session, read from the transcript while it is open.
let convoScroll = null;
let convoOpen = (() => { try { return localStorage.getItem("mako-chat") === "1"; } catch { return false; } })(), convo = { id: null, turns: [] };
async function loadConvo() {
  const id = selected, r = data?.records.find((x) => x.id === id);
  if (!convoOpen || !r?.worktree || r.executor === "terminal") return;
  const c = await getJSON(`/api/conversation?id=${encodeURIComponent(id)}`);
  if (id === selected && c.turns) convo = { id, turns: c.turns };
}
function convoHTML(turns) {
  if (!turns.length) return `<div class="muted">Розмови не знайдено: агент працює не в Claude Code або ще нічого не написав.</div>`;
  const out = [];
  for (let i = 0; i < turns.length; i++) {
    const t = turns[i];
    if (t.role === "tool") {
      const group = [];
      for (; i < turns.length && turns[i].role === "tool"; i++) group.push(turns[i].text);
      i--;
      const shown = group.slice(-4);
      out.push(`<div class="convo-tools">${group.length > shown.length ? `<div>… ще ${group.length - shown.length}</div>` : ""}${shown.map((x) => `<div>${esc(x)}</div>`).join("")}</div>`);
    } else if (t.role === "user") {
      out.push(`<div class="msg me"><div class="bubble">${t.text.length > 500 ? `<details><summary>${esc(t.text.slice(0, 300))}…</summary>${linkify(t.text)}</details>` : linkify(t.text)}</div></div>`);
    } else out.push(`<div class="msg"><div class="md">${md(t.text)}</div></div>`);
  }
  return out.join("");
}

// The tracker a task came from, by name: "GitHub"; with its host when two trackers share the name
// ("GitLab · git.example.com"); "трекера" when the tracker is gone from the settings.
function trackerName(task) {
  const all = data?.trackers || [], tr = all.find((x) => x.id === task.trackerId);
  if (!tr) return "трекера";
  return tr.host && all.filter((x) => x.name === tr.name).length > 1 ? `${tr.name} · ${tr.host}` : tr.name;
}

// The tracker's logo at the start of a task's id row, before its kind: which tracker the task came from, at a glance.

const trackerSvg = (task) => TRACKER_ICON[(data?.trackers || []).find((x) => x.id === task.trackerId)?.name];
function trackerIcon(task) {
  const svg = trackerSvg(task);
  return svg ? `<a class="tracker-logo" href="${esc(task.url)}" target="_blank" rel="noopener" title="Відкрити в ${esc(trackerName(task))}" aria-label="Відкрити в ${esc(trackerName(task))}">${svg}</a>` : "";
}
// The same logo before a sidebar row's title: the row is a button already, so it is a mark, not a link.
function trackerMark(task) {
  const svg = trackerSvg(task);
  return svg ? `<span class="tracker-mark" title="${esc(trackerName(task))}">${svg}</span>` : "";
}

// «+ Задача»: where a task can be written — a tracker that opens issues and its projects.
function newTaskTargets() {
  return (data?.trackers || []).flatMap((t) => (t.projects || []).map((p) => ({ tracker: t.id, name: t.name, project: p })));
}

const openNewTask = () => {

function showNewTask() {
  const targets = newTaskTargets(), several = new Set(targets.map((x) => x.tracker)).size > 1;
  // The project the list is filtered by comes first.
  const first = Math.max(0, targets.findIndex((x) => x.project === project));
  const options = targets.map((x, i) => `<option value="${i}" ${i === first ? "selected" : ""}>${esc(x.project)}${several ? ` · ${esc(x.name)} (${esc(x.tracker)})` : ""}</option>`).join("");
  $("detail").innerHTML = `<button class="ghost back" id="back">← Задачі</button>
    <form class="new-form nt-form" id="new-form">
      <div class="nt-head">
        <h1>Нова задача</h1>
        <p>З'явиться в трекері, призначена на вас, і одразу на дошці.</p>
      </div>
      <div class="nt-card">
        <label>Назва<input id="nt-title" required maxlength="250" autocomplete="off" placeholder="Коротко: що треба зробити"></label>
        <label>Опис<textarea id="nt-desc" rows="10" placeholder="Що саме, навіщо і як перевірити."></textarea>
          <span class="nt-hint">Markdown · скриншот можна вставити з буфера (⌘V)</span></label>
        <div class="nt-row">
          <label>Проєкт<select id="nt-project">${options}</select></label>
          <div class="nt-field"><span>Тип</span><div class="seg nt-type" role="radiogroup" aria-label="Тип">
            <label><input type="radio" name="nt-type" value="task" checked>Задача</label>
            <label><input type="radio" name="nt-type" value="bug">Баг</label>
          </div></div>
        </div>
        <div class="nt-error" id="nt-error" hidden></div>
      </div>
      <div class="nt-foot">
        <label class="check"><input type="checkbox" id="nt-take"> Одразу взяти в роботу</label>
        <div class="nt-actions"><button type="button" id="nt-cancel">Скасувати</button><button type="submit" class="primary" id="nt-submit">Створити</button></div>
      </div>
    </form>`;
  const close = () => { newOpen = false; render(); };
  $("back").onclick = $("nt-cancel").onclick = close;
  const target = () => targets[+$("nt-project").value];
  const fail = (msg) => { $("nt-error").textContent = msg; $("nt-error").hidden = !msg; };
  let uploading = 0;
  $("nt-desc").onpaste = (e) => {
    const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
    if (!files.length) return;
    e.preventDefault();
    for (const f of files) uploadImage($("nt-desc"), target(), f, (n) => { uploading += n; $("nt-submit").disabled = uploading > 0; }, fail);
  };
  $("new-form").onsubmit = async (e) => {
    e.preventDefault();
    const t = target();
    if (!t) return fail("Немає проєкту, куди записати задачу");
    fail("");
    $("nt-submit").disabled = true; $("nt-submit").textContent = "Створюю…";
    const body = { tracker: t.tracker, project: t.project, title: $("nt-title").value, description: $("nt-desc").value, type: document.querySelector('input[name="nt-type"]:checked').value, take: $("nt-take").checked };
    const res = await fetch("/api/create", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then((r) => r.json()).catch((err) => ({ error: err.message }));
    if (!res.ok) {
      $("nt-submit").disabled = false; $("nt-submit").textContent = "Створити";
      return fail(res.error || "Не вдалося створити задачу");
    }
    newOpen = false;
    await load();
    select(res.id);
  };
}
