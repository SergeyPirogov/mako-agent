    if (v) return sentFromAsk(id, id.startsWith("chat-") ? "the chat" : `task ${id}`);
    close(); stopQuestion();
    if (id.startsWith("chat-")) openFreeChat(id); else select(id);
  };
  draw("");
  dlg.onclose = () => { box.innerHTML = ""; };
  dlg.showModal();
}
// The new-task form over the chat with the plan in the description: its agent does not plan again.
function openPlanTask(draft) {
  const dlg = $("ca-ticket-dlg"), box = $("ca-ticket-form");
  const close = () => { dlg.close(); box.innerHTML = ""; };
  taskForm(box, { draft, onCancel: close, onCreated: async (res) => { close(); await load(); stopQuestion(); select(res.id); } });
  dlg.onclose = () => { box.innerHTML = ""; };
  dlg.showModal();
  $("nt-title").focus();
}

async function pollCode() {
  const v = code;
  if (!v) return;
  if (!v.el.isConnected) { stopQuestion(); return; }
  const s = await getJSON(`/api/chat?id=${encodeURIComponent(v.thread)}&v=${v.version}`);
  if (v !== code || s.same || s.error) return;
  const ended = v.snap?.state === "working" && s.state !== "working";
  v.snap = s; v.version = s.version;
  renderCode();
  if (ended) loadFreeChats();
}

function renderCode() {
  const v = code, s = v?.snap;
  if (!v || !v.list.isConnected) return;
  const atEnd = v.list.scrollHeight - v.list.scrollTop - v.list.clientHeight < 60;
  const items = s?.items ?? [];
  v.drafts = {}; v.plans = {};
  v.ticket = freeChats.find((c) => c.id === v.thread)?.ticket ?? "";
  const toChat = v.ticket.startsWith("chat-");
  const done = v.ticket ? `<div class="ca-done"><span>✓ Chat is done: ${toChat ? "the plan was sent to chat" : "task"} <b>${esc(v.ticket)}</b>${toChat ? "" : " was created"}. You can still ask more here.</span><span class="spacer"></span>
    <button type="button" data-open-ticket>${toChat ? "Open chat" : "Open task"}</button><button type="button" data-ca-delete>Delete question</button></div>` : "";
  v.list.innerHTML = `<div class="chat-col">${done}${chatTurns(s, { id: v.thread, flip: v.flip, code: true, drafts: v.drafts, plans: v.plans, snap: s, ticket: v.ticket }) ||
      `<div class="files-empty">Loading the conversation…</div>`}
    ${s?.state === "working" ? `<div class="chat-working"><span class="pulse"></span>Searching the code…</div>` : ""}</div>`;
  linkSources(v.list);
  if (atEnd || v.version <= 1) v.list.scrollTop = v.list.scrollHeight;
  v.el.querySelector(".chat-stop").hidden = s?.state !== "working";
  $("ca-task").hidden = !items.some((it) => it.kind === "text");
}

// file:line in the agent's answers (path:12 or path:12-20): links that open the file beside the chat.
const SRC = /((?:[\w@.-]+\/)*[\w@-][\w@.-]*\.[A-Za-z0-9]+):(\d+)(?:[-–](\d+))?/g;
function linkSources(root) {
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement.closest("a, .msg.me, .tool-card, .steps") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = [];
  for (let n; (n = walk.nextNode());) if (n.data.search(SRC) >= 0) nodes.push(n);
  for (const n of nodes) {
    const frag = document.createDocumentFragment();
    let at = 0;
    for (const m of n.data.matchAll(SRC)) {
      frag.append(n.data.slice(at, m.index));
      const a = document.createElement("a");
      a.href = "#"; a.className = "src-link"; a.textContent = m[0];
      a.dataset.src = m[1]; a.dataset.line = m[2]; if (m[3]) a.dataset.end = m[3];
      a.title = "Open file";
      frag.append(a);
      at = m.index + m[0].length;
    }
    frag.append(n.data.slice(at));
    n.replaceWith(frag);
  }
}

async function openSource(path, line, end) {
  const box = $("ca-file");
  box.hidden = false;
  box.innerHTML = `<div class="ca-file-h"><code title="${esc(path)}">${esc(path)}:${line}${end > line ? "-" + end : ""}</code><span class="spacer"></span>
    <button type="button" class="icon" id="ca-file-close" title="Close" aria-label="Close">×</button></div><div class="ca-file-body"><div class="muted">Opening…</div></div>`;
  $("ca-file-close").onclick = () => { box.hidden = true; };
  const r = await getJSON(`/api/code/file?project=${encodeURIComponent(code.project)}&path=${encodeURIComponent(path)}`);
  const body = box.querySelector(".ca-file-body");
  if (!body) return;
  if (r.error || typeof r.text !== "string") { body.innerHTML = `<div class="notice">${esc(r.error || "Could not open the file")}</div>`; return; }
  if (r.path) { const h = box.querySelector(".ca-file-h code"); h.textContent = `${r.path}:${line}${end > line ? "-" + end : ""}`; h.title = r.path; }
  body.innerHTML = `<pre class="ca-src">${r.text.split("\n").map((l, i) => `<span class="ln${i + 1 >= line && i + 1 <= end ? " hit" : ""}"><i>${i + 1}</i>${esc(l)}</span>`).join("")}</pre>`;
  body.querySelector(".hit")?.scrollIntoView({ block: "center" });
}

// "Make a task": the question and the answers become the description of a new task in this project.
function toTask() {
  const items = code.snap?.items ?? [], p = fcProjects.find((x) => x.key === code.project);
  const questions = items.filter((it) => it.kind === "user");
  const title = (freeChats.find((t) => t.id === code.thread)?.title || questions[0]?.text || "").split("\n")[0].slice(0, 250);
  // The agent's ticket draft is not part of the answer: "Create ticket" is its way to a task.
  const desc = items.filter((it) => it.kind === "user" || it.kind === "text")
    .map((it) => it.kind === "user" ? `**Question:** ${it.text}` : ticketOf(it.text).text.trim()).filter(Boolean).join("\n\n");
  openTicketDialog({ title, desc: `${desc}\n\n_From an Ask chat on the Mako board._`, tracker: p?.tracker, project: p?.project });
}

// A pasted screenshot goes to the tracker; a placeholder stands in the text until its link comes back.
async function uploadImage(area, t, file, busy, fail) {
  if (!t) return fail("Pick a project first");
  const name = file.name && file.name !== "image.png" ? file.name : `screenshot-${Date.now()}.${(file.type.split("/")[1] || "png").replace("jpeg", "jpg")}`;
  const mark = `![Uploading ${name}…]()`;
  area.setRangeText(mark, area.selectionStart, area.selectionEnd, "end");
  busy(1);
  const q = `tracker=${encodeURIComponent(t.tracker)}&project=${encodeURIComponent(t.project)}&name=${encodeURIComponent(name)}`;
  const res = await fetch(`/api/upload?${q}`, { method: "POST", headers: { "Content-Type": file.type }, body: file })
    .then((r) => r.json()).catch((err) => ({ error: err.message }));
  busy(-1);
  area.value = area.value.replace(mark, res.ok ? res.markdown : "");
  if (!res.ok) fail("The screenshot failed to upload: " + (res.error || "unknown error"));
}

// "Stats" (#280): a header with the period and the project, five tabs; shown where a task's card goes while none is
// open. The tab, the period and the project are remembered.
function statsHTML(s) {
  const period = segs("stats-days", [["today", "Today"], ["7", "7 days"], ["30", "30 days"], ["90", "90 days"], ["", "All time"]], statsDays, "Statistics period");
  const projects = statsProjects();
  // The navigation retro is a project's: with none picked, it is the one of the task merged last.
  if (statsTab === "navigation" && !statsProject && projects.length) {
    const last = (data?.records || []).filter((r) => r.reviewState === "merged" && projectOf(r)).sort((a, b) => (b.mergedAt || "").localeCompare(a.mergedAt || ""))[0];
    statsProject = last ? projectOf(last) : projects[0];
    try { localStorage.setItem("mako-stats-project", statsProject); } catch {}
    setTimeout(load);
  }
  const pick = projects.length > 1 || statsProject ? `<label class="stats-project"><span>Project</span><select id="stats-project" aria-label="Project">`
    + `<option value="">All projects</option>${projects.map((p) => `<option value="${esc(p)}"${p === statsProject ? " selected" : ""}>${esc(p)}</option>`).join("")}</select></label>` : "";
  const head = `<div class="stats-head"><h1>Stats</h1>${period}${pick}</div>`;
  const tabs = `<nav class="stats-tabs" role="tablist" aria-label="Stats">${STATS_TABS.map(([k, l]) =>
    `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === statsTab}" class="${k === statsTab ? "on" : ""}">${l}</button>`).join("")}</nav>`;
  if (statsTab === "navigation") return `<div class="stats">${head}${tabs}${navTab()}</div>`;
  if (!s?.taken && !statsDays && !statsProject) return `<div class="empty">Pick a task on the left. Statistics will appear once the agent takes its first task.</div>`;
  if (!s?.taken) return `<div class="stats">${head}${tabs}<div class="text muted">The agent took no tasks in this period</div></div>`;
  const tab = { time: timeTab, cost: costTab, quality: qualityTab, context: contextTab }[statsTab] || overviewTab;
  return `<div class="stats">${head}${tabs}${tab(s)}</div>`;
}

const STATS_TABS = [["overview", "Overview"], ["time", "Time"], ["cost", "Cost"], ["quality", "Quality"], ["context", "Context"], ["navigation", "Navigation"]];
const INFO_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`;
const money = (x) => `$${(x || 0).toFixed(2)}`;
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
// The project a record counts under, as the stats name it: its task's, else its repository.
const projectOf = (r) => r.task?.project || r.repo || "";
// The projects the stats can be narrowed to: those of every record, the archive too.
function statsProjects() {
  const ps = [...new Set((data?.records || []).map(projectOf).filter(Boolean))].sort();
  if (statsProject && data?.records?.length && !ps.includes(statsProject)) statsProject = "";
  return ps;
}

// One key number: its name with ⓘ (what it counts), the value and a muted line under it.
function metric(label, value, note = "", info = "") {
  const i = info ? `<span class="info" tabindex="0" role="img" aria-label="${esc(info)}" title="${esc(info)}">${INFO_ICON}</span>` : "";
  return `<div class="metric"><div class="metric-l">${label}${i}</div><b>${value}</b>${note ? `<small>${note}</small>` : ""}</div>`;
}
// A share as a thin bar; with its percent next to it.
const meter = (share, cls = "") => `<span class="meter"><i class="${cls}" style="width:${Math.max(0, Math.min(1, share || 0)) * 100}%"></i></span>`;
const meterPct = (share, cls = "") => `<span class="mbar">${meter(share, cls)}<span class="n">${Math.round((share || 0) * 100)}%</span></span>`;
const meterText = (share, text, cls = "") => `<span class="mbar">${meter(share, cls)}<span class="n">${text}</span></span>`;
// A card of the stats: its title, a muted note or a control on the right, the body.
const scard = (title, body, aside = "", cls = "") => `<div class="scard ${cls}"><div class="scard-h"><h2>${title}</h2>${aside ? `<span class="aside">${aside}</span>` : ""}</div>${body}</div>`;
// Segments: one of a few options, the chosen one raised.
const segs = (id, options, value, label = "") => `<div class="segs" id="${id}" role="group"${label ? ` aria-label="${esc(label)}"` : ""}>${options.map(([v, l]) =>
  `<button type="button" data-v="${esc(v)}" class="${v === value ? "on" : ""}" aria-pressed="${v === value}">${l}</button>`).join("")}</div>`;
const lastUnknown = (gs) => [...(gs || []).filter((g) => g.name !== "—"), ...(gs || []).filter((g) => g.name === "—")];
const nameModel = (n) => n === "—" ? "Not recorded" : cap(n);
const nameAgent = (n) => n === "terminal" ? "Mako agent" : n === "—" ? "Not recorded" : `Orca · ${n}`;

function overviewTab(s) {
  const pct = (n, of = s.taken) => of ? Math.round((n / of) * 100) : 0;
  const inReview = s.succeeded - s.merged;
  const spent = s.cost >= 100 ? `$${Math.round(s.cost)}` : money(s.cost);
  return `<div class="metrics">
      ${metric("Merged", s.merged, `${pct(s.merged)}% of ${s.taken} taken${inReview > 0 ? ` · ${inReview} in review` : ""}${s.running ? ` · ${s.running} running` : ""}`,
        "Tasks whose MR was merged, of the tasks handed to an agent in the period.")}
      ${metric("First pass", s.ended ? `${pct(s.clean, s.ended)}%` : "—", s.ended ? `${s.clean} of ${s.ended} done without rework` : "none finished yet",
        "Merged without \"Retry differently\", another attempt or fixes after a review, of the tasks merged or failed.")}
      ${metric("Lead time", s.leadSeconds ? durText(s.leadSeconds) : "—", "median, hand-off → merge",
        "From handing the task to the agent to the merge of its MR: the median over the merged tasks.")}
      ${metric("Spent", s.cost ? spent : "—", s.priced ? `${money(s.cost / s.priced)} per task${s.tokens ? ` · ${tok(s.tokens)} tokens` : ""}` : "Mako's agent only",
        "What Mako's own agent spent on the plan and the work; an agent in Orca does not report it. Tokens: everything the model read and wrote, cache included.")}
    </div>
    <div class="srow">${trendCard(s.days)}${attentionCard(s)}</div>
    ${stagesCard(s, true)}
    ${breakdownCard(s)}`;
}

// The tasks taken each day: merged, still open, failed; the hover tells the numbers. "As a table" shows them so.
function trendCard(days) {
  if (!days?.some((d) => d.taken)) return "";
  // The days before the first task tell nothing: from it on, though a week at least.
  days = days.slice(Math.max(0, Math.min(days.findIndex((d) => d.taken), days.length - 7)));
  const top = Math.max(...days.map((d) => d.taken));
  const peak = days.find((d) => d.taken === top);
  const date = (d, long) => new Date(d + "T12:00:00").toLocaleDateString(LANG, long ? { weekday: "short", day: "numeric", month: "short" } : { day: "numeric", month: "short" });
  const toggle = `<button type="button" class="link" id="trend-table">${trendTable ? "As a chart" : "As a table"}</button>`;
  const legend = `<div class="legend"><span><i class="merged"></i>Merged</span><span><i class="other"></i>In review or running</span><span><i class="failed"></i>Failed</span><span class="spacer"></span>${toggle}</div>`;
  const aside = `most: ${top} on ${date(peak.date)}`;
  if (trendTable) {
    const row = (d) => `<tr><td>${date(d.date, true)}</td><td class="n">${d.taken}</td><td class="n">${d.merged}</td><td class="n">${d.failed}</td><td class="n">${d.cost ? money(d.cost) : "—"}</td></tr>`;
    return scard("Tasks per day", `<div class="table-wrap"><table class="stable"><thead><tr><th>Day</th><th class="n">Taken</th><th class="n">Merged</th><th class="n">Failed</th><th class="n">Spent</th></tr></thead>`
      + `<tbody>${days.filter((d) => d.taken).reverse().map(row).join("")}</tbody></table></div>${legend}`, aside, "grow");
  }
  const seg = (cls, n) => n ? `<i class="${cls}" style="height:${(n / top) * 100}%"></i>` : "";
  const label = (i) => i === 0 || i === days.length - 1 || (days.length > 10 && i === Math.floor(days.length / 2));
  const col = (d, i) => {
    const other = d.taken - d.merged - d.failed;
    const tip = d.taken ? `<div class="tip"><b>${date(d.date, true)}</b> · ${d.taken} taken<br>${d.merged} merged · ${d.failed} failed · ${other} open${d.cost ? `<br>${money(d.cost)} spent` : ""}</div>` : "";
    return `<div class="day${i > days.length / 2 ? " late" : ""}" tabindex="${d.taken ? 0 : -1}" aria-label="${esc(`${date(d.date)}: taken ${d.taken}, merged ${d.merged}, failed ${d.failed}`)}">`
      + `<div class="bar">${seg("failed", d.failed)}${seg("other", other)}${seg("merged", d.merged)}</div>${tip}<span>${label(i) ? date(d.date) : ""}</span></div>`;
  };
  return scard("Tasks per day", `<div class="trend">${days.map(col).join("")}</div>${legend}`, aside, "grow");
}

// "Needs attention": what waits for you or went wrong in the period; a row opens those tasks in the list.
function attentionCard(s) {
  const merge = attentionTasks({ kind: "merge" });
  const oldest = Math.min(...merge.map((r) => Date.parse(r.finishedAt || r.updatedAt)).filter((t) => t > 0));
  const reasons = (s.reasons || []).slice(0, 3).map((x) => `${x.count} ${esc(x.text.length > 40 ? x.text.slice(0, 39) + "…" : x.text)}`).join(" · ");
  // The counts are Summarize's, as the other cards show them; only the MRs waiting now are counted here.
  const fix = s.review?.waiting || 0, failed = s.failed || 0, unclear = unclearOf(s);
  const rows = [
    ["fix", fix, "warn", `${plural(fix, "review round waits", "review rounds wait")} for «Fix»`, "The reviewer left remarks: press Fix to hand them to the agent"],
    ["failed", failed, "err", `${plural(failed, "task", "tasks")} failed`, reasons],
    ["unclear", unclear, "", `${plural(unclear, "task", "tasks")} the agent hardly understood`, "description clarity 2/5 or less"],
    ["merge", merge.length, "", `${plural(merge.length, "MR waits", "MRs wait")} for your merge`, oldest < Infinity ? `for ${durText(Math.max(0, Date.now() - skew - oldest) / 1000)}` : ""],
  ].filter((r) => r[1] > 0);
  const row = ([kind, count, tone, what, note]) => `<a href="#" class="need" data-need="${kind}"><b class="${tone}">${count}</b>`
    + `<span class="what">${what}${note ? `<small>${note}</small>` : ""}</span><span class="go" aria-hidden="true">→</span></a>`;
  return scard("Needs attention", rows.length ? rows.map(row).join("") : `<div class="muted need-none">Nothing needs attention</div>`, "", "needs");
}

// The tasks the agent hardly understood (clarity 1–2): every task is in one project's group, so their sum.
const unclearOf = (s) => (s.projects || []).reduce((n, g) => n + (g.unclear || 0), 0);
// What "Needs attention" lists in the task list, and how the list names it. The tests repeat Summarize's
// (go/internal/core): fix — reviewStats.add's Waiting, failed — Summarize's failed case, unclear — the groups' Unclear.
const NEEDS = {
  fix: { label: "review waits for «Fix»", test: (r) => { const a = r.agentReviews?.at(-1); return a?.state === "notes" && !a.sent; } },
  failed: { label: "failed", test: (r) => r.status === "failed" || r.status === "cancelled" || r.reviewState === "closed" },
  unclear: { label: "hardly understood", test: (r) => r.assessment?.state === "done" && (r.assessment.clarity?.value || 0) <= 2 },
  // An MR waits for its merge now, whenever it was taken.
  merge: { label: "MR waits for merge", now: true, test: (r) => !r.archivedAt && r.status === "done" && !!r.prUrl && r.reviewState !== "merged" && r.reviewState !== "closed" },
};
// Taken in the stats' period, as Summarize counts it (stats.go: Summarize, takenSince): handed off (or failed
// before) at its start or later.
function inPeriod(r) {
  if (!r.startedAt && r.status !== "failed") return false;
  if (!statsDays) return true;
  return Date.parse(r.startedAt || r.updatedAt) >= periodStart();
}
// The start of the stats' period, in ms: the local midnight for "today", else the last N days.
function periodStart() {
  if (statsDays === "today") {
    const d = new Date(Date.now() - skew);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  return Date.now() - skew - Number(statsDays) * 86400e3;
}
// The records a "Needs attention" row stands for: of the stats' project and period; reason: one failure's.
function attentionTasks(f) {
  const need = NEEDS[f?.kind];
  if (!need || !data) return [];
  return data.records.filter((r) => (!statsProject || projectOf(r) === statsProject) && (need.now || inPeriod(r)) && need.test(r)
    && (!f.reason || failReason(r) === f.reason));
}
// Why a task failed, in the words Summarize counts it by (stats.go: reason, cancelled).
const cancelMark = (e) => e === "Cancelled" || e === "\u0421\u043a\u0430\u0441\u043e\u0432\u0430\u043d\u043e"; // older records' «cancelled»
function failReason(r) {
  const e = r.error || "";
  const cancelled = r.status === "cancelled" && cancelMark(e) || e.toLowerCase().includes("cancelled by the developer");
  if (cancelled && (r.status !== "cancelled" || cancelMark(e))) return "Cancelled";
  const line = e.trim().split("\n")[0].trim();
  if (!line) return "No reason";
  const cs = [...line];
  return cs.length > 160 ? cs.slice(0, 160).join("") + "…" : line;
}
// Opens the list with the tasks of a "Needs attention" row; its chip over the list takes the filter off.
function openAttention(f) {
  attention = f;
  statsOpen = false; selected = null; query = ""; $("q").value = "";
  render();
}

// What each stage of a merged task's time takes in.
// A short time with its seconds while under 10 minutes: 12 s, 1 min 16 s; longer ones as durText.
const durFine = (sec) => sec < 60 ? `${Math.round(sec)} s` : sec < 600 ? `${Math.floor(sec / 60)} min${Math.round(sec % 60) ? ` ${Math.round(sec % 60)} s` : ""}` : durText(sec);
const STAGE_WHAT = { agent: "estimate, plan, work and the agent review before the MR", you: "a question, a permission, the plan to approve, the agent's turn is over",
  ci: "the MR's checks are running", review: "the MR is green and waits for review and the merge" };
// Where the time of a merged task goes, on average by stage; short: the legend only, with a link to "Time".
function stagesCard(s, short) {
  const st = s.stages || {}, stages = Object.keys(STAGE_NAMES).filter((k) => st[k] >= 1);
  const total = stages.reduce((n, k) => n + st[k], 0);
  if (!s.staged || !total) return "";
  const share = (k) => Math.round((st[k] / total) * 100);
  const bar = `<div class="stage-bar">${stages.map((k) => `<i class="s-${k}" style="width:${(st[k] / total) * 100}%" title="${esc(`${STAGE_NAMES[k]}: ${durFine(st[k])}`)}"></i>`).join("")}</div>`;
  const key = (k) => `<span class="key"><i class="s-${k}"></i>${cap(STAGE_NAMES[k])}</span>`;
  const body = short
    ? `<div class="stage-grid">${stages.map((k) => `<div>${key(k)}<br><b>${durFine(st[k])}</b> <span class="muted">· ${share(k)}%</span></div>`).join("")}</div>`
    : `<table class="stable plain"><tbody>${stages.map((k) => `<tr><td>${key(k)}</td><td class="nowrap"><b>${durFine(st[k])}</b> <span class="muted">${share(k)}%</span></td><td class="muted">${STAGE_WHAT[k]}</td></tr>`).join("")}</tbody></table>`;
  return scard("Where a merged task's time goes", bar + body, `average of ${s.staged} ${plural(s.staged, "task", "tasks")}${short ? ` · <a href="#" data-go="time">Time →</a>` : ""}`);
}

const BREAKDOWNS = { project: ["Project", "projects", (n) => n], agent: ["Agent", "executors", nameAgent], model: ["Model", "models", nameModel], author: ["Author", "authors", (n) => n] };
// How the tasks went by project, agent, model or author: one table, the cut picked over it.
function breakdownCard(s) {
  const [col, key, name] = BREAKDOWNS[breakdownBy] || BREAKDOWNS.project;
  const groups = lastUnknown(s[key]);
  const rated = groups.some((g) => g.assessed);
  const row = (g) => `<tr><td>${esc(name(g.name))}</td><td class="n">${g.taken}</td><td class="w">${meterPct(g.taken ? g.succeeded / g.taken : 0, "ok")}</td>`
    + `<td class="n">${g.cost ? money(g.cost) : `<span class="muted">not tracked</span>`}</td>${rated ? `<td class="n">${g.assessed ? `${g.clarity.toFixed(1)}/5` : `<span class="muted">—</span>`}</td>` : ""}</tr>`;
  const table = groups.length
    ? `<div class="table-wrap"><table class="stable"><thead><tr><th>${col}</th><th class="n">Taken</th><th title="An MR open or merged, of the taken">Success</th><th class="n">Spent</th>${rated ? `<th class="n" title="How well the tasks are described, by the agent's assessment">Clarity</th>` : ""}</tr></thead><tbody>${groups.map(row).join("")}</tbody></table></div>`
    : `<div class="muted pad">Nothing recorded</div>`;
  return scard("Breakdown", table, segs("breakdown-by", Object.entries(BREAKDOWNS).map(([k, [l]]) => [k, l]), breakdownBy, "Break down by"), "flush");
}

function timeTab(s) {
  const pct = (n) => s.taken ? Math.round((n / s.taken) * 100) : 0;
  return `<div class="metrics">
      ${metric("Lead time", s.leadSeconds ? durText(s.leadSeconds) : "—", "median, hand-off → merge", "From handing the task to the agent to the merge of its MR: the median over the merged tasks.")}
      ${metric("Agent to MR", s.medianSeconds ? durText(s.medianSeconds) : "—", s.avgSeconds ? `median · average ${durText(s.avgSeconds)}` : "median", "From handing the task to the agent until its MR is opened.")}
      ${metric("MR to merge", s.reviewSeconds ? durText(s.reviewSeconds) : "—", "average", "From the MR's opening to its merge, over the merged tasks.")}
      ${metric("Rework", s.retried || 0, `${plural(s.retried || 0, "retry", "retries")}${s.merged ? ` · ${(s.ciFixes || 0).toFixed(2)} CI fixes per merge` : ""}`, "Tasks taken more than once: \"Retry differently\" or another attempt.")}
    </div>
    ${stagesCard(s, false)}
    ${bySizeCard(s.bySize)}
    <div class="metrics three">
      ${metric("Retries", `${s.retried || 0} <span class="muted">· ${pct(s.retried || 0)}% of tasks</span>`, "taken more than once")}
      ${metric("CI fix rounds", `${(s.ciFixes || 0).toFixed(2)} <span class="muted">· per merged task</span>`, "«Fix» after a red CI")}
      ${metric("Review fix rounds", `${(s.reviewFixes || 0).toFixed(2)} <span class="muted">· per merged task</span>`, "human MR comments sent to the agent")}
    </div>`;
}

// How the tasks of each expected size went: the agent's time, merged with no rework, what they cost.
function bySizeCard(groups) {
  const gs = (groups || []).filter((g) => g.taken);
  if (!gs.length) return "";
  const top = Math.max(...gs.map((g) => g.timed ? g.seconds : 0)) || 1;
  const tokened = gs.some((g) => g.tokened);
  const row = (g) => `<tr><td>${cap(SIZE_NAMES[g.size] || esc(g.size))}</td><td class="n">${g.taken}</td>`
    + `<td class="w">${g.timed ? meterText(g.seconds / top, durText(g.seconds), "acc") : "—"}</td>`
    + `<td class="n">${g.ended ? `${g.clean} of ${g.ended}` : "—"}</td><td class="n">${g.priced ? money(g.cost) : "—"}</td>${tokened ? `<td class="n">${g.tokened ? tok(Math.round(g.tokens)) : "—"}</td>` : ""}</tr>`;
  const big = gs.find((g) => g.size === "big");
  const hint = big?.ended && !big.clean ? `<div class="snote">No big task went through without rework: worth splitting them before the hand-off.</div>` : "";
  const n = gs.reduce((a, g) => a + g.taken, 0);
  return scard("By task size", `<div class="table-wrap"><table class="stable"><thead><tr><th>Size</th><th class="n">Tasks</th>`
    + `<th title="From the hand-off to the MR, average">Agent time</th><th class="n" title="Merged without rework, of those merged or failed">First pass</th>`
    + `<th class="n" title="Plan and work of Mako's agent, average">Per task</th>${tokened ? `<th class="n" title="Average per task">Tokens</th>` : ""}</tr></thead><tbody>${gs.map(row).join("")}</tbody></table></div>${hint}`,
    `the size from the agent's estimate · ${n} estimated ${plural(n, "task", "tasks")}`, "flush");
}

function costTab(s) {
  const ph = s.phases || {};
  const around = (ph.estimate || 0) + (ph.review || 0) + (ph.assess || 0);
  return `<div class="metrics">
      ${metric("Spent", s.cost ? money(s.cost) : "—", s.priced ? `${s.priced} ${plural(s.priced, "task", "tasks")} with a price` : "Mako's agent only", "What Mako's own agent spent on the plan and the work; an agent in Orca does not report it.")}
      ${metric("Per task", s.priced ? money(s.cost / s.priced) : "—", "average")}
      ${metric("Tokens", s.tokens ? tok(s.tokens) : "—", "read and written, cache included")}
      ${metric("Around the work", around ? money(around) : "—", "estimate, agent review, retro", "Spent outside the plan and the work, for every task: the estimate before the start, the agent's review and the assessment with the retro.")}
    </div>
    <div class="srow">${phasesCard(s)}${costDaysCard(s.days)}</div>
    ${modelsCard(s)}
    ${routingCard(s)}`;
}

// A route's first pass this low, over this many finished tasks: the route is worth a level up.
const LOW_FIRST_PASS = 0.5, LOW_FIRST_PASS_MIN = 3;
const ESCALATION_NAMES = { ci: "CI red twice", retry: "Retry differently", review: "Review rounds ran out" };

// Routing: does picking the model by phase and size pay off: what the period cost against the same work on one
// model, how each route went, the escalations and the modes. Hidden with no routes recorded.
function routingCard(s) {
  const routes = s.routes || [];
  if (!routes.length) return "";
  const pct = (n, of) => of ? Math.round((n / of) * 100) : 0;
  const actual = s.whatIfActual || 0, wi = s.whatIf || {};
  const vs = (model) => {
    const v = wi[model] || 0, d = v - actual;
    const diff = !actual ? "" : d > 0 ? `<span class="ok">routing saves ${money(d)} · ${pct(d, v)}%</span>` : d < 0 ? `<span class="low">routing costs ${money(-d)} more</span>` : "the same";
    return metric(`All on ${cap(model)}`, v ? money(v) : "—", diff);
  };
  const whatIf = s.whatIfTasks
    ? `<div class="metrics three">${metric("Routed", money(actual), `${s.whatIfTasks} ${plural(s.whatIfTasks, "task", "tasks")} with tokens by kind`, "What these tasks' phases actually cost, by Claude Code's report.")}${vs("opus")}${vs("sonnet")}</div>`
      + `<div class="snote">Estimate at list prices, not a bill: the tokens of each phase (input, output, cache read and write) at the price of one model.</div>`
    : `<div class="snote">No tasks with tokens by kind yet: the comparison with one model appears with the next tasks.</div>`;

  const low = (g) => g.ended >= LOW_FIRST_PASS_MIN && g.clean / g.ended < LOW_FIRST_PASS;
  const label = (g) => `${cap(PHASE_NAMES[g.phase] || g.phase)} · ${SIZE_NAMES[g.size] || esc(g.size)} → ${esc(g.model === "—" ? "default" : g.model)}${g.effort ? ` · ${esc(g.effort)}` : ""}`;
  const row = (g) => `<tr class="${low(g) ? "raise" : ""}"${low(g) ? ` title="Low first pass: worth raising this route"` : ""}><td>${label(g)}</td><td class="n">${g.taken}</td><td class="n">${pct(g.succeeded, g.taken)}%</td>`
    + `<td class="n${low(g) ? " low" : ""}">${g.ended ? `${pct(g.clean, g.ended)}% <span class="muted">${g.clean}/${g.ended}</span>` : "—"}</td>`
    + `<td class="n">${g.priced ? money(g.cost) : "—"}</td><td class="n">${g.medianSeconds ? durText(g.medianSeconds) : "—"}</td></tr>`;
  const byRoute = `<div class="table-wrap"><table class="stable"><thead><tr><th>Phase · size → model · effort</th><th class="n">Tasks</th><th class="n" title="An MR open or merged, of the taken">Success</th>`
    + `<th class="n" title="Merged without rework, of those merged or failed">First pass</th><th class="n" title="The phase's spend, average per task">Per task</th><th class="n" title="From the hand-off to the MR">Median time</th></tr></thead><tbody>${routes.map(row).join("")}</tbody></table></div>`
    + (routes.some(low) ? `<div class="snote">Highlighted: first pass under ${LOW_FIRST_PASS * 100}% over ${LOW_FIRST_PASS_MIN}+ finished tasks — worth raising that route in Settings → Routes.</div>` : "");

  const e = s.escalations || {};
  const esc_ = e.tasks
    ? `<div class="pad"><b>${e.tasks}</b> ${plural(e.tasks, "task", "tasks")} lifted a level · merged after it: <b>${e.merged}</b> of ${e.ended} finished${e.tasks > e.ended ? ` · ${e.tasks - e.ended} still going` : ""}</div>`
      + `<div class="table-wrap"><table class="stable"><thead><tr><th>Why</th><th class="n">Tasks</th><th class="n">Merged</th></tr></thead><tbody>${(e.reasons || []).map((r) =>
        `<tr><td>${esc(ESCALATION_NAMES[r.reason] || r.reason)}</td><td class="n">${r.tasks}</td><td class="n">${r.merged}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="snote">No task was escalated in this period.</div>`;

  const modes = (s.modes || []).length > 1
    ? `<h3 class="sub">By mode</h3><div class="table-wrap"><table class="stable"><thead><tr><th>Mode</th><th class="n">Tasks</th><th class="n">Success</th><th class="n">First pass</th><th class="n">Per task</th></tr></thead><tbody>${s.modes.map((m) =>
        `<tr><td>${cap(esc(m.mode))}</td><td class="n">${m.taken}</td><td class="n">${pct(m.succeeded, m.taken)}%</td><td class="n">${m.ended ? `${pct(m.clean, m.ended)}%` : "—"}</td><td class="n">${m.taken && m.cost ? money(m.cost / m.taken) : "—"}</td></tr>`).join("")}</tbody></table></div>`
    : "";

  return scard("Routing", `<div class="pad">${whatIf}</div><h3 class="sub">By route</h3>${byRoute}<h3 class="sub">Escalations</h3>${esc_}${modes}`,
    "routing vs one model", "flush routing");
}

// What each phase of the work cost over the period: $ as bars, and the tokens.
function phasesCard(s) {
  const ph = s.phases || {}, pt = s.phaseTokens || {};
  const keys = Object.keys(PHASE_NAMES).filter((k) => ph[k] || pt[k]).sort((a, b) => (ph[b] || 0) - (ph[a] || 0));
  if (!keys.length) return "";
  const top = Math.max(...keys.map((k) => ph[k] || 0)) || 1, sum = keys.reduce((n, k) => n + (ph[k] || 0), 0);
  const row = (k) => `<div class="hrow"><span>${cap(PHASE_NAMES[k])}</span>${meter((ph[k] || 0) / top, "acc")}<b>${ph[k] ? money(ph[k]) : "—"}</b><span class="muted">${pt[k] ? tok(pt[k]) : ""}</span></div>`;
  return scard("By phase", keys.map(row).join("") + `<div class="snote">Phases are recorded since the metrics came in; older tasks count only in the total.</div>`, `${money(sum)} recorded by phase`, "grow");
}

// What the agent spent on the tasks taken each day.
function costDaysCard(days) {
  if (!days?.some((d) => d.cost)) return "";
  days = days.slice(Math.max(0, Math.min(days.findIndex((d) => d.taken), days.length - 7)));
  const top = Math.max(...days.map((d) => d.cost || 0));
  const date = (d) => new Date(d + "T12:00:00").toLocaleDateString(LANG, { day: "numeric", month: "short" });
  const col = (d, i) => `<div class="day${i > days.length / 2 ? " late" : ""}" tabindex="${d.cost ? 0 : -1}" aria-label="${esc(`${date(d.date)}: ${money(d.cost)}`)}"><div class="bar">${d.cost ? `<i class="cost" style="height:${(d.cost / top) * 100}%"></i>` : ""}</div>`
    + `${d.cost ? `<div class="tip"><b>${date(d.date)}</b> · ${money(d.cost)}<br>${d.taken} taken</div>` : ""}<span>${i === 0 || i === days.length - 1 ? date(d.date) : ""}</span></div>`;
  return scard("Per day", `<div class="trend small">${days.map(col).join("")}</div>`, `most: ${money(top)}`, "grow");
}

// By model: how its tasks went and what a task cost; the model not recorded goes last.
function modelsCard(s) {
  const gs = lastUnknown(s.models);
  if (!gs.length) return "";
  const per = (g) => g.taken ? g.cost / g.taken : 0;
  const top = Math.max(...gs.map(per)) || 1;
  const row = (g) => `<tr><td>${esc(nameModel(g.name))}</td><td class="n">${g.taken}</td><td class="n">${g.taken ? Math.round((g.succeeded / g.taken) * 100) : 0}%</td>`
    + `<td class="w">${g.cost ? meterText(per(g) / top, money(per(g)), "acc") : `<span class="muted">not tracked</span>`}</td><td class="n">${g.cost ? money(g.cost) : "—"}</td><td class="n">${g.tokens ? tok(g.tokens) : "—"}</td></tr>`;
  const orca = (s.executors || []).filter((g) => g.name !== "terminal" && g.name !== "—").reduce((n, g) => n + g.taken, 0);
  return scard("By model", `<div class="table-wrap"><table class="stable"><thead><tr><th>Model</th><th class="n">Tasks</th><th class="n">Success</th><th>Per task</th><th class="n">Spent</th><th class="n">Tokens</th></tr></thead><tbody>${gs.map(row).join("")}</tbody></table></div>`
    + `<div class="snote">Only the agent in Mako reports its spend${orca ? `: ${orca} Orca ${plural(orca, "task is", "tasks are")} not counted` : ""}. A task counts under the model of its last attempt.</div>`, "", "flush");
}

function qualityTab(s) {
  return `${reviewCard(s.review)}<div class="srow">${forecastCard(s.forecast)}${assessCard(s)}</div>${failuresCard(s)}`;
}

// The reviewer agent's rounds as a funnel: its remarks, the agent's answers, the next rounds' verdicts, converged.
function reviewCard(v) {
  if (!v?.rounds) return "";
  const answered = v.fixed + v.notFixed + v.partly;
  const of = v.remarks || 1;
  const step = (what, n, share, note) => `<div class="fstep"><span>${what}</span><b>${n}</b>${meter(share, "acc")}<small>${note}</small></div>`;
  const body = `<div class="funnel">
      ${step("Remarks", v.remarks, v.remarks ? 1 : 0, `${v.remarks ? v.perRound.toFixed(1) : 0} per round · ${v.must} «blockers»`)}
      ${step("Answered by the agent", answered, answered / of, `fixed ${v.fixed} · partly ${v.partly} · declined ${v.notFixed}${v.noReply ? ` · no reply ${v.noReply}` : ""}`)}
      ${step("Closed next round", v.closed, v.closed / of, `accepted explanations ${v.accepted} · open ${v.open}`)}
      ${step("Converged", `${v.converged} <span class="muted">of ${v.tasks} ${plural(v.tasks, "task", "tasks")}</span>`, v.tasks ? v.converged / v.tasks : 0, `escalated to you ${v.escalated}${v.unverified ? ` · "fixed" without commits ${v.unverified}` : ""}`)}
    </div>`;
  const waiting = v.waiting ? `<div class="swarn"><span><b>${v.waiting} ${plural(v.waiting, "round waits", "rounds wait")} for «Fix»</b> — the reviewer left remarks: press Fix to hand them to the agent. The numbers above do not count them yet.</span><a href="#" data-need="fix">Show the tasks</a></div>` : "";
  return scard("AI review", body + waiting, `${v.rounds} ${plural(v.rounds, "round", "rounds")} on ${v.tasks} ${plural(v.tasks, "task", "tasks")}${v.converged ? ` · ${v.toClean.toFixed(1)} rounds to a clean one` : ""}`);
}

// The size the estimate expected before the work against the one the assessment found after it.
function forecastCard(f) {
  if (!f?.compared) return "";
  const sizes = Object.keys(SIZE_NAMES);
  const cells = f.matrix.map((row, i) => `<span class="mx-l">${SIZE_NAMES[sizes[i]]}</span>${row.map((n, j) => `<b class="${i === j ? "hit" : ""}${n ? "" : " zero"}">${n}</b>`).join("")}`).join("");
  return scard("Size estimate", `<div class="matrix"><span></span>${sizes.map((x) => `<span class="mx-h">${SIZE_NAMES[x]}</span>`).join("")}${cells}</div>`
    + `<div class="snote">Rows: the estimate before the work · columns: the assessment after it. Outlined: the same size both times.</div>`,
    `right ${f.hits} of ${f.compared} · ${Math.round((f.hits / f.compared) * 100)}%`, "grow");
}

// The agent's assessment of the finished tasks, out of 5.
function assessCard(s) {
  if (!s.assessed) return "";
  const unclear = unclearOf(s);
  const row = (what, x) => `<span>${what}</span>${meter(x / 5, "acc")}<b>${x.toFixed(1)}</b>`;
  return scard("Agent's assessment", `<div class="scores">${row("Description clarity", s.clarity)}${row("Completeness", s.completeness)}${row("Complexity", s.complexity)}${row("Risk of the change", s.risk)}</div>`
    + `<div class="snote">Out of 5.${unclear ? ` ${unclear} ${plural(unclear, "task", "tasks")} scored 2 or less on clarity · <a href="#" data-need="unclear">show them</a>` : ""}</div>`,
    `${s.assessed} ${plural(s.assessed, "task", "tasks")}`, "grow");
}

// Why tasks failed, the most frequent first: each row opens the tasks that failed so.
function failuresCard(s) {
  const rs = s.reasons || [];
  if (!rs.length) return scard("Why tasks failed", `<div class="muted pad">No failures</div>`);
  const top = Math.max(...rs.map((x) => x.count));
  const row = (x) => `<a href="#" class="hrow link-row" data-need="failed" data-reason="${esc(x.text)}" title="${esc(x.text)}"><span class="clip">${esc(x.text)}</span>${meter(x.count / top, "err")}<b>${x.count}</b></a>`;
  return scard("Why tasks failed", rs.map(row).join(""), `${s.failed} of ${s.taken} · ${Math.round((s.failed / s.taken) * 100)}%`);
}

// The context window the bars of "Context" are drawn against.
const CTX_WINDOW = 200_000;
function contextTab(s) {
  const c = s.context, phases = ctxPhases(c?.phases);
  if (!phases.length) return `<div class="text muted">No context recorded yet: it is counted from the agent's sessions in Mako.</div>`;
  const main = c.phases.work ? "work" : phases[0], p = c.phases[main];
  const metrics = `<div class="metrics">
      ${metric(`Start of the ${PHASE_NAMES[main]}`, tok(Math.round(p.start)), `median${p.prompt ? ` · task prompt ≈ ${tok(Math.round(p.prompt))}` : ""}`, "The first model call: system prompt, tools, MCP, CLAUDE.md, memory and the task prompt.")}
      ${metric("Peak", tok(Math.round(p.peak)), `median${p.peakShare ? `, ${pctText(p.peakShare)} of the window` : ""} · max ${tok(p.maxPeak)}`, "The largest context of a session, the median over the sessions.")}
      ${metric("From the cache", pctText(cacheShare(p)), "of everything the model read", "Read from the prompt cache, of all the input: the cache is cheaper and faster.")}
      ${metric("Compactions", p.compactions, `in ${p.compacted} of ${p.runs} ${PHASE_NAMES[main]} ${plural(p.runs, "run", "runs")}`, "Claude Code compacted the context when it ran out.")}
    </div>`;
  const w = (n) => `${Math.min(1, n / CTX_WINDOW) * 100}%`;
  const row = (k) => { const x = c.phases[k], cache = cacheShare(x), grew = Math.max(0, x.peak - x.start);
    return `<tr><td>${cap(PHASE_NAMES[k])}</td><td class="n">${x.runs}</td>`
      + `<td class="w"><span class="mbar"><span class="meter"><i class="acc" style="width:${w(x.start)}"></i>${grew >= 1000 ? `<i class="grew" style="width:${w(grew)}"></i>` : ""}</span>`
      + `<span class="n">${grew >= 1000 ? `${tok(Math.round(x.start))} → ${tok(Math.round(x.peak))}` : tok(Math.round(x.peak))}</span></span></td>`
      + `<td class="n">${tok(x.maxPeak)}</td><td class="n${cache < 0.5 ? " low" : ""}">${pctText(cache)}</td></tr>`; };
  const byPhase = scard("By phase", `<div class="table-wrap"><table class="stable"><thead><tr><th>Phase</th><th class="n">Runs</th><th>Context</th><th class="n">Max</th><th class="n">Cache</th></tr></thead><tbody>${phases.map(row).join("")}</tbody></table></div>`
    + `<div class="legend pad"><span><i class="acc"></i>Start: system prompt, tools, MCP, CLAUDE.md, memory, task</span><span><i class="grew"></i>Grew during the run</span></div>`,
    `bar: start → peak, of a ${tok(CTX_WINDOW)} window`, "flush");
  return metrics + byPhase + `<div class="srow">${fillsCard(c, phases)}${heavyCard(c)}</div>`;
}

// What filled the context, by what came in: the growth between the model's calls split by its size (approximate).
function fillsCard(c, phases) {
  const total = {};
  for (const k of phases) for (const [t, n] of Object.entries(c.phases[k].tools || {})) total[t] = (total[t] || 0) + n;
  const tools = Object.keys(total).filter((t) => total[t] > 0).sort((a, b) => total[b] - total[a]);
  if (!tools.length) return "";
  const sum = tools.reduce((n, t) => n + total[t], 0);
  const shown = tools.slice(0, 3), rest = tools.slice(3), other = rest.reduce((n, t) => n + total[t], 0);
  const name = (t) => ({ Bash: "Bash output", Replies: "Agent's own replies" })[t] || t;
  const parts = [...shown.map((t, i) => [name(t), total[t], `f${i}`]), ...(other ? [[`Other: ${rest.slice(0, 3).join(", ")}${rest.length > 3 ? "…" : ""}`, other, "f3"]] : [])];
  return scard("What fills the context", `<div class="stage-bar">${parts.map(([t, n, cls]) => `<i class="${cls}" style="width:${(n / sum) * 100}%" title="${esc(t)}"></i>`).join("")}</div>`
    + `<div class="fills">${parts.map(([t, n, cls]) => `<span><i class="${cls}"></i>${esc(t)}</span><b>${tok(n)}</b><span class="muted">${pctText(n / sum)}</span>`).join("")}</div>`,
    `≈ ${tok(sum)} added`, "grow");
}

// The heaviest files read and the commands with the largest output, their paths relative to the task's worktree.
function heavyCard(c) {
  if (!c.files?.length && !c.commands?.length) return "";
  const by = heavyBy === "commands" && c.commands?.length || !c.files?.length ? "commands" : "files";
  const hs = (by === "files" ? c.files : c.commands).slice(0, 8);
  const row = (h) => `<div class="hrow heavy"><code title="${esc(h.name)}">${esc(h.name.length > 70 ? h.name.slice(0, 69) + "…" : h.name)}</code><span class="muted">${h.count}×</span><b>${tok(h.tokens)}</b></div>`;
  return scard("Heaviest", hs.map(row).join(""), segs("heavy-by", [["files", "Files"], ["commands", "Commands"]], by, "Heaviest"), "grow");
}

// "Navigation" (#482): the navigation retro of each repository of the project. Mako reads the transcripts of its last
// merged tasks (where the agents searched long, read the same files again, searched in vain, read docs before
// editing elsewhere) and the model suggests changes: a line for CLAUDE.md is saved under "## Navigation", a doc out
// of date or a change to the code becomes a task.
const NAV_KINDS = { claude_md: "CLAUDE.md", stale_doc: "Out-of-date doc", refactor: "Refactor" };
// The lines being edited, by "key|id": the stats re-render every few seconds.
const navEdit = {};
function navTab() {
  if (!statsProject) return `<div class="text muted">Pick a project above: the navigation retro reads the agents' transcripts of the last merged tasks of its repository.</div>`;
  const rs = data?.navRetros || [];
  if (!rs.length) return `<div class="text muted">${esc(statsProject)} has no merged tasks yet: the navigation retro reads the agents' transcripts of the merged ones.</div>`;
  return rs.map((x) => navCard(x, rs.length > 1)).join("");
}
function navCard(x, several) {
  const running = x.state === "running";
  const btn = `<button type="button" class="${x.state === "done" ? "ghost" : "primary"}" data-nav-run="${esc(x.key)}"${running ? " disabled" : ""}>${running ? "Running…" : x.state ? "Run again" : "Navigation retro"}</button>`;
  const title = `Navigation retro${several ? ` · ${esc(x.repo)}` : ""}`;
  const about = `Mako reads the agents' transcripts of the last ${x.merged} merged ${plural(x.merged, "task", "tasks")} of ${esc(x.repo)}: where they searched long before their first edit, read the same files again, searched in vain or relied on docs, and suggests what would make the repository easier to navigate.`;
  let body;
  if (running) body = `<div class="muted">Reading the transcripts and asking the model… it takes a few minutes.</div>`;
  else if (x.state === "failed") body = `<div class="nav-err">The retro failed: ${esc(x.error)}</div><div class="muted">${about}</div>`;
  else if (x.state === "done") {
    const read = x.tasks?.length || 0, skipped = x.skipped?.length || 0;
    const when = new Date(x.at).toLocaleString(LANG, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    body = `<div class="muted">Read ${read} ${plural(read, "task", "tasks")}${skipped ? ` · ${skipped} skipped: no transcript (${x.skipped.map(esc).join(", ")})` : ""} · ${when}</div>`
      + (x.suggestions || []).map((g) => navSuggestion(x, g)).join("");
  } else body = `<div class="muted">${about}</div>`;
  return scard(title, body, btn, "nav-retro");
}
function navSuggestion(x, g) {
  const k = `${x.key}|${g.id}`, open = !g.done;
  let foot = "";
  if (g.done === "saved") foot = `<div class="nav-done">Saved to CLAUDE.md</div>`;
  else if (g.done === "no") foot = `<div class="nav-done">Dismissed</div>`;
  else if (g.done?.startsWith("task:")) foot = `<div class="nav-done">Task <a href="#${esc(g.done.slice(5))}" data-nav-open="${esc(g.done.slice(5))}">${esc(g.done.slice(5))}</a></div>`;
  else if (g.kind === "claude_md") foot = `<textarea class="nav-rule-input" rows="2" data-nav-rule="${esc(k)}" aria-label="The line for CLAUDE.md">${esc(navEdit[k] ?? g.rule)}</textarea>
    <div class="nav-act"><button type="button" class="primary" data-nav-save="${esc(k)}">Save to CLAUDE.md</button><button type="button" class="ghost" data-nav-no="${esc(k)}">No</button></div>`;
  else foot = `<div class="nav-rule">${esc(g.rule)}</div>
    <div class="nav-act"><button type="button" class="primary" data-nav-task="${esc(k)}">Create task</button><button type="button" class="ghost" data-nav-no="${esc(k)}">No</button></div>`;
  return `<div class="nav-sug${open ? "" : " done"}"><div class="nav-sug-h"><span class="nav-kind k-${esc(g.kind)}">${NAV_KINDS[g.kind] || esc(g.kind)}</span><b>${esc(g.title)}</b></div>`
    + (g.evidence ? `<div class="nav-ev">${esc(g.evidence)}</div>` : "") + foot + `</div>`;
}
async function navPost(path, body) {
  const res = await fetch(path, { method: "POST", body: body ?? "" }).then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
  if (res.ok === false) toast(res.error, true);
  return res;
}
function bindNav() {
  const d = $("detail"), split = (k) => { const i = k.lastIndexOf("|"); return [k.slice(0, i), k.slice(i + 1)]; };
  const find = (k) => { const [key, id] = split(k); const x = (data?.navRetros || []).find((r) => r.key === key); return [x, x?.suggestions?.find((g) => g.id === id), key, id]; };
  for (const b of d.querySelectorAll("[data-nav-run]")) b.onclick = async () => {
    b.disabled = true;
    await navPost(`/api/navretro?key=${encodeURIComponent(b.dataset.navRun)}`);
    await load();
  };
  for (const a of d.querySelectorAll("[data-nav-rule]")) a.oninput = () => (navEdit[a.dataset.navRule] = a.value);
  for (const b of d.querySelectorAll("[data-nav-save]")) b.onclick = async () => {
    const k = b.dataset.navSave, [, g, key, id] = find(k);
    b.disabled = true;
    const res = await navPost(`/api/navretro/save?key=${encodeURIComponent(key)}&id=${encodeURIComponent(id)}`, navEdit[k] ?? g?.rule);
    if (res.ok) { delete navEdit[k]; toast("Saved to CLAUDE.md and pushed to the base branch"); }
    await load();
  };
  for (const b of d.querySelectorAll("[data-nav-no]")) b.onclick = async () => {
    const [key, id] = split(b.dataset.navNo);
    await navPost(`/api/navretro/mark?key=${encodeURIComponent(key)}&id=${encodeURIComponent(id)}&to=no`);
    await load();
  };
  for (const b of d.querySelectorAll("[data-nav-task]")) b.onclick = () => {
    const [x, g, key, id] = find(b.dataset.navTask);
    if (!x || !g) return;
    const desc = `${g.rule}\n\n## Why\n${g.evidence || ""}\n\n_From the navigation retro of ${x.repo}: the agents' transcripts of its last merged tasks._`;
    const dlg = $("ca-ticket-dlg"), box = $("ca-ticket-form");
    const close = () => { dlg.close(); box.innerHTML = ""; };
    taskForm(box, { draft: { title: g.title, desc, tracker: x.trackerId, project: x.project }, onCancel: close, onCreated: async (res) => {
      close();
      await navPost(`/api/navretro/mark?key=${encodeURIComponent(key)}&id=${encodeURIComponent(id)}&to=${encodeURIComponent("task:" + res.id)}`);
      toast(`Task ${res.id} created`);

    } });
    dlg.onclose = () => { box.innerHTML = ""; };
    dlg.showModal();
    $("nt-title").focus();
  };
  for (const a of d.querySelectorAll("[data-nav-open]")) a.onclick = (e) => { e.preventDefault(); statsOpen = false; select(a.dataset.navOpen); };
}

// Mako's own errors, one row per kind: "Send for analysis" writes them into an issue in Mako's repository.

  const row = (f) => `<div class="fault-row${f.reported ? " reported" : ""}"><b class="fault-n" title="${f.count} ${plural(f.count, "time", "times", "times")}">${f.count}×</b>`

// The board re-renders every few seconds: the report under way is remembered here, not in the button.
let faultsBusy = false;
function bindFaults() {

const SIZE_NAMES = { small: "small", medium: "medium", big: "big" };
const STAGE_NAMES = { agent: "agent working", you: "waiting for you", ci: "waiting for CI", review: "waiting for review" };
const PHASE_NAMES = { estimate: "estimate", plan: "plan", work: "work", review: "agent review", assess: "assessment and retro" };

// A time in seconds, short: 42 min, 3 h 5 min, 2 d 4 h.
function durText(sec) {
  const m = Math.round(sec / 60);
  return m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${Math.floor(m / 1440)} d ${Math.floor((m % 1440) / 60)} h`;
}

// The task's own cycle: where its time went by stage (the current one up to now) and what each phase cost.
function cycleHTML(r, card) {
  const m = r.metrics;
  if (!m) return "";
  const seconds = { ...(m.seconds || {}) };
  if (m.stage && m.stageSince) seconds[m.stage] = (seconds[m.stage] || 0) + Math.max(0, (Date.now() - Date.parse(m.stageSince)) / 1000);
  const bar = stageBar(seconds, durText);
  const phases = Object.keys(PHASE_NAMES).filter((k) => m.cost?.[k] || m.tokens?.[k]);
  const tokens = Object.values(m.tokens || {}).reduce((a, b) => a + b, 0);
  const spend = phases.length ? `<div class="legend stage-legend">${phases.map((k) => `<span>${PHASE_NAMES[k]} <b>${m.cost?.[k] ? `$${m.cost[k].toFixed(2)}` : "—"}</b>${m.tokens?.[k] ? ` <span class="muted">· ${tok(m.tokens[k])}</span>` : ""}</span>`).join("")}</div>` : "";
  if (!bar && !spend) return "";
  const spent = (r.cost || 0) + Object.entries(m.cost || {}).filter(([k]) => k !== "plan" && k !== "work").reduce((a, [, v]) => a + v, 0);
  const note = [spent ? `$${spent.toFixed(2)}` : "", tokens ? `${tok(tokens)} tokens` : "",
    r.ciFixes ? `CI fixes ${r.ciFixes}` : "", r.reviewFixes ? `comment fixes ${r.reviewFixes}` : ""].filter(Boolean).join(" · ");
  return card("Time and cost", `<div class="tcard-b">${bar}${spend}</div>`, "cycle", note);
}

// Tokens, short: 950, 12k, 1.4M.
function tok(n) {
  return n < 1000 ? `${n}` : n < 1e6 ? `${Math.round(n / 1000)}k` : `${(n / 1e6).toFixed(1)}M`;
}

// Where the time of a task goes, by stage: one bar of their shares and the times under it. seconds: stage → s.
function stageBar(seconds, dur) {
  const stages = Object.keys(STAGE_NAMES).filter((k) => seconds?.[k] >= 1);
  const total = stages.reduce((n, k) => n + seconds[k], 0);
  if (!total) return "";
  return `<div class="stage-bar">${stages.map((k) => `<i class="s-${k}" style="width:${(seconds[k] / total) * 100}%" title="${esc(`${STAGE_NAMES[k]}: ${dur(seconds[k])}`)}"></i>`).join("")}</div>
    <div class="legend stage-legend">${stages.map((k) => `<span><i class="s-${k}"></i>${STAGE_NAMES[k]} <b>${dur(seconds[k])}</b> <span class="muted">· ${Math.round((seconds[k] / total) * 100)}%</span></span>`).join("")}</div>`;
}

// The phases of the context, in the order the board shows them: the ones that have runs.
const ctxPhases = (phases) => Object.keys(PHASE_NAMES).filter((k) => phases?.[k]?.runs);
// The cache's share of all the input: what was read from it, of everything the model read.
const cacheShare = (p) => { const all = (p.input || 0) + (p.cacheRead || 0) + (p.cacheCreate || 0); return all ? p.cacheRead / all : 0; };
const pctText = (x) => `${Math.round(x * 100)}%`;

// "While you were away": what waits for you, the MRs to merge, what failed and got merged, with links to the tasks.
function digestHTML(d) {
  const at = (ms) => new Date(ms).toLocaleString(LANG, { weekday: "short", hour: "2-digit", minute: "2-digit" });
  const item = (x) => `<li><a href="#${encodeURIComponent(x.id)}"><b>${esc(x.id)}</b> ${esc(x.title)}</a>`
    + (x.new ? ` <span class="digest-new">new</span>` : "")
    + (x.note ? `<div class="muted">${esc(x.note)}</div>` : "")
    + (x.mr ? ` <a class="mr" href="${esc(x.mr)}" target="_blank" rel="noopener">MR ↗</a>` : "") + `</li>`;
  const part = (title, xs) => xs?.length ? `<h3>${title} <span class="muted">${xs.length}</span></h3><ul class="digest-list">${xs.map(item).join("")}</ul>` : "";
  const body = part("Waiting for you", d.waiting) + part("MRs ready to merge", d.review) + part("Failed", d.failed) + part("Merged", d.merged);
  return `<div class="stats digest">
    <div class="digest-head"><h1>While you were away</h1><button class="ghost" id="digest-close">Close</button></div>
    <p class="stats-note">${at(d.since)} — ${at(d.until)}</p>
    ${body || `<div class="text" style="color:var(--mute)">Nothing happened</div>`}
  </div>`;
}

// The card's head: tracker · number · status, the title and one muted line of facts; on the right the main action
// for the task's state (Mako picks it: r.card.primary) and the rest in "⋯".
function headHTML(r, title = true) {
  const t = r.task, st = state(r), [text, cls, tip] = cardStatus(r);
  return `<div class="d-head">
      <div class="d-main">
        <div class="d-id">${trackerIcon(t)}${r.type === "fix" ? kind(r) : ""}<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(r.id)}</a><span class="s ${st} ${cls}"${tip ? ` title="${esc(tip)}"` : ""}>${esc(text)}</span></div>
        ${title ? `<h1>${esc(t.title)}</h1>${metaLine(r)}` : ""}
      </div>
      <div class="actions">${primaryHTML(r)}${moreMenu(r)}</div>
    </div>`;
}

// The task's facts in one muted line: repo · branch (copy) · model · assignees · priority · labels. The project is in
// the number already, the worktree's path is in "⋯".
function metaLine(r) {
  const t = r.task, parts = [], a = agentOf(r);
  if (a?.state === "waiting") parts.push(`<span title="${esc(a.reason || "The agent waits for you")}"><b class="wait">Waiting for you</b>${a.since ? ` · ${dur((Date.now() - a.since) / 1000)}` : ""}</span>`);
  const branch = r.branch || r.branchName;
  if (r.repo) parts.push(`<span title="Repository">${esc(r.repo)}</span>`);
  if (branch && r.column !== "done") parts.push(`<span title="Branch"><code>${esc(branch)}</code><button type="button" class="icon" data-copy="${esc(branch)}" title="Copy branch name" aria-label="Copy branch name">${ICON.copy}</button></span>`);
  if (r.agentRoute?.model && r.column !== "new") {
    const route = [r.agentRoute.model, r.agentRoute.effort].filter(Boolean).join(" · ");
    parts.push(`<span title="The model and effort of the agent's run, and why${r.agentModel && r.agentModel !== r.agentRoute.model ? ` (${esc(r.agentModel)})` : ""}"><code>${esc(route)}</code>${r.agentRoute.why ? ` — ${esc(r.agentRoute.why)}` : ""}</span>`);
  } else if (r.agentModel && r.column !== "new") parts.push(`<span title="The model the agent worked with"><code>${esc(r.agentModel)}</code></span>`);
  if (t.assignees?.length) parts.push(`<span title="Assignees">${esc(t.assignees.join(", "))}</span>`);
  if (t.priority) parts.push(`<span title="Priority in the tracker" class="prio ${prioTone(t.priority)}">${esc(t.priority)}</span>`);
  // Jira's meta carries the priority too, GitHub's and GitLab's the labels: both are shown on their own.
  const meta = t.meta?.split(" | ").filter((p) => !(t.priority && p.startsWith("Priority:")) && !(t.labels?.length && p.startsWith("Labels:"))).join(" | ");
  if (meta) parts.push(`<span title="Tracker">${esc(meta)}</span>`);
  if (r.trackerStatus) parts.push(`<span class="${r.trackerStatus.ok ? "" : "bad"}" title="Tracker status">${esc(r.trackerStatus.text)}</span>`);
  if (t.labels?.length) parts.push(`<span class="labels" title="Labels">${t.labels.map((l) => `<span class="lbl">${esc(l)}</span>`).join("")}</span>`);
  return parts.length ? `<div class="d-meta">${parts.join(`<i>·</i>`)}</div>` : "";
}

const openMR = (r, cls = "") => r.prUrl ? `<a class="btn ${cls}" href="${esc(r.prUrl)}" target="_blank" rel="noopener">Open ${esc(mrName(r.prUrl))}${ICON.external}</a>` : "";
// The main action, as a button the card's handlers already know (data-a, data-ask, data-merge), and the one next
// to it when the state has a pair (Start + Snooze, Merge + Open MR).
function primaryHTML(r) {
  const b = (a, label, cls = "", x = "", title = "") => `<button class="${cls}" data-a="${a}" data-x="${x}"${title ? ` title="${esc(title)}"` : ""}>${label}</button>`;
  switch (r.card?.primary) {
    case "take": return takeButton(r) + laterMenu();
    case "restore": return takeButton(r) + b("later", "Restore", "", "&min=-1", "Bring it back from snoozed");
    case "push": return `<button class="primary" data-a="push" title="Skip the queue: hand it to the agent now, past the WIP limit and Claude limits">Run now</button>`;
    case "cancel": return b("cancel", "Cancel", "danger");
    case "stop": return b("stop", `${ICON.stop}Stop`, "", "", "Stop the agent");
    case "resume": return b("resume", `${ICON.play}Resume`, "primary", "", "Continue the conversation");
    case "focus": return b("focus", "Show in Orca", agentOf(r)?.state === "waiting" ? "primary" : "");
    // Once the agent has been asked, only the MR link is left, as the main button.
    case "fix-conflicts": return isAsked(r.id, "conflicts") ? openMR(r, "primary")
      : `<button class="primary" data-ask="conflicts" title="The agent will rebase on the main branch, resolve the conflicts and push">Resolve conflicts</button>` + openMR(r);
    case "fix-ci": return isAsked(r.id, "ci") ? openMR(r, "primary")
      : `<button class="primary" data-ask="ci" title="The agent will look at the failed jobs, fix them and push">Fix CI</button>` + openMR(r);
    case "merge": return `<button class="merge-go" data-merge>${ICON.merge}Merge</button>` + openMR(r);
    // CI still running, or the agent is in Orca: the MR is where to look.
    case "open-mr": return openMR(r, "primary");
    case "retry": return b("retry", "Retry", "primary");
    case "unarchive": return b("unarchive", `${ICON.unarchive}Restore from archive`);
    case "archive": return b("archive", `${ICON.archive}Archive`);
    default: return "";
  }
}

// "⋯": what is not the main action for this state.
function moreMenu(r) {
  const p = r.card?.primary, term = r.executor === "terminal" && r.worktree, items = [];
  const it = (attrs, label, cls = "") => items.push(`<button type="button" class="${cls}" ${attrs}>${label}</button>`);
  if (r.column === "doing" && p !== "stop" && term && r.live) it(`data-a="stop"`, "Stop the agent");
  if (r.column === "review" && term && p !== "resume") it(`data-a="${r.live ? "stop" : "resume"}"`, r.live ? "Stop the agent" : "Continue the conversation");
  if (r.reviewStep === "ready") it(`data-a="agentreview"`, "Run agent review");
  if (["doing", "review", "failed"].includes(r.column) && r.status !== "queued") it("data-redo", "Retry differently");
  if (r.column === "doing" && !term && r.worktree && p !== "focus") it(`data-a="focus"`, "Show in Orca");
  if (r.prUrl && !["merge", "fix-conflicts", "fix-ci", "open-mr"].includes(p)) items.push(`<a href="${esc(r.prUrl)}" target="_blank" rel="noopener">Open ${esc(mrName(r.prUrl))} ↗</a>`);
  if (r.worktree && r.column !== "done") {
    if (data.editor) it(`data-open="editor"`, `Open in ${esc(data.editor)}`);
    it(`data-open="finder"`, "Show in Finder");
    it(`data-copy="${esc(r.worktree)}" title="${esc(r.worktree)}"`, "Copy worktree path");
  }
  if (r.task.url) it(`data-copy="${esc(r.task.url)}"`, "Copy task link");
  if (r.status === "queued" && p !== "cancel") it(`data-a="cancel"`, "Cancel", "danger");
  if (r.column === "doing" && r.status !== "queued") it(`data-a="cancel"`, term ? "Stop watching" : "Stop watching the agent", "danger");
  if (!r.archivedAt && p !== "archive" && r.column !== "new" && r.column !== "doing") it(`data-a="archive"`, "Archive");
  if (!items.length) return "";
  return `<details class="menu more"><summary class="btn icon" title="More actions" aria-label="More actions">⋯</summary><div class="menu-pop">${items.join("")}</div></details>`;
}

// The stage strip: Estimate → Plan → Work → Checks (CI and the AI review) → Merge, each with its time and cost (r.card.stages, from
// the record's metrics). A click on a stage opens what it holds under the strip.
const STAGE_LABEL = { estimate: "Estimate", plan: "Plan", work: "Work", checks: "Checks", merge: "Merge" };
const STAGE_MARK = {
  done: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>`,
  fail: `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  now: `<i></i>`,
};
const STAGE_WORD = { done: "done", now: "current", fail: "failed", skip: "skipped", todo: "not yet" };
const stageOpen = {};
// On a phone the strip scrolls sideways: it keeps where it was scrolled to over the board's reloads, and the first time a
// task is shown it opens on the stage the work is at (the current or the failed one), not on «Estimate».
// A stage that moved on (plan → work → checks) brings the strip to the new current stage again.
const stripScroll = {};
function revealStage(strip, id) {
  if (!strip || strip.scrollWidth <= strip.clientWidth) return;
  const saved = stripScroll[id];
  if (saved && saved.at === strip.dataset.at) { strip.scrollLeft = saved.left; return; }
  const cur = strip.querySelector(".st.now, .st.fail");
  if (!cur) return;
  strip.scrollLeft = cur.getBoundingClientRect().left - strip.getBoundingClientRect().left + strip.scrollLeft - (strip.clientWidth - cur.offsetWidth) / 2;
