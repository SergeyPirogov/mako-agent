<!-- "Redo differently": the agent went the wrong way; Mako drops the attempt and starts the task over. -->

    <input id="redo-model" list="redo-models" placeholder="as in settings" autocomplete="off" spellcheck="false">
    <datalist id="redo-models"></datalist>
    <div class="redo-a">
      <button type="submit" class="primary" value="go">Redo</button>
      <button type="submit" value="cancel" formnovalidate>Cancel</button>
      <span class="muted">⌘/Ctrl+Enter — redo</span>

    for (const m of x.matchAll(MD_IMG)) {
      const src = m[1] ?? m[3], alt = m[2] ?? m[0].match(/\balt\s*=\s*["']([^"']*)/i)?.[1] ?? "";
      out += plain(x.slice(at, m.index)) + pic(src, alt);
      at = m.index + m[0].length;
    }
    return out + plain(x.slice(at));
  };
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const lines = text.trim().split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre class="code">${esc(code.join("\n"))}</pre>`);
      continue;
    }
    if (/^\s*\|/.test(l)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(lines[i]);
      i--;
      const body = rows.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r)).map(cells);
      const sep = rows.length > 1 && /^\s*\|?[\s:|-]+\|?\s*$/.test(rows[1]);
      const head = sep ? body.shift() : null;
      out.push(`<div class="table"><table>${head ? `<thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>` : ""}<tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const h = l.match(/^#{1,4}\s+(.*)/);
    const li = l.match(/^\s*[-*]\s+(.*)/);
    const num = l.match(/^\s*(\d+)[.)]\s+(.*)/);
    if (h) out.push(`<h4>${inline(h[1])}</h4>`);
    else if (li) out.push(`<li>${inline(li[1])}</li>`);
    else if (num) out.push(`<p class="num"><span>${num[1]}.</span> ${inline(num[2])}</p>`);
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  return out.join("").replace(/(<li>.*?<\/li>)+/g, (m) => `<ul>${m}</ul>`);
}

async function post(action, id, extra = "") {
  await fetch(`/api/${action}?id=${encodeURIComponent(id ?? "")}${extra}`, { method: "POST" });
  await load();
}
$("pause").onclick = () => fetch(`/api/pause?on=${data?.paused ? 0 : 1}`, { method: "POST" }).then(load);
$("awake").onclick = () => fetch(`/api/awake?on=${data?.awake?.on ? 0 : 1}`, { method: "POST" }).then(load);
$("restart").onclick = () => fetch(`/api/restart?on=${data?.restart?.pending ? 0 : 1}`, { method: "POST" }).then(load);
$("stats-btn").onclick = () => {
  selected = null; statsOpen = true; newOpen = false; digest = null;
  history.replaceState(null, "", location.pathname);
  try { localStorage.removeItem("mako-selected"); } catch {}
  render();
};
$("poll").onclick = async () => { $("poll").classList.add("busy"); await post("poll"); setTimeout(() => $("poll").classList.remove("busy"), 1500); };

async function load() {
  try {
    // seen=1: the board is on screen, so Mako knows you are back (and how long you were away).
    // days: the period "Stats" counts over.
    const q = new URLSearchParams();
    if (document.visibilityState === "visible") q.set("seen", "1");
    if (statsDays) q.set("days", statsDays);
    data = await (await fetch(`/api/state${q.toString() ? `?${q}` : ""}`)).json();
    if (data.now) skew = Date.now() - data.now;
    // The words of the page, the first time.
    if (!Object.keys(I18N).length) {
      await loadI18n();
      boardWords();
    }
  } catch {
    $("search").textContent = t("s.noAnswer");
    $("search").className = "search err";
    return;
  }
  // The running version, so it is clear which Mako is on screen.
  if (data.version) $("ver").textContent = data.version;
  if (data.digest) return openDigest(data.digest);
  await Promise.all([loadCard(), loadWork()]);
  render();
}

// The digest takes the place of the open card; its links open the tasks.
function openDigest(d) {
  digest = d; selected = null; statsOpen = false; newOpen = false;
  history.replaceState(null, "", location.pathname);
  try { localStorage.removeItem("mako-selected"); } catch {}
  render();
}
async function loadDigest(since) {
  const d = await getJSON(`/api/digest?since=${encodeURIComponent(since)}`);
  if (!d.error) openDigest(d);
}

// The open card's journal and conversation, fetched side by side; a reply for a card no longer open is dropped.
async function loadCard() {
  const id = selected;
  if (!id) return;
  const [l] = await Promise.all([getJSON(`/api/log?id=${encodeURIComponent(id)}`), loadConvo()]);
  if (id === selected && Array.isArray(l)) logs = l;
}

// Claude's usage limits, the account's: how much of each window is used, when it resets in the tooltip (the 5h one also beside the meter).
// Bare=true is the compact form beside the meter: "12:20" today, "Fri, 12:20" later; otherwise "at 12:20" for prose.
const resetTime = (sec, bare) => {
  const d = new Date(sec * 1000), today = new Date().toDateString() === d.toDateString();
  const hm = d.toLocaleTimeString(LANG, { hour: "2-digit", minute: "2-digit" });
  return today ? (bare ? hm : `at ${hm}`) : d.toLocaleString(LANG, { weekday: "short", hour: "2-digit", minute: "2-digit" });
};
function limitsHTML(l) {
  const bad = data.limitPausePct || 85;
  const meter = (label, short, w, what, showReset) => {
    if (!w) return "";
    const pct = Math.round(w.used * 100), cls = pct >= bad ? "bad" : pct >= 60 ? "warn" : "";
    // A reset time in the past: the window is fresh again, though no agent has reported it yet.
    const live = w.resetsAt * 1000 > Date.now(), at = live ? resetTime(w.resetsAt) : "";
    return `<span class="limit ${cls}" title="${what}: ${pct}% used${live ? `, resets ${at}` : ""}"><span class="lk">${label}</span><span class="ls">${short}</span><span class="lbar"><span style="width:${Math.min(pct, 100)}%"></span></span><b>${pct}%</b>${showReset && live ? `<span class="lr">↻ ${resetTime(w.resetsAt, true)}</span>` : ""}</span>`;
  };
  return meter("5 h", "5h", l?.fiveHour, "Claude limit for 5 hours", true) + meter("Week", "wk", l?.week, "Claude limit for the week");
}

// Past the threshold the queue waits for the limit to reset; agents already working go on.
// Trackers Mako cannot search now (no internet, the VPN dropped, the service is down): which one, why in
// words, since when; the raw error under "Details".
// "Hide" snoozes a tracker's alert for an hour; it comes back only if the tracker is still down then.
const SNOOZE_MS = 60 * 60 * 1000;
let downSnoozed = (() => { try { return JSON.parse(localStorage.getItem("mako-down-snoozed")) || {}; } catch { return {}; } })();
const snoozed = (id) => Date.now() - (downSnoozed[id] || 0) < SNOOZE_MS;
function snoozeDown(ids) {
  const now = Date.now();
  for (const id of Object.keys(downSnoozed)) if (now - downSnoozed[id] >= SNOOZE_MS) delete downSnoozed[id];
  for (const id of ids) downSnoozed[id] = now;
  try { localStorage.setItem("mako-down-snoozed", JSON.stringify(downSnoozed)); } catch {}
}
function downHTML(failed) {
  failed = failed.filter(([id]) => !snoozed(id));
  if (!failed.length) return "";
  const since = (iso) => iso ? ` since ${new Date(iso).toLocaleTimeString(LANG, { hour: "2-digit", minute: "2-digit" })}` : "";
  return `<div class="banner down" role="alert">${failed.map(([id, s]) =>
    `<div><b>⚠ ${esc(s.down || id)}</b><span class="muted">${since(s.since)}</span>
      <button data-pause-tracker="${esc(id)}" title="Do not look for new tasks in this tracker until you resume; other trackers are still searched">Pause</button>
      <details><summary>Details</summary><code>${esc(s.error)}</code></details></div>`).join("")}
    <div class="muted">New tasks from ${failed.length > 1 ? "these trackers" : "this tracker"} will not appear while it is unavailable; Mako checks again on its own.
      <button class="ghost" id="poll-again">Check now</button>
      <button class="ghost" id="down-hide" data-ids="${esc(failed.map(([id]) => id).join("\n"))}" title="Do not show for an hour; if the tracker is still unavailable, the alert will come back">Hide for an hour</button></div></div>`;
}

// The trackers put on pause one by one: not searched until "Resume"; the others are.
function pausedHTML(ts) {
  if (!ts.length) return "";
  return `<div class="banner paused">${ts.map((t) =>
    `<div class="paused-row"><span class="pt"><b>⏸ ${esc(t.name)}${t.host ? ` · ${esc(t.host)}` : ""}</b>: search for new tasks is paused</span>
      <button data-resume-tracker="${esc(t.id)}">Resume</button></div>`).join("")}</div>`;
}

function limitHoldHTML(h) {
  if (!h) return "";
  const queued = data.records.filter((r) => !r.archivedAt && r.status === "queued").length;
  const working = data.records.filter((r) => !r.archivedAt && r.status === "handed-off").length;
  return `<div class="banner"><div><b>Claude limit (${esc(h.window)}) is ${h.used}% used</b> (threshold ${h.pct}%): new tasks will not start${queued ? ` (${queued} queued)` : ""}. The limit resets ${resetTime(h.resetsAt)}, and the queue will continue on its own.</div>`
    + (working ? `<div>Agents at work (${working}) keep going, but may stop when the limit runs out.</div>` : "") + `</div>`;
}

function visible() {
  return data.records.filter((r) => (showArchive ? r.archivedAt : !r.archivedAt) && (!project || r.task.project === project));
}

// "Update Mako": a button when Mako's own main branch has new commits, "Updating…" while they install.
function updateHTML(u) {
  if (!u || (!u.count && !u.state)) return "";
  const busy = ["building", "restarting", "waiting"].includes(u.state);
  // The failure in a line; what went wrong in full is in the issue filed about it.
  const failed = u.state === "failed" ? `<div class="update-error"><b>Update failed, nothing was changed.</b> <span class="muted">${esc(u.error || "")}</span>${u.issue ? ` <a href="${esc(u.issue)}" target="_blank" rel="noopener">Task ↗</a>` : ""}</div>` : "";
  const waiting = u.state === "waiting" && u.busy > 0;
  const button = waiting ? `<span class="muted">Waiting for ${u.busy} ${u.busy === 1 ? "agent" : "agents"} to finish the turn; new tasks will start after the update</span>`
      + `<button id="update-now" class="danger" title="Agents will be interrupted">Restart now</button><button id="update-cancel">Cancel</button>`
    : busy ? `<span class="muted">Updating…</span>` : u.count ? `<button class="primary" id="update-btn">${u.state === "failed" ? "Try again" : "Update"}</button>` : "";
  if (!button && !failed) return "";
  return `<div class="banner update"><div class="update-head"><b>Mako update</b>${button}</div>${failed}</div>`;
}

// A newer release of Mako, for one installed from a release: a link to download it, hidden until the next one.
function releaseHTML(r) {
  if (!r) return "";
  return `<div class="banner update"><div class="update-head"><b>Mako ${esc(r.version)} is available</b>`
    + `<a class="button primary" href="${esc(r.url)}" target="_blank" rel="noopener">Download</a>`
    + `<span class="spacer"></span><button type="button" class="icon" id="release-hide" title="Hide until the next version" aria-label="Hide until the next version">×</button></div>`
    + (r.notes ? `<div class="muted">${esc(r.notes)}</div>` : "") + `</div>`;
}

function render() {
  $("update").innerHTML = updateHTML(data.update);
  $("release").innerHTML = releaseHTML(data.release);
  const rh = $("release-hide");
  if (rh) rh.onclick = async () => { rh.disabled = true; await fetch("/api/release/dismiss?version=" + encodeURIComponent(data.release.version), { method: "POST" }); await load(); };
  $("limit-hold").innerHTML = limitHoldHTML(data.limitHold);
  const ub = $("update-btn");
  if (ub) ub.onclick = async () => { ub.disabled = true; await fetch("/api/update", { method: "POST" }); await load(); };
  const un = $("update-now");
  if (un) un.onclick = async () => {
    if (!confirm("Restart Mako now? Running agents will be interrupted.")) return;
    un.disabled = true; await fetch("/api/update/now", { method: "POST" }); await load();
  };
  const uc = $("update-cancel");
  if (uc) uc.onclick = async () => { uc.disabled = true; await fetch("/api/update/cancel", { method: "POST" }); await load(); };
  $("problems").innerHTML = data.problems?.length
    ? `<div class="banner">${data.problems.map((p) => `<div>${esc(p)}</div>`).join("")}${data.remote ? "" : `<a href="/settings">${t("b.openSettings")}</a>`}</div>` : "";
  $("pause").innerHTML = data.paused ? ICON.play : ICON.pause;
  $("pause").title = $("pause").ariaLabel = data.paused ? t("b.resume") : t("tray.pause");
  $("pause").classList.toggle("on", !!data.paused);
  // "Restart when agents finish their turn": Mako waits for the agents that work now, then restarts.
  const rs = data.restart || {};
  $("restart").classList.toggle("on", !!rs.pending);
  // ☕: on — the Mac does not fall asleep while agents work (lit while it is being kept awake); off — crossed out.
  const aw = data.awake ?? {};
  $("awake").classList.toggle("off", !aw.on);
  $("awake").classList.toggle("awake", !!aw.on && !!aw.active);
  $("awake").title = $("awake").ariaLabel = !aw.on ? "Mac sleeps as usual. Click to keep it awake while agents work"
    : aw.active ? "Mac will stay awake: agents are working. Click to allow sleep"
    : "Mac will stay awake while agents work. Click to allow sleep";
  // Mako's own errors not sent for analysis yet: a dot on "Stats", where they are listed.
  const faults = (data.faults || []).filter((f) => !f.reported).length;
  $("stats-btn").classList.toggle("fault", faults > 0);
  $("stats-btn").title = $("stats-btn").ariaLabel = faults ? `Stats · Mako errors: ${faults}` : "Stats";
  $("restart").title = $("restart").ariaLabel = rs.pending ? "Cancel restart" : "Restart Mako when agents finish their turn";
  $("restart-note").innerHTML = rs.pending
    ? `<span class="waiting-chip" title="${esc((rs.busy || []).join(", "))}">${rs.busy?.length ? `Restart when agents finish their turn: ${rs.busy.length}` : "Restarting…"}</span>` : "";
  const live = data.records.filter((r) => !r.archivedAt);
  const doing = live.filter((r) => r.column === "doing").length;
  $("wip").className = "wip" + (data.wipLimit && doing >= data.wipLimit ? " full" : "");
  const waiting = live.filter((r) => agentOf(r)?.state === "waiting").length;
  // New tasks go to Orca or to Mako's own terminal.
  const where = data.executor === "terminal" ? t("b.col.doing") : t("b.inOrca");
  COLUMNS.find(([c]) => c === "doing")[1] = where;
  LABEL.doing = where.toLowerCase();
  // On a phone the word goes: «2/5» fits next to the limits.
  $("wip").innerHTML = `<span class="w">${where} </span><b>${doing}</b>` + (data.wipLimit ? `<span class="w"> ${t("b.of")} </span><span class="sl">/</span>${data.wipLimit}` : "");
  $("wip").title = data.wipLimit ? `${where}: ${doing} of ${data.wipLimit}` : `${where}: ${doing}`;
  $("waiting").innerHTML = waiting ? `<span class="waiting-chip" title="Waiting for you: ${waiting}"><span class="dot"></span><span class="wt">waiting for you: </span>${waiting}</span>` : "";
  document.title = waiting ? `(${waiting}) Mako` : "Mako";
  $("limits").innerHTML = limitsHTML(data.limits);
  const searches = Object.entries(data.searches);
  const failed = searches.filter(([, s]) => s.error);
  // Replaced only when it changes, so an open "Details" stays open between refreshes.
  const pausedTrackers = (data.trackers || []).filter((t) => t.paused);
  const down = (data.paused ? "" : downHTML(failed)) + pausedHTML(pausedTrackers);
  if ($("trackers-down").dataset.html !== down) {
    $("trackers-down").innerHTML = $("trackers-down").dataset.html = down;
    const pt = $("poll-again");
    if (pt) pt.onclick = () => $("poll").click();
    const dh = $("down-hide");
    if (dh) dh.onclick = () => { snoozeDown(dh.dataset.ids.split("\n")); render(); };
    for (const b of $("trackers-down").querySelectorAll("[data-pause-tracker], [data-resume-tracker]")) b.onclick = async () => {
      b.disabled = true;
      const pause = b.dataset.pauseTracker !== undefined;
      await fetch(`/api/tracker-pause?id=${encodeURIComponent(pause ? b.dataset.pauseTracker : b.dataset.resumeTracker)}&on=${pause ? 1 : 0}`, { method: "POST" });
      await load();
    };
  }
  const allPaused = data.paused || (pausedTrackers.length && pausedTrackers.length === (data.trackers || []).length);
  $("search").className = "search" + (failed.length ? " err" : "");
  $("search").textContent = failed.length
    ? `Unavailable:  ${failed.map(([id]) => id).join(", ")}`
    : allPaused ? "Task search is paused"
    : searches.length ? `Checked ${ago(searches.map(([, s]) => s.at).sort().pop())}` : "First tracker check…";
  $("search").title = $("search").textContent;

  // the projects, with how many tasks are on the board
  const counts = {};
  for (const r of live) counts[r.task.project] = (counts[r.task.project] || 0) + 1;
  const projects = Object.keys(counts).sort();
  if (project && (!counts[project] || projects.length < 2)) project = "";
  const archived = data.records.filter((r) => r.archivedAt).length;
  // One line for what the list shows: all tasks, a project's, or the archive.
  // Projects are prefixed so none can pass for the archive. (No NUL here: HTML turns it into U+FFFD.)
  const scope = showArchive ? "archive" : project ? "p:" + project : "";
  // A single project would only repeat "All tasks".
  const options = `<option value="">All tasks ·  ${live.length}</option>` +
    (projects.length > 1 ? projects.map((p) => `<option value="p:${esc(p)}" title="${esc(p)}">${esc(p.split("/").pop())} · ${counts[p]}</option>`).join("") : "") +
    (archived ? `<option value="archive">Archive ·  ${archived}</option>` : "");
  if ($("scope").dataset.options !== options) { $("scope").innerHTML = options; $("scope").dataset.options = options; }
  $("scope").value = scope;
  const many = visible().length > FILTER_FROM;
  if (!many && !$("q").value) query = "";
  $("scope").hidden = projects.length < 2 && !archived;
  $("q").hidden = !many && !query;
  $("filter").hidden = $("scope").hidden && $("q").hidden;
  $("q").oninput = () => { query = $("q").value; render(); };
  $("scope").onchange = () => {
    const v = $("scope").value;
    showArchive = v === "archive";
    if (!showArchive) { project = v.replace(/^p:/, ""); try { localStorage.setItem("mako-project", project); } catch {} }
    render();
  };

  // The filter matches the title, the number ("#12", "PROJ-12") and the project.
  const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows = visible().filter((r) => {
    const hay = `${r.task.title} ${r.id} ${r.task.project}`.toLowerCase();
    return words.every((w) => hay.includes(w));
  });
  let html = "";
  for (const [col, title] of COLUMNS) {
    const rank = (r) => ATTENTION[agentOf(r)?.state] ?? 9;
    // "New": the clear and small ones first, the not estimated last.
    const newRank = (r) => { const e = estimated(r); return e ? SIZE_RANK[e.size] * 5 + (5 - (e.clarity?.value || 0)) : 99; };
    // A held-up task keeps its column for its actions, but is listed under "Blocked".
    const items = rows.filter((r) => groupOf(r) === col).sort((a, b) => (col === "new" || col === "later" ? newRank(a) - newRank(b) : col === "doing" ? rank(a) - rank(b) : 0));
    // Others' MRs where I am a reviewer: open ones in "Reviews for me", finished ones in "Done".
    const asks = col === "forme" || col === "done" ? reviewAsks(words).filter((q) => (q.state === "open") === (col === "forme")) : [];
    if (!items.length && !asks.length) continue;
    // While filtering, every match shows: a folded group would hide what was asked for.
    const fold = !words.length && !!folded[col];
    html += `<div class="group-box"><button class="group${fold ? " folded" : ""}" data-col="${col}" aria-expanded="${!fold}">${ICON.chevron}${title}<span class="n">${items.length + asks.length}</span></button>`;
    for (const q of fold ? [] : asks) html += reviewAskRow(q);
    for (const r of fold ? [] : items) {
      const st = state(r);
      // The card shows the task's status; its number is in the tooltip and the task's panel. A plain task needs no
      // "Task" badge in the narrow list (a bug keeps "Bug"): the room goes to the status.
      const [say, tone, more] = cardStatus(r), why = r.error && r.status !== "cancelled" ? r.error : more ?? say;
      html += `<button class="item ${r.id === selected ? "sel" : ""} ${st === "later" ? "later" : ""}" data-id="${esc(r.id)}" title="${esc(r.id)} · ${esc(r.task.title)}">
        <span class="t">${esc(r.task.title)}</span>
        <span class="m"><span class="s ${r.error && r.status !== "cancelled" ? "failed" : st}"></span>${trackerMark(r.task)}${prioBadge(r.task)}${r.type === "fix" ? kind(r) : ""}<span class="say ${tone}" title="${esc(why)}">${esc(say)}</span>${r.column === "new" && estimated(r) ? `<span class="size ${esc(r.estimate.size)}" title="Estimate in advance:  ${esc(SIZE_NAMES[r.estimate.size] ?? "")}, description ${r.estimate.clarity?.value || 0}/5">${SIZE_NAMES[r.estimate.size] ?? ""}</span>` : ""}${reviewBadge(r)}${checksBadge(r)}<span class="ago" title="${esc(ago(r.updatedAt))}">${agoShort(r.updatedAt)}</span></span></button>`;
    }
    html += `</div>`;
  }
  $("new-task").hidden = !newTaskTargets().length;
  $("list").innerHTML = html || `<div class="empty">${words.length ? "Nothing found" : showArchive ? "The archive is empty" : "No tasks. Mako checks the trackers and will show new tasks assigned to you here."}</div>`;
  for (const b of $("list").querySelectorAll(".item")) b.onclick = () => select(b.dataset.id);
  for (const b of $("list").querySelectorAll(".group")) b.onclick = () => {
    if (words.length) return;
    folded[b.dataset.col] = !folded[b.dataset.col];
    try { localStorage.setItem("mako-folded", JSON.stringify(folded)); } catch {}
    render();
  };
  renderDetail();
}

// "Reviews for me": the MRs to review the list shows now (not in the archive; by the project and the filter).
function reviewAsks(words) {
  if (showArchive) return [];
  return (data.reviewRequests || []).filter((q) => (!project || q.project === project)
    && words.every((w) => `${q.title} ${q.ref} ${q.project} ${q.author}`.toLowerCase().includes(w)));
}
const DONE_WHY = { merged: "merged", closed: "MR closed", approved: "you approved" };
const sizeHTML = (q) => `<span class="mr-size" title="Lines added / removed"><span class="add">+${q.additions}</span> <span class="del">−${q.deletions}</span></span>`;
const ciDot = (ci) => { const [icon, text] = CI[ci] ?? []; return icon ? `<span class="ci-dot ${icon}" title="${esc(text)}"></span>` : ""; };
function reviewAskRow(q) {
  const say = q.state === "open" ? `${q.ref} · ${q.author}` : DONE_WHY[q.done] ?? "done";
  const since = q.state === "open" ? q.since : q.doneAt;
  return `<button class="item rq ${q.id === selected ? "sel" : ""}" data-id="${esc(q.id)}" title="${esc(q.project)}${esc(q.ref)} · ${esc(q.title)}">
    <span class="t">${esc(q.title)}</span>

  const q = `id=${encodeURIComponent(r.id)}`, path = fileTab;
  // Each part is drawn as it comes: the changes need not wait for the code host's MR.
  const part = (url, set, empty) => url && getJSON(url).then((v) => {

async function openFile(path) {

    if (!h && DIFF_META.test(l)) continue;
    if (l.startsWith("\\")) continue; // "\ No newline at end of file"
    const t = l[0];

    if (!h) { h = { rows: [] }; d.hunks.push(h); } // an edit without hunk headers: a tool card's
    const row = t === "+" ? { t, n: n++, s: l.slice(1) } : t === "-" ? { t, o: o++, s: l.slice(1) } : { t, o: o++, n: n++, s: l.slice(1) };
    row.i = d.rows.length;
    d.rows.push(row);

    let k = j; while (k < rows.length && rows[k].t === "+") k++;

      let suf = 0; while (suf < ta.length - pre && suf < tb.length - pre && ta[ta.length - 1 - suf] === tb[tb.length - 1 - suf]) suf++;
      const pa = ta.slice(0, pre).join("").length, sa = ta.slice(ta.length - suf).join("").length, sb = tb.slice(tb.length - suf).join("").length;

// The diff: line numbers, the changed words marked, unchanged lines between hunks folded; one column or side by side.

      <span class="dpath" title="${esc(path)}"><span class="ddir">${esc(path.slice(0, cut))}</span><span class="dname">${esc(path.slice(cut))}</span></span>
      <span class="num">${f?.additions ? `<span class="add">+${f.additions}</span>` : ""}${f?.deletions ? ` <span class="del">−${f.deletions}</span>` : ""}</span>
      <span class="dnav"><button type="button" class="icon" data-dnav="-1" title="Previous change" aria-label="Previous change">↑</button><button type="button" class="icon" data-dnav="1" title="Next change" aria-label="Next change">↓</button></span>
      <span class="seg" role="group" aria-label="How much of the file">${scope}</span>
      <span class="seg" role="group" aria-label="Diff view">${seg}</span>
      ${data.editor ? `<button type="button" class="icon" data-open-file="${esc(path)}" title="Open in ${esc(data.editor)}" aria-label="Open in ${esc(data.editor)}">${ICON.code}</button>` : ""}
    </div>${path in diffs ? diffHTML(diffs[path], diffMode, canNote ? noteAnnotations(r.id, path) : null) : `<div class="diff"><div class="diff-note">Loading…</div></div>`}${canNote ? reviewBar(r.id) : ""}</div>`;
}

// The changed files as a tree of folders; a folder with only one folder inside shares its row («src/app»).
function fileTree(files) {
  const root = { dirs: {}, files: [] };
  for (const f of files) {
    let n = root;
    for (const d of f.path.split("/").slice(0, -1)) n = n.dirs[d] ??= { dirs: {}, files: [] };
    n.files.push(f);
  }
  return root;
}
function treeHTML(node, depth, prefix, ST) {
  let out = "";
  for (const name of Object.keys(node.dirs).sort()) {
    let label = name, path = prefix + name, child = node.dirs[name];
    while (!child.files.length && Object.keys(child.dirs).length === 1) {
      const [only] = Object.keys(child.dirs);
      label += "/" + only; path += "/" + only; child = child.dirs[only];
    }
    const shut = collapsed.has(path);
    out += `<button class="dir" data-dir="${esc(path)}" style="--d:${depth}" title="${esc(path)}"><span class="tw">${shut ? "▸" : "▾"}</span><span class="fname">${esc(label)}</span></button>`;
    if (!shut) out += treeHTML(child, depth + 1, path + "/", ST);
  }
  for (const f of node.files.sort((a, b) => a.path.localeCompare(b.path))) {
    out += `<button class="file ${f.path === fileTab ? "on" : ""}" data-file="${esc(f.path)}" style="--d:${depth}" title="${esc(f.path)} · ${ST[f.status] ?? f.status}">
      <span class="st st-${f.status === "?" ? "N" : esc(f.status)}">${f.status === "?" ? "+" : esc(f.status)}</span>
      <span class="fname">${esc(f.path.split("/").pop())}</span>
      <span class="num">${f.additions ? `<span class="add">+${f.additions}</span>` : ""}${f.deletions ? ` <span class="del">−${f.deletions}</span>` : ""}</span></button>`;
  }
  return out;
}

// The right panel (changes, commits, MR) only when it has something: a worktree that is still there, or an open
// MR. A finished task keeps its worktree's path after the worktree is gone: until the changes say, it has none.
function showSide(r) {
  if (r.column === "review") return true;
  if (changes) return !changes.error;
  return r.column === "doing" || !!r.worktree && (r.column === "failed" || r.worktreeKept > 0);
}
// Next to the agent: what its branch changed. A file opens as a tab over the terminal.
function workArea(r, term, taskPane = "") {
  const files = changes?.files ?? [];
  const ST = { A: "added", M: "modified", D: "deleted", R: "renamed", "?": "new, not committed" };
  const list = changes?.error ? `<div class="files-empty">${esc(changes.error)}</div>`
    : !changes ? `<div class="files-empty">Loading changes…</div>`
    : files.length ? treeHTML(fileTree(files), 0, "", ST)
    : `<div class="files-empty">The agent has not changed anything yet</div>`;
  const commits = changes?.commits?.length ? `<div class="files-h">Commits<span class="n">${changes.commits.length}</span></div>` +
    changes.commits.map((c) => `<div class="commit" title="${esc(c.hash)} ${esc(c.subject)}">${esc(c.subject)}</div>`).join("") : "";
  // An agent that is not running: say so over its terminal, with the way to start it again.
  const idle = term && !r.live ? `<div class="term-idle"><div>Agent stopped</div>
      <button type="button" class="resume-btn" data-a="resume">${ICON.play}Resume conversation</button></div>` : "";
  const onTask = tab === "task" && taskPane;
  const chatView = r.view === "chat";
  const main = (term ? `<div id="term-slot" class="${fileTab || onTask ? "away" : ""}">${chatView ? "" : idle}</div>` : "") +
    (onTask ? taskPane : fileTab ? diffView(r, fileTab) : term ? "" : `<div class="files-empty pick">Pick a file on the right to see its changes</div>`);
  const side = showSide(r) ? `<div class="inspector">${branchCard(r, term)}${inspectorTabs(r, term, files.length, list)}</div>` : "";
  return `<div class="split${side ? "" : " solo"}"><div class="split-main">${main}</div>${side}</div>`;
}

// The commits as Orca draws them: a lane per line of history, a dot per commit, merges curving into it.
const LANE_COLORS = ["#4c8dff", "#e5a23b", "#d6457a", "#c4906b", "#3fb39b", "#9b7be8", "#7aa83c"];
function graphRows(commits) {
  const lanes = [], rows = [];
  for (const c of commits) {
    let col = lanes.indexOf(c.hash);
    const fresh = col < 0;
    if (fresh) { col = lanes.indexOf(null); if (col < 0) col = lanes.length; lanes[col] = c.hash; }
    const before = lanes.slice();
    const joins = before.map((h, i) => (h === c.hash && i !== col ? i : -1)).filter((i) => i >= 0);
    for (const i of joins) lanes[i] = null;
    lanes[col] = c.parents[0] ?? null;
    const forks = [];
    for (const p of c.parents.slice(1)) {
      let i = lanes.indexOf(p);
      if (i < 0) { i = lanes.indexOf(null); if (i < 0) i = lanes.length; lanes[i] = p; }
      forks.push(i);
    }
    while (lanes.length && lanes[lanes.length - 1] === null) lanes.pop();
    rows.push({ col, fresh, before, after: lanes.slice(), joins, forks });
  }
  return rows;
}
function commitGraph(commits) {
  if (!commits.length) return `<div class="files-empty">No commits yet</div>`;
  const rows = graphRows(commits), H = 28, W = 14, R = 6;
  const width = Math.max(...rows.map((r) => Math.max(r.before.length, r.after.length, r.col + 1))) * W + 6;
  const x = (i) => R + i * W, color = (i) => LANE_COLORS[i % LANE_COLORS.length];
  const line = (x1, y1, x2, y2, c) => x1 === x2 ? `<path d="M${x1} ${y1}V${y2}" stroke="${c}"/>`
    : `<path d="M${x1} ${y1}C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2}" stroke="${c}"/>`;
  return `<div class="cg">${commits.map((c, n) => {
    const r = rows[n];
    let svg = "";
    r.before.forEach((h, i) => {
      if (h === null || i === r.col || r.joins.includes(i)) return;
      svg += line(x(i), 0, x(i), H, color(i));
    });
    if (!r.fresh) svg += line(x(r.col), 0, x(r.col), H / 2, color(r.col));
    for (const i of r.joins) svg += line(x(i), 0, x(r.col), H / 2, color(i));
    if (r.after[r.col] != null) svg += line(x(r.col), H / 2, x(r.col), H, color(r.col));
    for (const i of r.forks) svg += line(x(r.col), H / 2, x(i), H, color(i));
    svg += c.parents.length > 1
      ? `<circle cx="${x(r.col)}" cy="${H / 2}" r="4.5" fill="var(--card)" stroke="${color(r.col)}" stroke-width="2.2"/>`
      : `<circle cx="${x(r.col)}" cy="${H / 2}" r="3.5" fill="${color(r.col)}"/>`;
    const refs = (c.refs ?? []).map((ref) => {
      const head = ref.startsWith("HEAD -> "), name = ref.replace(/^HEAD -> /, "").replace(/^tag: /, "");
      return `<span class="cg-ref ${head ? "head" : ref.startsWith("origin/") ? "remote" : ref.startsWith("tag: ") ? "tag" : ""}" title="${esc(ref)}">${esc(name)}</span>`;
    });
    const open = commitOpen[c.hash];
    const when = new Date(c.at * 1000).toLocaleString(LANG, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<div class="cg-row ${c.mine ? "mine" : ""}" title="${esc(c.hash.slice(0, 8))} · ${esc(c.author)} · ${esc(when)}">
        <svg class="cg-lanes" width="${width}" height="${H}" fill="none" stroke-width="1.6" aria-hidden="true">${svg}</svg>
        <button type="button" class="cg-toggle" data-commit="${esc(c.hash)}" aria-label="${open ? "Collapse" : "Expand"} commit">${open ? "▾" : "›"}</button>
        <span class="cg-subj">${esc(c.subject)}</span>${refs.slice(0, 2).join("")}${refs.length > 2 ? `<span class="cg-ref more">+${refs.length - 2}</span>` : ""}</div>
      ${open ? `<div class="cg-detail" style="margin-left:${width + 18}px">${open === "loading" ? "Loading…" : open.error ? esc(open.error)
        : `<div class="cg-msg">${esc(open.message.trim())}</div>${open.files.map((f) => `<div class="cg-file"><b class="st-${f.status === "?" ? "N" : esc(f.status)}">${esc(f.status)}</b><span>${esc(f.path)}</span>${f.additions ? `<span class="add">+${f.additions}</span>` : ""}${f.deletions ? `<span class="del">−${f.deletions}</span>` : ""}</div>`).join("")}`}</div>` : ""}`;
  }).join("")}</div>`;
}

// CI running: a spinning arc, not the «⟳» glyph, which fonts draw small and off-centre in the badge.
const IBADGE_SPIN = `<svg class="spin" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" role="img" aria-label="CI is running"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>`;

// The right panel's tabs: the changes, the commits, the MR with its CI; the card keeps its size, the tab scrolls.
// tabPicked: you chose the open task's tab yourself; Mako does not switch it for you then.
let itab = "changes", itabPicked = false, tabPicked = false;
function inspectorTabs(r, term, nFiles, list) {
  const c = review?.review, cs = changes?.commits ?? [];
  const mrBadge = !r.prUrl ? ["—", ""] : r.reviewState === "merged" || c?.state === "merged" ? ["✓", "merged"]
    : !c ? ["", ""] : c.ci === "failed" || c.conflicts ? ["!", "bad"] : c.threads.length ? [String(c.threads.length), "warn"]
    : ["running", "pending", "created"].includes(c.ci) ? ["⟳", "run"] : c.mergeable ? ["✓", "ok"] : ["", ""];
  const nCommits = commitLog ? `${commitLog.commits.length}${commitLog.more ? "+" : ""}` : String(cs.length);
  const tabs = [["changes", "Changes", [String(nFiles), ""]], ["commits", "Commits", [nCommits, ""]], ["mr", "MR", mrBadge]];
  const panel = itab === "commits" ? (commitLog ? commitGraph(commitLog.commits) : `<div class="files-empty">Loading history…</div>`)
    : itab === "mr" ? mrCard(r, term)
    : `${changes?.base ? `<div class="files-sub">from ${esc(changes.base)}</div>` : ""}${list}`;
  return `<div class="insp-card"><div class="itabs" role="tablist">${tabs.map(([k, label, [badge, cls]]) =>
      `<button type="button" role="tab" class="itab ${itab === k ? "on" : ""}" data-itab="${k}">${label}${badge ? `<span class="ibadge ${cls}">${cls === "run" ? IBADGE_SPIN : esc(badge)}</span>` : ""}</button>`).join("")}</div>
    <div class="insp-panel">${panel}</div></div>`;
}

// The MR: its CI, review threads and conflicts, each with what fixes it; then "Update MR" and "Merge".
const MR_ICON = {
  bad: `<svg class="mi bad" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>`,
  ok: `<svg class="mi ok" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>`,
  run: `<svg class="mi run" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  idle: `<svg class="mi idle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>`,
  talk: `<svg class="mi talk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>`,
};
const CI = { failed: ["bad", "CI failed"], running: ["run", "CI running"], pending: ["run", "CI pending"], created: ["run", "CI pending"],
  preparing: ["run", "CI pending"], waiting_for_resource: ["run", "CI pending"], scheduled: ["run", "CI scheduled"], success: ["ok", "CI passed"],
  canceled: ["idle", "CI canceled"], skipped: ["idle", "CI skipped"], manual: ["idle", "CI waits for a manual run"] };
const plural = (n, one, many) => (n === 1 ? one : many);
// One line of a card: a status icon, what it is (a link when it has one), and the button that fixes it.
const row = (icon, text, href, btn = "") => `<div class="mr-row">${MR_ICON[icon]}${href
  ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text)}</a>` : `<span>${esc(text)}</span>`}${btn}</div>`;
// A section of a card: its name (and a note to it on the right), then its lines.
const sec = (title, body, note = "") => `<div class="mr-sec"><div class="mr-sec-h"><span class="files-h-t">${esc(title)}</span>${note ? `<span class="mr-sec-n">${esc(note)}</span>` : ""}</div>${body}</div>`;
// The tracker's priority in words ("Highest", "P1", "urgent") as a tone: hot, high, mid (unknown) or low.
function prioTone(p) {
  const s = String(p).toLowerCase();
  if (/block|crit|urgent|highest|^p0$|^p1$|^1$/.test(s)) return "hot";
  if (/high|^p2$|^2$/.test(s)) return "high";
  if (/low|trivial|^p3$|^p4$|^[3-5]$/.test(s)) return "low";
  return "mid";
}
const prioBadge = (t) => t.priority ? `<span class="prio ${prioTone(t.priority)}" title="Priority: ${esc(t.priority)}">${esc(t.priority)}</span>` : "";
// ✨: the agent in the terminal does it; only while it runs.
const fixBtn = (live, kind, label) => live ? `<button type="button" class="fix-btn" data-ask="${kind}" title="${label}" aria-label="${label}">${ICON.fix}</button>` : "";
const commits = (n) => `${n} ${plural(n, "commit", "commits")}`;

// The branch: against its base and its remote, uncommitted work; copy its name, open it in Finder or the editor.
// Until git answers it holds its place, the name from the task, so the panel does not jump when the state comes.
function branchCard(r, term) {
  const b = changes ? changes.branch : { name: r.branch || r.branchName || "", loading: true };
  if (!b) return "";
  const live = term && r.live;
  let rows = "";
  if (b.loading) rows = `<div class="mr-row"><span style="color:var(--mute)">Checking the branch…</span></div><div class="mr-row"></div>`;
  else {
    rows = b.behind ? row("idle", `${commits(b.behind)} behind ${b.base}`, "", fixBtn(live, "rebase", `The agent will update the branch from ${b.base}`))
      : row("ok", `Up to date with ${b.base}`);
    if (b.unpushed) rows += row("run", `${commits(b.unpushed)} not pushed`, "", fixBtn(live, "push", "The agent will push the branch"));
    else if (b.pushed) rows += row("ok", "Everything is pushed");
    if (b.dirty) rows += row("idle", `${b.dirty} ${plural(b.dirty, "file", "files")} not committed`);
  }
  return `<div class="mr-card"><div class="mr-h"><span class="files-h-t">Branch</span>
      <code class="branch-name">${esc(b.name)}</code>
      ${b.name ? `<button type="button" class="icon" data-copy="${esc(b.name)}" title="Copy branch name" aria-label="Copy branch name">${ICON.copy}</button>` : ""}
      <button type="button" class="icon" data-open="finder" title="Show in Finder" aria-label="Show in Finder">${ICON.folder}</button>
      ${data.editor ? `<button type="button" class="icon" data-open="editor" title="Open in ${esc(data.editor)}" aria-label="Open in ${esc(data.editor)}">${ICON.code}</button>` : ""}
    </div>${rows}</div>`;
}

// The pipeline's jobs, a line each with its state in words, under their stage's name (GitLab has stages).
const JOB = { success: ["ok", "✓", "passed"], failed: ["bad", "✗", "failed"], running: ["run", "⟳", "running"], pending: ["wait", "◷", "waiting"],
  created: ["wait", "◷", "waiting"], preparing: ["wait", "◷", "preparing"], waiting_for_resource: ["wait", "◷", "waiting"], scheduled: ["wait", "◷", "scheduled"],
  manual: ["idle", "▶", "manual"], canceled: ["idle", "⊘", "canceled"], skipped: ["idle", "⊘", "skipped"] };
function jobsHTML(jobs) {
  if (!jobs?.length) return "";
  const stages = [];
  for (const j of jobs) {
    let st = stages.find((x) => x.name === (j.stage || ""));
    if (!st) stages.push((st = { name: j.stage || "", jobs: [] }));
    st.jobs.push(j);
  }
  return `<div class="stages">${stages.map((st) => `<div class="stage">${st.name ? `<span class="stage-name">${esc(st.name)}</span>` : ""}${st.jobs.map((j) => {
    const allowed = j.status === "failed" && j.allowFailure;
    const [cls, mark, word] = allowed ? ["warn", "!", "failed, allowed"] : JOB[j.status] ?? ["idle", "•", j.status];
    return `<a class="job ${cls}" href="${esc(j.url)}" target="_blank" rel="noopener" title="${esc(j.name)}: ${esc(word)}"><span class="jm">${mark}</span><span class="jn">${esc(j.name)}</span><span class="js">${esc(word)}</span></a>`;
  }).join("")}</div>`).join("")}</div>`;
}

function mrCard(r, term) {
  const live = term && r.live, c = review?.review;
  const num = r.prUrl?.match(/\/(?:merge_requests|pull)\/(\d+)/)?.[1];
  const state = c?.state ?? (r.reviewState || (r.prUrl ? "open" : ""));
  const waitCI = r.status === "handed-off" && !!r.prUrl && state === "open";
  const fix = (kind, label) => fixBtn(live, kind, label);
  let rows = "";
  if (!r.prUrl) rows = `<div class="muted mr-none">None yet: the agent opens the MR when it finishes</div>`;
  else if (review?.error) rows = `<div class="mr-none mr-err">${esc(review.error)}</div>`;
  else if (!c) rows = `<div class="muted mr-none">Checking the MR…</div>`;
  else if (c.state === "open") {
    if (c.ci) {
      const [icon, text] = CI[c.ci] ?? ["run", `CI: ${c.ci}`];
      const n = c.jobs?.length || 0;
      rows += sec("CI", row(icon, c.ci === "failed" && c.failed.length ? `${text}: ${c.failed.map((j) => j.name).join(", ")}` : text, c.ciUrl,
        c.ci === "failed" && c.failed.length ? fix("ci", "The agent will fix CI in the terminal") : "") + jobsHTML(c.jobs),
        n ? `${n} ${plural(n, "job", "jobs")}` : "");
    } else rows += sec("CI", row("idle", "No CI"));
    let merging = "";
    if (c.threads.length) {
      const n = c.threads.length;
      merging += row("talk", `${n} review ${plural(n, "comment", "comments")}`, c.threads[0].url, fix("comments", "The agent will fix the comments in the terminal"));
    }
    merging += c.conflicts ? row("bad", "Conflicts with the main branch", "", fix("conflicts", "The agent will resolve the conflicts in the terminal")) : row("ok", "No conflicts");
    rows += sec("Merging", merging);
  }
  rows += reviewSection(r);
  // The MR's own actions sit in its header, as icons: open it, update it, merge it.
  const icon = (attr, label, name, cls = "", disabled = false) =>
    `<button type="button" class="icon ${cls}" ${attr} title="${esc(label)}" aria-label="${esc(label)}" ${disabled ? "disabled" : ""}>${ICON[name]}</button>`;
  const open = live && !r.prUrl ? icon(`data-ask="open"`, "Open MR: the agent commits, pushes and opens it", "pr") : "";
  const update = live && r.prUrl && state === "open" ? icon(`data-ask="push"`, "Update MR: the agent commits and pushes what it has done", "push") : "";
  const merge = c?.state === "open" && !waitCI ? icon("data-merge", c.mergeable ? "Merge the MR into the main branch" : `Cannot merge yet: ${c.blocked || "GitLab does not allow it"}`,
    "merge", c.mergeable ? "ready" : "", !c.mergeable) : "";
  const close = c?.state === "open" ? icon("data-close-mr", "Close MR without merging", "closeMR", "danger") : "";
  return `<div class="mr-card"><div class="mr-h"><span class="files-h-t">MR</span>
      ${r.prUrl ? `<a href="${esc(r.prUrl)}" target="_blank" rel="noopener">${num ? (r.prUrl.includes("/pull/") ? "#" : "!") + num : "open"}</a>` : ""}
      <span class="muted">${waitCI ? "open · waiting for CI" : { open: "open", merged: "merged", closed: "closed" }[state] ?? ""}</span>
      <span class="spacer"></span>${open}${update}${close}${merge}</div>
    ${rows}${mrNote ? `<div class="mr-note">${esc(mrNote)}</div>` : ""}</div>`;
}

// The checks Mako runs before it opens the MR itself: "Checks: ✓ tests, ✗ lint".
const checkMark = (c) => (c.ok ? "✓" : c.timedOut ? "⏱" : "✗");
const checksLine = (k) => (k.results ?? []).map((c) => `${checkMark(c)} ${c.name}`).join(", ");
const checksTitle = (k) => (k.results ?? []).map((c) => `${checkMark(c)} ${c.command}${c.seconds ? ` · ${c.seconds} s` : ""}${c.timedOut ? " · timed out" : ""}`).join("\n");

function checksBadge(r) {
  const k = r.checks;
  if (!k || r.prUrl || r.status !== "handed-off") return "";
  if (k.state === "running") return `<span class="checks" title="Mako is running the checks before the MR">checks…</span>`;
  if (k.state === "failed") return `<span class="checks bad" title="${esc(checksTitle(k))}">✗ checks</span>`;
  return "";
}
// What failed, as the agent got it: the last lines of each failed command.
function checksHTML(r, card) {
  const k = r.checks;
  if (!k || k.state !== "failed" || r.prUrl) return "";
  const body = k.results.filter((c) => !c.ok).map((c) => `<div class="tcard-b"><code>${esc(c.command)}</code> ${c.timedOut ? `did not finish in time (${c.seconds} s)` : "failed"}
    ${c.tail ? `<pre class="code">${esc(c.tail)}</pre>` : ""}</div>`).join("");
  return card("Checks before the MR failed", body, "", `attempt ${k.fails} · <code>${esc(k.commit.slice(0, 8))}</code>`);
}

// The reviewer agent's rounds over the branch: the last one as a line of the MR card, all of them in the task. It
// starts only from "Review"; its remarks wait in the task for your "Fix".
const REVIEW_STATE = { running: ["run", "The reviewer agent is reviewing the branch…"], notes: ["talk", "The reviewer left remarks"],
  clean: ["ok", "Agent review passed"], failed: ["bad", "Agent review failed"], skipped: ["idle", "Agent review skipped"] };
const skippedText = (a) => `Agent review skipped${a.reason ? `: ${a.reason}` : ""}`;
const reviewBtn = (label, cls = "ghost", title = "The reviewer agent will read the task and the branch diff and leave remarks in the task; you pass them to the agent with the Fix button") =>
  `<button type="button" class="${cls}" data-a="agentreview" title="${esc(title)}">${label}</button>`;
const skipBtn = () => `<button type="button" class="ghost" data-a="reviewskip" title="No review needed: the reviewer will not run until you change your mind">Skip</button>`;
const reviewFixBtn = () => `<button type="button" class="ghost" data-a="reviewfix" title="Pass the reviewer's remarks to the agent: it fixes them, and you can run the review again">Fix</button>`;
// The agent's advice from its assessment of the finished task: true (do a review), false (not needed), null (none
// yet). An older assessment without it goes by the risk: 4–5 of 5 advise one.
function adviseReview(r) {
  const a = r.assessment;
  if (a?.state !== "done") return null;

}
const ADVISE = "The agent advises a review";
// "Review" in the MR card: what the agent advises, what the reviewer did, and your choice: "Run review" or "Skip".
function reviewSection(r) {
  const a = r.assessment, need = adviseReview(r);
  let advice = "";
  if (a?.state === "running") advice = row("run", "The agent is judging whether a review is needed…");
  else if (need !== null) {
    const why = a.review?.why || (need ? a.risk?.why : "") || "";
    advice = need ? row("talk", ADVISE + (why ? `: ${why}` : "")) : row("ok", "The agent thinks no review is needed" + (why ? `: ${why}` : ""));
  }
  const body = advice + reviewerRow(r, need);
  return body ? sec("Review", body, need === true && !r.agentReviews?.length ? "advised" : "") : "";
}
function reviewerRow(r, need) {
  const last = r.agentReviews?.at(-1), step = r.reviewStep, ready = step === "ready";
  const choice = (label = "Run review") => ready ? `<div class="mr-actions">${reviewBtn(label, "primary")}${skipBtn()}</div>` : "";
  if (step === "running") return row("run", REVIEW_STATE.running[1], "");
  if (!last) return ready ? (need === null ? row("idle", "No review by the reviewer yet") : "") + choice() : "";
  switch (last.state) {
    // Left by a restart of Mako in the middle of a round.
    case "running": return row("bad", "Agent review interrupted", "", ready ? reviewBtn("Try again") : "");
    case "skipped": return row("idle", last.reason === "skipped by you" ? "Review skipped by you" : skippedText(last), "", ready ? reviewBtn("Do it anyway") : "");
    case "failed": return row("bad", REVIEW_STATE.failed[1], "", ready ? reviewBtn("Try again") : "");
    case "notes": {
      const n = last.remarks?.length, what = n ? `${n} ${plural(n, "remark", "remarks")}` : "remarks";
      if (step === "notes") return row("talk", `The reviewer left ${what}: they are in the task` + (last.escalated ? ". The rounds are over: the decision is yours" : ""), "", reviewFixBtn());
      if (!last.sent) return row("talk", `The reviewer left ${what}: you pass them to the agent when it finishes`, "");
      if (step === "fixing") return row("run", "The agent is fixing the reviewer's remarks", "");
      const tally = replyTally(last);
      if (r.agentReviews.some((a) => a.escalated)) return row("bad", "Agent review rounds did not converge: the decision is yours" + (last.replyAt ? ` · the agent replied${tally}` : ""), "",
        ready ? reviewBtn("Another round", "ghost", "Round limit reached: another round is your decision") : "");
      return row(last.unverified ? "bad" : "talk", (last.replyAt ? "The agent replied to the remarks" + tally : "The agent worked on the remarks")
        + (last.unverified ? " · ⚠ says \"fixed\", but there are no new commits" : "") + (ready ? "" : ": no new pushed changes in the branch yet"), "", ready ? reviewBtn("Review again") : "");
    }
  }
  const [icon, text] = REVIEW_STATE[last.state] ?? ["idle", last.state];
  return row(icon, text, "", ready ? reviewBtn("Review again") : "");
}
// «: ✅ 2 · ❌ 1»: how the agent answered on the round's remarks, "" with no answers.
function replyTally(a) {
  const n = (k) => (a.remarks || []).filter((m) => m.reply === k).length;
  const parts = [["✅", n("fixed")], ["◐", n("partial")], ["❌", n("not")]].filter(([, c]) => c).map(([i, c]) => `${i} ${c}`);
  return parts.length ? ": " + parts.join(" · ") : ": no point-by-point report";
}
// The agent's summary, a section per heading: what was done, how it was checked (green), what to look at (amber).
function summaryHTML(text) {
  const parts = md(text).split(/(?=<h4>)/).filter((p) => p.trim());
  return parts.map((p) => {
    const h = p.match(/^<h4>(.*?)<\/h4>/)?.[1] || "";
    const plain = h.replace(/<[^>]+>/g, "").toLowerCase();
    const [cls, ic] = /risk|worth|attention|caution|open question/.test(plain) ? ["warn", "!"] : /check|test|verif/.test(plain) ? ["check", "✓"] : ["done", "✎"];
    return `<div class="sec ${h ? cls : ""}">${h ? `<h4><span class="ic">${ic}</span>${h}</h4>` : ""}${p.replace(/^<h4>.*?<\/h4>/, "")}</div>`;
  }).join("");
}
// «PR #80», «MR !12»: what a link to a merge request is called on the card.
const mrName = (url) => { const m = url.match(/\/pull\/(\d+)/) || url.match(/merge_requests\/(\d+)/); return m ? (url.includes("/pull/") ? `PR #${m[1]}` : `MR !${m[1]}`) : "MR"; };
const initials = (name) => name.split(/[\s._-]+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("") || "?";
// The reviewer in the list: ✓ for a clean last round, ⏳ for remarks that wait for "Fix", 👤 when the rounds
// ran out and the decision is yours.
function reviewBadge(r) {
  const last = r.agentReviews?.at(-1);
  if (!last) return "";
  if (last.state === "clean") return `<span class="reviewed" title="Agent review passed">✓ review</span>`;
  if (last.state !== "notes") return "";
  if (last.escalated && last.sent) return `<span class="remarks human" title="Agent review rounds did not converge: the decision is yours">👤 review</span>`;
  if (last.sent) return "";
  const n = last.remarks?.length;
  return `<span class="remarks" title="The reviewer's remarks are waiting for Fix">⏳ ${n ? `${n} ${plural(n, "remark", "remarks")}` : "remarks"}</span>`;
}
const WEIGHT = { must: "must", should: "should" };
const REPLY = { fixed: ["✅", "fixed"], not: ["❌", "not fixed"], partial: ["◐", "partly"] };
const VERDICT = { closed: ["✅", "closed"], accepted: ["✅", "explanation accepted"], open: ["❌", "not closed"] };
const mark = ([icon, text] = ["⏳", ""], note = "") => `<span class="rm-${icon === "✅" ? "ok" : icon === "❌" ? "bad" : "wait"}">${icon}</span> ${esc(text)}${note ? ` <span class="muted">— ${esc(note)}</span>` : ""}`;
const extLink = (url, label) => /^https?:\/\//.test(url || "") ? `<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>` : "";
// A round's numbered remarks: the remark, the agent's answer, the next round's verdict.
function remarksTable(a, verdicts, answered) {
  const rows = a.remarks.map((m) => {
    const where = m.file ? `<code>${esc(m.file)}${m.line ? `:${m.line}` : ""}</code> ` : "";
    const reply = REPLY[m.reply] ? mark(REPLY[m.reply], m.replyNote) + (a.unverified && m.reply !== "not" ? ` <span class="rm-warn" title="The branch has no new commits after Fix">⚠ no commits</span>` : "")
      : a.sent ? mark(["⏳", answered ? "no reply" : "awaiting report"]) : `<span class="muted">not passed on</span>`;
    const v = verdicts[m.id];
    return `<tr><td><b>${esc(m.id)}</b>${m.again ? ` <span class="muted" title="Not closed in the previous round">↻</span>` : ""}</td><td class="rm-${esc(m.weight)}">${WEIGHT[m.weight] ?? esc(m.weight)}</td>`
      + `<td>${where}${esc(m.text).replace(/\n/g, "<br>")}</td><td>${reply}</td><td>${v ? mark(VERDICT[v.verdict], v.note) : mark()}</td></tr>`;
  }).join("");
  return `<div class="table remarks-table"><table><thead><tr><th>#</th><th>Weight</th><th>Remark</th><th>Agent's reply</th><th>Next round</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function reviewerHTML(r) {
  if (!r.agentReviews?.length) return "";
  // The verdict on each remark from the round after the one that wrote it.
  const verdictsAfter = (i) => {
    const v = {};
    for (const b of r.agentReviews.slice(i + 1)) for (const c of b.checks || []) v[c.id] ??= c;
    return v;
  };
  return `<h3>Agent review</h3>` + r.agentReviews.map((a, i) => {
    const text = a.state === "skipped" ? skippedText(a) : (REVIEW_STATE[a.state] ?? ["", a.state])[1] + (a.sent ? ", passed to the agent" : "");
    const links = [extLink(a.commentUrl, "comment in the task"), extLink(a.mrCommentUrl, "comment in the MR"), extLink(a.replyUrl, "agent's reply"), extLink(a.mrReplyUrl, "agent's reply in the MR")].filter(Boolean).join(" · ");
    const structured = a.remarks?.length || a.checks?.length;
    const checks = a.checks?.length ? `<div class="muted">Previous: ${a.checks.map((c) => `<b>${esc(c.id)}</b> ${mark(VERDICT[c.verdict], c.note)}`).join(" · ")}</div>` : "";
    const body = structured ? checks + (a.remarks?.length ? remarksTable(a, verdictsAfter(i), !!a.replyAt) : "")
      + (a.replyAt && !a.remarks?.some((m) => m.reply) && a.reply ? `<details><summary class="muted">The agent gave no point-by-point report — what it wrote</summary><div class="summary">${md(a.reply)}</div></details>` : "")
      : a.notes ? `<div class="summary">${md(a.notes)}</div>` : "";
    const human = a.escalated ? `<div class="mr-err">👤 The agent review rounds are over, but the "must" remarks are still open: the decision is yours.</div>` : "";
    return `<div class="agent-review ${esc(a.state)}"><div class="muted">Round ${i + 1} · ${new Date(a.at).toLocaleString(LANG)} · <code>${esc(a.commit.slice(0, 8))}</code> · ${esc(text)}${links ? ` · ${links}` : ""}</div>
      ${body}${human}${a.error ? `<div class="mr-err">${esc(a.error)}</div>` : ""}</div>`;
  }).join("");
}

// The agent's rating of a finished task: four scores from 1 to 5 with why, and what the description lacked.
const ASSESS = [["clarity", "Task description", "up"], ["complexity", "Complexity", ""], ["completeness", "Task completed", "up"], ["risk", "Change risk", "down"]];
function assessmentHTML(r, card) {
  if (r.status !== "done") return "";
  const a = r.assessment;
  const btn = (label) => `<button class="ghost" data-a="assess" title="The agent will rate the task description, complexity, completeness and change risk">${label}</button>`;
  if (!a) return card("Agent assessment", `<div class="tcard-b muted">Not assessed yet.</div>`, "", btn("Assess"));
  if (a.state === "running") return card("Agent assessment", `<div class="tcard-b muted">The agent is assessing the task…</div>`);
  if (a.state === "failed") return card("Agent assessment", `<div class="tcard-b mr-err">${esc(a.error || "Could not assess")}</div>`, "", btn("Try again"));
  const rows = ASSESS.map(([k, label, way]) => scoreRow(label, way, a[k])).join("");
  // What the estimate before the start expected, against how hard it turned out.
  const was = r.estimate?.state === "done" && SIZE_NAMES[r.estimate.size], came = SIZE_NAMES[a.size || (a.complexity?.value ? sizeOfComplexity(a.complexity.value) : "")];
  const sizes = was && came ? `<div class="score expected"><span class="k">Size</span><span>expected: <b>${was}</b> → turned out: <b>${came}</b></span></div>` : "";
  const missing = a.missing?.trim() ? `<div class="sec warn"><h4><span class="ic">!</span>What the description lacked</h4>${md(a.missing)}</div>` : "";
  return card("Agent assessment", `<div class="tcard-b scores">${rows}${sizes}</div>${missing}`, "assess", btn("Assess again"));
}
// One score from 1 to 5 as pips; way: "up" — more is better, "down" — less is, "" — neither.
const scoreTone = (way, v) => !way ? "" : (way === "up" ? v : 6 - v) >= 4 ? "good" : (way === "up" ? v : 6 - v) <= 2 ? "bad" : "mid";
const pips = (v) => [1, 2, 3, 4, 5].map((i) => `<i class="${i <= v ? "on" : ""}"></i>`).join("");
function scoreRow(label, way, s = {}) {
  const v = s?.value || 0;
  return `<div class="score ${scoreTone(way, v)}"><span class="k">${label}</span><span class="pips" title="${v} of 5">${pips(v)}</span><b>${v}/5</b>${s?.why ? `<span class="score-why">${esc(s.why)}</span>` : ""}</div>`;
}

// The estimate before the start: how clear the task is and what to ask, how big, how risky, how to take it.
const SIZE_RANK = { small: 0, medium: 1, big: 2 };
const sizeOfComplexity = (v) => (v <= 2 ? "small" : v === 3 ? "medium" : "big");
const estimated = (r) => (r.estimate?.size && (r.estimate.state === "done" || r.estimate.state === "running") ? r.estimate : null);
// The estimate as one line (clarity · size · risk, the why of each in its tooltip), its questions folded under
// "N questions ▸" and the recommendation as a line of chips. A taken task shows it in its stage, read-only.
const qOpen = {};
function estimateHTML(r, card) {
  const e = r.estimate, fresh = r.column === "new";
  const btn = (label) => fresh ? `<button class="ghost" data-a="estimate" title="The agent will read the task and the repository structure: description clarity, size, risk, how to take it">${label}</button>` : "";
  if (e?.state === "running" && !e.size) return card("Estimate", `<div class="tcard-b muted">The agent is assessing the task…</div>`);
  // A failed estimate is quiet: the task is just without one.
  if (!e || e.state !== "done" && !e.size) return fresh ? card("Estimate", `<div class="tcard-b muted">Not assessed yet.</div>`, "", btn("Assess")) : "";
  const bit = (label, way, s) => `<span class="eb ${scoreTone(way, s?.value || 0)}" title="${esc(s?.why || "")}">${label}<span class="pips">${pips(s?.value || 0)}</span><b>${s?.value || 0}/5</b></span>`;
  const size = `<span class="eb" title="${esc(e.parts || "")}">Size<span class="size ${esc(e.size)}">${SIZE_NAMES[e.size] ?? esc(e.size)}</span></span>`;
  const line = `<div class="est-line">${bit("Clarity", "up", e.clarity)}${size}${bit("Risk", "down", e.risk)}</div>`;
  // "plan first" and the model are taken with a click, before "Start work"; a second click lets them go.
  // Splitting is the person's to do in the tracker: a plain chip.
  const plan = !!r.planFirst, model = r.model || "";
  const pick = (m, p) => `&model=${encodeURIComponent(m)}&plan=${p ? 1 : 0}`;
  const chip = (on, label, x, title) => fresh ? `<button type="button" class="tchip pick${on ? " on" : ""}" data-a="pick" data-x="${esc(x)}" title="${esc(title)}" aria-pressed="${on}">${on ? "✓ " : ""}${label}</button>`
    : `<span class="tchip">${label}</span>`;
  const advice = [
    e.plan ? chip(plan, "plan first", pick(model, !plan), plan ? "The agent will start with a plan. Click to cancel" : "The agent will start with a plan: it will change nothing until you approve it") : "",
    e.split ? `<span class="tchip">split into several tasks</span>` : "",
  ].filter(Boolean);
  const rec = advice.length || e.advice ? `<div class="rec-line"><span class="ic">→</span><b>Recommendation</b>${advice.join("")}${e.advice ? `<span class="rec-why" title="${esc(e.advice)}">${esc(e.advice)}</span>` : ""}</div>` : "";
  // While the estimate runs again (after the answers were sent) the old questions are answered: no empty form.
  const n = splitQuestions(e.questions).length;
  const questions = !fresh || !n ? "" : e.state === "running" ? `<div class="sec"><h4><span class="ic">?</span>Questions about the task</h4><p class="muted">Analysing the answers and estimating the task again…</p></div>`
    : `<details class="qs" data-qs ${qOpen[r.id] ? "open" : ""}><summary><span class="ic">?</span>${n} ${plural(n, "question", "questions")} for the tracker<span class="muted"> ▸</span></summary>${questionsHTML(r, e)}</details>`;
  const note = e.state === "running" ? `<span class="muted">estimating again…</span>` : btn("Assess again");
  return card("Estimate", `<div class="tcard-b">${line}</div>${rec}${questions}`, "assess", note);
}

// The estimate's questions, each with a field for its answer; "Send to tracker" posts the filled ones as one
// comment and the task is estimated again. The fields are empty in the HTML: the drafts (kept per task, so they
// outlive switching tasks) are put in after the render, and the 5 s reload does not take the field you type in.
// A draft is kept by its question's text: a new estimate with other questions does not put it under another one.
const splitQuestions = (text) => {
  const qs = [];
  for (const line of (text || "").split("\n")) {
    const t = line.trim(), m = /^\s*(?:[-*•]|\d+[.)])\s+/.exec(line);
    if (!t) continue;
    if (m) qs.push(line.slice(m[0].length).trim());
    else if (qs.length) qs[qs.length - 1] += " " + t;
    else qs.push(t);
  }
  return qs.filter(Boolean);
};
let answerDrafts = (() => { try { return JSON.parse(localStorage.getItem("mako-answers")) || {}; } catch { return {}; } })();
const saveAnswers = () => { try { localStorage.setItem("mako-answers", JSON.stringify(answerDrafts)); } catch {} };
const answersErr = {}, answersBusy = {};
function questionsHTML(r, e) {
  const items = splitQuestions(e.questions).map((q, i) => `<li class="qa-item"><div class="qa-q">${md(q)}</div><textarea class="qa" data-qa="${i}" data-q="${esc(q)}" rows="2" placeholder="Answer (can be left empty)" aria-label="Answer to question ${i + 1}"></textarea></li>`).join("");
  const err = answersErr[r.id] ? `<div class="mr-err">${esc(answersErr[r.id])}</div>` : "";
  return `<div class="sec warn"><h4><span class="ic">?</span>What to clarify in the tracker</h4><ol class="qa-list">${items}</ol>${err}
    <div class="qa-bar"><button type="button" class="ghost" data-answers ${answersBusy[r.id] ? "disabled" : ""} title="Mako will post one comment with the answers to the task and estimate it again">${answersBusy[r.id] ? "Sending…" : "Send to tracker"}</button></div></div>`;
}
function bindAnswers(r, focused) {
  const fields = [...$("detail").querySelectorAll("textarea[data-qa]")];
  if (!fields.length) return;
  const had = answerDrafts[r.id] && !Array.isArray(answerDrafts[r.id]) ? answerDrafts[r.id] : {};
  // Only the drafts of the questions asked now stay.
  const draft = Object.fromEntries(fields.filter((f) => had[f.dataset.q]).map((f) => [f.dataset.q, had[f.dataset.q]]));
  if (Object.keys(draft).length !== Object.keys(had).length) {
    if (Object.keys(draft).length) answerDrafts[r.id] = draft; else delete answerDrafts[r.id];
    saveAnswers();
  }
  for (const f of fields) {
    f.value = draft[f.dataset.q] || "";
    f.oninput = () => {
      const d = answerDrafts[r.id] && !Array.isArray(answerDrafts[r.id]) ? answerDrafts[r.id] : {};
      if (f.value.trim()) d[f.dataset.q] = f.value; else delete d[f.dataset.q];
      answerDrafts[r.id] = d;
      saveAnswers();
    };
  }
  if (focused) {
    const f = fields.find((x) => x.dataset.qa === focused.qa);
    if (f) { f.focus(); f.setSelectionRange(focused.at[0], focused.at[1]); }
  }
  const btn = $("detail").querySelector("[data-answers]");
  if (btn) btn.onclick = async () => {
    const answers = fields.map((f) => ({ q: f.dataset.q, a: f.value }));
    if (!answers.some((x) => x.a.trim())) { answersErr[r.id] = "Write an answer to at least one question"; shown = ""; renderDetail(); return; }
    answersBusy[r.id] = true; delete answersErr[r.id]; shown = ""; renderDetail();
    const res = await fetch(`/api/answers?id=${encodeURIComponent(r.id)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers }) })
      .then((x) => x.json()).catch((x) => ({ ok: false, error: x.message }));
    delete answersBusy[r.id];
    if (res.ok === false || res.error) answersErr[r.id] = `Not sent: ${res.error || "error"}`;
    else { delete answerDrafts[r.id]; saveAnswers(); toast("Answers sent to the tracker, estimating again…"); }
    shown = "";

}

// The look back at a merged task: what went well, what did not, what to do differently next time.
function retroHTML(r, card) {
  if (r.reviewState !== "merged") return "";
  const x = r.retro;
  const btn = (label) => `<button class="ghost" data-a="retro" title="The agent will look back at how the task went: what worked, what did not, what to do differently">${label}</button>`;
  if (!x) return card("Retro", `<div class="tcard-b muted">No retro yet.</div>`, "", btn("Write retro"));
  if (x.state === "running") return card("Retro", `<div class="tcard-b muted">The agent is writing the retro…</div>`);
  if (x.state === "failed") return card("Retro", `<div class="tcard-b mr-err">${esc(x.error || "Could not write the retro")}</div>`, "", btn("Try again"));
  const sec = (text, cls, ic, h) => text?.trim() ? `<div class="sec ${cls}"><h4><span class="ic">${ic}</span>${h}</h4>${md(text)}</div>` : "";
  const body = sec(x.good, "check", "✓", "What went well") + sec(x.bad, "warn", "!", "What went wrong") + sec(x.next, "done", "→", "What to do differently");
  return card("Retro", body, "retro", btn("Write again"));
}

// The rule Mako drew from your correction of the agent: saved, it goes into the repo's CLAUDE.md for the next agents.
function lessonHTML(r) {
  const base = changes?.branch?.base;
  return `<div class="notice lesson"><div class="lesson-h">💡 A lesson for CLAUDE.md, so the next agents do not repeat this</div>
    <input type="text" id="lesson-input" value="${esc(r.lesson.rule)}" aria-label="Rule for CLAUDE.md" title="From your message: ${esc(r.lesson.from)}">
    <div class="lesson-a"><button type="button" class="primary" data-lesson="branch" title="A separate commit on the task's branch: it goes into the MR">Save to the task's branch</button>
      <button type="button" data-lesson="base" title="A separate commit, pushed straight to ${esc(base || "the main branch")}">Save to ${base ? `<code>${esc(base)}</code>` : "the main branch"}</button>
      <button type="button" class="ghost" data-lesson="no">No</button></div></div>`;
}

// The push Mako stopped: what in the branch's changes looks like a secret, never the whole value. "Not a secret"
// lets that line through.
function secretsHTML(r) {
  const rows = r.secrets.map((f) => `<li><code>${esc(f.file)}${f.line ? ":" + f.line : ""}</code>${f.commit ? ` <span class="mute">commit ${esc(f.commit)}</span>` : ""}

// A short note at the bottom of the window that a click did something; it outlives the re-render of the card.
let toastTimer = 0;
function toast(text, bad = false) {
  let el = $("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.setAttribute("role", "status");
    el.setAttribute("aria-live", "polite");
    document.body.append(el);
  }
  el.textContent = text;
  el.classList.toggle("bad", bad);
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// The card's buttons: a request to the agent, or the merge.
async function mrAction(id, action, kind = "") {
  const res = await fetch(`/api/${action}?id=${encodeURIComponent(id)}${kind ? `&kind=${kind}` : ""}`, { method: "POST" }).then((r) => r.json()).catch((e) => ({ error: e.message }));
  const note = res.ok === false || res.error ? `⚠ ${res.error}` : { merge: "MR merged", close: "MR closed without merging" }[action] ?? "Passed to the agent";
  if (action === "ask") toast(res.ok === false || res.error ? note : "✨ Passed to the agent", res.ok === false || !!res.error);
  // The answer may come once another task is open (a merged task leaves the list): the note is this task's only.
  if (workOf !== id) return;
  mrNote = note;
  await loadWork();
  renderDetail();
  if (action === "ask" && !res.error) tv?.term.focus();
}

// "Snooze": one button, the times in its menu; the task shows how long it is put off and comes back with a
// notification.
function laterAt(kind) {
  const d = new Date();
  if (kind === "hour") return new Date(d.getTime() + 3600e3);
  d.setHours(9, 0, 0, 0);
  if (kind === "monday") d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));
  else d.setDate(d.getDate() + 1);
  return d;
}
// "Start work" and, in its arrow, the same with a model of your choice for the task's agent. The button
// names the model the agent will start with: picked for the task, else the estimate's when the settings take it.
function takeButton(r) {
  const model = r.model || "", def = r.defaultModel || "", start = model || def;
  // Opus's estimate advises a model by how complex the task is; without it the default is the configured one or Sonnet.
  const advised = estimated(r)?.model || "", fromEstimate = def && def === advised;
  // A model from the menu is only picked: the button shows it, the task starts on the button's click.
  const item = (m, label) => `<button type="button" data-a="pick" data-x="&model=${encodeURIComponent(m)}" aria-pressed="${model === m}">${model === m ? "✓ " : ""}${label}${m && m === advised ? ` <span class="muted">advises Opus</span>` : ""}</button>`;
  const title = model ? `The agent will start with model ${model}` : fromEstimate ? `The agent will start with model ${def}, advised by the estimate` : def ? `The agent will start with model ${def}` : "The agent will start with the model from settings";
  const byDefault = fromEstimate ? `Default: <code>${esc(def)}</code> from the estimate` : def ? `Default: <code>${esc(def)}</code>` : "As in settings";
  return `<span class="takesplit"><button class="primary" data-a="take" data-x="" title="${esc(title)}">Start work${start ? ` · <code>${esc(start)}</code>` : ""}</button>
    <details class="menu"><summary class="primary" title="Choose the model for the agent" aria-label="Choose model">${ICON.chevron}</summary>
    <div class="menu-pop"><div class="menu-h">Model for the work</div>${(data?.models ?? []).map((m) => item(m, `<code>${esc(m)}</code>`)).join("")}${item("", byDefault)}</div></details></span>`;
}
function laterMenu() {
  const item = (kind, label) => {
    const min = Math.max(1, Math.round((laterAt(kind) - Date.now()) / 60000));
    return `<button type="button" data-a="later" data-x="&min=${min}">${label}</button>`;
  };
  const monday = new Date().getDay() === 1 ? "Until next Monday, 9:00" : "Until Monday, 9:00";
  return `<details class="menu"><summary class="btn">${ICON.clock}Snooze</summary>
    <div class="menu-pop">${item("hour", "For an hour")}${item("tomorrow", "Until tomorrow, 9:00")}${item("monday", monday)}</div></details>`;
}
const untilText = (ms) => {
  const d = new Date(ms), t = d.toLocaleTimeString(LANG, { hour: "2-digit", minute: "2-digit" });
  const days = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 864e5);
  return days === 0 ? `until ${t}` : days === 1 ? `until tomorrow, ${t}` : `until ${d.toLocaleDateString(LANG, { weekday: "long" })}, ${t}`;
};

function agentBlock(r) {
  const a = agentOf(r);
  if (!a) return "";
  const since = a.since ? ` · ${ago(new Date(a.since).toISOString()).replace(" ago", "")}` : "";
  const name = { claude: "Claude Code", codex: "Codex", cursor: "Cursor", opencode: "OpenCode", gemini: "Gemini" }[a.name] ?? a.name ?? "";
  const note = a.state === "waiting" ? `${AGENT_NOTE.waiting}${a.reason ? `: ${esc(a.reason)}` : ""}`
    : a.state === "stopped" ? `Agent stopped${a.reason ? `: ${esc(a.reason)}` : ""}`
    : a.state === "working" && a.tool ? esc(a.tool) : AGENT_NOTE[a.state] ?? "";
  return `<div class="agent ${a.state}">
    <div class="agent-head"><span class="s ag-${a.state}">${LABEL["ag-" + a.state] ?? "agent"}${since}</span>${name ? `<span class="muted">${esc(name)}</span>` : ""}
      ${note ? `<span class="agent-note">${note}</span>` : ""}</div>
    ${a.screen?.length ? `<pre class="screen">${a.screen.map(esc).join("\n")}</pre>` : ""}
    ${a.message ? `<div class="agent-msg"><div class="agent-msg-h">The agent's last message</div>${md(a.message)}</div>` : ""}
    ${a.error ? `<div class="agent-err">${esc(a.error)}</div>` : ""}
  </div>${r.worktree ? `<details class="convo" ${convoOpen ? "open" : ""}><summary>Whole conversation with the agent${convo.id === r.id && convo.turns.length ? ` · ${convo.turns.filter((x) => x.role !== "tool").length}` : ""}</summary>
    <div class="convo-body">${convo.id === r.id ? convoHTML(convo.turns) : `<div class="muted">Loading…</div>`}</div></details>` : ""}`;
}

// A task in Orca: its agent's whole Claude Code session, read from the transcript while it is open.
let convoScroll = null;
// Where each task's "Task" tab was scrolled to: it is redrawn on every refresh and tab switch.
const taskScroll = {};
let convoOpen = (() => { try { return localStorage.getItem("mako-chat") === "1"; } catch { return false; } })(), convo = { id: null, turns: [] };
async function loadConvo() {
  const id = selected, r = data?.records.find((x) => x.id === id);
  if (!convoOpen || !r?.worktree || r.executor === "terminal") return;
  const c = await getJSON(`/api/conversation?id=${encodeURIComponent(id)}`);
  if (id === selected && c.turns) convo = { id, turns: c.turns };
}
function convoHTML(turns) {
  if (!turns.length) return `<div class="muted">No conversation found: the agent is not running in Claude Code or has not written anything yet.</div>`;
  const out = [];
  for (let i = 0; i < turns.length; i++) {
    const t = turns[i];
    if (t.role === "tool") {
      const group = [];
      for (; i < turns.length && turns[i].role === "tool"; i++) group.push(turns[i].text);
      i--;
      const shown = group.slice(-4);
      out.push(`<div class="convo-tools">${group.length > shown.length ? `<div>… ${group.length - shown.length} more</div>` : ""}${shown.map((x) => `<div>${esc(x)}</div>`).join("")}</div>`);
    } else if (t.role === "user") {
      out.push(`<div class="msg me"><div class="bubble">${t.text.length > 500 ? `<details><summary>${esc(t.text.slice(0, 300))}…</summary>${linkify(t.text)}</details>` : linkify(t.text)}</div></div>`);
    } else out.push(`<div class="msg"><div class="md">${md(t.text)}</div></div>`);
  }
  return out.join("");
}

// The tracker a task came from, by name: "GitHub"; with its host when two trackers share the name
// ("GitLab · git.example.com"); "the tracker" when the tracker is gone from the settings.
function trackerName(task) {
  const all = data?.trackers || [], tr = all.find((x) => x.id === task.trackerId);
  if (!tr) return "the tracker";
  return tr.host && all.filter((x) => x.name === tr.name).length > 1 ? `${tr.name} · ${tr.host}` : tr.name;
}
