      : `<circle cx="${x(r.col)}" cy="${H / 2}" r="3.5" fill="${color(r.col)}"/>`;
    const refs = (c.refs ?? []).map((ref) => {
      const head = ref.startsWith("HEAD -> "), name = ref.replace(/^HEAD -> /, "").replace(/^tag: /, "");
      return `<span class="cg-ref ${head ? "head" : ref.startsWith("origin/") ? "remote" : ref.startsWith("tag: ") ? "tag" : ""}" title="${esc(ref)}">${esc(name)}</span>`;
    });
    const open = commitOpen[c.hash];
    const when = new Date(c.at * 1000).toLocaleString(LANG, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<div class="cg-row" title="${esc(c.hash.slice(0, 8))} · ${esc(c.author)} · ${esc(when)}">
        <svg class="cg-lanes" width="${width}" height="${H}" fill="none" stroke-width="1.6" aria-hidden="true">${svg}</svg>
        <button type="button" class="cg-toggle" data-commit="${esc(c.hash)}" aria-label="${open ? "Collapse" : "Expand"} commit">${open ? "▾" : "›"}</button>
        <span class="cg-subj">${esc(c.subject)}</span>${refs.slice(0, 2).join("")}${refs.length > 2 ? `<span class="cg-ref more">+${refs.length - 2}</span>` : ""}</div>
      ${open ? `<div class="cg-detail" style="margin-left:${width + 18}px">${open === "loading" ? "Loading…" : open.error ? esc(open.error)
        : `<div class="cg-msg">${esc(open.message.trim())}</div>${open.files.map((f) => `<div class="cg-file"><b class="st-${f.status === "?" ? "N" : esc(f.status)}">${esc(f.status)}</b><span>${esc(f.path)}</span>${f.additions ? `<span class="add">+${f.additions}</span>` : ""}${f.deletions ? `<span class="del">−${f.deletions}</span>` : ""}</div>`).join("")}`}</div>` : ""}`;
  }).join("")}</div>`;
}

// CI running: a spinning arc, not the «⟳» glyph, which fonts draw small and off-centre in the badge.
const IBADGE_SPIN = `<svg class="spin" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" role="img" aria-label="CI is running"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>`;

// The right panel's tabs: the changes, the commits, the MR with its CI; the card keeps its size, the tab scrolls.
// tabPicked: you chose the open task's tab yourself; Mako does not switch it for you then.
let itab = "changes", itabPicked = false, tabPicked = false;
// The JS twin of trackers.CIRunning: the pipeline has not finished yet.
const ciRunning = (ci) => ["running", "pending", "created", "preparing", "waiting_for_resource", "scheduled"].includes(ci);
// The reviewer agent is reading the branch or the agent is fixing its remarks: the MR is not ready to merge yet.
// Also when the reviewer's blockers wait for Fix (r.reviewBlocks).
const mergeHeld = (r) => r.reviewStep === "running" || r.reviewStep === "fixing" || !!r.reviewBlocks || assessing(r);
function inspectorTabs(r, term, nFiles, list) {
  const c = review?.review, cs = changes?.commits ?? [];
  const mrBadge = !r.prUrl ? ["—", ""] : r.reviewState === "merged" || c?.state === "merged" ? ["✓", "merged"]
    : !c ? ["", ""] : c.ci === "failed" || c.conflicts || r.reviewBlocks ? ["!", "bad"] : c.threads.length ? [String(c.threads.length), "warn"]
    : ["running", "pending", "created"].includes(c.ci) || mergeHeld(r) ? ["⟳", "run"] : c.mergeable ? ["✓", "ok"] : ["", ""];
  const nCommits = commitLog ? `${commitLog.commits.length}${commitLog.more ? "+" : ""}` : String(cs.length);
  const tabs = [["changes", "Changes", [String(nFiles), ""]], ["commits", "Commits", [nCommits, ""]], ["mr", "MR", mrBadge]];
  const panel = itab === "commits" ? (commitLog ? commitGraph(commitLog.commits) : `<div class="files-empty">Loading history…</div>`)
    : itab === "mr" ? mrCard(r, term)
    : `${changes?.base ? `<div class="files-sub">from ${esc(changes.base)}</div>` : ""}${list}`;
  return `<div class="insp-card"><div class="itabs" role="tablist">${tabs.map(([k, label, [badge, cls]]) =>
      `<button type="button" role="tab" class="itab ${itab === k ? "on" : ""}" data-itab="${k}">${label}${badge ? `<span class="ibadge ${cls}">${cls === "run" ? IBADGE_SPIN : esc(badge)}</span>` : ""}</button>`).join("")}</div>
    <div class="insp-panel">${panel}</div></div>`;
}

// The MR: its CI, review threads and conflicts, each with what fixes it; then "Update MR" and "Merge".
const MR_ICON = {
  bad: `<svg class="mi bad" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>`,
  ok: `<svg class="mi ok" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>`,
  run: `<svg class="mi run" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  idle: `<svg class="mi idle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>`,
  eye: `<svg class="mi eye" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
  talk: `<svg class="mi talk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>`,
};
const CI = { failed: ["bad", "CI failed"], running: ["run", "CI running"], pending: ["run", "CI pending"], created: ["run", "CI pending"],
  preparing: ["run", "CI pending"], waiting_for_resource: ["run", "CI pending"], scheduled: ["run", "CI scheduled"], success: ["ok", "CI passed"],
  canceled: ["idle", "CI canceled"], skipped: ["idle", "CI skipped"], manual: ["idle", "CI waits for a manual run"] };
const plural = (n, one, many) => (n === 1 ? one : many);
// One line of a card: a status icon, what it is (a link when it has one), and the button that fixes it.
const row = (icon, text, href, btn = "") => `<div class="mr-row">${MR_ICON[icon]}${href
  ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text)}</a>` : `<span>${esc(text)}</span>`}${btn}</div>`;
// The same line with HTML in it (the caller escapes what it puts in).
const rowHTML = (icon, html, btn = "") => `<div class="mr-row">${MR_ICON[icon]}<span>${html}</span>${btn}</div>`;
// A section of a card: its name (and a note to it on the right), then its lines.
const sec = (title, body, note = "") => `<div class="mr-sec"><div class="mr-sec-h"><span class="files-h-t">${esc(title)}</span>${note ? `<span class="mr-sec-n">${esc(note)}</span>` : ""}</div>${body}</div>`;
// The tracker's priority in words ("Highest", "P1", "urgent") as a tone: hot, high, mid (unknown) or low.
function prioTone(p) {
  const s = String(p).toLowerCase();
  if (/block|crit|urgent|highest|^p0$|^p1$|^1$/.test(s)) return "hot";
  if (/high|^p2$|^2$/.test(s)) return "high";
  if (/low|trivial|^p3$|^p4$|^[3-5]$/.test(s)) return "low";
  return "mid";
}
const prioBadge = (t) => t.priority ? `<span class="prio ${prioTone(t.priority)}" title="Priority: ${esc(t.priority)}">${esc(String(t.priority).toLowerCase())}</span>` : "";
// ✨: the agent in the terminal does it; only while it runs.
// A pressed ✨ stays a disabled check for ASK_HOLD, through the redraws the polling brings; the key is "<task>:<kind>".
const asked = new Map(), ASK_HOLD = 120000;
function isAsked(id, kind) {
  const t = asked.get(`${id}:${kind}`);
  if (t === undefined) return false;
  if (Date.now() - t < ASK_HOLD) return true;
  asked.delete(`${id}:${kind}`);
  return false;
}
function markAsked(id, kind) {
  asked.set(`${id}:${kind}`, Date.now());
  setTimeout(() => { if (workOf === id) renderDetail(); }, ASK_HOLD + 100);
}
const fixBtn = (id, live, kind, label) => !live ? ""
  : isAsked(id, kind) ? `<button type="button" class="fix-btn sent" disabled title="Already passed to the agent" aria-label="Already passed to the agent">${ICON.check}</button>`
  : `<button type="button" class="fix-btn" data-ask="${kind}" title="${label}" aria-label="${label}">${ICON.fix}</button>`;
const commits = (n) => `${n} ${plural(n, "commit", "commits")}`;

// The branch's name for the panel: the prefix ("feature/") muted, a line may break only after "/" and "-".
let nameFlashUntil = 0; // until when the name shows it was copied: a redraw of the panel keeps the flash
function branchName(name) {
  const m = /^(.*\/)?(?:(\d+)(?=[-_]|$))?(.*)$/s.exec(name);
  const wrap = (t) => t.split(/([/-])/).map((x, i) => (i % 2 ? `${x}<wbr>` : esc(x))).join("");
  return `${m[1] ? `<span class="bn-pre">${wrap(m[1])}</span>` : ""}${m[2] ? `<span class="bn-num">${m[2]}</span>` : ""}${wrap(m[3])}`;
}

// The branch: against its base and its remote, uncommitted work; click the name to copy it, open it in Finder or the editor.
// Until git answers it holds its place, the name from the task, so the panel does not jump when the state comes.
function branchCard(r, term) {
  const b = changes ? changes.branch : { name: r.branch || r.branchName || "", loading: true };
  if (!b) return "";
  const live = term && r.live;
  let rows = "";
  if (b.loading) rows = `<div class="mr-row"><span style="color:var(--mute)">Checking the branch…</span></div>`;
  else {
    // [icon, text, button]; when all are fine they share one line.
    const st = [];
    if (b.behind) st.push(["idle", `${commits(b.behind)} behind ${b.base}`, fixBtn(r.id, live, "rebase", `The agent will update the branch from ${b.base}`)]);
    else st.push(["ok", `Up to date with ${b.base}`, ""]);
    if (b.unpushed) st.push(["run", `${commits(b.unpushed)} not pushed`, fixBtn(r.id, live, "push", "The agent will push the branch")]);
    else if (b.pushed) st.push(["ok", "Everything is pushed", ""]);
    if (b.dirty) st.push(["idle", `${b.dirty} ${plural(b.dirty, "file", "files")} not committed`, ""]);
    rows = st.every((x) => x[0] === "ok") ? row("ok", st.map((x) => x[1]).join(" · ")) : st.map((x) => row(x[0], x[1], "", x[2])).join("");
  }
  return `<div class="mr-card br-card"><div class="mr-h"><span class="files-h-t">Branch</span><span class="mr-sp"></span>
      <button type="button" class="icon" data-open="finder" title="Show in Finder" aria-label="Show in Finder">${ICON.folder}</button>
      ${data.editor ? `<button type="button" class="icon" data-open="editor" title="Open in ${esc(data.editor)}" aria-label="Open in ${esc(data.editor)}">${ICON.code}</button>` : ""}
    </div>${b.name ? `<button type="button" class="branch-name${Date.now() < nameFlashUntil ? " copied" : ""}" data-copy="${esc(b.name)}" title="Copy branch name" aria-label="Copy branch name ${esc(b.name)}">${branchName(b.name)}<span class="bn-copy">${ICON.copy}</span></button>` : ""}${rows}</div>`;
}

// The pipeline's jobs, a line each with its state in words, under their stage's name (GitLab has stages).
const JOB = { success: ["ok", "✓", "passed"], failed: ["bad", "✗", "failed"], running: ["run", "⟳", "running"], pending: ["wait", "◷", "waiting"],
  created: ["wait", "◷", "waiting"], preparing: ["wait", "◷", "preparing"], waiting_for_resource: ["wait", "◷", "waiting"], scheduled: ["wait", "◷", "scheduled"],
  manual: ["idle", "▶", "manual"], canceled: ["idle", "⊘", "canceled"], skipped: ["idle", "⊘", "skipped"] };
const JOB_SVG = {
  ok: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>`,
  bad: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  warn: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v9M12 19v.5"/></svg>`,
  run: `<svg class="jspin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>`,
  wait: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="3.2 3.2" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>`,
  idle: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M7 17L17 7"/></svg>`,
};
const jobLook = (j) => j.status === "failed" && j.allowFailure ? ["warn", "failed, allowed"] : (([c, , w]) => [c, w])(JOB[j.status] ?? ["idle", "", j.status]);
// A job's line: its mark and name; its state in words only when the mark does not say it (a passed one is its tick).
function jobsHTML(jobs) {
  if (!jobs?.length) return "";
  const stages = [];
  for (const j of jobs) {
    let st = stages.find((x) => x.name === (j.stage || ""));
    if (!st) stages.push((st = { name: j.stage || "", jobs: [] }));
    st.jobs.push(j);
  }
return `<div class="ci-jobs">${stages.map((st) => `${st.name && stages.length > 1 ? `<div class="ci-stage">${esc(st.name)}</div>` : ""}${st.jobs.map((j) => {
    const [cls, word] = jobLook(j);
    return `<a class="job ${cls}" href="${esc(j.url)}" target="_blank" rel="noopener" title="${esc(j.name)}: ${esc(word)}"><span class="jm">${JOB_SVG[cls] ?? JOB_SVG.idle}</span><span class="jn">${esc(j.name)}</span>${cls === "ok" ? "" : `<span class="js">${esc(word)}</span>`}</a>`;
  }).join("")}`).join("")}</div>`;
}

function mrCard(r, term) {
  const live = term && r.live, c = review?.review;
  const num = r.prUrl?.match(/\/(?:merge_requests|pull)\/(\d+)/)?.[1];
  const state = c?.state ?? (r.reviewState || (r.prUrl ? "open" : ""));
  const waitCI = r.status === "handed-off" && !!r.prUrl && state === "open" && (!c || ciRunning(c.ci));
  const fix = (kind, label) => fixBtn(r.id, live, kind, label);
  let rows = "";
  if (!r.prUrl) rows = `<div class="muted mr-none">None yet: the agent opens the MR when it finishes</div>`;
  else if (review?.error) rows = `<div class="mr-none mr-err">${esc(review.error)}</div>`;
  else if (!c) rows = `<div class="muted mr-none">Checking the MR…</div>`;
  else if (c.state === "open") {
    if (c.ci) {
      // The state on the right of the head (the jobs passed, in the state's colour, a link to the pipeline), the jobs under it; no line repeating "CI".
      const [icon, text] = CI[c.ci] ?? ["run", `CI: ${c.ci}`], word = text.replace(/^CI:? /, "");
      // "1/2": the jobs passed of all of them (an allowed failure counts as passed); the word when there are none.
      const jobs = c.jobs || [], passed = jobs.filter((j) => j.status === "success" || j.status === "failed" && j.allowFailure).length;
      const head = `<a class="ci-st ${icon}" href="${esc(c.ciUrl || "#")}" target="_blank" rel="noopener" title="${esc(text)}: ${jobs.length ? `${passed} of ${jobs.length} jobs passed · ` : ""}open the pipeline">${jobs.length ? `${passed}/${jobs.length}` : esc(word)}</a>`;
      const body = (jobsHTML(c.jobs) || row(icon, text, c.ciUrl)) ;
      // CI failed: the agent's fix, the blue sparkle, left of the count: the count keeps its place at the right edge
      // when the sparkle comes and goes.
      const fx = c.ci === "failed" && c.failed.length ? fix("ci", "The agent will fix CI in the terminal") : "";
      rows += `<div class="mr-sec"><div class="mr-sec-h ci-h"><span class="files-h-t">CI</span>${fx}${head}</div>${body}</div>`;
    } else rows += sec("CI", row("idle", "No CI"));
    let merging = "";
    if (c.threads.length) {
      const n = c.threads.length;
      merging += row("talk", `${n} review ${plural(n, "comment", "comments")}`, c.threads[0].url, fix("comments", "The agent will fix the comments in the terminal"));
    }
    merging += c.conflicts ? row("bad", "Conflicts with the main branch", "", fix("conflicts", "The agent will resolve the conflicts in the terminal")) : row("ok", "No conflicts");
    rows += sec("Merging", merging);
  }
  rows += reviewSection(r);
  // The MR's own actions sit in its header, as icons: open it, update it, merge it.
  const icon = (attr, label, name, cls = "", disabled = false) =>
    `<button type="button" class="icon ${cls}" ${attr} title="${esc(label)}" aria-label="${esc(label)}" ${disabled ? "disabled" : ""}>${ICON[name]}</button>`;
  const ask = (kind, label, name) => isAsked(r.id, kind) ? icon(`data-ask="${kind}"`, "Already passed to the agent", "check", "sent", true) : icon(`data-ask="${kind}"`, label, name);
  const open = live && !r.prUrl ? ask("open", "Open MR: the agent commits, pushes and opens it", "pr") : "";
  const update = live && r.prUrl && state === "open" ? ask("push", "Update MR: the agent commits and pushes what it has done", "push") : "";
  const reviewing = r.reviewStep === "running", fixing = r.reviewStep === "fixing", held = mergeHeld(r);
  const merge = c?.state === "open" && !waitCI ? icon("data-merge", reviewing ? "The reviewer agent is reviewing the branch: merge once it finishes"
    : fixing ? "The agent is fixing the reviewer's remarks: merge once it finishes"
    : r.reviewBlocks ? "The reviewer left blockers: fix them before the merge"
    : assessing(r) ? "The agent is judging whether a review is needed: merge once it decides"
    : c.mergeable ? "Merge the MR into the main branch" : `Cannot merge yet: ${c.blocked || "GitLab does not allow it"}`,
    "merge", c.mergeable && !held ? "ready" : "", !c.mergeable || held) : "";
  const close = c?.state === "open" ? icon("data-close-mr", "Close MR without merging", "closeMR", "danger") : "";
  return `<div class="mr-card"><div class="mr-h"><span class="files-h-t">MR</span>
      ${r.prUrl ? `<a href="${esc(r.prUrl)}" target="_blank" rel="noopener">${num ? (r.prUrl.includes("/pull/") ? "#" : "!") + num : "open"}</a>` : ""}
      <span class="muted mr-st">${waitCI ? `<span class="spin"></span>waiting for CI` : { open: "open", merged: "merged", closed: "closed" }[state] ?? ""}</span>
      <span class="spacer"></span>${open}${update}${close}${merge}</div>
    ${rows}${mrNote ? `<div class="mr-note">${esc(mrNote)}</div>` : ""}</div>`;
}

// The checks Mako runs before it opens the MR itself: "Checks: ✓ tests, ✗ lint".
const checkMark = (c) => (c.ok ? "✓" : c.timedOut ? "⏱" : "✗");
const checksLine = (k) => (k.results ?? []).map((c) => `${checkMark(c)} ${c.name}`).join(", ");
const checksTitle = (k) => (k.results ?? []).map((c) => `${checkMark(c)} ${c.command}${c.seconds ? ` · ${c.seconds} s` : ""}${c.timedOut ? " · timed out" : ""}`).join("\n");
// On the list: only while they matter, before the MR.
function checksBadge(r) {
  const k = r.checks;
  if (!k || r.prUrl || r.status !== "handed-off") return "";
  if (k.state === "running") return `<span class="checks" title="Mako is running the checks before the MR">checks…</span>`;
  if (k.state === "failed") return `<span class="checks bad" title="${esc(checksTitle(k))}">✗ checks</span>`;
  return "";
}
// What failed, as the agent got it: the last lines of each failed command.
function checksHTML(r, card) {
  const k = r.checks;
  if (!k || k.state !== "failed" || r.prUrl) return "";
  const body = k.results.filter((c) => !c.ok).map((c) => `<div class="tcard-b"><code>${esc(c.command)}</code> ${c.timedOut ? `did not finish in time (${c.seconds} s)` : "failed"}
    ${c.tail ? `<pre class="code">${esc(c.tail)}</pre>` : ""}</div>`).join("");
  return card("Checks before the MR failed", body, "", `attempt ${k.fails} · <code>${esc(k.commit.slice(0, 8))}</code>`);
}

// The reviewer agent's rounds over the branch: the last one as a line of the MR card, all of them in the task. It
// starts only from "Review"; its remarks wait in the task for your "Fix".
const REVIEW_STATE = { running: ["run", "The reviewer agent is reviewing the branch…"], notes: ["talk", "The reviewer left remarks"],
  clean: ["ok", "AI review passed"], failed: ["bad", "AI review failed"], skipped: ["idle", "AI review skipped"] };
const skippedText = (a) => `AI review skipped${a.reason ? `: ${a.reason}` : ""}`;
const reviewBtn = (label, cls = "ghost", title = "The reviewer agent will read the task and the branch diff and leave remarks in the task; you pass them to the agent with the Fix button") =>
  `<button type="button" class="${cls}" data-a="agentreview" title="${esc(title)}">${label}</button>`;
const skipBtn = () => `<button type="button" class="ghost" data-a="reviewskip" title="No review needed: the reviewer will not run until you change your mind">Skip</button>`;
// "Fix N blockers" when the merge waits for them (n: counted like remarksSplit), else "Fix with the agent".
const reviewFixBtn = (blocks = false, n = 0) => `<button type="button" class="${blocks ? "primary" : "ghost fix"}" data-a="reviewfix" title="${blocks ? "Required: the reviewer left blockers, the merge waits for the fix" : "Pass the reviewer's remarks to the agent: it fixes them, and you can run the review again"}">${blocks && n ? `Fix ${n} ${plural(n, WEIGHT.must, WEIGHT.must + "s")}` : "Fix with the agent"}</button>`;
const suggestFixBtn = () => `<button type="button" class="ghost fix" data-a="reviewfix" title="Pass the reviewer's suggestions to the agent: optional, the merge is not blocked">Fix suggestions with the agent</button>`;
// The agent is still judging the task (a judgement that started over 5 minutes ago and never ended is stale, not
// holding anything): the twin of the Go Assessing.
const assessing = (r) => r.assessment?.state === "running" && Date.now() - skew - Date.parse(r.assessment.at) < 5 * 60e3;
// The agent's advice from its assessment of the finished task: true (do a review), false (not needed), null (none
// yet). An older assessment without it goes by the risk: 4–5 of 5 advise one.
function adviseReview(r) {
  const a = r.assessment;
  if (a?.state !== "done") return null;
  return a.review ? a.review.need : (a.risk?.value ?? 0) >= 4;
}
const ADVISE = "AI review advised";
// "Check it yourself": once the reviewer agent has had its say, the agent's advice is what is left for you to look

// The estimate's questions, each with a field for its answer; "Send to tracker" posts the filled ones as one
// comment and the task is estimated again. The fields are empty in the HTML: the drafts (kept per task, so they
// outlive switching tasks) are put in after the render, and the 5 s reload does not take the field you type in.
// A draft is kept by its question's text: a new estimate with other questions does not put it under another one.
const splitQuestions = (text) => {
  const qs = [];
  for (const line of (text || "").split("\n")) {
    const t = line.trim(), m = /^\s*(?:[-*•]|\d+[.)])\s+/.exec(line);
    if (!t) continue;
    if (m) qs.push(line.slice(m[0].length).trim());
    else if (qs.length) qs[qs.length - 1] += " " + t;
    else qs.push(t);
  }
  return qs.filter(Boolean);
};
let answerDrafts = (() => { try { return JSON.parse(localStorage.getItem("mako-answers")) || {}; } catch { return {}; } })();
const saveAnswers = () => { try { localStorage.setItem("mako-answers", JSON.stringify(answerDrafts)); } catch {} };
const answersErr = {}, answersBusy = {};
function questionsHTML(r, e) {
  const items = splitQuestions(e.questions).map((q, i) => `<li class="qa-item"><div class="qa-q">${md(q)}</div><textarea class="qa" data-qa="${i}" data-q="${esc(q)}" rows="2" placeholder="Answer (can be left empty)" aria-label="Answer to question ${i + 1}"></textarea></li>`).join("");
  const err = answersErr[r.id] ? `<div class="mr-err">${esc(answersErr[r.id])}</div>` : "";
  return `<div class="sec warn"><h4><span class="ic">?</span>What to clarify in the tracker</h4><ol class="qa-list">${items}</ol>${err}
    <div class="qa-bar"><button type="button" class="ghost" data-answers ${answersBusy[r.id] ? "disabled" : ""} title="Mako will post one comment with the answers to the task and estimate it again">${answersBusy[r.id] ? "Sending…" : "Send to tracker"}</button></div></div>`;
}
function bindAnswers(r, focused) {
  const fields = [...$("detail").querySelectorAll("textarea[data-qa]")];
  if (!fields.length) return;
  const had = answerDrafts[r.id] && !Array.isArray(answerDrafts[r.id]) ? answerDrafts[r.id] : {};
  // Only the drafts of the questions asked now stay.
  const draft = Object.fromEntries(fields.filter((f) => had[f.dataset.q]).map((f) => [f.dataset.q, had[f.dataset.q]]));
  if (Object.keys(draft).length !== Object.keys(had).length) {
    if (Object.keys(draft).length) answerDrafts[r.id] = draft; else delete answerDrafts[r.id];
    saveAnswers();
  }
  for (const f of fields) {
    f.value = draft[f.dataset.q] || "";
    f.oninput = () => {
      const d = answerDrafts[r.id] && !Array.isArray(answerDrafts[r.id]) ? answerDrafts[r.id] : {};
      if (f.value.trim()) d[f.dataset.q] = f.value; else delete d[f.dataset.q];
      answerDrafts[r.id] = d;
      saveAnswers();
    };
  }
  if (focused) {
    const f = fields.find((x) => x.dataset.qa === focused.qa);
    if (f) { f.focus(); f.setSelectionRange(focused.at[0], focused.at[1]); }
  }
  const btn = $("detail").querySelector("[data-answers]");
  if (btn) btn.onclick = async () => {
    const answers = fields.map((f) => ({ q: f.dataset.q, a: f.value }));
    if (!answers.some((x) => x.a.trim())) { answersErr[r.id] = "Write an answer to at least one question"; shown = ""; renderDetail(); return; }
    answersBusy[r.id] = true; delete answersErr[r.id]; shown = ""; renderDetail();
    const res = await fetch(`/api/answers?id=${encodeURIComponent(r.id)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers }) })
      .then((x) => x.json()).catch((x) => ({ ok: false, error: x.message }));
    delete answersBusy[r.id];
    if (res.ok === false || res.error) answersErr[r.id] = `Not sent: ${res.error || "error"}`;
    else { delete answerDrafts[r.id]; saveAnswers(); toast("Answers sent to the tracker, estimating again…"); }
    shown = "";
    await load();
  };
}

// The look back at a merged task: what went well, what did not, what to do differently next time.
function retroHTML(r, card) {
  if (r.reviewState !== "merged") return "";
  const x = r.retro;
  const btn = (label) => `<button class="ghost" data-a="retro" title="The agent will look back at how the task went: what worked, what did not, what to do differently">${label}</button>`;
  if (!x) return card("Retro", `<div class="tcard-b muted">No retro yet.</div>`, "", btn("Write retro"));
  if (x.state === "running") return card("Retro", `<div class="tcard-b muted">The agent is writing the retro…</div>`);
  if (x.state === "failed") return card("Retro", `<div class="tcard-b mr-err">${esc(x.error || "Could not write the retro")}</div>`, "", btn("Try again"));
  const sec = (text, cls, ic, h) => text?.trim() ? `<div class="sec ${cls}"><h4><span class="ic">${ic}</span>${h}</h4>${md(text)}</div>` : "";
  const body = sec(x.good, "check", "✓", "What went well") + sec(x.bad, "warn", "!", "What went wrong") + sec(x.next, "done", "→", "What to do differently");
  return card("Retro", body, "retro", btn("Write again"));
}

// The rule Mako drew from your correction of the agent: saved, it goes into the repo's CLAUDE.md for the next agents.

// The push Mako stopped: what in the branch's changes looks like a secret, never the whole value. "Not a secret"
// lets that line through.
function secretsHTML(r) {
  const rows = r.secrets.map((f) => `<li><code>${esc(f.file)}${f.line ? ":" + f.line : ""}</code>${f.commit ? ` <span class="mute">commit ${esc(f.commit)}</span>` : ""}
      — ${esc(f.kind)}${f.masked ? ` <code class="mute">${esc(f.masked)}</code>` : ""}
      <button type="button" class="ghost" data-notsecret="${esc(f.key)}" title="Allow this line in this task">Not a secret</button></li>`).join("");
  return `<div class="notice warn secrets"><div class="secrets-h">🔐 Push stopped: the changes look like secrets. The agent has been asked to remove them</div><ul>${rows}</ul></div>`;
}

// A short note at the bottom of the window that a click did something; it outlives the re-render of the card.
let toastTimer = 0;
function toast(text, bad = false) {
  let el = $("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.setAttribute("role", "status");
    el.setAttribute("aria-live", "polite");
    document.body.append(el);
  }
  el.textContent = text;
  el.classList.toggle("bad", bad);
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// The card's buttons: a request to the agent, or the merge.
async function mrAction(id, action, kind = "") {
  const res = await fetch(`/api/${action}?id=${encodeURIComponent(id)}${kind ? `&kind=${kind}` : ""}`, { method: "POST" }).then((r) => r.json()).catch((e) => ({ error: e.message }));
  const failed = res.ok === false || !!res.error;
  const note = failed ? `⚠ ${res.error}` : "";
  // Success is a toast only: the card header already shows the merged/closed state, so no note under the card.
  if (failed) { if (action === "ask") { asked.delete(`${id}:${kind}`); toast(note, true); } }
  else toast({ merge: "MR merged", close: "MR closed without merging" }[action] ?? "✨ Passed to the agent");
  // The answer may come once another task is open (a merged task leaves the list): the note is this task's only.
  if (workOf !== id) return;
  mrNote = note;
  await loadWork();
  renderDetail();
  if (action === "ask" && !res.error) tv?.term.focus();
}

// "Redo differently": the note and the model go to Mako, which drops the attempt and starts the task over.
function openRedo(r) {
  const dlg = $("redo"), note = $("redo-note"), model = $("redo-model");
  dlg.dataset.id = r.id;
  note.value = "";
  model.value = r.model || "";
  $("redo-models").innerHTML = (data?.models ?? []).map((m) => `<option value="${esc(m)}">`).join("");
  dlg.showModal();
  note.focus();
}
$("redo-note").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("redo-form").requestSubmit($("redo-form").querySelector('[value="go"]')); }
});
$("redo").addEventListener("close", async () => {
  const dlg = $("redo");
  if (dlg.returnValue !== "go") return;
  dlg.returnValue = "";
  const id = dlg.dataset.id, body = JSON.stringify({ note: $("redo-note").value, model: $("redo-model").value });
  const res = await fetch(`/api/redo?id=${encodeURIComponent(id)}`, { method: "POST", body }).then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
  toast(res.ok === false ? `⚠ ${res.error}` : "Mako is cleaning up the previous attempt and will start the task over", res.ok === false);
  await load();
});

// "Snooze": one button, the times in its menu; the task shows how long it is put off and comes back with a
// notification.
function laterAt(kind) {
  const d = new Date();
  if (kind === "hour") return new Date(d.getTime() + 3600e3);
  d.setHours(9, 0, 0, 0);
  if (kind === "monday") d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));
  else d.setDate(d.getDate() + 1);
  return d;
}
// "Start work" and, in its arrow, the same with a model of your choice for the task's agent. The button
// names the model the agent will start with: picked for the task, else its work's route (by the estimate's size).
function takeButton(r) {
  const model = r.model || "", def = r.defaultModel || "", start = model || def;
  // A model from the menu is only picked: the button shows it, the task starts on the button's click.
  const item = (m, label) => `<button type="button" data-a="pick" data-x="&model=${encodeURIComponent(m)}" aria-pressed="${model === m}">${model === m ? "✓ " : ""}${label}</button>`;
  const title = model ? `The agent will start with model ${model}, the effort by the routes` : def ? `The agent will start with model ${def}, by the routes` : "The agent will start with the model of the routes";
  const byDefault = def ? `Default: <code>${esc(def)}</code> by the routes` : "By the routes";
  return `<span class="takesplit"><button class="primary" data-a="take" data-x="" title="${esc(title)}">Start work${start ? ` · <code>${esc(start)}</code>` : ""}</button>
    <details class="menu"><summary class="primary" title="Choose the model for the agent" aria-label="Choose model">${ICON.chevron}</summary>
    <div class="menu-pop"><div class="menu-h">Model for the work</div>${(data?.models ?? []).map((m) => item(m, `<code>${esc(m)}</code>`)).join("")}${item("", byDefault)}</div></details></span>`;
}
function laterMenu() {
  const item = (kind, label) => {
    const min = Math.max(1, Math.round((laterAt(kind) - Date.now()) / 60000));
    return `<button type="button" data-a="later" data-x="&min=${min}">${label}</button>`;
  };
  const monday = new Date().getDay() === 1 ? "Until next Monday, 9:00" : "Until Monday, 9:00";
  return `<details class="menu"><summary class="btn">${ICON.clock}Snooze</summary>
    <div class="menu-pop">${item("hour", "For an hour")}${item("tomorrow", "Until tomorrow, 9:00")}${item("monday", monday)}</div></details>`;
}
const untilText = (ms) => {
  const d = new Date(ms), t = d.toLocaleTimeString(LANG, { hour: "2-digit", minute: "2-digit" });
  const days = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 864e5);
  return days === 0 ? `until ${t}` : days === 1 ? `until tomorrow, ${t}` : `until ${d.toLocaleDateString(LANG, { weekday: "long" })}, ${t}`;
};

function agentBlock(r) {
  const a = agentOf(r);
  if (!a) return "";
  const since = a.since ? ` · ${ago(new Date(a.since).toISOString()).replace(" ago", "")}` : "";
  const name = { claude: "Claude Code", codex: "Codex", cursor: "Cursor", opencode: "OpenCode", gemini: "Gemini" }[a.name] ?? a.name ?? "";
  const note = a.state === "waiting" ? `${AGENT_NOTE.waiting}${a.reason ? `: ${esc(a.reason)}` : ""}`
    : a.state === "stopped" ? `Agent stopped${a.reason ? `: ${esc(a.reason)}` : ""}`
    : a.state === "working" && a.tool ? esc(a.tool) : AGENT_NOTE[a.state] ?? "";
  return `<div class="agent ${a.state}">
    <div class="agent-head"><span class="s ag-${a.state}">${LABEL["ag-" + a.state] ?? "agent"}${since}</span>${name ? `<span class="muted">${esc(name)}</span>` : ""}
      ${note ? `<span class="agent-note">${note}</span>` : ""}</div>
    ${a.screen?.length ? `<pre class="screen">${a.screen.map(esc).join("\n")}</pre>` : ""}
    ${a.message ? `<div class="agent-msg"><div class="agent-msg-h">The agent's last message</div>${md(a.message)}</div>` : ""}
    ${a.error ? `<div class="agent-err">${esc(a.error)}</div>` : ""}
  </div>${r.worktree ? `<details class="convo" ${convoOpen ? "open" : ""}><summary>Whole conversation with the agent${convo.id === r.id && convo.turns.length ? ` · ${convo.turns.filter((x) => x.role !== "tool").length}` : ""}</summary>
    <div class="convo-body">${convo.id === r.id ? convoHTML(convo.turns) : `<div class="muted">Loading…</div>`}</div></details>` : ""}`;
}

// A task in Orca: its agent's whole Claude Code session, read from the transcript while it is open.
let convoScroll = null;
// Where each task's "Task" tab was scrolled to: it is redrawn on every refresh and tab switch.
const taskScroll = {};
let convoOpen = (() => { try { return localStorage.getItem("mako-chat") === "1"; } catch { return false; } })(), convo = { id: null, turns: [] };
async function loadConvo() {
  const id = selected, r = data?.records.find((x) => x.id === id);
  if (!convoOpen || !r?.worktree || r.executor === "terminal") return;
  const c = await getJSON(`/api/conversation?id=${encodeURIComponent(id)}`);
  if (id === selected && c.turns) convo = { id, turns: c.turns };
}
function convoHTML(turns) {
  if (!turns.length) return `<div class="muted">No conversation found: the agent is not running in Claude Code or has not written anything yet.</div>`;
  const out = [];
  for (let i = 0; i < turns.length; i++) {
    const t = turns[i];
    if (t.role === "tool") {
      const group = [];
      for (; i < turns.length && turns[i].role === "tool"; i++) group.push(turns[i].text);
      i--;
      const shown = group.slice(-4);
      out.push(`<div class="convo-tools">${group.length > shown.length ? `<div>… ${group.length - shown.length} more</div>` : ""}${shown.map((x) => `<div>${esc(x)}</div>`).join("")}</div>`);
    } else if (t.role === "user") {
      out.push(`<div class="msg me"><div class="bubble">${t.text.length > 500 ? `<details><summary>${esc(t.text.slice(0, 300))}…</summary>${linkify(t.text)}</details>` : linkify(t.text)}</div></div>`);
    } else out.push(`<div class="msg"><div class="md">${md(t.text)}</div></div>`);
  }
  return out.join("");
}

// The tracker a task came from, by name: "GitHub"; with its host when two trackers share the name
// ("GitLab · git.example.com"); "the tracker" when the tracker is gone from the settings.
function trackerName(task) {
  const all = data?.trackers || [], tr = all.find((x) => x.id === task.trackerId);
  if (!tr) return "the tracker";
  return tr.host && all.filter((x) => x.name === tr.name).length > 1 ? `${tr.name} · ${tr.host}` : tr.name;
}

// The new-task form, in root: the page's own (showNewTask) or the dialog over a chat about code. It creates the task and
// calls onCreated(res) — what comes next is the caller's. root has no "← Tasks" button unless onBack is given.
function taskForm(root, { draft, onCreated, onCancel, onBack }) {
  const targets = newTaskTargets(), several = new Set(targets.map((x) => x.tracker)).size > 1;
  // The project the list is filtered by comes first.
  const first = Math.max(0, draft ? targets.findIndex((x) => x.tracker === draft.tracker && x.project === draft.project) : targets.findIndex((x) => x.project === project));
  const options = targets.map((x, i) => `<option value="${i}" ${i === first ? "selected" : ""}>${esc(x.project)}${several ? ` · ${esc(x.name)} (${esc(x.tracker)})` : ""}</option>`).join("");
  root.innerHTML = `${onBack ? `<button class="ghost back" id="back">← Tasks</button>` : ""}
    <form class="new-form nt-form" id="new-form">
      <div class="nt-head">
        <h1>New task</h1>
        <p>It will appear in the tracker, assigned to you, and on the board right away.</p>
      </div>
      <div class="nt-card">
        <label>Title<input id="nt-title" required maxlength="250" autocomplete="off" placeholder="Briefly: what needs to be done"></label>
        <label>Description<textarea id="nt-desc" rows="10" placeholder="What exactly, why, and how to verify it."></textarea>
          <span class="nt-hint">Markdown · you can paste a screenshot from the clipboard (⌘V)</span></label>
        <div class="nt-row">
          <label>Project<select id="nt-project">${options}</select></label>
          <div class="nt-field"><span>Type</span><div class="seg nt-type" role="radiogroup" aria-label="Type">
            <label><input type="radio" name="nt-type" value="task" checked>Task</label>
            <label><input type="radio" name="nt-type" value="bug">Bug</label>
          </div></div>
        </div>
        <div class="nt-error" id="nt-error" hidden></div>
      </div>
      <div class="nt-foot">
        <label class="check"><input type="checkbox" id="nt-take"> Start working on it right away</label>
        <div class="nt-actions"><button type="button" id="nt-cancel">Cancel</button><button type="submit" class="primary" id="nt-submit">Create</button></div>
      </div>
    </form>`;
  if (onBack) $("back").onclick = onBack;
  $("nt-cancel").onclick = onCancel;
  if (draft) { $("nt-title").value = draft.title; $("nt-desc").value = draft.desc; }
  const target = () => targets[+$("nt-project").value];
  const fail = (msg) => { $("nt-error").textContent = msg; $("nt-error").hidden = !msg; };
  let uploading = 0;
  $("nt-desc").onpaste = (e) => {
    const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
    if (!files.length) return;
    e.preventDefault();
    for (const f of files) uploadImage($("nt-desc"), target(), f, (n) => { uploading += n; $("nt-submit").disabled = uploading > 0; }, fail);
  };
  $("new-form").onsubmit = async (e) => {
    e.preventDefault();
    const t = target();
    if (!t) return fail("No project to put the task in");
    fail("");
    $("nt-submit").disabled = true; $("nt-submit").textContent = "Creating…";
    const body = { tracker: t.tracker, project: t.project, title: $("nt-title").value, description: $("nt-desc").value, type: document.querySelector('input[name="nt-type"]:checked').value, take: $("nt-take").checked, fromPlan: !!draft?.fromPlan };
    const res = await fetch("/api/create", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then((r) => r.json()).catch((err) => ({ error: err.message }));
    if (!res.ok) {
      $("nt-submit").disabled = false; $("nt-submit").textContent = "Create";
      return fail(res.error || "Could not create the task");
    }
    if (draft?.source) rememberTicket(draft.source, draft.draftTitle, res.id);
    await onCreated(res);
  };
}

// «Chats»: one history of the chats and of the questions about code, and one place to start a new one, in a mode.
// Work: an agent that changes code in the chat's own worktree. Ask: a read-only agent in the project's shared worktree on
// main (it reads, searches and runs commands but changes no code); it answers with file:line places that open the file
// beside the chat, and may propose a ticket or a plan. The model of Ask, picked in the header, is kept in the settings for
// every repository.
// code: the open question's view (mountQuestion), one thread; null while a chat or the empty field is open.
let code = null;
const isAsk = (id) => typeof id === "string" && id.startsWith("ask-");
// The open question's view goes: its polling stops.
function stopQuestion() {
  if (!code) return;
  clearInterval(code.timer);
  code = null;
}
// The header button: the latest chat, or the history with the field of a new one when there is none.
$("code-btn").onclick = async () => {
  const r = await getJSON("/api/chats");
  openFreeChat(r.chats?.[0]?.id ?? "");
};

// A chat without a task: a conversation with the agent in a project, as in a task's chat (modes, permissions, plan,
// pictures), in the chat's own worktree on its own branch from main. The first message makes the worktree and
// starts the agent; the chats and the questions are listed on the left, «×» removes one (a chat with its worktree, its
// branch stays).
let freeChat = null; // the open chat's id, "" a new one; null: the view is closed
let freeChats = [], fcListed = null; // the history on the left, and for which open chat it was last read
let fcReady = false, fcLoaded = false, fcProjects = []; // the view has its projects; the history has been read; the projects with a clone
const fcSel = { on: false, ids: new Set(), last: null }; // «Select»: several rows at once
const FC_SUB = "A conversation with the agent without a task. In a project, each chat gets its own worktree on a new branch from the base branch, prepared like a task's; the agent works as in a task's chat: it changes the code, commits and can open an MR, asking as the mode says. A chat without a project works in a separate empty folder, with no repository.";
const ASK_SUB = "Read-only agent in a separate worktree on main: it reads, searches and runs tests and builds, but can't change files or the repository. It can turn a remark or an idea into a ticket draft.";
// The mode of a new chat, remembered.
const chatMode = () => { try { return localStorage.getItem("mako-chat-mode") === "ask" ? "ask" : "work"; } catch { return "work"; } };
function openFreeChat(id = "") {
  selected = null; statsOpen = false; newOpen = "chat"; digest = null; freeChat = id;
  history.replaceState(null, "", `#${id || "chat"}`);
  try { localStorage.removeItem("mako-selected"); } catch {}
  if ($("free-chat")) mountFreeChat();
  render();
  if (!id) document.querySelector("#fc-new-box textarea")?.focus();
}
$("new-chat").onclick = () => openFreeChat("");

async function showFreeChat() {

      <div class="fc-slot" id="fc-slot"></div>
      <div class="ca-file" id="ca-file" hidden></div>

  $("back").onclick = () => { newOpen = false; freeChat = null; closeChat(); stopQuestion(); history.replaceState(null, "", location.pathname); render(); };

  $("fc-project").innerHTML = `<option value="" ${loose ? "selected" : ""}>No project</option>` + projects.map((p) => `<option value="${esc(p.key)}" ${!loose && p.key === start?.key ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  $("fc-project").onchange = (e) => { try { localStorage.setItem("mako-chat-project", e.target.value); } catch {} };
  const names = { opus: "Opus", sonnet: "Sonnet", haiku: "Haiku" };

  $("ca-model").onchange = async (e) => {

      .then((x) => x.json()).catch((err) => ({ ok: false, error: err.message }));
    if (r.ok) toast(`Model: ${names[e.target.value] ?? e.target.value} — from the next message`); else toast(`⚠ ${r.error}`, true);
  };
  $("fc-list").onclick = (e) => {

// What the header says: the chat's folder and branch, or what Ask is.
function fcSub() {
  const cur = freeChats.find((c) => c.id === freeChat);
  if (isAsk(freeChat)) return ASK_SUB;
  if (cur) return cur.project === "" ? cur.dir : `${cur.dir} · ${cur.branch}`;
  return freeChat === "" && chatMode() === "ask" ? ASK_SUB : FC_SUB;
}
// The header follows the open chat: Ask has a model to pick; an open question has its project already.
function fcHead() {
  if (!$("free-chat")) return;
  $("ca-model").hidden = !(isAsk(freeChat) || (freeChat === "" && chatMode() === "ask"));
  // Ask needs a project: with no clones the select would be empty, and the empty state says why (#515).
  $("fc-project").hidden = isAsk(freeChat) || (freeChat === "" && chatMode() === "ask" && !fcProjects.length);
  $("fc-sub").textContent = fcSub();
}

// The open chat in the middle: the task's chat for it, the view of a question, or the field of a new one.
function mountFreeChat() {
  const slot = $("fc-slot");
  if (!slot || !fcReady) return;
  if (fcListed !== freeChat) loadFreeChats();
  fcHead();
  if (isAsk(freeChat)) { mountQuestion(freeChat); return; }
  stopQuestion();
  if (freeChat) {
    if (cv?.id === freeChat && cv.el.parentElement === slot) return;
    const v = chatFor(freeChat);
    slot.replaceChildren(v.el);
    restoreChatScroll(v);
    return;
  }
  if ($("fc-new-box")) return;
  closeChat();
  slot.innerHTML = `<div class="chat" id="fc-new-box"><div class="chat-list"><div class="chat-col"><div class="files-empty" id="fc-empty"></div></div></div>
    <div class="chat-foot"><div class="chat-box composer">
      <div class="seg fc-mode" role="group" aria-label="Mode"><button type="button" data-fc-mode="work">${esc(t("b.modeWork"))}</button><button type="button" data-fc-mode="ask">${esc(t("b.modeAsk"))}</button></div>
      <div class="chat-att" hidden></div>
      <textarea rows="2"></textarea>
      <div class="chat-row"><span class="spacer"></span>
        <input type="file" accept="image/*" multiple hidden>
        <button type="button" class="icon chat-attach" title="Attach a picture (or paste it with ⌘V)" aria-label="Attach a picture">${ICON.clip}</button>
        <button type="button" class="chat-send" title="Send (Enter)" aria-label="Send">${ICON.up}</button></div></div>
      <div class="chat-keys" hidden></div></div></div>`;
  const input = slot.querySelector("textarea"), keys = slot.querySelector(".chat-keys"), btn = slot.querySelector(".chat-send");
  const file = slot.querySelector('input[type="file"]'), clip = slot.querySelector(".chat-attach");
  // The pictures attached: a new chat has no id yet, so they are kept under the shared one, as a new question's are.
  const box = { el: $("fc-new-box"), input, att: [], loading: 0 };
  const lock = () => { btn.disabled = box.sending || box.loading > 0; };
  // The mode: Ask needs a project (no "No project"), and the field says what each mode does.
  const apply = () => {
    const ask = chatMode() === "ask", sel = $("fc-project");
    for (const b of slot.querySelectorAll("[data-fc-mode]")) { const on = (b.dataset.fcMode === "ask") === ask; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }
    sel.querySelector('option[value=""]').disabled = ask;
    if (ask && sel.value === "") sel.value = sel.options[1]?.value ?? "";
    if (!ask) { // back to Work: the project picked there
      let saved = null; try { saved = localStorage.getItem("mako-chat-project"); } catch {}
      if (saved !== null && [...sel.options].some((o) => o.value === saved)) sel.value = saved;
    }
    const noClone = ask && !fcProjects.length;
    $("fc-empty").textContent = noClone ? "There are no project clones on this Mac. A clone appears when Mako takes a task of the project, or set a path to it in the settings."
      : ask ? "Ask a question about the project's code: the agent will find the answer and show the places in the code."
      : "Write what to do or ask: the first message starts the agent. In a project it first creates the chat's worktree and branch; with no project the agent works in an empty folder.";
    input.placeholder = ask ? "E.g.: where do we handle payments? how does the update work? Paste a screenshot with ⌘V"
      : "E.g.: try out a faster cache for the board; explain how the update works. Paste a screenshot with ⌘V";
    input.setAttribute("aria-label", ask ? "Question about the code" : "Message to the agent");
    input.disabled = noClone;
    fcHead();
  };
  const send = async () => {
    const ask = chatMode() === "ask", typed = input.value.trim();
    const text = [typed, ...box.att.map((a) => a.line)].filter(Boolean).join("\n"), project = $("fc-project")?.value ?? "";
    if (!text || box.loading || box.sending) return;
    if (ask && !typed) { keys.hidden = false; keys.classList.add("err"); keys.textContent = "⚠ Write a question about the picture"; return; }
    if (ask && !project) { keys.hidden = false; keys.classList.add("err"); keys.textContent = "⚠ Pick a project: Ask reads its code"; return; }
    box.sending = true; input.disabled = clip.disabled = true; lock();
    keys.hidden = false; keys.classList.remove("err"); keys.textContent = ask || !project ? "Starting the agent…" : "Creating the worktree…";
    const r = await fetch(ask ? "/api/code/ask" : "/api/chats/new", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ask ? { project, thread: "", text } : { project, text }) })
      .then((x) => x.json()).catch((err) => ({ ok: false, error: err.message }));
    box.sending = false; input.disabled = clip.disabled = false; lock();
    if (!r.ok) { keys.classList.add("err"); keys.textContent = `⚠ ${r.error}`; return; }
    openFreeChat(r.id);
  };
  const attach = async (files) => {
    for (const f of files) {
      if (!f.type.startsWith("image/")) continue;
      box.loading++; lock();
      const r = await fetch(`/api/attach?id=ask-new&name=${encodeURIComponent(f.name || "image.png")}`,
        { method: "POST", headers: { "Content-Type": f.type }, body: f }).then((x) => x.json()).catch(() => ({ ok: false, error: "the picture did not upload" }));
      box.loading--; lock();
      if (!box.el.isConnected) return;
      if (r.ok === false) { keys.hidden = false; keys.classList.add("err"); keys.textContent = `⚠ ${r.error}`; continue; }
      keys.hidden = true; keys.classList.remove("err"); keys.textContent = "";
      box.att.push({ line: r.line, url: r.url, name: f.name || "image" });
      drawAttached(box);
    }
  };
  slot.querySelector(".fc-mode").onclick = (e) => {
    const b = e.target.closest("[data-fc-mode]");
    if (!b) return;
    try { localStorage.setItem("mako-chat-mode", b.dataset.fcMode); } catch {}
    apply();
  };
  input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
  btn.onclick = send;
  clip.onclick = () => file.click();
  file.onchange = () => { attach([...file.files]); file.value = ""; };
  input.onpaste = (e) => {
    const files = [...(e.clipboardData?.files ?? [])].filter((f) => f.type.startsWith("image/"));
    if (files.length) { e.preventDefault(); attach(files); }
  };
  slot.querySelector(".chat-att").onclick = (e) => {
    const x = e.target.closest("[data-unattach]");
    if (x) { box.att.splice(+x.dataset.unattach, 1); drawAttached(box); }
  };
  apply();
}

async function loadFreeChats() {
  fcListed = freeChat;
  const r = await getJSON("/api/chats");
  if (!$("fc-list")) return;
  freeChats = r.chats ?? [];
  fcLoaded = true;
  fcHead();
  drawFreeChats();
  // The question was not in the list when it was opened (a reload on its link): now it can be shown. A mark
  // that came (or went) with the list: the banner and the draft cards follow.
  if (isAsk(freeChat) && code?.thread !== freeChat) mountFreeChat();
  else if (code && (freeChats.find((c) => c.id === code.thread)?.ticket ?? "") !== (code.ticket ?? "")) renderCode();
}
const projectName = (key) => key === "" ? "No project" : [...($("fc-project")?.options ?? [])].find((o) => o.value === key)?.textContent ?? key.split("/").slice(1).join("/");

function drawFreeChats() {
  if (!$("fc-list")) return;
  if (fcSel.on) { // the rows that are gone from the list are not chosen
    const ids = new Set(freeChats.map((c) => c.id));
    for (const id of fcSel.ids) if (!ids.has(id)) fcSel.ids.delete(id);
  }
  $("fc-select").hidden = fcSel.on || !freeChats.length;
  $("fc-cancel").hidden = !fcSel.on;
  $("fc-selbar").hidden = !fcSel.on;
  if (fcSel.on) {
    $("fc-selbar").innerHTML = `<button type="button" class="ghost" data-sel="all">${fcSel.ids.size === freeChats.length ? "Clear" : "Select all"}</button>
      <button type="button" class="danger" data-sel="delete" ${fcSel.ids.size ? "" : "disabled"}>${fcSel.ids.size ? `Delete (${fcSel.ids.size})` : "Delete"}</button>`;
  }
  $("fc-list").innerHTML = freeChats.length ? freeChats.map((c) => {
    const ask = c.kind === "ask", picked = fcSel.on && fcSel.ids.has(c.id);
    return `<div class="ca-thread fc-item ${c.id === freeChat ? "on" : ""}${c.ticket ? " done" : ""}${picked ? " sel" : ""}" role="button" tabindex="0" data-fc="${esc(c.id)}" title="${esc(c.title)}${c.ticket ? ` — done, ${c.ticket.startsWith("chat-") ? "chat" : "task"} ${esc(c.ticket)}` : ""}">
      ${fcSel.on ? `<input type="checkbox" class="ca-check" tabindex="-1" aria-label="Select" ${picked ? "checked" : ""}>` : ""}<span class="ca-line">${ask ? `<span class="fc-kind" title="Question about code, read-only">Ask</span>` : ""}${c.ticket ? `<span class="ca-ok" role="img" aria-label="Done">✓</span>` : ""}<span class="ca-title">${esc(c.title)}</span></span><span class="muted">${esc(projectName(c.project))} · ${esc(ago(new Date(c.at).toISOString()))}</span>
      ${fcSel.on ? "" : `<button type="button" class="icon fc-remove" data-fc-remove="${esc(c.id)}" title="${ask ? "Delete the question" : c.project === "" ? "Delete the chat and its folder" : "Delete the chat and its worktree"}" aria-label="${ask ? "Delete the question" : "Delete the chat"}">×</button>`}</div>`;
  }).join("") : `<div class="muted ca-none">No chats yet.</div>`;
}

function selectChats(on) {
  fcSel.on = on; fcSel.ids = new Set(); fcSel.last = null;
  drawFreeChats();
}

// A click on a row in the selection mode; with Shift, the rows between it and the last chosen one.
function pickChat(id, range) {
  if (range && fcSel.last && fcSel.last !== id) {
    const a = freeChats.findIndex((c) => c.id === fcSel.last), b = freeChats.findIndex((c) => c.id === id);
    if (a >= 0 && b >= 0) {
      const on = fcSel.ids.has(fcSel.last);
      for (let i = Math.min(a, b); i <= Math.max(a, b); i++) on ? fcSel.ids.add(freeChats[i].id) : fcSel.ids.delete(freeChats[i].id);
      fcSel.last = id;
      drawFreeChats();
      return;
    }
  }
  if (!fcSel.ids.delete(id)) fcSel.ids.add(id);
  fcSel.last = id;
  drawFreeChats();
}

// «×», «Select → Delete» and "Delete question" in a done question: one confirm, then each goes by its kind (the server
// tells a question from a chat by its id): the agents stop; a chat loses its worktree, its branch stays.
async function removeChats(ids) {
  const items = ids.map((id) => freeChats.find((c) => c.id === id)).filter(Boolean);
  if (!items.length) return;
  const asks = items.filter((c) => c.kind === "ask"), chats = items.length - asks.length, one = items[0];
  let ask;
  if (items.length === 1) {
    ask = one.kind === "ask" ? `Delete the question "${one.title}" from the history?`
      : one.project === "" ? `Delete the chat "${one.title}" and its folder? Everything in the folder will be lost.`
      : `Delete the chat "${one.title}" and its worktree? Uncommitted changes in it will be lost; the branch ${one.branch ?? ""} stays.`;
  } else {
    const what = [chats && `${chats} ${plural(chats, "chat", "chats")}`, asks.length && `${asks.length} ${plural(asks.length, "question", "questions")}`].filter(Boolean).join(" and ");
    ask = `Delete ${what}? Agents that are still working will be stopped.${chats ? " A chat loses its worktree (or its folder) with the uncommitted changes in it; its branch stays." : ""}`;
  }
  if (!(await askConfirm(ask, { ok: "Delete", danger: true }))) return;
  let failed = "";
  for (const c of items) {
    const r = await fetch(`/api/chats/remove?id=${encodeURIComponent(c.id)}`, { method: "POST" }).then((x) => x.json()).catch((err) => ({ ok: false, error: err.message }));
    if (!r.ok && !failed) failed = r.error || "Failed";
  }
  if (failed) alert(failed);
  fcSel.on = false; fcSel.ids = new Set(); fcSel.last = null;
  if (items.some((c) => c.id === freeChat)) openFreeChat(""); else loadFreeChats();
}

// A question about code in the middle: its conversation, the agent's file:line places with the file beside it, the ticket
// and plan blocks. One thread; the project is the question's own.
function mountQuestion(id) {
  const slot = $("fc-slot");
  if (code?.thread === id && slot.contains(code.el)) return;
  closeChat(); stopQuestion();
  const q = freeChats.find((c) => c.id === id);
  if (!q) {
    slot.innerHTML = `<div class="files-empty">${fcLoaded ? "No such question: it was deleted." : "Loading…"}</div>`;
    return;
  }
  const el = document.createElement("div");
  el.className = "chat ca-chat";
  el.innerHTML = `<div class="chat-list" role="log" aria-live="polite"></div>
    <div class="chat-foot"><div class="chat-box composer"><div class="chat-att" hidden></div>
      <textarea rows="2" aria-label="Question about the code" placeholder="Ask more. Paste a screenshot with ⌘V"></textarea>
      <div class="chat-row"><span class="spacer"></span>
        <input type="file" accept="image/*" multiple hidden>
        <button type="button" class="icon chat-attach" title="Attach a picture (or paste it with ⌘V)" aria-label="Attach a picture">${ICON.clip}</button>
        <button type="button" class="icon chat-stop" title="Interrupt" aria-label="Interrupt" hidden>${ICON.stop}</button>
        <button type="button" class="chat-send" title="Send (Enter)" aria-label="Send">${ICON.push}</button></div></div>
      <div class="chat-hint"><span class="chat-keys">Enter to send · Shift+Enter for a new line</span><span class="spacer"></span>
        <button type="button" class="ghost" id="ca-task" hidden title="The question and answer will become the description of a new task">Make a task</button>
        <div class="ca-ws" id="ca-ws"></div></div></div>`;
  slot.replaceChildren(el);
  $("ca-file").hidden = true;
  const v = (code = { project: q.project, thread: id, version: -1, snap: null, flip: new Set(), code: true, att: [], el, list: el.querySelector(".chat-list"), input: el.querySelector("textarea") });
  const keys = el.querySelector(".chat-keys"), idle = "Enter to send · Shift+Enter for a new line";
  $("ca-ws").onclick = async (e) => {
    const b = e.target.closest("[data-ws]");
    if (!b) return;
    const what = b.dataset.ws, ws = v.ws;
    // Both stop the agents of this project's questions first: the code is not changed under their feet.
    const stops = "An agent currently answering a question of this project will stop and its answer will be cut off; the next message continues the conversation.";
    if (what === "reset" && !(await askConfirm(`Discard ${ws?.dirty || ""} unsaved changes in the worktree and update it from ${ws?.base || "main"}? The changes will be lost.\n\n${stops}`, { ok: "Discard", danger: true }))) return;
    if (what === "remove" && !(await askConfirm(`Delete the worktree for questions${ws?.dirty ? ` along with ${ws.dirty} unsaved changes` : ""}? It will reappear with the next question.\n\n${stops}`, { ok: "Delete", danger: true }))) return;
    b.disabled = true;
    const r = await fetch(`/api/code/workspace/${what}?project=${encodeURIComponent(v.project)}`, { method: "POST" })
      .then((x) => x.json()).catch((err) => ({ ok: false, error: err.message }));
    if (!r.ok) alert(r.error || "Failed");
    loadWorkspace();
  };
  // The pictures attached go with the question as lines naming their files: the agent reads them from there.
  const send = async () => {
    const typed = v.input.value.trim();
    if (!typed) {
      if (v.att.length) { keys.classList.add("err"); keys.textContent = "⚠ Write a question about the picture"; }
      return;
    }
    const text = [typed, ...v.att.map((a) => a.line)].join("\n"), att = v.att;
    v.input.value = ""; v.att = []; drawAttached(v);
    const r = await fetch("/api/code/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: v.project, thread: v.thread, text }) })
      .then((x) => x.json()).catch((err) => ({ ok: false, error: err.message }));
    keys.classList.toggle("err", !r.ok);
    keys.textContent = r.ok ? idle : `⚠ ${r.error}`;
    if (!r.ok) { v.input.value ||= typed; v.att = att; drawAttached(v); return; }
    if (!v.snap?.live) v.version = -1; // resumed: a new session, read from the start
    loadFreeChats(); pollCode(); loadWorkspace();
  };
  v.input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
  const attach = async (files) => {
    for (const f of files) {
      if (!f.type.startsWith("image/")) continue;
      const r = await fetch(`/api/attach?id=${encodeURIComponent(v.thread)}&name=${encodeURIComponent(f.name || "image.png")}`,
        { method: "POST", headers: { "Content-Type": f.type }, body: f }).then((x) => x.json()).catch(() => ({ ok: false, error: "the picture did not upload" }));
      keys.classList.toggle("err", r.ok === false);
      if (r.ok === false) { keys.textContent = `⚠ ${r.error}`; continue; }
      keys.textContent = idle;
      if (code !== v) return;
      v.att.push({ line: r.line, url: r.url, name: f.name || "image" });
      drawAttached(v);
    }
  };
  const file = el.querySelector("input[type=file]");
  el.querySelector(".chat-attach").onclick = () => file.click();
  file.onchange = () => { attach([...file.files]); file.value = ""; };
  v.input.onpaste = (e) => {
    const files = [...(e.clipboardData?.files ?? [])].filter((f) => f.type.startsWith("image/"));
    if (files.length) { e.preventDefault(); attach(files); }
  };
  el.querySelector(".chat-att").onclick = (e) => {
    const x = e.target.closest("[data-unattach]");
    if (x) { v.att.splice(+x.dataset.unattach, 1); drawAttached(v); }
  };
  el.querySelector(".chat-send").onclick = send;
  el.querySelector(".chat-stop").onclick = () => fetch(`/api/code/stop?id=${encodeURIComponent(v.thread)}`, { method: "POST" });
  $("ca-task").onclick = toTask;
  v.list.onclick = (e) => {
    const tk = e.target.closest("[data-ticket]");
    if (tk) { const d = v.drafts?.[tk.dataset.ticket]; if (d) toTicket(d, tk.dataset.ticket); return; }
    const pb = e.target.closest("[data-plan-block]");
    if (pb) { const p = v.plans?.[pb.dataset.planBlock]; if (p) openPlanXfer(p.plan, p.title, { ...planSource(v), thread: v.thread, doneKey: planKey(v.thread, +pb.dataset.planBlock), draftTitle: p.title || planTitle(p.plan) }); return; }
    const made = e.target.closest("[data-task]");
    if (made) { e.preventDefault(); stopQuestion(); select(made.dataset.task); return; }
    const madeChat = e.target.closest("[data-chat]");
    if (madeChat) { e.preventDefault(); stopQuestion(); openFreeChat(madeChat.dataset.chat); return; }
    if (e.target.closest("[data-open-ticket]")) { openMade(v.ticket); return; }
    if (e.target.closest("[data-ca-delete]")) { removeChats([v.thread]); return; }
    // The agent's question: an option, or your own words.
    if (answerClick(e, `/api/code/answer?id=${encodeURIComponent(v.thread)}`, pollCode)) return;
    const src = e.target.closest("[data-src]");
    if (src) { e.preventDefault(); openSource(src.dataset.src, +src.dataset.line, +(src.dataset.end || src.dataset.line)); return; }
    if (stepClick(e, v, renderCode)) return;
    const tg = e.target.closest("[data-toggle]");
    if (tg) { if (!v.flip.delete(tg.dataset.toggle)) v.flip.add(tg.dataset.toggle); renderCode(); }
  };
  v.timer = setInterval(pollCode, 1000);
  renderCode(); pollCode(); loadWorkspace();
}

// The shared worktree, bottom right: its branch, and a warning when something changed it, with "Reset and update".
async function loadWorkspace() {
  const v = code;
  if (!v) return;
  const ws = await getJSON(`/api/code/workspace?project=${encodeURIComponent(v.project)}`);
  if (v !== code || !$("ca-ws")) return;
  v.ws = ws.error ? null : ws;
  const remove = `<button type="button" class="ghost" data-ws="remove" title="${esc(ws.dir || "")}">Delete</button>`;
  $("ca-ws").innerHTML = ws.error ? "" : !ws.exists ? `<span class="muted" title="${esc(ws.dir)}">the worktree will appear with the first question</span>`
    : ws.dirty ? `<span class="ca-ws-warn" title="${esc((ws.files || []).join("\n"))}">⚠ The worktree has ${ws.dirty} ${plural(ws.dirty, "unsaved change", "unsaved changes")}: it was not updated from ${esc(ws.base)}</span>
        <button type="button" data-ws="reset">Reset and update</button>${remove}`
    : ws.behind ? `<span class="muted" title="${esc(ws.dir)}">the worktree is ${ws.behind} ${plural(ws.behind, "commit", "commits")} behind ${esc(ws.base)}: it will update with a new question, when no other is running</span>${remove}`
    : `<span class="muted" title="${esc(ws.dir)}">worktree · ${esc(ws.base)}</span>${remove}`;
}

// The ticket the agent proposes: a fenced mako-ticket block of JSON {title, description} in its answer. The answer
// shows without it; an unfinished one (still being written) is hidden.
const TICKET = /```mako-ticket[^\n]*\n([\s\S]*?)\n\s*```/;
function ticketOf(text) {
  const m = text.match(TICKET);
  if (!m) return { text: text.replace(/```mako-ticket[\s\S]*$/, ""), draft: null };
  let d = null;
  try { const j = JSON.parse(m[1]); if (j && typeof j.title === "string" && j.title.trim()) d = { title: j.title.trim(), description: String(j.description ?? "") }; } catch {}
  return d ? { text: text.replace(m[0], ""), draft: d } : { text, draft: null };
}
// Which drafts already became tasks: "thread#message index" → {id, title}, kept in the browser. The title guards
// against another draft taking the same place after the agent rewrites its answer.
const TICKETS_KEY = "mako-tickets";
const ticketsMade = () => { try { return JSON.parse(localStorage.getItem(TICKETS_KEY)) || {}; } catch { return {}; } };
const ticketSource = (thread, i) => `${thread}#${i}`;
// The plan of the same answer has its own key, so it never marks the ticket of that answer as made.
const planKey = (thread, i) => `${thread}#${i}#plan`;
// The link to what a chat made: a task (its tracker's page, or the board) or a free chat.
function madeLink(id) {
  if (id.startsWith("chat-")) return `<a href="#${encodeURIComponent(id)}" data-chat="${esc(id)}">${esc(id)}</a>`;
  const rec = data?.records?.find((r) => r.id === id);
  return rec?.task?.url ? `<a href="${esc(rec.task.url)}" target="_blank" rel="noopener">${esc(id)}</a>` : `<a href="#${encodeURIComponent(id)}" data-task="${esc(id)}">${esc(id)}</a>`;
}
function rememberTicket(source, title, id) {
  try { localStorage.setItem(TICKETS_KEY, JSON.stringify({ ...ticketsMade(), [source]: { id, title } })); } catch {}
}
function ticketCard(d, i, thread) {
  const made = ticketsMade()[ticketSource(thread, i)];
  const done = made && made.title === d.title ? made.id : null;
  const link = done ? madeLink(done) : "";
  return `<div class="ca-ticket"><div class="ca-ticket-h">${ICON.doc}<span>Ticket draft</span></div>
    <b>${esc(d.title)}</b><div class="md ca-ticket-body">${md(d.description)}</div>
    <div class="ca-ticket-foot">${done ? `<span class="muted">Task ${link}</span>` : `<span class="muted">You can edit it and pick a tracker before creating</span>`}<span class="spacer"></span>
      ${done ? `<button type="button" disabled>Ticket created</button>` : `<button type="button" class="primary" data-ticket="${i}">Create ticket</button>`}</div></div>`;
}

// "Create ticket": the agent's draft goes to the new task form over the chat, to be edited, given a tracker and created.
// The chat stays open; once the task exists it is marked done (see openTicketDialog).
function toTicket(d, i) {
  const p = fcProjects.find((x) => x.key === code.project);
  openTicketDialog({ source: ticketSource(code.thread, i), draftTitle: d.title, title: d.title.slice(0, 250), desc: `${d.description.trim()}\n\n_From an Ask chat on the Mako board._`, tracker: p?.tracker, project: p?.project });
}

// The Ask chat is done: it keeps the id of the task or the chat it led to (shown in the history and above the chat).
async function markCodeDone(v, thread, id) {
  const r = !thread ? { ok: false, error: "the chat has no id yet" } : await fetch(`/api/code/done?id=${encodeURIComponent(thread)}&ticket=${encodeURIComponent(id)}`, { method: "POST" })
    .then((x) => x.json()).catch((err) => ({ ok: false, error: err.message }));
  await load();
  if (v !== code) return r;
  const t = freeChats.find((x) => x.id === thread);
  if (r.ok && t) t.ticket = id;
  if (v.thread === thread) renderCode();
  loadFreeChats();
  return r;
}

// The form in a dialog over the chat. A task made, the chat is marked done with its id and stays: the developer opens
// the task only if they want to.
function openTicketDialog(draft) {
  const v = code, thread = v.thread, dlg = $("ca-ticket-dlg"), box = $("ca-ticket-form");
  const close = () => { dlg.close(); box.innerHTML = ""; };
  taskForm(box, { draft, onCancel: close, onCreated: async (res) => {
    close();
    const r = await markCodeDone(v, thread, res.id);
    if (!r.ok) toast(`Task ${res.id} created, but the chat was not marked done: ${r.error}`, true);
  } });
  dlg.onclose = () => { box.innerHTML = ""; };
  dlg.showModal();
  $("nt-title").focus();
}

// The task made from the chat: the board goes to it, only on a click.
function openMade(id) {
  if (!id) return;
  stopQuestion();
  if (id.startsWith("chat-")) openFreeChat(id); else select(id);
}

// The plan the agent proposes in an Ask chat: a fenced mako-plan block of JSON {title, plan}, handled like the ticket.
const PLAN_BLOCK = /```mako-plan[^\n]*\n([\s\S]*?)\n\s*```/;
function planOf(text) {
  const m = text.match(PLAN_BLOCK);
  if (!m) return { text: text.replace(/```mako-plan[\s\S]*$/, ""), plan: null };
  let p = null;
  try { const j = JSON.parse(m[1]); if (j && typeof j.plan === "string" && j.plan.trim()) p = { title: String(j.title ?? "").trim(), plan: j.plan.trim() }; } catch {}
  return p ? { text: text.replace(m[0], ""), plan: p } : { text, plan: null };
}
function planBlockCard(p, i, thread) {
  const made = thread ? ticketsMade()[planKey(thread, i)] : null;
  const done = made && made.title === (p.title || planTitle(p.plan)) ? made.id : null;
  return `<div class="ca-ticket"><div class="ca-ticket-h">${ICON.doc}<span>Plan</span></div>
    ${p.title ? `<b>${esc(p.title)}</b>` : ""}<div class="md ca-ticket-body">${md(p.plan)}</div>
    <div class="ca-ticket-foot">${done ? `<span class="muted">${done.startsWith("chat-") ? "Sent to chat" : "Task"} ${madeLink(done)}</span>` : `<span class="muted">${data?.remote ? "Plans are handed over from the Mac" : "Hand it over to a new or an existing session"}</span>`}<span class="spacer"></span>
      ${done ? `<button type="button" disabled>Plan sent</button>` : data?.remote ? "" : `<button type="button" class="primary" data-plan-block="${i}">Send plan to…</button>`}</div></div>`;
}

// «Send plan to…»: the plan's text (not a path to its file) goes to another session; the plan's own session stays as it
// is. The line "Plan from …" says where it came from.
const planTitle = (plan) => (plan.split("\n").map((l) => l.replace(/^[#>*\-\s]+/, "").trim()).find(Boolean) ?? "").slice(0, 80);
const planFrom = (from) => `_Plan from ${from}._`;
// The message to a chat: its first line is the chat's title.
const planMessage = (plan, title, from) => `Execute this plan${(title || planTitle(plan)) ? `: ${title || planTitle(plan)}` : ""}\n\n${plan.trim()}\n\n${planFrom(from)}`;
// Where the plan of the open view comes from: its words, the project (tracker and name) and the id to leave out.
function planSource(v) {
  if (v.code) {
    const p = fcProjects.find((x) => x.key === code.project);
    return { from: `an Ask chat on the Mako board`, tracker: p?.tracker, project: p?.project, key: code.project, id: "" };
  }
  if (v.id.startsWith("chat-")) {
    const c = freeChats.find((x) => x.id === v.id);
    return { from: `chat "${c?.title || v.id}" (${v.id})`, key: c?.project, id: v.id };
  }
  const r = data?.records?.find((x) => x.id === v.id);
  return { from: `task ${v.id}${r?.task?.title ? ` "${r.task.title}"` : ""}`, tracker: r?.task?.trackerId, project: r?.task?.project, id: v.id };
}
// A click on «Send plan to…» on an agent's plan card (v: the chat's view).
function planXferClick(btn, v) {
  const it = v.snap?.items?.find((x) => x.id === btn.dataset.planXfer);
  const plan = it?.input?.plan ?? "";
  if (plan.trim()) openPlanXfer(plan, "", planSource(v));
}
const planXferBtn = (it) => data?.remote || !(it.input?.plan ?? "").trim() ? "" : `<button type="button" class="link" data-plan-xfer="${esc(it.id)}">Send plan to…</button>`;

async function openPlanXfer(plan, title, src) {
  const dlg = $("plan-xfer-dlg"), box = $("plan-xfer-box");
  const v = src.thread ? code : null; // started from an Ask chat: it stays open and is marked done
  const close = () => { dlg.close(); box.innerHTML = ""; };
  // Sent from Ask: the chat stays, done, with the id of where the plan went.
  const sentFromAsk = async (id, what) => {
    close();
    rememberTicket(src.doneKey, src.draftTitle, id);
    const r = await markCodeDone(v, src.thread, id);
    if (!r.ok) toast(`Plan sent to ${what}, but the chat was not marked done: ${r.error}`, true);
    else toast(`Plan sent to ${what}`);
  };
  const [projects, chats] = await Promise.all([getJSON("/api/code/projects").then((r) => r.projects ?? []), getJSON("/api/chats").then((r) => r.chats ?? [])]);
  const key = src.key || projects.find((x) => x.tracker === src.tracker && x.project === src.project)?.key || projects[0]?.key || "";
  const post = (url, init) => fetch(url, { method: "POST", ...init }).then((r) => r.json()).catch((err) => ({ ok: false, error: err.message }));
  const draw = (step, error = "") => {
    const head = `<h2>Send plan to…</h2><p class="muted px-sub">${esc(planTitle(plan) || "the plan")}</p>`;
    const foot = (back) => `<div class="px-foot">${back ? `<button type="button" data-px="menu">← Back</button>` : ""}<span class="spacer"></span><button type="button" data-px="cancel">Cancel</button></div>`;
    const err = `<div class="nt-error" ${error ? "" : "hidden"}>${esc(error)}</div>`;
    if (step === "chat") {
      box.innerHTML = `${head}<label class="px-field">Project<select id="px-project">${projects.map((x) => `<option value="${esc(x.key)}" ${x.key === key ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <p class="muted px-sub">A new chat in its own worktree: the agent starts carrying the plan out.</p>${err}
        <div class="px-foot"><button type="button" data-px="menu">← Back</button><span class="spacer"></span><button type="button" data-px="cancel">Cancel</button><button type="button" class="primary" data-px="go-chat" ${projects.length ? "" : "disabled"}>Start chat</button></div>`;
    } else if (step === "existing") {
      const tasks = (data?.records ?? []).filter((r) => r.id !== src.id && r.executor === "terminal" && r.worktree && r.column !== "done");
      const rows = [...chats.filter((c) => c.id !== src.id).map((c) => `<button type="button" class="px-row" data-px-to="${esc(c.id)}"><span>${esc(c.title || c.id)}</span><span class="muted">chat</span></button>`),
        ...tasks.map((r) => `<button type="button" class="px-row" data-px-to="${esc(r.id)}"><span>${esc(r.task?.title || r.id)}</span><span class="muted">task ${esc(r.id)}</span></button>`)];
      box.innerHTML = `${head}<div class="px-list">${rows.join("") || `<p class="muted">No other chats with an agent yet.</p>`}</div>${err}${foot(true)}`;
    } else {
      box.innerHTML = `${head}<div class="px-opts">
        <button type="button" data-px="chat"><b>New chat</b><span class="muted">A new agent in the same project carries the plan out</span></button>
        <button type="button" data-px="task"><b>New task</b><span class="muted">The new-task form, with the plan in the description</span></button>
        <button type="button" data-px="existing"><b>Existing chat</b><span class="muted">The plan arrives as a message</span></button></div>${foot(false)}`;
    }
  };
  box.onclick = async (e) => {
    const b = e.target.closest("[data-px],[data-px-to]");
    if (!b) return;
    const act = b.dataset.px;
    if (act === "cancel") return close();
    if (["menu", "chat", "existing"].includes(act)) return draw(act === "menu" ? "" : act);
    if (act === "task") {
      const p = projects.find((x) => x.key === key);
      close();
      const draft = { title: (title || planTitle(plan)).slice(0, 250), desc: `${plan.trim()}\n\n${planFrom(src.from)}`, tracker: p?.tracker ?? src.tracker, project: p?.project ?? src.project, fromPlan: true };
      return v ? openTicketDialog({ ...draft, source: src.doneKey, draftTitle: src.draftTitle }) : openPlanTask(draft);
    }
    b.disabled = true;
    if (act === "go-chat") {
      const r = await post("/api/chats/new", { headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: $("px-project").value, text: planMessage(plan, title, src.from), fromPlan: true }) });
      if (!r.ok) { draw("chat", r.error || "Could not start the chat"); return; }
      if (v) return sentFromAsk(r.id, "a new chat");
      close(); stopQuestion(); openFreeChat(r.id);
      return;
    }
    const id = b.dataset.pxTo;
    const r = await post(`/api/say?id=${encodeURIComponent(id)}&plan=1`, { body: planMessage(plan, title, src.from) });
    if (!r.ok) { draw("existing", r.error || "Could not send the plan"); return; }
