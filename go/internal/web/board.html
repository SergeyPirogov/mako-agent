// A pasted screenshot goes to the tracker; a placeholder stands in the text until its link comes back.
async function uploadImage(area, t, file, busy, fail) {
  if (!t) return fail("Спершу виберіть проєкт");
  const name = file.name && file.name !== "image.png" ? file.name : `screenshot-${Date.now()}.${(file.type.split("/")[1] || "png").replace("jpeg", "jpg")}`;
  const mark = `![Завантажую ${name}…]()`;
  area.setRangeText(mark, area.selectionStart, area.selectionEnd, "end");
  busy(1);
  const q = `tracker=${encodeURIComponent(t.tracker)}&project=${encodeURIComponent(t.project)}&name=${encodeURIComponent(name)}`;
  const res = await fetch(`/api/upload?${q}`, { method: "POST", headers: { "Content-Type": file.type }, body: file })
    .then((r) => r.json()).catch((err) => ({ error: err.message }));
  busy(-1);
  area.value = area.value.replace(mark, res.ok ? res.markdown : "");
  if (!res.ok) fail("Скриншот не завантажився: " + (res.error || "невідома помилка"));
}

// How the taken tasks went: shown where a task's card goes while none is open.
function statsHTML(s) {
  if (!s?.taken) return `<div class="empty">Виберіть задачу зліва. Статистика з'явиться, коли агент візьме першу задачу.</div>`;
  const pct = (n) => s.taken ? Math.round((n / s.taken) * 100) : 0;
  const dur = (sec) => {
    const m = Math.round(sec / 60);
    return m < 60 ? `${m} хв` : m < 1440 ? `${Math.floor(m / 60)} год ${m % 60} хв` : `${Math.floor(m / 1440)} д ${Math.floor((m % 1440) / 60)} год`;
  };
  const tile = (label, value, note = "") => `<div class="stat"><span>${label}</span><b>${value}</b>${note ? `<small>${note}</small>` : ""}</div>`;
  return `<div class="stats">
    <h1>Статистика</h1>
    <div class="stat-row">
      ${tile("Взято задач", s.taken, s.running ? `${s.running} ще в роботі` : "")}
      ${tile("Успішно", s.succeeded, `${pct(s.succeeded)}% · змерджено ${s.merged}${s.succeeded > s.merged ? ` · на рев'ю ${s.succeeded - s.merged}` : ""}`)}
      ${tile("Не успішно", s.failed, `${pct(s.failed)}%`)}
      ${tile("Середній час до MR", s.avgSeconds ? dur(s.avgSeconds) : "—", s.medianSeconds ? `медіана ${dur(s.medianSeconds)}` : "")}
      ${tile("Рев'ю до мерджу", s.reviewSeconds ? dur(s.reviewSeconds) : "—", "в середньому")}
      ${tile("За 7 днів", s.lastWeek || 0, "взято задач")}
      ${tile("Повторні спроби", s.retried || 0, `${pct(s.retried || 0)}% задач`)}
      ${tile("Витрачено", `$${(s.cost || 0).toFixed(2)}`, s.priced ? `≈ $${(s.cost / s.priced).toFixed(2)} на задачу · ${s.priced} ${plural(s.priced, "задача", "задачі", "задач")}` : "лише агент у Mako")}
    </div>
    ${s.assessed ? `<h3>Оцінка агента <span class="muted">· ${s.assessed} ${plural(s.assessed, "задача", "задачі", "задач")}</span></h3>
    <div class="stat-row">
      ${tile("Опис задач", `${s.clarity.toFixed(1)}/5`, "наскільки добре описано")}
      ${tile("Складність", `${s.complexity.toFixed(1)}/5`, "в середньому")}
      ${tile("Виконано задачі", `${s.completeness.toFixed(1)}/5`, "наскільки повно")}
      ${tile("Ризик змін", `${s.risk.toFixed(1)}/5`, "в середньому")}
    </div>` : ""}
    ${groupsHTML("За проєктами", s.projects, "Проєкт")}
    ${groupsHTML("За агентами", s.executors, "Агент", (n) => n === "terminal" ? "Агент у Mako" : n === "—" ? "—" : `Orca · ${n}`)}
    <h3>Причини невдач</h3>
    ${s.reasons.length ? `<dl class="facts">${s.reasons.map((x) => `<dt>${x.count}</dt><dd>${linkify(x.text)}</dd>`).join("")}</dl>` : `<div class="text" style="color:var(--mute)">Невдач не було</div>`}
    <p class="stats-note">Час — від передачі агенту до відкриття MR, рев'ю — від MR до мерджу. Бюджет рахує лише агент у Mako: агент в Orca своїх витрат не повідомляє.</p>
  </div>`;
}

// Mako's own errors, one row per kind: «На аналіз» writes them into an issue in Mako's repository.
function faultsHTML(fs) {
  if (!fs?.length) return "";
  const fresh = fs.filter((f) => !f.reported).length;
  const at = (t) => new Date(t).toLocaleString("uk", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const row = (f) => `<li class="${f.reported ? "reported" : ""}"><div><b>${esc(f.what)}</b> <span class="muted">${f.count}× · ${at(f.last)}${f.task ? ` · ${esc(f.task)}` : ""}</span></div>`
    + `<div class="fault-text">${esc(f.error)}</div>`
    + (f.reported ? `<div class="muted">на аналізі: ${/^https?:/.test(f.reported) ? `<a href="${esc(f.reported)}" target="_blank" rel="noopener">${esc(f.reported)}</a>` : esc(f.reported)}</div>` : "") + `</li>`;
  return `<div class="stats faults">
    <div class="digest-head"><h3>Помилки Mako <span class="muted">${fs.length}</span></h3>
      <span class="actions">${fresh && !data.remote ? `<button id="faults-report"${faultsBusy ? " disabled" : ""} title="Створити в репозиторії Mako задачу з цими помилками, щоб агент їх розібрав">${faultsBusy ? "Створюю задачу…" : `На аналіз: ${fresh}`}</button>` : ""}
      ${data.remote ? "" : `<button class="ghost" id="faults-clear">Очистити</button>`}</span></div>
    <ul class="digest-list">${fs.map(row).join("")}</ul>
    <p class="stats-note">Що не вдалося на боці Mako: пошук, коментарі, статуси, перевірка MR, worktree. Однакові помилки зібрано в одну.</p>
  </div>`;
}
// The board re-renders every few seconds: the report under way is remembered here, not in the button.
let faultsBusy = false;
function bindFaults() {
  const rep = $("faults-report"), clr = $("faults-clear");
  if (rep) rep.onclick = async () => {
    if (faultsBusy) return;
    faultsBusy = true; render();
    const res = await fetch("/api/faults/report", { method: "POST" }).then((r) => r.json()).catch((err) => ({ error: err.message }));
    faultsBusy = false;
    if (!res.ok) { toast(res.error || "Не вдалося створити задачу", true); await load(); return; }
    toast("Задачу з помилками Mako створено");
    await load();
    select(res.id);
  };
  if (clr) clr.onclick = async () => {
    if (!confirm("Забути всі помилки Mako?")) return;
    await fetch("/api/faults/clear", { method: "POST" });
    await load();
  };
}

// One row per project or agent: how its tasks went. Hidden while there is only one.
function groupsHTML(title, groups, col, name = (n) => n) {
  if (!groups || groups.length < 2) return "";
  const rated = groups.some((g) => g.assessed);
  const row = (g) => `<tr><td>${esc(name(g.name))}</td><td>${g.taken}</td><td>${g.succeeded}</td><td>${g.failed}</td><td>${g.taken ? Math.round((g.succeeded / g.taken) * 100) : 0}%</td><td>${g.cost ? `$${g.cost.toFixed(2)}` : "—"}</td>${rated ? `<td>${g.assessed ? `${g.clarity.toFixed(1)}/5` : "—"}</td>` : ""}</tr>`;
  return `<h3>${title}</h3><div class="table"><table><thead><tr><th>${col}</th><th>Взято</th><th>Успішно</th><th>Не успішно</th><th>Успіх</th><th>Витрачено</th>${rated ? `<th title="Як добре описано задачі, за оцінкою агента">Опис</th>` : ""}</tr></thead><tbody>${groups.map(row).join("")}</tbody></table></div>`;
}

// «Поки вас не було»: what waits for you, the MRs to merge, what failed and got merged, with links to the tasks.
function digestHTML(d) {
  const at = (ms) => new Date(ms).toLocaleString("uk", { weekday: "short", hour: "2-digit", minute: "2-digit" });
  const item = (x) => `<li><a href="#${encodeURIComponent(x.id)}"><b>${esc(x.id)}</b> ${esc(x.title)}</a>`
    + (x.new ? ` <span class="digest-new">нове</span>` : "")
    + (x.note ? `<div class="muted">${esc(x.note)}</div>` : "")
    + (x.mr ? ` <a class="mr" href="${esc(x.mr)}" target="_blank" rel="noopener">MR ↗</a>` : "") + `</li>`;
  const part = (title, xs) => xs?.length ? `<h3>${title} <span class="muted">${xs.length}</span></h3><ul class="digest-list">${xs.map(item).join("")}</ul>` : "";
  const body = part("Чекає на вас", d.waiting) + part("MR готові до мерджу", d.review) + part("Не вдалося", d.failed) + part("Змерджено", d.merged);
  return `<div class="stats digest">
    <div class="digest-head"><h1>Поки вас не було</h1><button class="ghost" id="digest-close">Закрити</button></div>
    <p class="stats-note">${at(d.since)} — ${at(d.until)}</p>
    ${body || `<div class="text" style="color:var(--mute)">Нічого не сталося</div>`}
  </div>`;
}

function renderDetail() {
  const r = data.records.find((x) => x.id === selected);
  $("work").classList.toggle("detail", !!r || statsOpen || newOpen || !!digest);
  if (!r && digest) {
    closeTerminal(); shown = ""; $("detail").classList.remove("ws");
    $("detail").innerHTML = `<button class="ghost back" id="back">← Задачі</button>` + digestHTML(digest);
    $("back").onclick = $("digest-close").onclick = () => { digest = null; render(); };
    return;
  }
  if (!r && newOpen) {
    closeTerminal(); shown = ""; $("detail").classList.remove("ws");
    // The form keeps what is typed: the board re-renders every few seconds.
    if (newOpen === "why") { if (!$("why-form")) showWhy(); } else if (!$("new-form")) showNewTask();
    return;
  }
  if (!r) {
    closeTerminal(); shown = ""; $("detail").classList.remove("ws");
    $("detail").innerHTML = (statsOpen ? `<button class="ghost back" id="back">← Задачі</button>` : "") + statsHTML(data.stats) + faultsHTML(data.faults);
    if ($("back")) $("back").onclick = () => { statsOpen = false; render(); };
    bindFaults();
    return;
  }
  const t = r.task, st = state(r);
  const b = (action, label, cls = "", extra = "") => `<button class="${cls}" data-a="${action}" data-x="${extra}">${label}</button>`;
  // Icon buttons leave the room to the work; the name is in the tooltip.
  const ib = (action, label, icon, cls = "") => `<button class="icon ${cls}" data-a="${action}" title="${label}" aria-label="${label}">${ICON[icon]}</button>`;
  let actions = "";
  const term = r.executor === "terminal" && r.worktree;
  // Mako's own agent goes on after its MR too (CI, review comments), until the merge.
  const agentOn = term && !r.archivedAt && r.reviewState !== "merged" && (r.column === "doing" || r.column === "review");
  // «Повторити інакше»: an icon in the agent's workspace bar, words elsewhere.
  const redo = term ? `<button class="icon" data-redo title="Повторити інакше" aria-label="Повторити інакше">${ICON.redo}</button>` : `<button data-redo>Повторити інакше</button>`;
  if (r.column === "new") actions = b("take", "Взяти в роботу", "primary") + (r.postponed ? b("later", "Повернути", "", "&min=-1") : laterMenu());
  else if (r.status === "queued") actions = b("cancel", "Скасувати", "danger");
  else if (agentOn && r.column === "review") actions = (r.live ? ib("stop", "Зупинити агента", "stop") : ib("resume", "Продовжити розмову", "play")) + redo + ib("archive", "В архів", "archive");
  else if (r.column === "doing" && term) actions = (r.live ? ib("stop", "Зупинити агента", "stop") : ib("resume", "Продовжити розмову", "play")) + redo + ib("cancel", "Більше не стежити", "unwatch", "danger");
  else if (r.column === "doing") actions = (r.worktree ? b("focus", "Показати в Orca", agentOf(r)?.state === "waiting" ? "primary" : "") : "") + redo + ib("cancel", "Більше не стежити", "unwatch", "danger");
  else if (r.column === "failed") actions = b("retry", "Повторити", "primary") + redo + ib("archive", "В архів", "archive");
  else if (r.column === "review") actions = redo + ib("archive", "В архів", "archive");
  else actions = ib("archive", "В архів", "archive");
  if (r.archivedAt) actions = ib("unarchive", "Повернути з архіву", "unarchive");

  // The task's facts as chips: they wrap, so the narrow pane next to the agent and a phone fit them too.
  const chip = (body, cls = "", title = "") => `<span class="tchip ${cls}"${title ? ` title="${esc(title)}"` : ""}>${body}</span>`;
  const copy = (v, what) => `<button type="button" class="icon" data-copy="${esc(v)}" title="Скопіювати ${what}" aria-label="Скопіювати ${what}">${ICON.copy}</button>`;
  const chips = [];
  if (r.trackerStatus) chips.push(chip(`<span class="dot"></span><span class="v">${esc(r.trackerStatus.text)}</span>`, r.trackerStatus.ok ? "st" : "st bad", r.trackerStatus.ok ? "Статус у трекері" : r.trackerStatus.text));
  if (t.meta) chips.push(chip(esc(t.meta), "", "Трекер"));
  if (t.assignees?.length) chips.push(chip(`<span class="k">Виконавці</span>${esc(t.assignees.join(", "))}`));
  if (r.repo) chips.push(chip(`<span class="k">Репо</span>${esc(r.repo)}`));
  const branch = r.branch || r.branchName;
  if (branch) chips.push(chip(`${ICON.pr}<code>${esc(branch)}</code>${copy(branch, "назву гілки")}`, "", "Гілка"));
  if (r.worktree) chips.push(chip(`${ICON.folder}<code>${esc(shortPath(r.worktree))}</code>${copy(r.worktree, "шлях до worktree")}`, "", r.worktree));
  if (r.prUrl) {
    const rs = r.reviewState === "merged" ? ["змерджено", "merged"] : r.reviewState === "closed" ? ["закрито", "closed"] : ["відкрито", ""];
    chips.push(`<a class="tchip mr ${rs[1]}" href="${esc(r.prUrl)}" target="_blank" rel="noopener" title="${esc(r.prUrl)}"><span class="dot"></span>${esc(mrName(r.prUrl))} · ${rs[0]} ↗</a>`);
  }
  const card = (title, body, cls = "", note = "") => `<div class="tcard ${cls}"><div class="tcard-h">${title}${note ? `<span class="r">${note}</span>` : ""}</div>${body}</div>`;

  // The task itself first; what the agent does in Orca and Mako's log in their own tab.
  const task = `
    ${chips.length ? `<div class="tchips">${chips.join("")}</div>` : ""}
    ${r.summary && r.column !== "doing" ? card("Підсумок агента", summaryHTML(r.summary), "sum") : ""}
    ${assessmentHTML(r, card)}
    ${reviewerHTML(r)}
    ${r.retryNote ? card(`Спроба ${r.attempt || 2}: що зробити інакше`, `<div class="tcard-b text">${richText(r.retryNote)}</div>`, "", r.model ? `<code>${esc(r.model)}</code>` : "") : ""}
    ${card("Опис", `<div class="tcard-b text">${t.description?.trim() ? richText(t.description.trim()) : `<span style="color:var(--mute)">Без опису</span>`}</div>`, "", `з ${esc(trackerName(t))}`)}
    ${t.comments?.length ? card(`Коментарі · ${t.comments.length}`, t.comments.map((c) => `<div class="cmt"><span class="av">${esc(initials(c.author))}</span><div><b>${esc(c.author)}</b><div class="text">${richText(c.body)}</div></div></div>`).join("")) : ""}
    ${logs.length ? `<details class="journal" ${journalOpen ? "open" : ""}><summary>Журнал · ${logs.length} ${plural(logs.length, "запис", "записи", "записів")}</summary>
      <div class="log">${logs.map((l) => `${new Date(l.at).toLocaleTimeString("uk")}  ${linkify(l.text)}`).join("\n")}</div></details>` : ""}`;
  const started = r.column === "doing" && !!r.worktree;
  // A new task opened: a terminal task in progress opens on its terminal, the side card on its changes.
  if (workOf !== r.id) {
    workOf = r.id;
    itab = "changes"; itabPicked = false;
    changes = changesOf.get(r.id) ?? null; openFiles = []; fileTab = ""; diffs = {}; review = null; mrNote = ""; commitLog = null; commitOpen = {};
    pick = null; pickText = ""; reviewNote = "";
    tab = term && r.column === "doing" ? "orca" : "task";
    if (r.worktree) loadWork().then(renderDetail);
  } else if (started && !workStarted) {
    // Taken while open: once the agent has started, show its work instead of the task.
    tab = "orca"; fileTab = "";
    loadWork().then(renderDetail);
  }
  workStarted = started;
  // A task of Mako's own agent is one workspace: the tabs only change the centre, the right panel stays.
  const taskPane = term ? `<div class="task-pane">
      <div class="d-id">${trackerIcon(t)}${kind(r)}<span class="s ${st}">${LABEL[st]}</span><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(r.id)}</a><span>${esc(t.project)}</span></div>
      <h1>${esc(t.title)}</h1>
      ${t.labels?.length ? `<div class="labels">${t.labels.map((l) => `<span class="label">${esc(l)}</span>`).join("")}</div>` : ""}
      ${task}</div>` : "";
  const orca = (r.worktree ? workArea(r, term, taskPane) : "") + (term ? "" : agentBlock(r));
  if (!orca.trim()) tab = "task";
  const waiting = agentOf(r)?.state === "waiting";
  // One bar: the task, the agent's terminal (or Orca), and the files opened from the changes.
  const bar = orca.trim() ? `<div class="tabs">
      <button class="tab ${tab === "task" ? "on" : ""}" data-tab="task">Задача</button>
      <button class="tab ${tab === "orca" && !fileTab ? "on" : ""}" data-tab="orca">${term ? "Агент" : "Orca"}${waiting ? ` <span class="wait">· чекає на вас</span>` : ""}</button>
      ${openFiles.map((p) => `<button class="tab ${tab === "orca" && p === fileTab ? "on" : ""}" data-ftab="${esc(p)}" title="${esc(p)}">${esc(p.split("/").pop())}<span class="x" data-close="${esc(p)}" title="Закрити">×</span></button>`).join("")}
    </div>` : "";
  const ws = !!term;
  const body = ws ? orca : bar && tab === "orca" ? orca : task;
  // How the agent is shown: its chat or its terminal; the same conversation either way.
  const view = r.view === "chat" ? "chat" : "terminal";
  const views = agentOn ? `<span class="seg" role="group" aria-label="Вигляд агента">
      <button type="button" class="${view === "chat" ? "on" : ""}" data-view="chat">Чат</button><button type="button" class="${view === "terminal" ? "on" : ""}" data-view="terminal">Термінал</button></span>` : "";
  $("detail").classList.toggle("ws", ws);
  if (ws) $("detail").scrollTop = 0; // it does not scroll, but keeps where the task page was scrolled to

  const notices = `
    ${r.column === "new" && r.postponed ? `<div class="notice later-note">${ICON.clock}Відкладено ${untilText(r.snoozedUntil)}: тоді Mako нагадає про задачу</div>` : ""}
    ${r.error ? `<div class="notice ${r.status === "cancelled" ? "warn" : ""}">${linkify(r.error)}</div>` : ""}
    ${r.lesson && !r.archivedAt ? lessonHTML(r) : ""}
    ${r.gone && r.status !== "cancelled" ? `<div class="notice warn">Задачу ${r.gone === "deleted" ? "видалено" : "закрито"} в трекері, а агент ще працює над нею ${term ? "в терміналі" : "в Orca"}.</div>` : ""}`;
  // In the workspace the tabs, the task's id and the buttons share one thin bar: the rest is the terminal's.
  const html = ws ? `
    <button class="ghost back" id="back">← Задачі</button>
    <div class="ws-bar">${bar}${views}
      <div class="actions">${actions}</div>
    </div>${notices}${body}` : `
    <button class="ghost back" id="back">← Задачі</button>
    <div class="d-head">
      <div class="d-main">
        <div class="d-id">${trackerIcon(t)}${kind(r)}<span class="s ${st}">${LABEL[st]}</span><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(r.id)}</a><span>${esc(t.project)}</span></div>
        ${tab === "task" ? `<h1>${esc(t.title)}</h1>` : ""}
      </div>
      <div class="actions">${actions}</div>
    </div>
    ${t.labels?.length && !ws ? `<div class="labels">${t.labels.map((l) => `<span class="label">${esc(l)}</span>`).join("")}</div>` : ""}
    ${notices}
    ${bar}${body}`;
  if (!term) { closeTerminal(); closeChat(); }
  // The board reloads every 5 s: the same page is left as it is, so the terminal keeps its focus and selection.
  if (html === shown) return;
  const typing = tv?.el.contains(document.activeElement) || cv?.el.contains(document.activeElement);
  // The diff stays where it was scrolled to, and a comment being written keeps its cursor.
  const box = $("detail").querySelector(".diff-view > .diff"), scrolled = box && { path: box.dataset.path, top: box.scrollTop, left: box.scrollLeft };
  const writing = document.activeElement?.id === "note-input" && [document.activeElement.selectionStart, document.activeElement.selectionEnd];
  if (lessonEdit) lessonEdit.at = document.activeElement?.id === "lesson-input" && [document.activeElement.selectionStart, document.activeElement.selectionEnd];
  $("detail").innerHTML = shown = html;
  const box2 = $("detail").querySelector(".diff-view > .diff");
  if (box2) box2.dataset.path = fileTab;
  if (box2 && scrolled?.path === fileTab) { box2.scrollTop = scrolled.top; box2.scrollLeft = scrolled.left; }
  const li = $("lesson-input");
  if (li && lessonEdit?.id === r.id && lessonEdit.rule === r.lesson.rule) {
    li.value = lessonEdit.text;
    if (lessonEdit.at) { li.focus(); li.setSelectionRange(...lessonEdit.at); }
  }
  if (li) li.oninput = () => (lessonEdit = { id: r.id, rule: r.lesson.rule, text: li.value });
  for (const btn of $("detail").querySelectorAll("[data-lesson]")) btn.onclick = async () => {
    for (const x of $("detail").querySelectorAll("[data-lesson]")) x.disabled = true;
    const to = btn.dataset.lesson;
    const res = await fetch(`/api/lesson?id=${encodeURIComponent(r.id)}&to=${to}`, { method: "POST", body: li?.value ?? "" })
      .then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) toast(res.error, true);
    else { lessonEdit = null; if (to !== "no") toast(`Урок записано в CLAUDE.md (${to === "base" ? "основна гілка" : "гілка задачі"})`); }
    await load();
  };
  const input = $("note-input");
  if (input) {
    input.value = pickText;
    if (writing) { input.focus(); input.setSelectionRange(...writing); }
  }
  if (term && $("term-slot") && view === "chat") {
    closeTerminal();
    const c = chatFor(r.id);
    $("term-slot").append(c.el);
    restoreChatScroll(c);
    if (typing) c.input.focus();
  } else if (term && $("term-slot")) {
    closeChat();
    const v = terminalFor(r.id);
    $("term-slot").append(v.el);
    if (r.live && v.gone) connect(v);
    requestAnimationFrame(() => { v.resize(); if (typing) v.term.focus(); });
  }
  for (const j of $("detail").querySelectorAll("details.journal")) j.ontoggle = () => { journalOpen = j.open; };
  for (const c of $("detail").querySelectorAll("details.convo")) {
    // Stays at the end while the agent writes, unless the reader scrolled up.
    const body = c.querySelector(".convo-body");
    body.scrollTop = convoScroll?.id === r.id && !convoScroll.atEnd ? convoScroll.top : body.scrollHeight;
    body.onscroll = () => (convoScroll = { id: r.id, top: body.scrollTop, atEnd: body.scrollTop + body.clientHeight >= body.scrollHeight - 30 });
    c.ontoggle = async () => {
      if (convoOpen === c.open) return;
      convoOpen = c.open;
      try { localStorage.setItem("mako-chat", convoOpen ? "1" : "0"); } catch {}
      if (convoOpen) { await loadConvo(); renderDetail(); }
    };
  }
  for (const btn of $("detail").querySelectorAll("[data-itab]")) btn.onclick = () => {
    itab = btn.dataset.itab; itabPicked = true;
    renderDetail();
    loadWork().then(renderDetail);
  };
  for (const btn of $("detail").querySelectorAll("[data-commit]")) btn.onclick = async () => {
    const h = btn.dataset.commit;
    if (commitOpen[h]) { delete commitOpen[h]; renderDetail(); return; }
    commitOpen[h] = "loading";
    renderDetail();
    commitOpen[h] = await getJSON(`/api/commit?id=${encodeURIComponent(r.id)}&hash=${h}`);
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-view]")) btn.onclick = async () => {
    if (btn.classList.contains("on")) return;
    btn.disabled = true;
    await fetch(`/api/view?id=${encodeURIComponent(r.id)}&to=${btn.dataset.view}`, { method: "POST" });
    await load();
  };
  for (const btn of $("detail").querySelectorAll("[data-tab]")) btn.onclick = () => {
    tab = btn.dataset.tab;
    if (tab === "orca") fileTab = "";
    renderDetail();
    if (tab === "orca") { tv?.term.focus(); cv?.input.focus(); }
    loadWork().then(renderDetail);
  };
  for (const btn of $("detail").querySelectorAll("[data-file]")) btn.onclick = () => openFile(btn.dataset.file);
  for (const btn of $("detail").querySelectorAll("[data-copy]")) btn.onclick = () => navigator.clipboard?.writeText(btn.dataset.copy);
  for (const btn of $("detail").querySelectorAll("[data-open]")) btn.onclick = () => fetch(`/api/open?id=${encodeURIComponent(r.id)}&in=${btn.dataset.open}`, { method: "POST" });
  for (const btn of $("detail").querySelectorAll("[data-open-file]")) btn.onclick = () =>
    fetch(`/api/open?id=${encodeURIComponent(r.id)}&in=editor&file=${encodeURIComponent(btn.dataset.openFile)}`, { method: "POST" });
  bindNotes(r);
  for (const btn of $("detail").querySelectorAll("[data-dwhole]")) btn.onclick = () => {
    diffWhole = btn.dataset.dwhole === "1";
    try { localStorage.setItem("mako-diff-whole", diffWhole ? "1" : "0"); } catch {}
    for (const k in diffs) delete diffs[k];
    renderDetail();
    loadWork().then(renderDetail);
  };
  // From the change at the top of the view to the next or the one before it.
  for (const btn of $("detail").querySelectorAll("[data-dnav]")) btn.onclick = () => {
    const box = $("detail").querySelector(".diff-view > .diff");
    if (!box) return;
    const top = box.scrollTop, starts = [...box.querySelectorAll(".dstart")].map((e) => e.offsetTop - 40);
    const to = btn.dataset.dnav === "1" ? starts.find((y) => y > top + 2) : starts.reverse().find((y) => y < top - 2);
    if (to !== undefined) box.scrollTo({ top: Math.max(0, to), behavior: "smooth" });
  };
  for (const btn of $("detail").querySelectorAll("[data-dmode]")) btn.onclick = () => {
    diffMode = btn.dataset.dmode;
    try { localStorage.setItem("mako-diff", diffMode); } catch {}
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-ask]")) btn.onclick = () => { btn.disabled = true; btn.classList.add("busy"); mrAction(r.id, "ask", btn.dataset.ask); };
  for (const btn of $("detail").querySelectorAll("[data-merge]")) btn.onclick = () => {
    if (confirm("Змерджити MR? Гілку задачі буде видалено, задача отримає фінальний статус.")) { btn.disabled = true; mrAction(r.id, "merge"); }
  };
  for (const btn of $("detail").querySelectorAll("[data-close-mr]")) btn.onclick = () => {
    if (confirm("Закрити MR без злиття? Зміни лишаться в гілці, задача отримає статус «Не виконано».")) { btn.disabled = true; mrAction(r.id, "close"); }
  };
  for (const btn of $("detail").querySelectorAll("[data-dir]")) btn.onclick = () => {
    const d = btn.dataset.dir;
    if (!collapsed.delete(d)) collapsed.add(d);
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-ftab]")) btn.onclick = (e) => {
    if (e.target.dataset.close) return closeFile(e.target.dataset.close);
    tab = "orca";
    fileTab = btn.dataset.ftab;
    renderDetail();
    if (!(fileTab in diffs)) loadWork().then(renderDetail);
  };
  for (const btn of $("detail").querySelectorAll("[data-a]")) btn.onclick = () => post(btn.dataset.a, r.id, btn.dataset.x);
  for (const btn of $("detail").querySelectorAll("[data-redo]")) btn.onclick = () => openRedo(r);
  $("back").onclick = () => { selected = null; statsOpen = false; history.replaceState(null, "", location.pathname); try { localStorage.removeItem("mako-selected"); } catch {} render(); };
}

// Comments on the open file's lines: a click on a line number (Shift+click or a drag for several) opens the box
// to write in; the comments gather in the draft review, which goes to the agent as one message.
function bindNotes(r) {
  const box = $("detail").querySelector(".diff-view > .diff[data-notes]");
  if (box) {
    const rows = () => parseDiff(diffs[fileTab]).rows;
    const show = (a, b) => {
      for (const el of box.querySelectorAll("[data-row]")) {
        const on = +el.dataset.row >= Math.min(a, b) && +el.dataset.row <= Math.max(a, b);
        if (el.parentElement.classList.contains("dl")) el.parentElement.classList.toggle("picked", on);
        else { el.classList.toggle("picked", on); el.nextElementSibling?.classList.toggle("picked", on); }
      }
    };
    box.onmousedown = (e) => {
      const ln = e.target.closest("[data-row]");
      if (!ln || e.button !== 0) return;
      e.preventDefault();
      const all = rows(), at = +ln.dataset.row;
      // Shift+click goes on from the lines already picked in this file.
      const from = e.shiftKey && pick?.path === fileTab && !pick.edit ? linesAt(all, pick.rows, pick.line) : -1;
      const drag = { a: from >= 0 ? from : at, b: at };
      show(drag.a, drag.b);
      box.onmouseover = (ev) => {
        const over = ev.target.closest("[data-row]");
        if (over) { drag.b = +over.dataset.row; show(drag.a, drag.b); }
      };
      document.addEventListener("mouseup", () => {
        box.onmouseover = null;
        const lo = Math.min(drag.a, drag.b), hi = Math.max(drag.a, drag.b), picked = all.slice(lo, hi + 1).map(({ t, o, n, s }) => ({ t, o, n, s }));
        if (!pick || pick.edit) pickText = "";
        pick = { path: fileTab, rows: picked, line: lineOf(picked[0]) };
        renderDetail();
        $("note-input")?.focus();
      }, { once: true });
    };
  }
  const input = $("note-input");
  const cancel = () => { pick = null; pickText = ""; renderDetail(); };
  const save = () => {
    const text = pickText.trim(), list = notesOf(r.id);
    if (pick.edit) {
      const n = list.find((x) => x.id === pick.edit);
      if (n && text) n.text = text;
      else if (n) list.splice(list.indexOf(n), 1);
    } else if (text) list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), path: pick.path, rows: pick.rows, line: pick.line, text });
    saveNotes();
    reviewNote = "";
    cancel();
  };
  if (input) {
    input.oninput = () => (pickText = input.value);
    input.onkeydown = (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
      else if (e.key === "Escape") { e.preventDefault(); cancel(); }
    };
  }
  for (const btn of $("detail").querySelectorAll("[data-note-save]")) btn.onclick = save;
  for (const btn of $("detail").querySelectorAll("[data-note-cancel]")) btn.onclick = cancel;
  for (const btn of $("detail").querySelectorAll("[data-note-edit]")) btn.onclick = () => {
    const n = notesOf(r.id).find((x) => x.id === btn.dataset.noteEdit);
    if (!n) return;
    pick = { path: n.path, rows: n.rows, line: n.line, edit: n.id };
    pickText = n.text;
    renderDetail();
    $("note-input")?.focus();
  };
  for (const btn of $("detail").querySelectorAll("[data-note-del]")) btn.onclick = () => {
    notes[r.id] = notesOf(r.id).filter((x) => x.id !== btn.dataset.noteDel);
    saveNotes();
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-review-clear]")) btn.onclick = () => {
    if (!confirm("Видалити всі коментарі чернетки?")) return;
    notes[r.id] = notesOf(r.id).filter((x) => x.sent);
    saveNotes();
    reviewNote = "";
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-review-send]")) btn.onclick = async () => {
    const drafts = notesOf(r.id).filter((x) => !x.sent);
    if (!drafts.length) return;
    btn.disabled = true;
    const res = await fetch(`/api/say?id=${encodeURIComponent(r.id)}`, { method: "POST", body: reviewMessage(drafts) }).then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) reviewNote = `⚠ ${res.error}`;
    else {
      for (const n of drafts) n.sent = true;
      saveNotes();
      reviewNote = `Надіслано агенту: ${drafts.length} ${plural(drafts.length, "коментар", "коментарі", "коментарів")}`;
      if (cv?.id === r.id) { if (!cv.snap?.live) cv.version = -1; pollChat(); }
    }
    renderDetail();
  };
}

// The task from the link, else the one open last time.
// Mako's chat with the agent: one for the open task, kept while the board re-renders around it; the board asks
// for its conversation every second and redraws it only when it changed.
let cv = null;
function chatFor(id) {
  if (cv?.id === id) return cv;
  closeChat();
  const el = document.createElement("div");
  el.className = "chat";
  el.innerHTML = `<div class="chat-list" role="log" aria-live="polite"></div>
    <div class="chat-resume" hidden><button type="button" class="resume-btn on-light" data-chat-resume title="Агент зупинився. Розмова збережена в Claude Code.">${ICON.play}Продовжити розмову</button></div>
    <div class="chat-foot">
      <div class="chat-quick">${["Продовжуй", "Запусти тести", "Відкрий MR"].map((q) => `<button type="button" class="chip" data-quick="${q}">${q}</button>`).join("")}</div>
      <div class="chat-box"><textarea rows="2" aria-label="Повідомлення агенту"></textarea>
        <button type="button" class="icon chat-stop" title="Перервати поточний крок" aria-label="Перервати поточний крок" hidden>${ICON.stop}</button>
        <button type="button" class="chat-send" title="Надіслати (Enter)" aria-label="Надіслати">${ICON.push}</button></div>
      <div class="chat-hint">
        <label class="chat-mode" title="Що Claude робить без питань; діє одразу, як Shift+Tab у терміналі">
          <select aria-label="Що Claude робить без питань">
            <option value="auto">auto</option><option value="default">питати все</option><option value="acceptEdits">правки без питань</option>
            <option value="plan">план</option><option value="bypassPermissions">без питань</option></select></label>
        <span class="chat-model"></span><span class="chat-ctx"></span><span class="chat-limits"></span>
        <span class="chat-keys">Enter — надіслати · Shift+Enter — новий рядок</span></div>
    </div>`;
  const v = (cv = { id, el, list: el.querySelector(".chat-list"), input: el.querySelector("textarea"), version: -1, flip: new Set(), snap: null, top: 0, atEnd: true, auto: -1 });
  // What grows after it is drawn (pictures, opened blocks) keeps the end in view.
  v.grow = new ResizeObserver(() => { if (v.atEnd && v.list.isConnected) restoreChatScroll(v); });
  // Where the reader is: the board re-attaches the chat when it redraws the page, and that drops the list's scroll.
  // Only the reader's own scrolling counts: the event from Mako setting the scroll itself comes a frame later, when
  // pictures may have loaded and pushed the end down, and would leave the chat in the middle from then on.
  v.list.onscroll = () => {
    if (!v.list.isConnected || Math.abs(v.list.scrollTop - v.auto) < 2) return;
    v.top = v.list.scrollTop;
    v.atEnd = v.list.scrollHeight - v.list.scrollTop - v.list.clientHeight < 60;
  };
  // To a closed agent too: the message resumes the conversation, in a new session the board reads from 0.
  const say = async (text) => {
    if (!text) return;
    const r = await (await fetch(`/api/say?id=${encodeURIComponent(id)}`, { method: "POST", body: text })).json().catch(() => ({}));
    const keys = el.querySelector(".chat-keys");
    keys.classList.toggle("err", r.ok === false);
    keys.textContent = r.ok === false ? `⚠ ${r.error}` : "Enter — надіслати · Shift+Enter — новий рядок";
    if (r.ok === false) v.input.value ||= text;
    if (!v.snap?.live) v.version = -1;
    pollChat();
  };
  const send = () => { const text = v.input.value.trim(); v.input.value = ""; say(text); };
  for (const q of el.querySelectorAll("[data-quick]")) q.onclick = () => say(q.dataset.quick);
  v.input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
  el.querySelector(".chat-send").onclick = send;
  el.querySelector(".chat-mode select").onchange = (e) =>
    fetch(`/api/mode?id=${encodeURIComponent(id)}&to=${e.target.value}`, { method: "POST" }).then(() => pollChat());
  el.querySelector(".chat-stop").onclick = () => fetch(`/api/interrupt?id=${encodeURIComponent(id)}`, { method: "POST" });
  el.querySelector("[data-chat-resume]").onclick = () => post("resume", id).then(() => { v.version = -1; pollChat(); });
  v.list.onclick = (e) => {
    const t = e.target.closest("[data-toggle]");
    if (t) { if (!v.flip.delete(t.dataset.toggle)) v.flip.add(t.dataset.toggle); renderChat(v); return; }

// #new: straight to the new-task form.
if (location.hash === "#new") newOpen = "task";
else selected = startDigest ? null : decodeURIComponent(location.hash.slice(1)) || (() => { try { return localStorage.getItem("mako-selected"); } catch { return null; } })();
// A link to a task (from a notification or the menu) opens it even when the board is already open.
// An open menu closes on a click anywhere else.
document.addEventListener("click", (e) => {
  for (const m of document.querySelectorAll("details.menu[open]")) if (!m.contains(e.target)) m.open = false;
});
window.addEventListener("hashchange", () => {
  const since = digestHash();
  if (since) return loadDigest(since);
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === "new") return openNewTask();
  if (id && id !== selected) select(id);
});
// Back at the board: look at once, so what happened meanwhile shows without waiting for the next poll.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
// On a phone: the app on the home screen, its service worker, and pushes once the user allows them.
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
// iPadOS calls itself a Mac; its touch screen tells it apart.
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
// Android's Chrome offers to install the app itself; the event comes once the page qualifies.
let installPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installPrompt = e;
  const b = $("install-app");
  if (b) b.hidden = false;
});
let phoneReady = false;
function setupPhone() {
  if (phoneReady || !data?.remote) return;
  phoneReady = true;
  document.body.classList.add("phone");
  $("settings-link").hidden = true;
  if (!standalone && ios) {
    // iOS gives pushes only to an app added to the home screen.
    $("phone-hint").innerHTML = `<div class="banner"><div>Додайте Mako на екран «Додому»: «Поділитися» <b>⎙</b> → «На екран “Додому”». Потім відкривайте Mako зі значка: так приходять сповіщення.</div></div>`;
    return;
  }
  if (!standalone) {
    // Android: pushes work in the browser too, the app on the home screen is for convenience.
    $("phone-hint").innerHTML = `<div class="banner"><div>Встановіть Mako як додаток: меню браузера <b>⋮</b> → «Додати на головний екран».</div>
      <button class="primary" id="install-app"${installPrompt ? "" : " hidden"}>Встановити</button></div>`;
    $("install-app").onclick = async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      if ((await installPrompt.userChoice).outcome === "accepted") $("phone-hint").innerHTML = "";
      installPrompt = null;
    };
  }
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  navigator.serviceWorker.register("/sw.js").then(async (reg) => {
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === "granted") return subscribe(sub);
    $("bell").hidden = false;
  });
  $("bell").onclick = async () => {
    try {
      if ((await Notification.requestPermission()) !== "granted") return alert(ios
        ? "Сповіщення не дозволено. Увімкніть їх: Параметри → Сповіщення → Mako."
        : "Сповіщення не дозволено. Увімкніть їх: 🔒 біля адреси → Дозволи → Сповіщення (або Налаштування → Додатки → Mako → Сповіщення).");
      const reg = await navigator.serviceWorker.ready;
      const { key } = await (await fetch("/api/push/key")).json();
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlKey(key) });
      await subscribe(sub);
      $("bell").hidden = true;
    } catch (e) {
      alert("Не вдалося увімкнути сповіщення: " + e.message);
    }
  };
}
const subscribe = (sub) => fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
function urlKey(b64) {
  const raw = atob((b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

load().then(() => { setupPhone(); if (startDigest) loadDigest(startDigest); });
setInterval(load, 5000);
</script>
</body>
