      .then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) toast(res.error, true);
    else { lessonEdit = null; if (to !== "no") toast(`Lesson saved to CLAUDE.md (${to === "base" ? "base branch" : "task branch"})`); }
    await load();
  };
  for (const btn of $("detail").querySelectorAll("[data-kept]")) btn.onclick = async () => {
    if (btn.dataset.kept === "clean" && !(await askConfirm("Delete the worktree along with uncommitted changes? This cannot be undone.", { ok: "Delete", danger: true }))) return;
    for (const x of $("detail").querySelectorAll("[data-kept]")) x.disabled = true;
    const res = await fetch(`/api/${btn.dataset.kept}?id=${encodeURIComponent(r.id)}`, { method: "POST" }).then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) toast(res.error, true);
    await load();
  };
  for (const btn of $("detail").querySelectorAll("[data-notsecret]")) btn.onclick = async () => {
    btn.disabled = true;
    const res = await fetch(`/api/notsecret?id=${encodeURIComponent(r.id)}&key=${encodeURIComponent(btn.dataset.notsecret)}`, { method: "POST" })
      .then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) toast(res.error, true);
    else toast("Line allowed: the next push will skip it");
    await load();
  };
  const input = $("note-input");
  if (input) {
    input.value = pickText;
    if (writing) { input.focus(); input.setSelectionRange(...writing); }
  }
  if (term && $("term-slot") && view === "chat") {
    closeTerminal();
    const c = chatFor(r.id);
    $("term-slot").append(c.el);
    drawViewNext(c.el, r);
    restoreChatScroll(c);
    if (typing) c.input.focus();
  } else if (term && $("term-slot")) {
    closeChat();
    const v = terminalFor(r.id);
    $("term-slot").append(v.el);
    drawViewNext(v.el, r);
    if (r.live && v.gone) connect(v);
    requestAnimationFrame(() => { v.resize(); if (typing) v.term.focus(); });
  }
  for (const j of $("detail").querySelectorAll("details.journal")) j.ontoggle = () => { journalOpen = j.open; };
  // The folded description and questions stay as you left them over the reloads.
  for (const d of $("detail").querySelectorAll("details[data-desc]")) d.ontoggle = () => { descOpen[r.id] = d.open; };
  for (const d of $("detail").querySelectorAll("details[data-qs]")) d.ontoggle = () => { qOpen[r.id] = d.open; };
  for (const btn of $("detail").querySelectorAll("[data-stage]")) btn.onclick = () => {
    const shownBelow = r.column === "new" && btn.dataset.stage === "estimate" && $("detail").querySelector(".tcard.assess");
    if (shownBelow) return shownBelow.scrollIntoView({ behavior: "smooth", block: "start" });
    stageOpen[r.id] = stageOpen[r.id] === btn.dataset.stage ? "" : btn.dataset.stage;
    renderDetail();
  };
  // «2 blockers, 4 suggestions» in the Review row: to the last round's table, to the first remark of that weight.
  // The table is in the Checks stage: opened first when it is not on the page.
  for (const btn of $("detail").querySelectorAll("[data-remarks]")) btn.onclick = () => {
    const id = `ar-${r.id}-${r.agentReviews?.length}`;
    if (!document.getElementById(id)) { stageOpen[r.id] = "checks"; renderDetail(); }
    const round = document.getElementById(id);
    if (!round) return;
    const to = (btn.dataset.remarks && round.querySelector(`li.rm.${btn.dataset.remarks}`)) || round;
    to.scrollIntoView({ behavior: "smooth", block: "start" });
    to.classList.remove("rm-flash");
    void to.offsetWidth;
    to.classList.add("rm-flash");
    to.addEventListener("animationend", () => to.classList.remove("rm-flash"), { once: true });
  };
  // A pick in "⋯" closes it.
  for (const m of $("detail").querySelectorAll("details.more")) m.querySelector(".menu-pop").addEventListener("click", (e) => { if (e.target.closest("button, a")) m.open = false; });
  for (const c of $("detail").querySelectorAll("details.convo")) {
    // Stays at the end while the agent writes, unless the reader scrolled up.
    const body = c.querySelector(".convo-body");
    body.scrollTop = convoScroll?.id === r.id && !convoScroll.atEnd ? convoScroll.top : body.scrollHeight;
    body.onscroll = () => (convoScroll = { id: r.id, top: body.scrollTop, atEnd: body.scrollTop + body.clientHeight >= body.scrollHeight - 30 });
    c.ontoggle = async () => {
      if (convoOpen === c.open) return;
      convoOpen = c.open;
      try { localStorage.setItem("mako-chat", convoOpen ? "1" : "0"); } catch {}
      if (convoOpen) { await loadConvo(); renderDetail(); }
    };
  }
  for (const btn of $("detail").querySelectorAll("[data-itab]")) btn.onclick = () => {
    itab = btn.dataset.itab; itabPicked = true;
    renderDetail();
    loadWork().then(renderDetail);
  };
  for (const btn of $("detail").querySelectorAll("[data-commit]")) btn.onclick = async () => {
    const h = btn.dataset.commit;
    if (commitOpen[h]) { delete commitOpen[h]; renderDetail(); return; }
    commitOpen[h] = "loading";
    renderDetail();
    commitOpen[h] = await getJSON(`/api/commit?id=${encodeURIComponent(r.id)}&hash=${h}`);
    renderDetail();
  };
  // The view it is in again, while a switch waits for the turn: that switch is cancelled.
  for (const btn of $("detail").querySelectorAll("[data-view]")) btn.onclick = async () => {
    if (btn.classList.contains("on") && !r.viewNext) return;
    btn.disabled = true;
    await switchView(r.id, btn.dataset.view);
  };
  for (const btn of $("detail").querySelectorAll("[data-tab]")) btn.onclick = () => {
    tab = btn.dataset.tab; tabPicked = true;
    if (tab === "orca" || tab === "side") fileTab = "";
    renderDetail();
    if (tab === "orca") { tv?.term.focus(); cv?.input.focus(); }
    loadWork().then(renderDetail);
  };
  for (const btn of $("detail").querySelectorAll("[data-file]")) btn.onclick = () => openFile(btn.dataset.file);
  for (const btn of $("detail").querySelectorAll("[data-copy]")) btn.onclick = () => {
    const done = navigator.clipboard?.writeText(btn.dataset.copy);
    // The branch name flashes green for a moment, only when it was really copied; the flash outlives a redraw of the panel.
    if (btn.classList.contains("branch-name")) done?.then(() => {
      nameFlashUntil = Date.now() + 1200;
      const mark = (on) => { for (const el of document.querySelectorAll(".branch-name")) el.classList.toggle("copied", on); };
      mark(true); setTimeout(() => mark(false), 1200);
    }, () => {});
  };
  for (const btn of $("detail").querySelectorAll("[data-open]")) btn.onclick = () => fetch(`/api/open?id=${encodeURIComponent(r.id)}&in=${btn.dataset.open}`, { method: "POST" });
  for (const btn of $("detail").querySelectorAll("[data-open-file]")) btn.onclick = () =>
    fetch(`/api/open?id=${encodeURIComponent(r.id)}&in=editor&file=${encodeURIComponent(btn.dataset.openFile)}`, { method: "POST" });
  bindNotes(r);
  for (const btn of $("detail").querySelectorAll("[data-dwhole]")) btn.onclick = () => {
    diffWhole = btn.dataset.dwhole === "1";
    try { localStorage.setItem("mako-diff-whole", diffWhole ? "1" : "0"); } catch {}
    for (const k in diffs) delete diffs[k];
    renderDetail();
    loadWork().then(renderDetail);
  };
  // From the change at the top of the view to the next or the one before it.
  for (const btn of $("detail").querySelectorAll("[data-dnav]")) btn.onclick = () => {
    const box = $("detail").querySelector(".diff-view > .diff");
    if (!box) return;
    const top = box.scrollTop, starts = [...box.querySelectorAll(".dstart")].map((e) => e.offsetTop - 40);
    const to = btn.dataset.dnav === "1" ? starts.find((y) => y > top + 2) : starts.reverse().find((y) => y < top - 2);
    if (to !== undefined) box.scrollTo({ top: Math.max(0, to), behavior: "smooth" });
  };
  for (const btn of $("detail").querySelectorAll("[data-dmode]")) btn.onclick = () => {
    diffMode = btn.dataset.dmode;
    try { localStorage.setItem("mako-diff", diffMode); } catch {}
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-ask]")) btn.onclick = () => { btn.disabled = true; btn.classList.add("busy"); markAsked(r.id, btn.dataset.ask); mrAction(r.id, "ask", btn.dataset.ask); };
  for (const btn of $("detail").querySelectorAll("[data-merge]")) btn.onclick = async () => {
    if (await askConfirm("Merge the MR? The task branch will be deleted and the task will get its final status.", { ok: "Merge", success: true })) { btn.disabled = true; mrAction(r.id, "merge"); }
  };
  for (const btn of $("detail").querySelectorAll("[data-close-mr]")) btn.onclick = async () => {
    if (await askConfirm("Close the MR without merging? The changes stay on the branch and the task gets the status “Not done”.", { ok: "Close MR" })) { btn.disabled = true; mrAction(r.id, "close"); }
  };
  for (const btn of $("detail").querySelectorAll("[data-dir]")) btn.onclick = () => {
    const d = btn.dataset.dir;
    if (!collapsed.delete(d)) collapsed.add(d);
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-ftab]")) btn.onclick = (e) => {
    if (e.target.dataset.close) return closeFile(e.target.dataset.close);
    tab = "orca";
    fileTab = btn.dataset.ftab;
    renderDetail();
    if (!(fileTab in diffs)) loadWork().then(renderDetail);
  };
  for (const btn of $("detail").querySelectorAll("[data-a]")) btn.onclick = async () => {
    if (btn.dataset.a === "cancel" && r.starting && !(await askConfirm("Cancel the launch? Preparation will be stopped and the created worktree removed.", { ok: "Cancel launch", cancel: "Keep going" }))) return;
    post(btn.dataset.a, r.id, btn.dataset.x);
  };
  for (const btn of $("detail").querySelectorAll("[data-self]")) btn.onclick = () => {
    btn.disabled = true;
    post("selfcheck", r.id, `&on=${btn.dataset.self}`);
  };
  for (const btn of $("detail").querySelectorAll("[data-redo]")) btn.onclick = () => openRedo(r);
  $("back").onclick = () => { selected = null; statsOpen = false; history.replaceState(null, "", location.pathname); try { localStorage.removeItem("mako-selected"); } catch {} render(); };
}

// Comments on the open file's lines: a click on a line number (Shift+click or a drag for several) opens the box
// to write in; the comments gather in the draft review, which goes to the agent as one message.
function bindNotes(r) {
  const box = $("detail").querySelector(".diff-view > .diff[data-notes]");
  if (box) {
    const rows = () => parseDiff(diffs[fileTab]).rows;
    const show = (a, b) => {
      for (const el of box.querySelectorAll("[data-row]")) {
        const on = +el.dataset.row >= Math.min(a, b) && +el.dataset.row <= Math.max(a, b);
        if (el.parentElement.classList.contains("dl")) el.parentElement.classList.toggle("picked", on);
        else { el.classList.toggle("picked", on); el.nextElementSibling?.classList.toggle("picked", on); }
      }
    };
    box.onmousedown = (e) => {
      const ln = e.target.closest("[data-row]");
      if (!ln || e.button !== 0) return;
      e.preventDefault();
      const all = rows(), at = +ln.dataset.row;
      // Shift+click goes on from the lines already picked in this file.
      const from = e.shiftKey && pick?.path === fileTab && !pick.edit ? linesAt(all, pick.rows, pick.line) : -1;
      const drag = { a: from >= 0 ? from : at, b: at };
      show(drag.a, drag.b);
      box.onmouseover = (ev) => {
        const over = ev.target.closest("[data-row]");
        if (over) { drag.b = +over.dataset.row; show(drag.a, drag.b); }
      };
      document.addEventListener("mouseup", () => {
        box.onmouseover = null;
        const lo = Math.min(drag.a, drag.b), hi = Math.max(drag.a, drag.b), picked = all.slice(lo, hi + 1).map(({ t, o, n, s }) => ({ t, o, n, s }));
        if (!pick || pick.edit) pickText = "";
        pick = { path: fileTab, rows: picked, line: lineOf(picked[0]) };
        renderDetail();
        $("note-input")?.focus();
      }, { once: true });
    };
  }
  const input = $("note-input");
  const cancel = () => { pick = null; pickText = ""; renderDetail(); };
  const save = () => {
    const text = pickText.trim(), list = notesOf(r.id);
    if (pick.edit) {
      const n = list.find((x) => x.id === pick.edit);
      if (n && text) n.text = text;
      else if (n) list.splice(list.indexOf(n), 1);
    } else if (text) list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), path: pick.path, rows: pick.rows, line: pick.line, text });
    saveNotes();
    reviewNote = "";
    cancel();
  };
  if (input) {
    input.oninput = () => (pickText = input.value);
    input.onkeydown = (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
      else if (e.key === "Escape") { e.preventDefault(); cancel(); }
    };
  }
  for (const btn of $("detail").querySelectorAll("[data-note-save]")) btn.onclick = save;
  for (const btn of $("detail").querySelectorAll("[data-note-cancel]")) btn.onclick = cancel;
  for (const btn of $("detail").querySelectorAll("[data-note-edit]")) btn.onclick = () => {
    const n = notesOf(r.id).find((x) => x.id === btn.dataset.noteEdit);
    if (!n) return;
    pick = { path: n.path, rows: n.rows, line: n.line, edit: n.id };
    pickText = n.text;
    renderDetail();
    $("note-input")?.focus();
  };
  for (const btn of $("detail").querySelectorAll("[data-note-del]")) btn.onclick = () => {
    notes[r.id] = notesOf(r.id).filter((x) => x.id !== btn.dataset.noteDel);
    saveNotes();
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-review-clear]")) btn.onclick = async () => {
    if (!(await askConfirm("Delete all draft comments?", { ok: "Delete", danger: true }))) return;
    notes[r.id] = notesOf(r.id).filter((x) => x.sent);
    saveNotes();
    reviewNote = "";
    renderDetail();
  };
  for (const btn of $("detail").querySelectorAll("[data-review-send]")) btn.onclick = async () => {
    const drafts = notesOf(r.id).filter((x) => !x.sent);
    if (!drafts.length) return;
    btn.disabled = true;
    const res = await fetch(`/api/say?id=${encodeURIComponent(r.id)}`, { method: "POST", body: reviewMessage(drafts) }).then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (res.ok === false) reviewNote = `⚠ ${res.error}`;
    else {
      for (const n of drafts) n.sent = true;
      saveNotes();
      reviewNote = `Sent to the agent: ${drafts.length} ${plural(drafts.length, "comment", "comments")}`;
      if (cv?.id === r.id) { if (!cv.snap?.live) cv.version = -1; pollChat(); }
    }
    renderDetail();
  };
}

// The task from the link, else the one open last time.
// Mako's chat with the agent: one for the open task, kept while the board re-renders around it; the board asks
// for its conversation every second and redraws it only when it changed.
let cv = null;
function chatFor(id) {
  if (cv?.id === id) return cv;
  closeChat();
  const el = document.createElement("div");
  el.className = "chat";
  el.innerHTML = `<div class="view-next" role="status" hidden></div>
    <div class="chat-progress" hidden></div>
    <div class="chat-list" role="log" aria-live="polite"></div>
    <div class="chat-resume" hidden><button type="button" class="resume-btn on-light" data-chat-resume title="The agent has stopped. The conversation is saved in Claude Code.">${ICON.play}Continue conversation</button></div>
    <div class="chat-dock" hidden></div>
    <div class="chat-foot">
      <div class="chat-quick"></div>
      <div class="chat-ctxwarn" role="status" hidden></div>
      <div class="chat-status" hidden><span class="dot"></span><b class="st"></b><span class="st-more"></span></div>
      <div class="chat-box composer">
        <div class="chat-att" hidden></div>
        <textarea rows="2" aria-label="Message to the agent"></textarea>
        <div class="chat-row">
          <span class="chat-mode"><button type="button" class="chat-mode-btn" aria-haspopup="menu" aria-expanded="false" title="What Claude does without asking; takes effect immediately, like Shift+Tab in the terminal"></button>
            <span class="chat-mode-menu" role="menu" hidden>${MODES.map(([m, label, hint]) => `<button type="button" role="menuitemradio" data-mode="${m}"><b>${label}</b><span class="muted">${hint}</span></button>`).join("")}</span></span>
          <span class="chat-model"></span><span class="chat-ctx"></span>
          <span class="spacer"></span>
          <input type="file" accept="image/*" multiple hidden>
          <button type="button" class="icon chat-attach" title="Attach a picture (or paste it with ⌘V)" aria-label="Attach a picture">${ICON.clip}</button>
          <button type="button" class="chat-send" title="Send (Enter)" aria-label="Send">${ICON.up}</button></div></div>
      <div class="chat-keys" hidden></div>
    </div>`;
  const v = (cv = { id, el, list: el.querySelector(".chat-list"), input: el.querySelector("textarea"), version: -1, flip: new Set(), snap: null, top: 0, atEnd: true, auto: -1,
    att: [], seen: 0, total: 0 });
  // What grows after it is drawn (pictures, opened blocks) keeps the end in view.
  v.grow = new ResizeObserver(() => { if (v.atEnd && v.list.isConnected) restoreChatScroll(v); });
  // Where the reader is: the board re-attaches the chat when it redraws the page, and that drops the list's scroll.
  // Only the reader's own scrolling counts: the event from Mako setting the scroll itself comes a frame later, when
  // pictures may have loaded and pushed the end down, and would leave the chat in the middle from then on.
  v.list.onscroll = () => {
    if (!v.list.isConnected || Math.abs(v.list.scrollTop - v.auto) < 2) return;
    v.top = v.list.scrollTop;
    v.atEnd = v.list.scrollHeight - v.list.scrollTop - v.list.clientHeight < 60;
    if (v.atEnd) { v.seen = v.total; const n = v.list.querySelector(".chat-new"); if (n) n.hidden = true; }
  };
  const keys = el.querySelector(".chat-keys");
  const warn = (msg) => { keys.hidden = !msg; keys.textContent = msg ? `⚠ ${msg}` : ""; };
  // To a closed agent too: the message resumes the conversation, in a new session the board reads from 0.
  const say = async (text) => {
    if (!text) return;
    const r = await (await fetch(`/api/say?id=${encodeURIComponent(id)}`, { method: "POST", body: text })).json().catch(() => ({}));
    warn(r.ok === false ? r.error : "");
    if (r.ok === false) v.input.value ||= text;
    if (!v.snap?.live) v.version = -1;
    v.atEnd = true;
    pollChat();
  };
  // The pictures attached go with the message as lines naming their files: the agent reads them from there.
  const send = () => {
    const text = [v.input.value.trim(), ...v.att.map((a) => a.line)].filter(Boolean).join("\n");
    v.input.value = ""; v.att = []; drawAttached(v);
    say(text);
  };
  const interrupt = () => fetch(`/api/interrupt?id=${encodeURIComponent(id)}`, { method: "POST" });
  // While the agent runs and nothing is typed, the send button is Stop; a typed message turns it back into Send.
  const sendOrStop = () => { if (stopMode(v)) interrupt(); else send(); };
  const attach = async (files) => {
    for (const f of files) {
      if (!f.type.startsWith("image/")) continue;
      const r = await (await fetch(`/api/attach?id=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name || "image.png")}`,
        { method: "POST", headers: { "Content-Type": f.type }, body: f })).json().catch(() => ({ ok: false, error: "the picture did not upload" }));
      if (r.ok === false) { warn(r.error); continue; }
      warn("");
      v.att.push({ line: r.line, url: r.url, name: f.name || "image" });
      drawAttached(v);
    }
  };
  const file = el.querySelector('input[type="file"]');
  el.querySelector(".chat-attach").onclick = () => file.click();
  file.onchange = () => { attach([...file.files]); file.value = ""; };
  v.input.onpaste = (e) => {
    const files = [...(e.clipboardData?.files ?? [])].filter((f) => f.type.startsWith("image/"));
    if (files.length) { e.preventDefault(); attach(files); }
  };
  el.querySelector(".chat-att").onclick = (e) => {
    const x = e.target.closest("[data-unattach]");
    if (x) { v.att.splice(+x.dataset.unattach, 1); drawAttached(v); }
  };
  // The next actions after a turn: a message to the agent, or one of Mako's own actions on the task.
  el.querySelector(".chat-quick").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.quick) { say(b.dataset.quick); return; }
    const next = b.dataset.next;
    if (next === "open" || next === "push") {
      fetch(`/api/ask?id=${encodeURIComponent(id)}&kind=${next}`, { method: "POST" }).then((x) => x.json()).catch(() => ({}))
        .then((r) => { warn(r.ok === false ? r.error : ""); v.version = -1; pollChat(); });
    } else if (next === "agentreview") post("agentreview", id);
    else if (next === "diff") { const f = changesOf.get(id)?.files?.[0]; if (f) openFile(f.path); }
  };
  // The context nearly full: compact the conversation now, or start a new one.
  el.querySelector(".chat-ctxwarn").onclick = async (e) => {
    if (e.target.closest("[data-compact]")) say("/compact");
    else if (e.target.closest("[data-fresh]")) {
      if (!(await askConfirm("Start a new conversation with the agent? It starts the task over in the same worktree: the work in the branch stays, this conversation's context is dropped.", { ok: "Start new" }))) return;
      fetch(`/api/fresh?id=${encodeURIComponent(id)}`, { method: "POST" }).then((x) => x.json()).catch(() => ({}))
        .then((r) => { warn(r.ok === false ? r.error : ""); v.version = -1; v.atEnd = true; pollChat(); });
    }
  };
  v.input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
  v.input.addEventListener("input", () => drawSend(v));
  el.querySelector(".chat-send").onclick = sendOrStop;
  // The mode: a button and its menu, like the model's.
  const modeBtn = el.querySelector(".chat-mode-btn"), modeMenu = el.querySelector(".chat-mode-menu");
  const showModes = (on) => { modeMenu.hidden = !on; modeBtn.setAttribute("aria-expanded", on ? "true" : "false"); };
  modeBtn.onclick = (e) => { e.stopPropagation(); showModes(modeMenu.hidden); };
  modeMenu.onclick = (e) => {
    const b = e.target.closest("[data-mode]");
    if (!b) return;
    showModes(false);
    fetch(`/api/mode?id=${encodeURIComponent(id)}&to=${b.dataset.mode}`, { method: "POST" }).then(() => pollChat());
  };
  el.addEventListener("click", (e) => { if (!modeMenu.hidden && !e.target.closest(".chat-mode")) showModes(false); });
  // Esc closes the open menu; otherwise it interrupts the step, like in the terminal.
  el.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || e.defaultPrevented || e.isComposing) return;
    if (!modeMenu.hidden) { showModes(false); modeBtn.focus(); }
    else if (v.snap?.state === "working" || v.snap?.state === "waiting") interrupt();
  });
  el.querySelector("[data-chat-resume]").onclick = () => post("resume", id).then(() => { v.version = -1; pollChat(); });
  el.querySelector(".chat-progress").onclick = (e) => {
    if (!e.target.closest("[data-all-steps]")) return;
    v.allSteps = !v.allSteps;
    renderChat(v);

    <div class="td-opts">${c.options.map((o, i) => `<button type="button" class="${i === 0 ? "primary" : ""}" data-key="${esc(o.key)}"><span class="kbd" aria-hidden="true">${esc(o.key)}</span>${esc(o.label.replace(/\s*\(esc\)\s*$/i, ""))}</button>`).join("")}</div>
    ${instead ? `<label class="td-instead"><span class="muted">Instead:</span><input type="text" data-instead="${esc(instead.key)}" value="${esc(typed)}" placeholder="tell the agent what to do differently…" aria-label="Tell the agent what to do differently" autocomplete="off"></label>` : ""}`;
}
function answerTerm(v, key, text) {
  v.send({ t: "i", d: key });
  // Rejected: Claude Code is back at its input, and the words go there.
  if (text) setTimeout(() => v.send({ t: "s", d: text }), 400);
  v.answered = { key: v.askedKey, at: Date.now() };
  v.asked = "";
  v.dock.hidden = true;
  if (!narrow.matches) v.term.focus();
}
function connect(v) {
  v.gone = false;
  v.ws?.close();
  const ws = (v.ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/term?id=${encodeURIComponent(v.id)}`));
  ws.onopen = () => v.resize();
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    // The agent's question shows as soon as its menu is drawn, not at the next second.
    if (m.t === "init") { v.term.reset(); v.gone = m.gone; v.term.write(m.d, () => showChoice(v)); }
    else if (m.t === "o") v.term.write(m.d, () => showChoice(v));
    else if (m.t === "x") { v.gone = true; load(); pollTerm(v); }
  };
  ws.onclose = () => { if (ws === v.ws && !v.closed && !v.gone) setTimeout(() => ws === v.ws && !v.closed && connect(v), 2000); };
}
function closeTerminal() {
  if (!tv) return;
  tv.closed = true;
  clearInterval(tv.timer);
  clearInterval(tv.statTimer);
  tv.ws?.close();
  tv.term.dispose();
  tv = null;
}
// The agent shown the other way. In the middle of a turn Mako moves it once the turn ends; now: at once.
async function switchView(id, to, now) {
  await fetch(`/api/view?id=${encodeURIComponent(id)}&to=${to}${now ? "&now=1" : ""}`, { method: "POST" });
  await load();
}
// The switch asked for during the turn, over the terminal or the chat: Cancel, or Switch now.
function drawViewNext(el, r) {
  const box = el?.querySelector(".view-next");
  if (!box) return;
  const next = r?.viewNext ?? "";
  box.hidden = !next;
  for (const b of el.querySelectorAll("[data-tview]")) b.classList.toggle("next", b.dataset.tview === next);
  box.onclick = (e) => {
    const b = e.target.closest("[data-vn]");
    if (!b) return;
    b.disabled = true;
    if (b.dataset.vn === "now") switchView(r.id, next, true);
    else switchView(r.id, r.view === "chat" ? "chat" : "terminal");
  };
  if (box.dataset.next === next) return;
  box.dataset.next = next;
  box.innerHTML = !next ? "" : `${ICON.swap}<span class="vn-t"><b>Moves to the ${next} when this turn ends</b> — the agent keeps working, the conversation carries over.</span>
    <button type="button" data-vn="cancel">Cancel</button><button type="button" data-vn="now" title="Interrupts the current step; the agent then continues in the ${next}">Switch now</button>`;
}

// #digest:<ms>: the morning push's link, the digest from that time.
const digestHash = () => { const h = decodeURIComponent(location.hash.slice(1)); return h.startsWith("digest:") ? h.slice(7) : null; };
const startDigest = digestHash();
// #new: straight to the new-task form.
if (location.hash === "#new") newOpen = "task";
// #chat: a new chat without a task; #chat-<id>: that chat; #ask-<id>: that question about code. (#code, the old page of the
// questions, is the new chat now.)
else if (location.hash === "#code" || location.hash === "#chat" || location.hash.startsWith("#chat-") || location.hash.startsWith("#ask-")) { newOpen = "chat"; freeChat = ["#code", "#chat"].includes(location.hash) ? "" : location.hash.slice(1); }
// #stats: straight to "Stats".
else if (location.hash === "#stats") statsOpen = true;
// #stats:cost: straight to a tab of "Stats".
else if (STATS_TABS.some(([k]) => location.hash === `#stats:${k}`)) { statsOpen = true; statsTab = location.hash.slice(7); }
// On a phone the board opens on the list: only a link to a task (#id) opens the task itself.
else selected = startDigest ? null : decodeURIComponent(location.hash.slice(1)) || (narrow.matches ? null : (() => { try { return localStorage.getItem("mako-selected"); } catch { return null; } })());
// A link to a task (from a notification or the menu) opens it even when the board is already open.
// An open menu closes on a click anywhere else.
document.addEventListener("click", (e) => {
  for (const m of document.querySelectorAll("details.menu[open]")) if (!m.contains(e.target)) m.open = false;
});
window.addEventListener("hashchange", () => {
  const since = digestHash();
  if (since) return loadDigest(since);
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === "new") return openNewTask();
  if (id === "code" || id === "chat" || id.startsWith("chat-") || id.startsWith("ask-")) return openFreeChat(id === "chat" || id === "code" ? "" : id);
  if (id && id !== selected) select(id);
});
// Back at the board: look at once, so what happened meanwhile shows without waiting for the next poll.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
// On a phone: the app on the home screen, its service worker, and pushes once the user allows them.
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
// iPadOS calls itself a Mac; its touch screen tells it apart.
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
// Each iOS browser hides "Share" in its own place; Safari is the one without a name of its own in the UA.
function iosAddHome() {
  const ua = navigator.userAgent;
  const home = '"Add to Home Screen" → "Add"';
  const fallback = "If there is no such item, update the browser and iOS (16.4+ required) or open a new QR code from the settings in Safari.";
  if (/CriOS/.test(ua)) return `"Share" <b>⎙</b> on the right of the address bar (or <b>⋯</b> → "Share") → ${home}. ${fallback}`;
  if (/FxiOS/.test(ua)) return `menu <b>☰</b> → "Share" → ${home}. ${fallback}`;
  if (/EdgiOS/.test(ua)) return `<b>⋯</b> → "Share" → ${home}. ${fallback}`;
  return `"Share" <b>⎙</b> → ${home}.`;
}
// Android's Chrome offers to install the app itself; the event comes once the page qualifies.
let installPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installPrompt = e;
  const b = $("install-app");
  if (b) b.hidden = false;
});
let phoneReady = false;
function setupPhone() {
  if (phoneReady || !data?.remote) return;
  phoneReady = true;
  document.body.classList.add("phone");
  $("settings-link").hidden = true;
  $("awake").hidden = true; // the Mac's own sleep: its settings, not the phone's
  // The hint to install the app: once closed with «×», not shown again on this phone.
  const hintHidden = (() => { try { return localStorage.getItem("mako-hint-hidden") === "1"; } catch { return false; } })();
  const hint = (body) => {
    $("phone-hint").innerHTML = `<div class="banner hint"><div class="hint-row"><div>${body}</div>
      <button class="icon-btn" id="hint-close" title="Hide" aria-label="Hide">×</button></div></div>`;
    $("hint-close").onclick = () => { $("phone-hint").innerHTML = ""; try { localStorage.setItem("mako-hint-hidden", "1"); } catch {} };
  };
  if (!standalone && ios) {
    // iOS gives pushes only to an app added to the home screen.
    if (!hintHidden) hint(`Add Mako to your Home Screen: ${iosAddHome()}
      <div class="muted">Then open Mako from its icon: that is the only way notifications arrive.</div>`);
    return;
  }
  if (!standalone && !hintHidden) {
    // Android: pushes work in the browser too, the app on the home screen is for convenience.
    hint(`Install Mako as an app: browser menu <b>⋮</b> → "Add to Home Screen".
      <button class="primary" id="install-app"${installPrompt ? "" : " hidden"}>Install</button>`);
    $("install-app").onclick = async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      if ((await installPrompt.userChoice).outcome === "accepted") $("phone-hint").innerHTML = "";
      installPrompt = null;
    };
  }
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  navigator.serviceWorker.register("/sw.js").then(async (reg) => {
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === "granted") return subscribe(sub);
    $("bell").hidden = false;
  });
  $("bell").onclick = async () => {
    try {
      if ((await Notification.requestPermission()) !== "granted") return alert(ios
        ? "Notifications are not allowed. Turn them on: Settings → Notifications → Mako."
        : "Notifications are not allowed. Turn them on: 🔒 next to the address → Permissions → Notifications (or Settings → Apps → Mako → Notifications).");
      const reg = await navigator.serviceWorker.ready;
      const { key } = await (await fetch("/api/push/key")).json();
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlKey(key) });
      await subscribe(sub);
      $("bell").hidden = true;
    } catch (e) {
      alert("Could not enable notifications: " + e.message);
    }
  };
}
const subscribe = (sub) => fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
function urlKey(b64) {
  const raw = atob((b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

// The keyboard on iOS covers the page instead of shrinking it: the body takes the visible part, so the
// chat's input stays above the keyboard.
narrow.addEventListener("change", () => { if (data) renderDetail(); });
if (window.visualViewport) {
  const fit = () => document.documentElement.style.setProperty("--vvh", `${Math.round(visualViewport.height)}px`);
  visualViewport.addEventListener("resize", fit);
  fit();
}

load().then(() => { setupPhone(); if (startDigest) loadDigest(startDigest); });
setInterval(load, 5000);
// A task being started counts its steps' time by the second.
setInterval(() => { if (data?.records?.some((r) => r.id === selected && r.starting)) renderDetail(); }, 1000);
</script>
</body>
</html>
