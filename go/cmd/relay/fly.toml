# The shared relay on Fly.io (docs/relay.md). From go/:
#   fly deploy . --config cmd/relay/fly.toml --dockerfile cmd/relay/Dockerfile
# One machine only: the Macs' tunnels live in its memory, so a phone must land where its Mac is (fly scale count 1).
app = "mako-relay"
primary_region = "fra"

[env]
  RELAY_DOMAIN = "relay.example.com" # the domain *.relay.example.com points to; set it before the first deploy
  RELAY_IP_HEADER = "Fly-Client-IP"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # A Mac's tunnel is a long WebSocket: the machine must not sleep under it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 4000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/_relay/health"
    timeout = "2s"

[metrics]
  port = 8080
  path = "/_relay/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
