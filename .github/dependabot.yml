# Weekly updates of the Go modules and of the pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
