# Builds Mako.app for Apple Silicon and Intel Macs and attaches the .dmg/.zip to the GitHub Release.
# Cut a release: npm version patch && git push --follow-tags
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    # One Apple Silicon runner builds both apps: node-pty ships prebuilt binaries for darwin-arm64 and
    # darwin-x64 (N-API, so they work in Electron as is), and Electron for each arch is downloaded.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall restores spawn-helper's execute bit in every prebuild.
      - run: npm ci
      - run: npx tsc
      - run: npm test
      - name: Build Mako.app for Apple Silicon and Intel (ad-hoc signed, not notarized)
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Mako-mac
          path: |
            release/*.dmg
            release/*.zip

  # The Go version: one small menu bar app (universal binary), see go/README.md.
  mac-go:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go test ./...
        working-directory: go
      - run: go/packaging/mac/build-app.sh ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: go/dist/*.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Mako-go-mac
          path: go/dist/*.zip
