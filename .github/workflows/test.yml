# Formatting, vet, staticcheck, govulncheck and the tests on every push to main and every pull request.
# A pull request cannot merge until these pass (branch protection on main).
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: tests with the race detector
        run: go test -race ./...

  # The menu bar and the board's window are Objective-C (cgo): only a Mac compiles them, for both architectures.
  go-mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=1 GOARCH=arm64 go build -o /dev/null ./cmd/mako
      - run: CGO_ENABLED=1 GOARCH=amd64 go build -o /dev/null ./cmd/mako
