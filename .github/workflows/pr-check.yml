# A pull request says how it was verified.
name: PR description

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - name: Check the sections
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The template's <!-- hints --> do not count as text.
          body=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' | perl -0pe 's/<!--.*?-->//gs')
          fail=0

          section() { # section <heading>: the text under "## <heading>" up to the next heading
            printf '%s\n' "$body" | awk -v h="## $1" 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' | sed '/^\s*$/d'
          }

          if [ -z "$(section 'Як перевірено')" ]; then
            echo "::error::Fill in «## Як перевірено»: the commands run and what was checked by hand, or say it was not."
            fail=1
          fi

          if [ "$fail" = 1 ]; then
            echo "The template is in .github/pull_request_template.md, the rules in CLAUDE.md."
            exit 1
          fi
          echo "The description is complete."
